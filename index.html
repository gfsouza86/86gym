/* ============================================================
   EXECUÇÃO FORÇA
============================================================ */
function buildSessionFromDivisao(treino, divisao){
  return {
    treinoId: treino.id, divisaoId: divisao.id,
    treinoNome: treino.nome, divisaoLetra: divisao.letra,
    startTime: Date.now(), lastAction: Date.now(), paused: false, pausedSegundos: 0,
    timer: { running:false, secondsLeft:0, exIdx:null, interval:null },
    exercicios: divisao.exercicios.map(ex=>({
      nome: ex.nome, descanso: Number(ex.descanso)||0, carga: Number(ex.carga)||0,
      repeticoes: Number(ex.repeticoes)||10, nota: ex.nota||'', grupo: (ex.grupo||'').toUpperCase(),
      rirAlvo: ex.rirAlvo!==undefined && ex.rirAlvo!=='' ? Number(ex.rirAlvo) : null,
      aquecimento: !!ex.aquecimento, dropSet: !!ex.dropSet,
      sets: (()=>{
        const arr = [];
        if(ex.aquecimento) arr.push({ repeticoes: Math.max(6, Math.round((Number(ex.repeticoes)||10)*0.6)),
          carga: Math.max(0, Math.round(((Number(ex.carga)||0)*0.5)*2)/2), done:false, warmup:true, rir:null, falha:false });
        const n = Number(ex.series)||1;
        for(let i=0;i<n;i++) arr.push({ repeticoes: Number(ex.repeticoes)||10, carga: Number(ex.carga)||0, done:false, rir:null, falha:false });
        return arr;
      })()
    }))
  };
}
function validateSession(s){
  if(!s || typeof s !== 'object') return false;
  if(!s.treinoId || !s.divisaoId || !s.startTime) return false;
  if(!Array.isArray(s.exercicios) || !s.exercicios.length) return false;
  if(!s.exercicios.every(ex => ex && typeof ex.nome === 'string' && Array.isArray(ex.sets))) return false;
  return true;
}
function persistSession(){
  try{
    if(SESSION && validateSession(SESSION)){
      const copy = JSON.parse(JSON.stringify(SESSION, (k,v)=> k === 'interval' ? null : v));
      safeSet(KEYS.session, JSON.stringify(copy));
    } else {
      safeSet(KEYS.session, 'null');
    }
  }catch(e){
    console.warn('[86gym] persistSession falhou', e);
  }
}
function loadPersistedSession(){
  const s = safeJSON(KEYS.session, null);
  if(!validateSession(s)) return null;
  if(Date.now() - s.startTime > 24*3600*1000) return null;
  if(s.timer) s.timer.interval = null;
  return s;
}
function ExecucaoScreen(treinoId, divisaoId){
  const treino = DB.treinos.find(t=>t.id===treinoId);
  if(!treino) return `<div class="empty">Treino não encontrado.</div>`;
  const divisao = treino.divisoes.find(d=>d.id===divisaoId);
  if(!divisao) return `<div class="empty">Divisão não encontrada.</div>`;
  if(!SESSION || SESSION.treinoId!==treinoId || SESSION.divisaoId!==divisaoId){
    SESSION = buildSessionFromDivisao(treino, divisao);
    persistSession();
    startMediaSession(treino.nome + ' · ' + divisao.letra);
    focusedExIdx = null;
  }
  if(SESSION.timer && SESSION.timer.interval){
    clearInterval(SESSION.timer.interval);
    SESSION.timer.interval = null;
  }
  const s = loadSettings();
  const focusMode = s.focusMode && focusedExIdx !== null;
  const allDone = SESSION.exercicios.every(ex=> ex.sets.every(st=>st.done));
  const timerHtml = SESSION.timer.running ? `
    <div class="timer-banner" id="timer-banner">
      <div>
        <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;">DESCANSO</div>
        <div style="font-size:12px;">${escapeHtml(SESSION.exercicios[SESSION.timer.exIdx]?.nome||'')}</div>
      </div>
      <div class="t-num" id="timer-num">${formatSeconds(SESSION.timer.secondsLeft)}</div>
    </div>`:'';

  const exHtml = SESSION.exercicios.map((ex, exi)=>{
    let hide = false;
    if(focusMode && exi !== focusedExIdx){
      const firstIncomplete = SESSION.exercicios.findIndex(e=> !e.sets.every(x=>x.done));
      if(exi !== firstIncomplete) hide = true;
    }
    if(hide){
      const doneCount = ex.sets.filter(x=>x.done).length;
      return `<div class="exec-ex-card" data-exi="${exi}" style="opacity:0.5; padding:10px 14px; cursor:pointer;" data-focus-toggle="${exi}">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px;">${escapeHtml(ex.nome)}</span>
          <span style="font-size:11px; color:var(--muted);">${doneCount}/${ex.sets.length} séries</span>
        </div>
      </div>`;
    }
    const done = ex.sets.every(st=>st.done);
    const lastSess = lastSessionFor(ex.nome);
    let compareBadge = '';
    if(lastSess){
      const cargaAtual = ex.sets[0]?.carga || ex.carga;
      const diff = cargaAtual - Number(lastSess.ex.carga);
      if(diff > 0) compareBadge = `<span class="compare-badge up">↑ +${diff}kg</span>`;
      else if(diff < 0) compareBadge = `<span class="compare-badge down">↓ ${diff}kg</span>`;
      else compareBadge = `<span class="compare-badge same">=</span>`;
    }
    const sugg = suggestProgression(ex.nome);
    const stagnant = isStagnant(ex.nome);
    const rows = ex.sets.map((st, si)=>{
      const prevDone = si===0 ? true : ex.sets[si-1].done;
      const lockedByTimer = SESSION.timer.running && SESSION.timer.exIdx===exi;
      const disabled = (!prevDone) || st.done || lockedByTimer;
      const rowStyle = st.warmup ? 'color:var(--muted);' : '';
      return `
      <tr style="${rowStyle}">
        <td style="white-space:nowrap;">
          ${st.warmup? 'A' : (ex.sets.slice(0,si).filter(x=>!x.warmup).length + 1)}
          <button class="icon-btn mini" style="margin-left:2px; padding:0; width:20px; height:20px;" data-copy-set="${exi}:${si}" title="Copiar valores">${ICONS.copy}</button>
          ${!st.warmup? `<button class="icon-btn mini" style="padding:0; width:20px; height:20px;" data-del-set="${exi}:${si}" aria-label="Excluir">✕</button>`:''}
        </td>
        <td><input type="number" inputmode="numeric" data-set-field="repeticoes" data-exi="${exi}" data-si="${si}" value="${st.repeticoes}" ${st.done?'disabled':''}></td>
        <td><input type="number" step="0.5" inputmode="decimal" data-set-field="carga" data-exi="${exi}" data-si="${si}" value="${st.carga}" ${st.done?'disabled':''}></td>
        <td><input type="number" min="0" max="5" inputmode="numeric" data-set-field="rir" data-exi="${exi}" data-si="${si}" value="${st.rir??''}" ${st.done?'disabled':''} style="width:38px;"></td>
        <td><input type="checkbox" data-set-field="falha" data-exi="${exi}" data-si="${si}" ${st.falha?'checked':''} ${st.done?'disabled':''} style="width:18px;height:18px;accent-color:var(--orange);"></td>
        <td><input type="checkbox" data-check-set="${exi}:${si}" ${st.done?'checked':''} ${disabled && !st.done ? 'disabled':''}></td>
      </tr>`;
    }).join('');
    const nextSetIdx = ex.sets.findIndex(st=> !st.done);
    const nextSet = nextSetIdx>=0 ? ex.sets[nextSetIdx] : null;
    const previewHtml = nextSet ? `<div style="font-size:11.5px; color:var(--muted); margin-top:8px; display:flex; align-items:center; gap:6px;">
      <span style="color:var(--blue); font-weight:700;">▶ Próxima:</span>
      <b>${nextSet.carga}kg × ${nextSet.repeticoes}</b>${nextSet.rir!==null? ` · RIR ${nextSet.rir}`:''}
      <button class="btn mini secondary" data-repeat-last="${exi}" style="margin-left:auto;">Repetir anterior</button>
    </div>` : '';
    return `
    <div class="exec-ex-card ${done?'done':''} ${focusMode && exi===focusedExIdx?'focused':''}" data-exi="${exi}">
      <div class="exec-ex-head">
        <h3>${escapeHtml(ex.nome)} ${ex.grupo? `<span class="group-tag">${ex.grupo}</span>`:''} ${ex.dropSet? '<span class="group-tag" style="background:var(--orange);">DS</span>':''}</h3>
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
          ${compareBadge}
          <button class="icon-btn mini" data-swap-ex="${exi}" title="Trocar" aria-label="Trocar">${ICONS.swap}</button>
          <button class="icon-btn mini" data-postpone-ex="${exi}" title="Adiar" aria-label="Adiar">${ICONS.arrowDown}</button>
          <div class="help-icon" data-help="${escapeHtml(ex.nome)}" role="button" tabindex="0">?</div>
        </div>
      </div>
      ${lastSess ? `<div style="font-size:11.5px;color:var(--muted);margin-top:6px;">Última: ${lastSess.ex.carga}kg × ${lastSess.ex.repsMedias||'-'} (${lastSess.ex.setsFeitas}/${lastSess.ex.setsTotal})</div>`:''}
      ${ex.nota? `<div style="font-size:11.5px;color:var(--muted);margin-top:4px;">📝 ${escapeHtml(ex.nota)}</div>`:''}
      ${stagnant? `<div class="stagnation-alert">⚠ Estagnado. Tente +2.5kg ou nova variação.</div>`:''}
      ${sugg && sugg.tipo==='up' && !stagnant? `<div class="suggestion-banner" style="margin-top:10px; font-size:12px;">${ICONS.star} Sugestão: <b>${sugg.carga}kg</b></div>`:''}
      <table class="set-table">
        <tr><th>Série</th><th>Reps</th><th>Carga</th><th>RIR</th><th>Falha</th><th>OK</th></tr>
        ${rows}
      </table>
      ${previewHtml}
      <button class="btn mini ghost" data-add-set="${exi}" style="margin-top:8px;">${ICONS.plus} Série</button>
    </div>`;
  }).join('');

  return `
    <div class="top-actions">
      <button class="icon-btn" id="btn-exit-exec" aria-label="Sair">${ICONS.back}</button>
      <h1 class="page-title" style="margin:0; font-size:18px;">${escapeHtml(treino.nome)} · ${escapeHtml(divisao.letra)}</h1>
      <div style="width:38px;"></div>
    </div>
    <div class="session-clock">Tempo de treino<br><b id="session-clock-num">00:00</b>${SESSION.paused?' <span style="color:var(--orange);font-size:11px;">· pausado</span>':''}</div>
    ${timerHtml}
    <div id="exec-container">
      ${exHtml}
    </div>
    <button class="btn" id="btn-finalizar-treino" style="margin-top:10px;">${allDone? 'Finalizar treino ✓':'Finalizar treino'}</button>
    <div style="margin-top:12px; text-align:center;">
      <button class="btn mini ghost" id="btn-plank">${ICONS.bolt} Cronômetro de prancha</button>
    </div>`;
}

let clockInterval = null;
function startSessionClock(){
  clearInterval(clockInterval);
  const tick = ()=>{
    const el = document.getElementById('session-clock-num');
    if(!el || !SESSION){ clearInterval(clockInterval); return; }
    const s = loadSettings();
    if(s.pausaAuto){
      const inativo = Date.now() - lastActionTime;
      if(inativo > 10*60*1000 && !autoPaused){ autoPaused = true; SESSION.paused = true; render(); }
    }
    const elapsed = (Date.now() - SESSION.startTime)/1000 - (SESSION.pausedSegundos||0);
    el.textContent = formatSeconds(Math.max(0, elapsed));
  };
  tick();
  clockInterval = setInterval(tick, 1000);
}
function startRestTimer(exi){
  const ex = SESSION.exercicios[exi];
  if(SESSION.timer.interval) clearInterval(SESSION.timer.interval);
  SESSION.timer.running = true;
  SESSION.timer.exIdx = exi;
  SESSION.timer.secondsLeft = ex.descanso;
  render(); haptic('medium');
  SESSION.timer.interval = setInterval(()=>{
    SESSION.timer.secondsLeft -= 1;
    const numEl = document.getElementById('timer-num');
    if(numEl) numEl.textContent = formatSeconds(SESSION.timer.secondsLeft);
    if(SESSION.timer.secondsLeft<=0){
      clearInterval(SESSION.timer.interval);
      SESSION.timer.running = false; SESSION.timer.exIdx = null;
      SESSION.timer.interval = null;
      haptic('success'); playBeep(2);
      render();
    }
  }, 1000);
}

/* ============================================================
   CRONÔMETRO PRANCHA
============================================================ */
function startPlankTimer(){
  let seg = 0, target = 60, running = true, interval = null;
  const bg = openModal(`
    <button class="close-x" aria-label="Fechar">&times;</button>
    <h3 style="margin-bottom:8px;">Cronômetro de prancha</h3>
    <div class="plank-timer running" id="plank-box">
      <div class="t" id="plank-time">00:00</div>
      <div class="l" id="plank-label">Alvo: 60s</div>
    </div>
    <label class="field">Alvo (segundos)</label>
    <input type="number" min="10" max="600" id="plank-target" value="60">
    <div class="row" style="margin-top:16px;">
      <button class="btn secondary" id="plank-reset">Zerar</button>
      <button class="btn" id="plank-stop">Parar</button>
    </div>
  `);
  const timeEl = bg.querySelector('#plank-time');
  const labelEl = bg.querySelector('#plank-label');
  const boxEl = bg.querySelector('#plank-box');
  const targetEl = bg.querySelector('#plank-target');
  function tick(){
    if(!running) return;
    seg++;
    timeEl.textContent = formatSeconds(seg);
    if(seg >= target){ playBeep(3); haptic('success'); running = false; boxEl.classList.remove('running'); labelEl.textContent = '✓ Alvo atingido!'; }
  }
  interval = setInterval(tick, 1000);
  targetEl.addEventListener('change', ()=>{ target = Number(targetEl.value)||60; labelEl.textContent = `Alvo: ${target}s`; });
  bg.querySelector('#plank-reset').onclick = ()=>{ seg = 0; timeEl.textContent = '00:00'; labelEl.textContent = `Alvo: ${target}s`; boxEl.classList.add('running'); running = true; };
  bg.querySelector('#plank-stop').onclick = ()=>{ clearInterval(interval); closeModal(bg); };
  bg.querySelector('.close-x').onclick = ()=>{ clearInterval(interval); closeModal(bg); };
}

let HIST_FILTER = { tipo:'todos', q:'' };
let _histSearchDebounce = null;
let _cacheExerciciosHistorico = null;
let _cacheExerciciosHistoricoKey = '';
function getExerciciosComHistorico(){
  const key = DB.historico.length + '|' + DB.historico.filter(h=>h.tipo==='forca').length;
  if(_cacheExerciciosHistoricoKey === key && _cacheExerciciosHistorico) return _cacheExerciciosHistorico;
  _cacheExerciciosHistorico = [...new Set(
    DB.historico.filter(h=>h.tipo!=='cardio').flatMap(h=> (h.exercicios||[]).map(e=>e.nome)).filter(Boolean)
  )];
  _cacheExerciciosHistoricoKey = key;
  return _cacheExerciciosHistorico;
}
function HistoricoScreen(){
  let hist = [...DB.historico].sort((a,b)=> b.data - a.data);
  if(HIST_FILTER.tipo!=='todos') hist = hist.filter(h=> h.tipo===HIST_FILTER.tipo);
  if(HIST_FILTER.q){
    const q = HIST_FILTER.q.toLowerCase();
    hist = hist.filter(h=> h.treinoNome.toLowerCase().includes(q));
  }
  const totalHist = hist.length;
  const LIMIT = 30;
  const visiveis = hist.slice(0, LIMIT);
  const exerciciosComHistorico = getExerciciosComHistorico();
  const checkins = safeJSON(KEYS.checkin, {});
  const filterChips = `
    <div style="margin-bottom:14px;">
      <span class="chip ${HIST_FILTER.tipo==='todos'?'active':''}" data-hist-tipo="todos" role="button" tabindex="0">Todos</span>
      <span class="chip ${HIST_FILTER.tipo==='forca'?'active':''}" data-hist-tipo="forca" role="button" tabindex="0">Força</span>
      <span class="chip ${HIST_FILTER.tipo==='cardio'?'active':''}" data-hist-tipo="cardio" role="button" tabindex="0">Cardio</span>
    </div>
    <input type="text" id="hist-search" placeholder="Buscar..." value="${escapeHtml(HIST_FILTER.q)}" style="margin-bottom:14px;">`;
  const evoChips = exerciciosComHistorico.length ? `
    <div class="card">
      <h3 style="font-size:15px; margin-bottom:10px;">${ICONS.chart} Ver evolução</h3>
      <div>${exerciciosComHistorico.slice(0, 30).map(n=>`<span class="chip" data-ver-evolucao="${escapeHtml(n)}" role="button" tabindex="0">${escapeHtml(n)}</span>`).join('')}</div>
    </div>`:'';
  const body = visiveis.length===0 ? `<div class="empty">${ICONS.empty}<div>Nenhum treino encontrado.</div></div>` :
    visiveis.map(h=>{
      const isCardio = h.tipo==='cardio';
      const ck = checkins[todayKey(h.data)];
      return `
      <div class="hist-item">
        <div class="row-top">
          <div>
            <span class="tipo-tag ${isCardio?'cardio':'forca'}">${isCardio?'Cardio':'Força'}</span><br>
            <b>${escapeHtml(h.treinoNome)}${h.divisaoLetra? ' · '+escapeHtml(h.divisaoLetra):''}</b><br>
            <small style="color:var(--muted);">${new Date(h.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})} · ${new Date(h.data).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small>
          </div>
          <div class="dur">${formatSeconds(h.duracaoSegundos||0)}</div>
        </div>
        ${ck ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted);">
          ${ck.horaDormir? `<span>🌙 ${ck.horaDormir}→${ck.horaAcordar}</span>`:''}
          ${ck.energia? `<span>⚡ ${ck.energia}/5</span>`:''}
          ${ck.estresse? `<span>😰 ${ck.estresse}/5</span>`:''}
          ${ck.humor? `<span>😊 ${ck.humor}/5</span>`:''}
        </div>`:''}
        ${isCardio ?
          (h.intervalos||[]).map(iv=>`<div class="hist-ex-line"><span>${iv.duracaoMin}min</span><span>Inc ${iv.inclinacao} · ${iv.velocidade}km/h</span></div>`).join('')
          :
          (h.exercicios||[]).map(e=>`<div class="hist-ex-line"><span>${escapeHtml(e.nome)}</span><span>${e.setsFeitas}/${e.setsTotal} · ${e.carga}kg</span></div>`).join('')
        }
      </div>`;
    }).join('');
  const more = totalHist > LIMIT ? `<div style="text-align:center; color:var(--muted); font-size:12px; padding:16px;">Mostrando ${LIMIT} de ${totalHist} treinos</div>` : '';
  return `<h1 class="page-title">Histórico</h1>${filterChips}${evoChips}${body}${more}`;
}

function CardioExecScreen(cardioId){

  if(!CARDIO_SESSION || CARDIO_SESSION.cardioId!==cardioId){
    CARDIO_SESSION = {
      cardioId, nome: cardio.nome, startTime: Date.now(),
      idx: 0, secondsLeft: Number(cardio.intervalos[0].duracaoMin)*60,
      paused:false, pausedSegundos: 0, pauseStart: null,
      finished:false, interval:null,
      intervalos: JSON.parse(JSON.stringify(cardio.intervalos)),
      observacoes: cardio.observacoes
    };
    startMediaSession('Cardio: ' + cardio.nome);
  }
  if(CARDIO_SESSION.interval) clearInterval(CARDIO_SESSION.interval);
  const S = CARDIO_SESSION;
  const current = S.intervalos[S.idx];
  const dots = S.intervalos.map((iv,i)=>`<div class="interval-dot ${(i<S.idx || (S.finished && i<=S.idx))?'done':''} ${(i===S.idx && !S.finished)?'active':''}"></div>`).join('');
  return `
    <div class="top-actions">
      <button class="icon-btn" id="btn-exit-cardio-exec" aria-label="Sair">${ICONS.back}</button>

      <div style="width:38px;"></div>
    </div>
    <div class="session-clock">Tempo total<br><b id="cardio-clock-num">${formatSeconds((Date.now()-S.startTime)/1000 - (S.pausedSegundos||0))}</b></div>
    <div class="interval-dots">${dots}</div>
    <div class="cardio-countdown">
      <div class="num" id="cardio-countdown-num">${formatSeconds(S.secondsLeft)}</div>
      <div class="sub">${S.finished? 'Concluído!' : `Intervalo ${S.idx+1}/${S.intervalos.length}${S.paused?' · pausado':''}`}</div>
    </div>
    <div class="row" style="margin-bottom:14px;">
      <div class="dash-box" style="flex:1;"><div class="val">${current.inclinacao}</div><div class="lbl">Inclinação</div></div>
      <div class="dash-box" style="flex:1;"><div class="val">${current.velocidade}</div><div class="lbl">km/h</div></div>

    </div>
    <button class="btn" id="btn-finalizar-cardio" style="margin-top:10px;">${S.finished?'Finalizar ✓':'Finalizar'}</button>`;
}
function startCardioTicker(){
  if(!CARDIO_SESSION) return;
  if(CARDIO_SESSION.interval) clearInterval(CARDIO_SESSION.interval);
  CARDIO_SESSION.interval = setInterval(()=>{
    const S = CARDIO_SESSION;
    if(!S) return;
    const elapsed = (Date.now()-S.startTime)/1000 - (S.pausedSegundos||0);
    const clockEl = document.getElementById('cardio-clock-num');
    if(clockEl) clockEl.textContent = formatSeconds(elapsed);
    if(S.paused || S.finished) return;
    S.secondsLeft -= 1;
    const numEl = document.getElementById('cardio-countdown-num');
    if(numEl) numEl.textContent = formatSeconds(S.secondsLeft);
    if(S.secondsLeft<=0){
      if(S.idx < S.intervalos.length-1){
        S.idx += 1; S.secondsLeft = Number(S.intervalos[S.idx].duracaoMin)*60;
        haptic('success'); playBeep(2); render();
      } else {
        S.finished = true; clearInterval(S.interval);
        haptic('success'); playBeep(3); render();
      }
    }
  }, 1000);
}
async function finalizeCardio(){
  const S = CARDIO_SESSION;
  if(!S) return;
  const duracaoSegundos = (Date.now()-S.startTime)/1000 - (S.pausedSegundos||0);
  const totalMin = S.intervalos.reduce((a,iv)=>a+Number(iv.duracaoMin),0);
  const totalIntervalos = S.intervalos.length;
  DB.historico.push({
    id: uid(), tipo:'cardio', treinoNome: S.nome, divisaoLetra:'', data: Date.now(),
    duracaoSegundos,
    intervalos: S.intervalos.map(iv=>({duracaoMin:iv.duracaoMin, inclinacao:iv.inclinacao, velocidade:iv.velocidade}))
  });
  saveHistorico();
  clearInterval(S.interval); clearInterval(clockInterval);
  CARDIO_SESSION = null;
  releaseWakeLock(); stopMediaSession();
  const novosBadges = checkNewBadges();
  completeChallengeIfDone();
  await showWorkoutComplete({
    subtitulo: 'Cardio finalizado!',
    stats: [
      { v: formatSeconds(duracaoSegundos), l: 'Duração' },
      { v: totalMin + 'min', l: 'Programado' },
      { v: totalIntervalos, l: 'Intervalos' }
    ],
    gruposTreinados: ['Cardio'], novosBadges
  });
  go('historico');
}

/* ============================================================
   IMAGE COMPRESS
============================================================ */
function compressImage(file, maxSize=256, quality=0.82){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if(w>h){ if(w>maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
          else { if(h>maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(e){ reject(e); }
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

============================================================ */
function exportBackup(){
  const data = buildBackupPayload();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `86gym-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); setTimeout(()=> URL.revokeObjectURL(url), 2000);
  markBackupDone();
  showToast('Backup exportado!');
}
function importBackup(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{ try{ const d = JSON.parse(reader.result); if(!d) throw new Error('inválido'); resolve(d); }catch(e){ reject(e); } };
    reader.onerror = reject;
    reader.readAsText(file);
  });
}
function rebuildAnnualRecords(){
  const anual = {};
  DB.historico.filter(h=>h.tipo!=='cardio').forEach(h=>{
    const ano = new Date(h.data).getFullYear();
    if(!anual[ano]) anual[ano] = {};
    (h.exercicios||[]).forEach(e=>{
      (e.setsDetalhados||[]).forEach(s=>{
        if(!s.done || s.warmup) return;
        const carga = Number(s.carga)||0, reps = Number(s.repeticoes)||0;
        if(carga<=0 || reps<=0) return;
        const oneRm = carga*(1+reps/30);
        if(!anual[ano][e.nome] || anual[ano][e.nome].oneRm < oneRm){
          anual[ano][e.nome] = { carga, reps, oneRm, ts:h.data };
        }
      });
    });
  });
  saveAnnual(anual);
}

    DRAFT.divisoes[Number(el.dataset.divIdx)].letra = e.target.value.toUpperCase();
  }));
  view.querySelectorAll('[data-add-ex]').forEach(el=> el.addEventListener('click', ()=>{
    const di = Number(el.dataset.addEx);
    DRAFT.divisoes[di].exercicios.push({nome:'',series:3,repeticoes:10,carga:0,descanso:60,nota:'',aquecimento:false,grupo:'',dropSet:false,rirAlvo:null});
    render();
  }));
  view.querySelectorAll('[data-del-ex]').forEach(el=> el.addEventListener('click', ()=>{
    const [di,ei] = el.dataset.delEx.split(':').map(Number);
    DRAFT.divisoes[di].exercicios.splice(ei,1); render();
  }));
  view.querySelectorAll('[data-move-ex]').forEach(el=> el.addEventListener('click', ()=>{
    const [di,ei,dir] = el.dataset.moveEx.split(':').map(Number);
    const arr = DRAFT.divisoes[di].exercicios;
    const novo = ei + dir;
    if(novo < 0 || novo >= arr.length) return;
    [arr[ei], arr[novo]] = [arr[novo], arr[ei]];
    render();
  }));
  view.querySelectorAll('[data-field="series"],[data-field="repeticoes"],[data-field="carga"],[data-field="descanso"],[data-field="nota"],[data-field="grupo"],[data-field="rirAlvo"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const di=Number(el.dataset.di), ei=Number(el.dataset.ei), f=el.dataset.field;
      let v;
      if(f==='nota' || f==='grupo') v = el.value;
      else if(f==='rirAlvo') v = el.value === '' ? null : Number(el.value);
      else v = Number(el.value);
      DRAFT.divisoes[di].exercicios[ei][f] = v;
    });
  });
  view.querySelectorAll('[data-field="aquecimento"],[data-field="dropSet"]').forEach(el=> el.addEventListener('change', ()=>{
    const di=Number(el.dataset.di), ei=Number(el.dataset.ei);
    DRAFT.divisoes[di].exercicios[ei][el.dataset.field] = el.checked;
  }));
  view.querySelectorAll('.ex-nome-input').forEach(input=>{
    input.addEventListener('input', ()=>{
      const di=Number(input.dataset.di), ei=Number(input.dataset.ei);
      DRAFT.divisoes[di].exercicios[ei].nome = input.value;
      const hb = input.closest('.ex-head').querySelector('.help-icon');
      if(hb) hb.dataset.help = input.value;
      const listEl = view.querySelector(`.ac-list[data-di="${di}"][data-ei="${ei}"]`);
      const q = input.value.trim().toLowerCase();
      if(!q){ listEl.style.display='none'; listEl.innerHTML=''; return; }
      const flat = exerciseFlat();
      const m = flat.filter(e=> e.name.toLowerCase().includes(q)).slice(0,8);
      if(!m.length){ listEl.style.display='none'; listEl.innerHTML=''; return; }
      listEl.innerHTML = m.map(x=>`<div data-pick="${escapeHtml(x.name)}">${escapeHtml(x.name)} <span style="color:var(--muted);">· ${escapeHtml(x.group)}</span></div>`).join('');
      listEl.style.display='block';
      listEl.querySelectorAll('[data-pick]').forEach(opt=>{
        opt.addEventListener('mousedown', ev=>{
          ev.preventDefault();
          input.value = opt.dataset.pick;
          DRAFT.divisoes[di].exercicios[ei].nome = opt.dataset.pick;
          if(hb) hb.dataset.help = opt.dataset.pick;
          listEl.style.display='none';
        });
      });
    });
    input.addEventListener('blur', ()=> setTimeout(()=>{
      const l = view.querySelector(`.ac-list[data-di="${input.dataset.di}"][data-ei="${input.dataset.ei}"]`);
      if(l) l.style.display='none';
    }, 150));
  });
  const btnSave = document.getElementById('btn-save-treino');
  if(btnSave) btnSave.addEventListener('click', ()=>{
    if(!DRAFT.nome.trim()){ showToast('Nome vazio'); return; }
    if(!DRAFT.divisoes.length){ showToast('Adicione uma divisão'); return; }
    for(const d of DRAFT.divisoes){
      if(!d.letra.trim()){ showToast('Divisão sem letra'); return; }
      if(!d.exercicios.length){ showToast(`Sem exercícios na ${d.letra}`); return; }
      for(const ex of d.exercicios){
        if(!ex.nome.trim()){ showToast('Exercício sem nome'); return; }
      }
    }
    const idx = DB.treinos.findIndex(t=>t.id===DRAFT.id);
    if(idx>=0) DB.treinos[idx] = DRAFT; else DB.treinos.push(DRAFT);
    saveTreinos(); showToast('Treino salvo!'); DRAFT=null; go('treinos');
  });

  const btnNovoEx = document.getElementById('btn-novo-exercicio');
  if(btnNovoEx) btnNovoEx.addEventListener('click', async ()=>{
    const name = await promptDialog('Nome do exercício', {title:'Novo exercício'});
    if(!name||!name.trim()) return;
    const g = await promptDialog('Grupo muscular', {title:'Grupo', defaultValue:'Personalizados'});
    if(!g) return;
    CUSTOM_EXERCISES.push({name:name.trim(), group:g.trim()||'Personalizados', en:name.trim()});
    saveCustomExercises(CUSTOM_EXERCISES); showToast('Criado!'); render();
  });

  const btnCheckin = document.getElementById('btn-checkin');
  if(btnCheckin) btnCheckin.addEventListener('click', async ()=>{ await askPreCheckin(); render(); });
  const btnResume = document.getElementById('btn-resume-session');
  if(btnResume) btnResume.addEventListener('click', ()=>{
    const s = loadPersistedSession();
    if(!s){ showToast('Sem sessão válida'); return; }
    SESSION = s;
    go('treino_exec', {treinoId:s.treinoId, divisaoId:s.divisaoId});
  });
  const btnDiscard = document.getElementById('btn-discard-session');
  if(btnDiscard) btnDiscard.addEventListener('click', async ()=>{
    if(!await confirmDialog('Descartar?', {danger:true, okText:'Descartar'})) return;
    SESSION=null; persistSession(); render();
  });
  view.querySelectorAll('[data-start-treino]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const s = loadPersistedSession();
      if(s){
        if(!await confirmDialog('Existe treino em andamento. Descartar?', {danger:true, okText:'Descartar'})) return;
        SESSION=null; persistSession();
      }
      const treino = DB.treinos.find(t=>t.id===el.dataset.startTreino);
      const divisao = treino ? treino.divisoes.find(d=>d.id===el.dataset.startDiv) : null;
      const settings = loadSettings();
      if(divisao && settings.warmupAtivado) await showWarmupScreen(divisao);
      go('treino_exec', {treinoId: el.dataset.startTreino, divisaoId: el.dataset.startDiv});
    });
  });

  const btnExit = document.getElementById('btn-exit-exec');
  if(btnExit) btnExit.addEventListener('click', async ()=>{
    if(!await confirmDialog('Sair? O progresso fica salvo.', {okText:'Sair'})) return;
    if(SESSION){
      if(SESSION.timer.interval){ clearInterval(SESSION.timer.interval); SESSION.timer.interval = null; }
      SESSION.timer.running=false;
      persistSession();
    }
    releaseWakeLock(); stopMediaSession();
    go('treinar');
  });
  view.querySelectorAll('[data-set-field]').forEach(el=>{
    el.addEventListener('input', ()=>{
      lastActionTime = Date.now(); autoPaused = false;
      if(SESSION && SESSION.paused) SESSION.paused = false;
      const exi=Number(el.dataset.exi), si=Number(el.dataset.si), f=el.dataset.setField;
      if(f==='falha') SESSION.exercicios[exi].sets[si][f] = el.checked;
      else if(f==='rir') SESSION.exercicios[exi].sets[si][f] = el.value === '' ? null : Number(el.value);
      else SESSION.exercicios[exi].sets[si][f] = Number(el.value);
      persistSession();
    });
    if(el.type==='checkbox') el.addEventListener('change', ()=>{
      const exi=Number(el.dataset.exi), si=Number(el.dataset.si);
      SESSION.exercicios[exi].sets[si].falha = el.checked;
      persistSession();
    });
  });
  view.querySelectorAll('[data-copy-set]').forEach(el=> el.addEventListener('click', e=>{
    e.stopPropagation();
    const [exi,si] = el.dataset.copySet.split(':').map(Number);
    const ex = SESSION.exercicios[exi];
    if(si === 0){ showToast('Não há série anterior'); return; }
    const prev = ex.sets[si-1];
    ex.sets[si].repeticoes = prev.repeticoes;
    ex.sets[si].carga = prev.carga;
    ex.sets[si].rir = prev.rir;
    persistSession(); render();
    showToast('Copiado!', {duration:1500});
  }));
  view.querySelectorAll('[data-repeat-last]').forEach(el=> el.addEventListener('click', ()=>{
    const exi = Number(el.dataset.repeatLast);
    const ex = SESSION.exercicios[exi];
    const doneSets = ex.sets.filter(s=> s.done && !s.warmup);
    if(!doneSets.length){ showToast('Nenhuma série marcada ainda'); return; }
    const last = doneSets[doneSets.length-1];
    const nextIdx = ex.sets.findIndex(s=> !s.done);
    if(nextIdx < 0) return;
    ex.sets[nextIdx].repeticoes = last.repeticoes;
    ex.sets[nextIdx].carga = last.carga;
    ex.sets[nextIdx].rir = last.rir;
    persistSession(); render();
  }));
  view.querySelectorAll('[data-swap-ex]').forEach(el=> el.addEventListener('click', ()=>{
    swapExerciseModal(Number(el.dataset.swapEx));
  }));
  view.querySelectorAll('[data-postpone-ex]').forEach(el=> el.addEventListener('click', ()=>{
    const exi = Number(el.dataset.postponeEx);
    const ex = SESSION.exercicios.splice(exi, 1)[0];
    SESSION.exercicios.push(ex);
    persistSession(); render();
    showToast('Exercício adiado');
  }));
  view.querySelectorAll('[data-focus-toggle]').forEach(el=> el.addEventListener('click', ()=>{
    focusedExIdx = Number(el.dataset.focusToggle); render();
  }));
  view.querySelectorAll('[data-check-set]').forEach(el=>{
    el.addEventListener('change', ()=>{
      lastActionTime = Date.now(); autoPaused = false;
      const [exi,si] = el.dataset.checkSet.split(':').map(Number);
      const ex = SESSION.exercicios[exi];
      ex.sets[si].done = el.checked;
      persistSession();
      if(el.checked){
        if(loadSettings().focusMode) focusedExIdx = exi;
        const s = ex.sets[si];
        const carga = Number(s.carga)||0, reps = Number(s.repeticoes)||0;
        if(carga>0 && reps>0){
          const prevBest = bestSetFor(ex.nome);
          const novo1RM = carga*(1+reps/30);
          const prevRM = prevBest ? prevBest.oneRm : 0;
          if(novo1RM > prevRM + 0.5){
            showToast(`🏆 NOVO PR em ${ex.nome}! ${carga}kg × ${reps}`, {gold:true, duration:3500});
            haptic('success');
            const card = view.querySelector(`.exec-ex-card[data-exi="${exi}"]`);
            if(card) card.classList.add('pr');
            const ano = new Date().getFullYear();
            const anual = loadAnnual();
            if(!anual[ano]) anual[ano] = {};
            if(!anual[ano][ex.nome] || anual[ano][ex.nome].oneRm < novo1RM){
              anual[ano][ex.nome] = { carga, reps, oneRm:novo1RM, ts:Date.now() };
              saveAnnual(anual);
            }
          }
        }
      }
      const grupo = ex.grupo;
      const isLastSet = si === ex.sets.length-1;
      if(el.checked && !isLastSet && ex.descanso>0){ startRestTimer(exi); return; }
      if(el.checked && isLastSet && grupo){
        const grupoExs = SESSION.exercicios.filter(e=> e.grupo === grupo);
        const todosDone = grupoExs.every(e=> e.sets.every(s=>s.done));
        if(todosDone && ex.descanso>0){ startRestTimer(exi); return; }
      }
      render();
    });
  });
  view.querySelectorAll('[data-add-set]').forEach(el=> el.addEventListener('click', ()=>{
    const exi = Number(el.dataset.addSet);
    const ex = SESSION.exercicios[exi];
    const last = ex.sets[ex.sets.length-1];
    ex.sets.push({ repeticoes: last?last.repeticoes:10, carga: last?last.carga:0, done:false, rir:null, falha:false });
    persistSession(); render();
  }));
  view.querySelectorAll('[data-del-set]').forEach(el=> el.addEventListener('click', ()=>{
    const [exi, si] = el.dataset.delSet.split(':').map(Number);
    const ex = SESSION.exercicios[exi];
    if(ex.sets.length<=1) return;
    ex.sets.splice(si,1); persistSession(); render();
  }));
  const btnPlank = document.getElementById('btn-plank');
  if(btnPlank) btnPlank.addEventListener('click', startPlankTimer);

  const btnFinalizar = document.getElementById('btn-finalizar-treino');
  if(btnFinalizar) btnFinalizar.addEventListener('click', async ()=>{
    const anySet = SESSION.exercicios.some(ex=> ex.sets.some(s=>s.done));
    if(!anySet && !await confirmDialog('Nenhuma série marcada. Finalizar?', {okText:'Finalizar'})) return;
    const duracaoSegundos = (Date.now()-SESSION.startTime)/1000 - (SESSION.pausedSegundos||0);
    const resumo = SESSION.exercicios.map(ex=>{
      const doneSets = ex.sets.filter(s=>s.done && !s.warmup);
      const repsArr = doneSets.map(s=>Number(s.repeticoes)||0).filter(r=>r>0);
      const repsMedias = repsArr.length ? repsArr.reduce((a,b)=>a+b,0)/repsArr.length : (Number(ex.repeticoes)||0);
      const lastDone = [...doneSets].reverse()[0];
      const rirs = doneSets.map(s=>s.rir).filter(x=> x!==null && x!==undefined);
      return {
        nome: ex.nome,
        setsTotal: ex.sets.filter(s=>!s.warmup).length,
        setsFeitas: doneSets.length,
        carga: lastDone ? lastDone.carga : ex.carga,
        repsMedias: Math.round(repsMedias),
        rirMedio: rirs.length ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null,
        setsDetalhados: ex.sets.map(s=>({reps:s.repeticoes, carga:s.carga, done:s.done, warmup:!!s.warmup, rir:s.rir, falha:s.falha}))
      };
    });
    const totalSets = resumo.reduce((a,e)=>a+e.setsFeitas,0);
    const totalExercicios = resumo.length;
    const gruposTreinados = [...new Set(SESSION.exercicios.map(ex=> exerciseGroup(ex.nome)))];
    const post = await askPostCheckin();
    const checkinHoje = loadCheckinHoje() || {};
    const checkinFinal = { ...checkinHoje, ...post };
    DB.historico.push({
      id: uid(), tipo:'forca',
      treinoNome: SESSION.treinoNome, divisaoLetra: SESSION.divisaoLetra,
      data: Date.now(), duracaoSegundos, exercicios: resumo, checkin: checkinFinal
    });
    saveHistorico();
    if(SESSION.timer.interval) clearInterval(SESSION.timer.interval);
    clearInterval(clockInterval);
    SESSION=null; persistSession();
    releaseWakeLock(); stopMediaSession();
    const novosBadges = checkNewBadges();
    completeChallengeIfDone();
    await showWorkoutComplete({
      subtitulo: 'Bom treino! Continue assim.',
      stats: [
        { v: formatSeconds(duracaoSegundos), l: 'Duração' },
        { v: totalSets, l: 'Séries' },
        { v: totalExercicios, l: 'Exercícios' }
      ],
      gruposTreinados, novosBadges
    });
    go('historico');
  });
  if(ROUTE.name==='treino_exec'){
    startSessionClock();
    if(SESSION && SESSION.timer && SESSION.timer.running && SESSION.timer.secondsLeft>0){
      if(SESSION.timer.interval) clearInterval(SESSION.timer.interval);
      SESSION.timer.interval = setInterval(()=>{
        SESSION.timer.secondsLeft -= 1;
        const numEl = document.getElementById('timer-num');
        if(numEl) numEl.textContent = formatSeconds(SESSION.timer.secondsLeft);
        if(SESSION.timer.secondsLeft<=0){
          clearInterval(SESSION.timer.interval);
          SESSION.timer.running = false; SESSION.timer.exIdx = null;
          SESSION.timer.interval = null;
          haptic('success'); playBeep(2); render();
        }
      }, 1000);
    }
    const container = document.getElementById('exec-container');
    if(container && 'ontouchstart' in window && !execContainerHandlersBound){
      execContainerHandlersBound = true;
      let startX = 0, startY = 0;
      container.addEventListener('touchstart', e=>{
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      }, {passive:true});
      container.addEventListener('touchend', e=>{
        if(!e.changedTouches.length || !SESSION) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if(Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)*1.5){
          const cur = focusedExIdx !== null ? focusedExIdx : SESSION.exercicios.findIndex(ex=> !ex.sets.every(s=>s.done));
          let next = cur;
          if(dx < 0) next = Math.min(SESSION.exercicios.length-1, cur+1);
          else next = Math.max(0, cur-1);
          if(next !== cur){
            focusedExIdx = next;
            render();
          }
        }
      }, {passive:true});
    }
  }

  const btnNovoCardio = document.getElementById('btn-novo-cardio');
  if(btnNovoCardio) btnNovoCardio.addEventListener('click', ()=>{ DRAFT_CARDIO=null; go('cardio_form', {id:null}); });
  view.querySelectorAll('[data-del-cardio]').forEach(el=> el.addEventListener('click', async ()=>{
    if(await confirmDialog('Excluir cardio?', {danger:true, okText:'Excluir'})){
      DB.cardios = DB.cardios.filter(c=>c.id!==el.dataset.delCardio); saveCardios(); render();
    }
  }));
  view.querySelectorAll('[data-edit-cardio]').forEach(el=> el.addEventListener('click', ()=> go('cardio_form', {id: el.dataset.editCardio})));
  view.querySelectorAll('[data-start-cardio]').forEach(el=> el.addEventListener('click', ()=>{ CARDIO_SESSION=null; go('cardio_exec', {cardioId: el.dataset.startCardio}); }));

  const cNome = document.getElementById('cardio-nome');
  if(cNome) cNome.addEventListener('input', e=> DRAFT_CARDIO.nome = e.target.value);
  const cD = document.getElementById('cardio-dicas');
  if(cD) cD.addEventListener('input', e=> DRAFT_CARDIO.observacoes.dicas = e.target.value.split('\n').map(s=>s.trim()).filter(Boolean));
  const cP = document.getElementById('cardio-porque');
  if(cP) cP.addEventListener('input', e=> DRAFT_CARDIO.observacoes.porque = e.target.value.split('\n').map(s=>s.trim()).filter(Boolean));
  const backC = document.getElementById('btn-back-cardio');
  if(backC) backC.addEventListener('click', ()=>{ DRAFT_CARDIO=null; go('cardio'); });
  const addIv = document.getElementById('btn-add-interval');
  if(addIv) addIv.addEventListener('click', ()=>{
    DRAFT_CARDIO.intervalos.push({id:uid(), duracaoMin:5, inclinacao:0, velocidade:0, dica:''}); render();
  });
  view.querySelectorAll('[data-del-interval]').forEach(el=> el.addEventListener('click', ()=>{
    DRAFT_CARDIO.intervalos.splice(Number(el.dataset.delInterval),1); render();
  }));
  view.querySelectorAll('[data-cfield]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const ii = Number(el.dataset.ii), f = el.dataset.cfield;
      DRAFT_CARDIO.intervalos[ii][f] = f==='dica' ? el.value : Number(el.value);
    });
  });
  const btnSaveC = document.getElementById('btn-save-cardio');
  if(btnSaveC) btnSaveC.addEventListener('click', ()=>{
    if(!DRAFT_CARDIO.nome.trim()){ showToast('Nome vazio'); return; }
    if(!DRAFT_CARDIO.intervalos.length){ showToast('Adicione intervalo'); return; }
    const idx = DB.cardios.findIndex(c=>c.id===DRAFT_CARDIO.id);
    if(idx>=0) DB.cardios[idx]=DRAFT_CARDIO; else DB.cardios.push(DRAFT_CARDIO);
    saveCardios(); showToast('Salvo!'); DRAFT_CARDIO=null; go('cardio');
  });

  const btnExitC = document.getElementById('btn-exit-cardio-exec');
  if(btnExitC) btnExitC.addEventListener('click', async ()=>{
    if(await confirmDialog('Sair?', {danger:true, okText:'Sair'})){
      if(CARDIO_SESSION && CARDIO_SESSION.interval) clearInterval(CARDIO_SESSION.interval);
      CARDIO_SESSION=null; releaseWakeLock(); stopMediaSession(); go('cardio');
    }
  });
  const btnPauseC = document.getElementById('btn-pause-cardio');
  if(btnPauseC) btnPauseC.addEventListener('click', ()=>{
    const S = CARDIO_SESSION;
    if(S.paused){
      if(S.pauseStart) S.pausedSegundos = (S.pausedSegundos||0) + (Date.now()-S.pauseStart)/1000;
      S.pauseStart = null;
    } else {
      S.pauseStart = Date.now();
    }
    S.paused = !S.paused;
    render();
  });
  const btnSkipC = document.getElementById('btn-skip-cardio');
  if(btnSkipC) btnSkipC.addEventListener('click', ()=>{
    const S = CARDIO_SESSION;
    if(S.idx < S.intervalos.length-1){ S.idx+=1; S.secondsLeft = Number(S.intervalos[S.idx].duracaoMin)*60; }
    else { S.finished = true; if(S.interval) clearInterval(S.interval); }
    render();
  });
  const btnFinC = document.getElementById('btn-finalizar-cardio');
  if(btnFinC) btnFinC.addEventListener('click', finalizeCardio);
  if(ROUTE.name==='cardio_exec' && CARDIO_SESSION) startCardioTicker();

  view.querySelectorAll('[data-hist-tipo]').forEach(c=> c.addEventListener('click', ()=>{
    HIST_FILTER.tipo = c.dataset.histTipo; render();
  }));
  const hs = document.getElementById('hist-search');
  if(hs){
    hs.addEventListener('input', e=>{
      HIST_FILTER.q = e.target.value;
      clearTimeout(_histSearchDebounce);
      _histSearchDebounce = setTimeout(()=>{
        render();
        const el = document.getElementById('hist-search');
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }, 250);
    });
  }

  view.querySelectorAll('[data-ver-evolucao]').forEach(el=> el.addEventListener('click', ()=> openDemoModal(el.dataset.verEvolucao)));
  view.querySelectorAll('[data-help]').forEach(el=>{
    el.addEventListener('click', ()=> openDemoModal(el.dataset.help));
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') openDemoModal(el.dataset.help); });
  });
}

/* ============================================================
   TEMPLATE MODAL
============================================================ */
function openTemplateModal(){
  const bg = openModal(`
    <button class="close-x" aria-label="Fechar">&times;</button>
    <h3 style="margin-bottom:4px;">Escolher template</h3>
    <p style="color:var(--muted); font-size:13px; margin-bottom:16px;">Um ponto de partida editável.</p>
    ${TEMPLATES.map(t=>`
      <div class="card" style="cursor:pointer; margin-bottom:10px;" data-pick-template="${t.id}" role="button" tabindex="0">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div style="flex:1;">
            <b style="font-size:15px;">${escapeHtml(t.name)}</b>
            <p style="color:var(--muted); font-size:12.5px; margin:6px 0 0 0;">${escapeHtml(t.desc)}</p>
          </div>
          ${ICONS.chevron}
        </div>
      </div>`).join('')}
  `);
  bg.querySelector('.close-x').onclick = ()=> closeModal(bg);
  bg.querySelectorAll('[data-pick-template]').forEach(el=> el.addEventListener('click', ()=>{
    const t = TEMPLATES.find(x=> x.id === el.dataset.pickTemplate);
    if(!t) return;
    const novo = t.build();
    novo.id = uid();
    DB.treinos.push(novo);
    saveTreinos();
    closeModal(bg);
    showToast('Template adicionado!');
    go('treinos');
  }));
}
function openImportTextModal(){
  textareaDialog('Cole o texto do treino. Formato: Nome do exercício 3x10 60kg (por linha)', {
    title:'Importar treino de texto',
    placeholder:`Supino reto com barra 3x10 60kg\nCrucifixo reto 3x12 15kg\nTríceps pulley 3x15 25kg`
  }).then(text=>{
    if(!text) return;
    const exercicios = parseWorkoutText(text);
    if(!exercicios.length){ showToast('Nada reconhecido. Verifique o formato.'); return; }
    const novo = { id:uid(), nome:'Treino importado', divisoes:[{ id:uid(), letra:'A', exercicios }] };
    DB.treinos.push(novo);
    saveTreinos();
    showToast(`${exercicios.length} exercícios importados!`);
    go('treinos');
  });
}

/* ============================================================
   FUNDO
============================================================ */
function buildGymPatternDataUri(opacity){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360' viewBox='0 0 360 360'>
    <g stroke='#FFFFFF' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='${opacity}'>
      <g transform='translate(40,50) rotate(-18)'>
        <line x1='0' y1='14' x2='50' y2='14'/>
        <rect x='-9' y='2' width='14' height='24' rx='4'/>
        <rect x='45' y='2' width='14' height='24' rx='4'/>
      </g>
      <g transform='translate(280,260)'><circle cx='0' cy='0' r='24'/><circle cx='0' cy='0' r='7'/></g>
    </g>
  </svg>`.trim();
  return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
}
const BG_SVGS = [
  `<svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="28" y1="30" x2="72" y2="30" stroke-width="3"/><rect x="10" y="14" width="14" height="32" rx="3"/><rect x="76" y="14" width="14" height="32" rx="3"/></svg>`,
  `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2"><circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="26" stroke-dasharray="5 7"/><circle cx="50" cy="50" r="10"/></svg>`,
  `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 26 Q50 6 68 26"/><circle cx="50" cy="58" r="32"/><path d="M32 26 Q50 40 68 26"/></svg>`,
  `<svg viewBox="0 0 200 60" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="30" x2="200" y2="30" stroke-width="3"/><rect x="18" y="14" width="9" height="32" rx="2"/><rect x="32" y="8" width="10" height="44" rx="2"/><rect x="158" y="8" width="10" height="44" rx="2"/><rect x="173" y="14" width="9" height="32" rx="2"/></svg>`,
  `<svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="32" y1="30" x2="68" y2="30" stroke-width="3"/><polygon points="16,8 30,8 40,30 30,52 16,52 6,30"/><polygon points="84,8 70,8 60,30 70,52 84,52 94,30"/></svg>`
];
function mountBgAnimation(){
  const wrap = document.getElementById('bg-anim');
  if(!wrap) return;
  wrap.innerHTML = '';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const g1 = document.createElement('div'); g1.className='bg-glow'; g1.style.width='380px'; g1.style.height='380px'; g1.style.left='-90px'; g1.style.top='8%'; wrap.appendChild(g1);
  const g2 = document.createElement('div'); g2.className='bg-glow'; g2.style.width='320px'; g2.style.height='320px'; g2.style.right='-100px'; g2.style.bottom='10%'; g2.style.animationDelay='-5s'; wrap.appendChild(g2);
  const p1 = document.createElement('div'); p1.className='bg-plate-big'; p1.style.width='340px'; p1.style.height='340px'; p1.style.right='-140px'; p1.style.top='-110px'; wrap.appendChild(p1);
  const p2 = document.createElement('div'); p2.className='bg-plate-big'; p2.style.width='260px'; p2.style.height='260px'; p2.style.left='-120px'; p2.style.bottom='-80px'; p2.style.animationDuration='90s'; p2.style.animationDirection='reverse'; wrap.appendChild(p2);
  if(reduce) return;
  const W = window.innerWidth, H = window.innerHeight;
  const count = Math.max(7, Math.min(14, Math.round((W*H)/110000)));
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className='bg-item';
    const sz = 44 + Math.random()*70;
    el.style.width = sz+'px'; el.style.height = sz+'px';
    el.style.left = (Math.random()*90)+'%'; el.style.top = (Math.random()*85)+'%';
    el.style.setProperty('--dx', (Math.random()*50-25).toFixed(1)+'px');
    el.style.setProperty('--dy', (-30-Math.random()*50).toFixed(1)+'px');
    el.style.setProperty('--rot-start', (Math.random()*24-12).toFixed(1)+'deg');
    el.style.setProperty('--rot-end', (Math.random()*24-12).toFixed(1)+'deg');
    el.style.animationDuration = (9+Math.random()*9).toFixed(1)+'s';
    el.style.animationDelay = (-Math.random()*12).toFixed(1)+'s';
    el.style.opacity = (0.05+Math.random()*0.06).toFixed(3);
    el.innerHTML = BG_SVGS[Math.floor(Math.random()*BG_SVGS.length)];
    wrap.appendChild(el);
  }
  for(let i=0;i<20;i++){
    const p = document.createElement('div');
    p.className='bg-particle';
    p.style.left = (Math.random()*100)+'%'; p.style.bottom = '-20px';
    const sz = (2+Math.random()*2).toFixed(1)+'px';
    p.style.width = sz; p.style.height = sz;
    p.style.animationDuration = (11+Math.random()*12).toFixed(1)+'s';
    p.style.animationDelay = (-Math.random()*20).toFixed(1)+'s';
    wrap.appendChild(p);
  }
}
let bgResizeT = null;
window.addEventListener('resize', ()=>{ clearTimeout(bgResizeT); bgResizeT = setTimeout(mountBgAnimation, 300); });

/* ============================================================
   PWA
============================================================ */
function setupPWA(){
  const manifest = {
    name:"86 Training & Grind", short_name:"86 TG", start_url:"./",
    display:"standalone", background_color:"#0A0B0D", theme_color:"#0A0B0D",
    orientation:"portrait",
    icons:[{ src:"data:image/svg+xml;base64," + btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0A0B0D"/><text x="256" y="340" font-family="Arial,sans-serif" font-weight="900" font-size="230" fill="#C9FF4D" text-anchor="middle">86</text></svg>`),
    sizes:"512x512", type:"image/svg+xml", purpose:"any maskable" }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
}

/* ============================================================
   INIT
============================================================ */
async function initApp(){
  migrate();
  DB = {
    treinos: safeJSON(KEYS.treinos, []),
    historico: safeJSON(KEYS.hist, []),
    cardios: safeJSON(KEYS.cardios, [])
  };
  const persisted = safeJSON(KEYS.session, null);
  if(persisted && !validateSession(persisted)){
    console.warn('[86gym] sessão corrompida, removendo');
    safeDel(KEYS.session);
  }
  seedDefaultCardio();
  setupPWA();
  document.documentElement.style.setProperty('--gym-pattern', buildGymPatternDataUri(0.028));
  document.documentElement.style.setProperty('--gym-pattern-strong', buildGymPatternDataUri(0.09));
  mountBgAnimation();
  applyTheme();
  render();

  setInterval(()=>{ if(SESSION) persistSession(); }, 30000);

  try{
    const idbAvatar = await IDB.get('avatar');
    if(idbAvatar){
      const pp = loadPerfil();
      if(!pp.avatar){ pp.avatar = idbAvatar; savePerfil(pp); }
    }
  }catch(e){}

  const weekCount = DB.historico.filter(h=> h.data >= Date.now()-7*86400000).length;
  const meta = loadPerfil().metaTreinos || 4;
  setAppBadge(Math.max(0, meta - weekCount));

  if(needsOnboarding()){
    await showOnboarding();
  }

  checkImportFromURL();

  setTimeout(async ()=>{
    if(loadSettings().autoBackup){
      await autoBackup(false);
    }
  }, 3000);

  setInterval(()=>{
    if(loadSettings().autoBackup) autoBackup(false);
  }, 10*60*1000);

  if(reminderDue()){
    setTimeout(()=> showToast('Hora de atualizar seu peso!'), 700);
  }
}
window.addEventListener('beforeunload', ()=>{ if(SESSION) persistSession(); });
initApp();
</script>
