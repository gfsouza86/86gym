function startPlankTimer(){
  let seg = 0, target = 60, running = true, interval = null;
  const bg = openModal(`
    <button class="close-x">&times;</button>
    <h3 style="margin-bottom:8px;">Cronômetro de prancha</h3>
    <div class="plank-timer running" id="plank-box"><div class="t" id="plank-time">00:00</div><div class="l" id="plank-label">Alvo: 60s</div></div>
    <label class="field">Alvo (segundos)</label>
    <input type="text" inputmode="numeric" id="plank-target" value="60">
    <div class="row" style="margin-top:16px;"><button class="btn secondary" id="plank-reset">Zerar</button><button class="btn" id="plank-stop">Parar</button></div>
  `);
  const timeEl = bg.querySelector('#plank-time'), labelEl = bg.querySelector('#plank-label'),
        boxEl = bg.querySelector('#plank-box'), targetEl = bg.querySelector('#plank-target');
  function tick(){ if(!running) return; seg++; timeEl.textContent = formatSeconds(seg); if(seg >= target){ playBeep(3); haptic('success'); running = false; boxEl.classList.remove('running'); labelEl.textContent = '✓ Alvo atingido!'; } }
  interval = setInterval(tick, 1000);
  targetEl.addEventListener('change', ()=>{ target = Number(targetEl.value)||60; labelEl.textContent = `Alvo: ${target}s`; });
  bg.querySelector('#plank-reset').onclick = ()=>{ seg = 0; timeEl.textContent = '00:00'; labelEl.textContent = `Alvo: ${target}s`; boxEl.classList.add('running'); running = true; };
  bg.querySelector('#plank-stop').onclick = ()=>{ clearInterval(interval); closeModal(bg); };
  bg.querySelector('.close-x').onclick = ()=>{ clearInterval(interval); closeModal(bg); };
}

function getExerciciosComHistorico(){
  const key = DB.historico.length + '|' + DB.historico.filter(h=>h.tipo==='forca').length;
  if(_cacheExerciciosHistoricoKey === key && _cacheExerciciosHistorico) return _cacheExerciciosHistorico;
  _cacheExerciciosHistorico = [...new Set(DB.historico.filter(h=>h.tipo==='forca').flatMap(h=> (h.exercicios||[]).map(e=>e.nome)).filter(Boolean))];
  _cacheExerciciosHistoricoKey = key;
  return _cacheExerciciosHistorico;
}
function HistoricoScreen(){
  let hist = [...DB.historico].sort((a,b)=> b.data - a.data);
  if(HIST_FILTER.tipo!=='todos') hist = hist.filter(h=> h.tipo===HIST_FILTER.tipo);
  if(HIST_FILTER.q){ const q = HIST_FILTER.q.toLowerCase(); hist = hist.filter(h=> (h.treinoNome||'').toLowerCase().includes(q)); }
  const totalHist = hist.length; const LIMIT = 30;
  const visiveis = hist.slice(0, LIMIT);
  const exHist = getExerciciosComHistorico();
  const filterChips = `<div style="margin-bottom:14px;">
      <span class="chip ${HIST_FILTER.tipo==='todos'?'active':''}" data-hist-tipo="todos">Todos</span>
      <span class="chip ${HIST_FILTER.tipo==='forca'?'active':''}" data-hist-tipo="forca">Força</span>
      <span class="chip ${HIST_FILTER.tipo==='cardio'?'active':''}" data-hist-tipo="cardio">Cardio</span>
      <span class="chip ${HIST_FILTER.tipo==='descanso'?'active':''}" data-hist-tipo="descanso">Descanso</span>
    </div>
    <input type="text" id="hist-search" placeholder="Buscar..." value="${escapeHtml(HIST_FILTER.q)}" style="margin-bottom:14px;">`;
  const evoChips = exHist.length ? `<div class="card">
    <h3 style="font-size:14px; margin-bottom:10px;">Ver evolução</h3>
    <div>${exHist.slice(0, 30).map(n=>`<span class="chip" data-ver-evolucao="${escapeHtml(n)}">${escapeHtml(n)}</span>`).join('')}</div>
  </div>`:'';
  const body = visiveis.length===0 ? `<div class="empty">${ICONS.empty}<div>Nenhuma sessão encontrada.</div></div>` :
    visiveis.map(h=>{
      const isCardio = h.tipo==='cardio';
      const isRest = h.tipo==='descanso';
      const note = h.nota || '';
      const tipoCls = isCardio?'cardio':(isRest?'descanso':'forca');
      const tipoLbl = isCardio?'Cardio':(isRest?'Descanso':'Força');
      const trSet = isCardio
        ? (h.intervalos||[]).map(iv=>`<div class="hist-ex-line"><span>${iv.duracaoMin}min</span><span>Inc ${iv.inclinacao} · ${iv.velocidade}km/h</span></div>`).join('')
        : (h.exercicios||[]).map(e=>`<div class="hist-ex-line"><span>${escapeHtml(e.nome)}</span><span>${e.setsFeitas}/${e.setsTotal} · ${e.carga}kg</span></div>`).join('');
      return `<div class="hist-item" data-hist-id="${h.id}">
        <div class="swipe-bg">🗑 Excluir</div>
        <div class="hist-content">
          <div class="row-top">
            <div>
              <span class="tipo-tag ${tipoCls}">${tipoLbl}</span><br>
              <b>${escapeHtml(h.treinoNome || 'Descanso')}${h.divisaoLetra? ' · '+escapeHtml(h.divisaoLetra):''}</b><br>
              <small style="color:var(--muted);">${new Date(h.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})} · ${new Date(h.data).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small>
            </div>
            ${!isRest? `<div class="dur">${formatSeconds(h.duracaoSegundos||0)}</div>`:''}
          </div>
          ${note ? `<div class="hist-note">📝 ${escapeHtml(note)}</div>` : ''}
          ${trSet}
          ${!isRest ? `<div style="display:flex;gap:6px;margin-top:10px;justify-content:flex-end;">
            <button class="btn mini secondary" data-repeat-session="${h.id}">🔁 Repetir</button>
            <button class="btn mini secondary" data-edit-session="${h.id}">Editar</button>
          </div>`:''}
        </div>
      </div>`;
    }).join('');
  const more = totalHist > LIMIT ? `<div style="text-align:center;color:var(--muted);font-size:12px;padding:16px;">Mostrando ${LIMIT} de ${totalHist}</div>` : '';

function startCardioTicker(){
  if(!CARDIO_SESSION) return;
  if(CARDIO_SESSION.interval) clearInterval(CARDIO_SESSION.interval);
  CARDIO_SESSION.interval = setInterval(()=>{
    const S = CARDIO_SESSION; if(!S) return;
    const elapsed = (Date.now()-S.startTime)/1000 - (S.pausedSegundos||0);
    const cEl = document.getElementById('cardio-clock-num'); if(cEl) cEl.textContent = formatSeconds(elapsed);
    if(S.paused || S.finished) return;
    S.secondsLeft -= 1;
    const nEl = document.getElementById('cardio-countdown-num'); if(nEl) nEl.textContent = formatSeconds(S.secondsLeft);
    if(S.secondsLeft<=0){
      if(S.idx < S.intervalos.length-1){ S.idx += 1; S.secondsLeft = Number(S.intervalos[S.idx].duracaoMin)*60; haptic('success'); playBeep(2); render(); }
      else { S.finished = true; clearInterval(S.interval); haptic('success'); playBeep(3); render(); }
    }
  }, 1000);
}
async function finalizeCardio(){
  const S = CARDIO_SESSION; if(!S) return;
  const duracaoSegundos = (Date.now()-S.startTime)/1000 - (S.pausedSegundos||0);
  const totalMin = S.intervalos.reduce((a,iv)=>a+Number(iv.duracaoMin),0);
  DB.historico.push({
    id: uid(), tipo:'cardio', treinoNome: S.nome, divisaoLetra:'', data: Date.now(),
    duracaoSegundos,
    intervalos: S.intervalos.map(iv=>({duracaoMin:iv.duracaoMin, inclinacao:iv.inclinacao, velocidade:iv.velocidade}))
  });
  saveHistorico();
  clearInterval(S.interval); clearInterval(clockInterval);
  CARDIO_SESSION = null;
  releaseWakeLock(); stopMediaSession();
  await showWorkoutComplete({
    subtitulo: 'Cardio finalizado!',
    stats: [ { v: formatSeconds(duracaoSegundos), l: 'Duração' }, { v: totalMin + 'min', l: 'Programado' }, { v: S.intervalos.length, l: 'Intervalos' } ],
    gruposTreinados: ['Cardio'], novosBadges: checkNewBadges()
  });
  go('historico');
}

function renderPRTimeline(name){
  const prs = [];
  const seenBest = new Map();
  const sorted = DB.historico.filter(h=>h.tipo==='forca').sort((a,b)=> a.data - b.data);
  sorted.forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(!e.nome || e.nome.toLowerCase() !== name.toLowerCase()) return;
      (e.setsDetalhados||[]).forEach(s=>{
        if(!s.done || s.warmup) return;
        const c = Number(s.carga)||0, r = Number(s.repeticoes)||0;
        if(c<=0 || r<=0) return;
        const oneRm = c*(1+r/30);
        const best = seenBest.get(name) || 0;
        if(oneRm > best){
          seenBest.set(name, oneRm);
          prs.push({ ts: h.data, carga: c, reps: r, oneRm });
        }
      });
    });
  });
  if(prs.length < 2) return '';
  return `<div class="divider"></div>
    <h3 style="font-size:15px;margin-bottom:8px;">📈 Histórico de PRs</h3>
    ${prs.slice(-8).reverse().map(p=>`<div class="hist-weight-row">
      <span style="color:var(--muted);font-size:11.5px;">${new Date(p.ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</span>
      <span style="flex:1;text-align:right;">
        <b style="color:var(--lime);">${p.carga}kg × ${p.reps}</b>
        <span style="color:var(--muted);font-size:11px;margin-left:6px;">1RM ${p.oneRm.toFixed(1)}kg</span>
      </span>
    </div>`).join('')}`;
}

    const dots = wrap.querySelectorAll('.ex-img-dot');
    let current = 0;
    function show(idx){
      current = (idx + imgs.length) % imgs.length;
      imgs.forEach((img, i)=> img.style.opacity = i === current ? '1' : '0');
      dots.forEach((d, i)=> d.style.background = i === current ? 'var(--lime)' : 'rgba(255,255,255,0.5)');
    }
    wrap.querySelectorAll('[data-img-nav]').forEach(btn=> btn.addEventListener('click', ()=> show(current + Number(btn.dataset.imgNav))));
    wrap.querySelectorAll('[data-img-dot]').forEach(dot=> dot.addEventListener('click', ()=> show(Number(dot.dataset.imgDot))));
    let startX = 0;
    wrap.addEventListener('touchstart', e=> startX = e.touches[0].clientX, {passive:true});
    wrap.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - startX;
      if(Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
    }, {passive:true});
  });
  const noteInp = bg.querySelector('#ex-note-input');
  noteInp.addEventListener('blur', ()=> setExNote(name, noteInp.value));
  const editBtn = bg.querySelector('#edit-custom');
  if(editBtn) editBtn.addEventListener('click', async ()=>{
    closeModal(bg);
    const idx = CUSTOM_EXERCISES.findIndex(c=> c.name.toLowerCase() === name.toLowerCase());
    if(idx < 0) return;
    const novoNome = await promptDialog('Novo nome', {title:'Editar exercício', defaultValue:CUSTOM_EXERCISES[idx].name});
    if(!novoNome || !novoNome.trim()) return;
    const novoGrupo = await promptDialog('Grupo muscular', {title:'Grupo', defaultValue:CUSTOM_EXERCISES[idx].group || 'Personalizados'});
    if(!novoGrupo) return;
    const oldName = CUSTOM_EXERCISES[idx].name;
    CUSTOM_EXERCISES[idx].name = novoNome.trim();
    CUSTOM_EXERCISES[idx].group = novoGrupo.trim() || 'Personalizados';
    saveCustomExercises(CUSTOM_EXERCISES);
    DB.treinos.forEach(t => t.divisoes.forEach(d => d.exercicios.forEach(ex => { if(ex.nome.toLowerCase() === oldName.toLowerCase()) ex.nome = novoNome.trim(); })));
    saveTreinos(); showToast('Exercício atualizado!'); render();
  });
  const delBtn = bg.querySelector('#del-custom');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    closeModal(bg);
    if(!await confirmDialog('Excluir este exercício personalizado?', {danger:true, okText:'Excluir'})) return;
    CUSTOM_EXERCISES = CUSTOM_EXERCISES.filter(c=> c.name.toLowerCase() !== name.toLowerCase());
    saveCustomExercises(CUSTOM_EXERCISES); showToast('Excluído'); render();
  });
}

function swapExerciseModal(sessionExIdx){
  const currentName = SESSION.exercicios[sessionExIdx].nome;
  const g = exerciseGroup(currentName);
  const favs = loadFavs();
  const allFlat = exerciseFlat();
  const favList = allFlat.filter(e=> favs[e.name.toLowerCase()] && e.name !== currentName);
  const sameGroup = allFlat.filter(e=> e.group === g && e.name !== currentName);
  const allOthers = allFlat.filter(e=> e.name !== currentName);
  const bg = openModal(`
    <button class="close-x">&times;</button>
    <h3 style="margin-bottom:4px;">Trocar exercício</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">Atual: ${escapeHtml(currentName)}</p>
    <input type="text" id="swap-search" placeholder="Buscar..." autocomplete="off">
    <div style="margin-top:12px;max-height:60vh;overflow-y:auto;" id="swap-list">
      ${favList.length ? `<div class="group-title" style="margin-top:0;">⭐ Favoritos</div>${favList.slice(0,20).map(e=>`<div class="ex-row ${hasInjury(e.group)?'banned':''}" data-pick-swap="${escapeHtml(e.name)}" style="cursor:pointer;"><span>${escapeHtml(e.name)} <small style="color:var(--muted);font-size:11px;">· ${escapeHtml(e.group)}</small></span>${ICONS.chevron}</div>`).join('')}`:''}
      ${sameGroup.length ? `<div class="group-title">Mesmo grupo · ${escapeHtml(g)}</div>${sameGroup.slice(0,60).map(e=>`<div class="ex-row ${hasInjury(e.group)?'banned':''}" data-pick-swap="${escapeHtml(e.name)}" style="cursor:pointer;"><span>${escapeHtml(e.name)}</span>${ICONS.chevron}</div>`).join('')}` : ''}
      <div class="group-title">Outros exercícios</div>
      ${allOthers.slice(0, 40).map(e=>`<div class="ex-row ${hasInjury(e.group)?'banned':''}" data-pick-swap="${escapeHtml(e.name)}" style="cursor:pointer;"><span>${escapeHtml(e.name)} <small style="color:var(--muted);font-size:11px;">· ${escapeHtml(e.group)}</small></span>${ICONS.chevron}</div>`).join('')}
    </div>
  `);
  bg.querySelector('.close-x').onclick = ()=> closeModal(bg);
  const listEl = bg.querySelector('#swap-list'), searchEl = bg.querySelector('#swap-search');
  function bindSwap(){
    listEl.querySelectorAll('[data-pick-swap]').forEach(el=>{
      el.addEventListener('click', ()=>{
        SESSION.exercicios[sessionExIdx].nome = el.dataset.pickSwap;
        persistSession(); closeModal(bg); render(); showToast('Exercício trocado!');
      });
    });
  }
  bindSwap();
  searchEl.addEventListener('input', ()=>{
    const q = searchEl.value.toLowerCase().trim();
    if(!q) return;
    const matches = allFlat.filter(e=> e.name.toLowerCase().includes(q) && e.name !== currentName).slice(0, 30);
    listEl.innerHTML = matches.length ? matches.map(e=>`<div class="ex-row" data-pick-swap="${escapeHtml(e.name)}" style="cursor:pointer;"><span>${escapeHtml(e.name)} <small style="color:var(--muted);font-size:11px;">· ${escapeHtml(e.group)}</small></span>${ICONS.chevron}</div>`).join('') : '<p style="color:var(--muted);font-size:12.5px;text-align:center;padding:20px;">Nada encontrado.</p>';
    bindSwap();
  });
}

function renderPerfilAnalises(){
  const streak = computeStreak(), streakDays = computeStreakDays();
  const vol = weekVolume(), volMes = monthVolume();
  const goals = loadGoals();
  const metaVolPct = goals.volumeMes ? Math.min(100, Math.round(volMes/goals.volumeMes*100)) : 0;
  const hm = buildHeatmapData();
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dow = (hoje.getDay()+6)%7;
  const ini = new Date(hoje); ini.setDate(ini.getDate() - dow - 51*7);
  const cells = [];
  const maxVol = Math.max(1, ...Object.values(hm));
  for(let w=0; w<52; w++){
    for(let d=0; d<7; d++){
      const dt = new Date(ini); dt.setDate(dt.getDate() + w*7 + d);
      if(dt > hoje){ cells.push({empty:true}); continue; }
      const k = todayKey(dt); const v = hm[k]||0;
      let level = 0;
      if(v>0) level = v/maxVol > 0.75 ? 4 : v/maxVol > 0.5 ? 3 : v/maxVol > 0.25 ? 2 : 1;
      cells.push({level, date: dt, vol:v});
    }
  }
  const grpVol = {}; const monthAgo = Date.now() - 30*86400000;
  DB.historico.filter(h=> h.data>=monthAgo && h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      const g = exerciseGroup(e.nome);
      const v = (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0);
      grpVol[g] = (grpVol[g]||0) + v;
    });
  });
  const grpSorted = Object.entries(grpVol).sort((a,b)=>b[1]-a[1]);
  const maxGrp = grpSorted.length ? grpSorted[0][1] : 0;
  const nomes = [...new Set(DB.historico.filter(h=>h.tipo==='forca').flatMap(h=> (h.exercicios||[]).map(e=>e.nome)).filter(Boolean))];
  const prs = nomes.map(n=> ({n, b:bestSetFor(n)})).filter(x=>x.b).sort((a,b)=> b.b.oneRm - a.b.oneRm).slice(0, 5);
  const estagnados = nomes.filter(n=> isStagnant(n)).slice(0, 5);
  const anoAtual = new Date().getFullYear();
  const anual = loadAnnual()[anoAtual] || {};
  const notas = DB.historico.filter(h=> h.nota && h.nota.trim()).sort((a,b)=> b.data - a.data);
  return `
  <div class="stat-grid">
    <div class="stat-box"><div class="v">${DB.historico.filter(h=>h.tipo==='forca').length}</div><div class="l">Treinos</div></div>
    <div class="stat-box"><div class="v">${streak}</div><div class="l">Sem.</div></div>
    <div class="stat-box"><div class="v">${streakDays}</div><div class="l">Dias</div></div>
  </div>
  <div class="card"><h3 style="font-size:15px;margin-bottom:8px;">Volume últimos 7 dias</h3><div style="font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--lime);">${vol.toLocaleString('pt-BR')} kg</div></div>
  ${goals.volumeMes ? `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><h3 style="font-size:15px;">Meta mensal</h3><b style="color:var(--lime);font-family:var(--font-display);">${metaVolPct}%</b></div><div class="progress-bar"><div class="fill" style="width:${metaVolPct}%"></div></div><div style="font-size:12px;color:var(--muted);margin-top:8px;">${volMes.toLocaleString('pt-BR')} / ${goals.volumeMes.toLocaleString('pt-BR')} kg</div></div>` : ''}
  <div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Atividade do ano</h3>
    <div class="heatmap-wrap"><div class="heatmap">${cells.map(c=> c.empty ? '<div class="hm-cell" style="visibility:hidden;"></div>' : `<div class="hm-cell l${c.level}" title="${todayKey(c.date)}: ${c.vol.toFixed(0)}kg"></div>`).join('')}</div></div>
    <div class="hm-legend"><span>Menos</span><div class="hm-cell"></div><div class="hm-cell l1"></div><div class="hm-cell l2"></div><div class="hm-cell l3"></div><div class="hm-cell l4"></div><span>Mais</span></div>
  </div>
  ${Object.keys(anual).length ? `<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Recordes ${anoAtual}</h3>${Object.entries(anual).sort((a,b)=> b[1].oneRm - a[1].oneRm).slice(0,5).map(([n,d])=>`<div class="hist-weight-row"><span style="flex:1;">${escapeHtml(n)}</span><span style="text-align:right;"><b style="color:var(--lime);">${d.oneRm.toFixed(1)}kg</b><div style="color:var(--muted);font-size:11px;">${d.carga}kg × ${d.reps}</div></span></div>`).join('')}</div>`:''}
  ${estagnados.length ? `<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">⚠ Estagnados</h3>${estagnados.map(n=>{ const l = lastSessionFor(n); return `<div class="insight-alert" style="margin-bottom:8px;"><b>${escapeHtml(n)}</b><small>${l?`Último: ${l.ex.carga}kg`:''}. Tente +2.5kg ou nova variação.</small></div>`; }).join('')}</div>`:''}
  ${grpSorted.length? `<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Volume por grupo (30 dias)</h3>${grpSorted.map(([g,v])=>`<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span><span class="grp-chip" data-grp="${g}">${g}</span></span><b>${Math.round(v).toLocaleString('pt-BR')} kg</b></div><div class="progress-bar"><div class="fill" style="width:${maxGrp? (v/maxGrp*100).toFixed(0):0}%"></div></div></div>`).join('')}</div>`:''}
  <div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Top PRs (1RM)</h3>
    ${prs.length===0 ? '<p style="color:var(--muted);font-size:12.5px;">Sem registros.</p>' : prs.map(x=>`<div class="hist-weight-row"><span style="flex:1;">${escapeHtml(x.n)}</span><span style="text-align:right;"><b style="color:var(--lime);">${x.b.oneRm.toFixed(1)} kg</b><div style="color:var(--muted);font-size:11px;">${x.b.carga}kg × ${x.b.reps}</div></span></div>`).join('')}
  </div>
  ${notas.length ? `<div class="card">
    <h3 style="font-size:15px;margin-bottom:10px;">📝 Diário</h3>
    ${notas.slice(0, 20).map(h=>`<div style="padding:10px 0;border-top:1px solid var(--line-soft);">
      <div style="font-size:11px;color:var(--muted);font-weight:600;">${new Date(h.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})} · ${escapeHtml(h.treinoNome||'Treino')}</div>
      <div style="font-size:13px;margin-top:4px;line-height:1.5;">${escapeHtml(h.nota)}</div>
    </div>`).join('')}
  </div>` : ''}`;
}

function needsOnboarding(){ return !safeGet(KEYS.onboarded); }
function showOnboarding(opts = {}){
  const askSetup = opts.askSetup !== false;
  return new Promise(resolve=>{
    const slides = [
      { icon:'dumbbell', title:'Bem-vindo ao <span class="accent">86 TG</span>', desc:'Seu companheiro completo de treino.' },
      { icon:'clipboard', title:'Monte seus <span class="accent">treinos</span>', desc:'Escolha um template (PPL, ABC...) ou crie do zero.' },
      { icon:'cloud', title:'Sincronize', desc:'Configure o Gist no Perfil. Tudo aparece no celular e PC.' },
      { icon:'chart', title:'Acompanhe padrões', desc:'Sono, energia, PRs, volume, heatmap anual.' }
    ];
    let idx = 0;
    const bg = document.createElement('div');
    bg.className = 'onb-bg';
    bg.innerHTML = `<div class="onb-card">
      ${slides.map((s,i)=>`<div class="onb-slide ${i===0?'active':''}"><div class="onb-icon">${ICONS[s.icon]}</div><h1 class="onb-title">${s.title}</h1><p class="onb-desc">${escapeHtml(s.desc)}</p></div>`).join('')}
      <div class="onb-dots">${slides.map((_,i)=>`<span class="onb-dot ${i===0?'active':''}"></span>`).join('')}</div>
      <div class="onb-actions"><button class="btn secondary" id="onb-skip">Pular</button><button class="btn" id="onb-next">Próximo</button></div>
    </div>`;
    document.body.appendChild(bg);
    function update(){
      bg.querySelectorAll('.onb-slide').forEach((el,i)=> el.classList.toggle('active', i===idx));
      bg.querySelectorAll('.onb-dot').forEach((el,i)=> el.classList.toggle('active', i===idx));
      bg.querySelector('#onb-next').textContent = idx === slides.length-1 ? (askSetup ? 'Começar' : 'Concluir') : 'Próximo';
    }
    bg.querySelector('#onb-next').onclick = ()=>{ haptic('tap'); if(idx < slides.length-1){ idx++; update(); } else finish(); };
    bg.querySelector('#onb-skip').onclick = finish;
    async function finish(){ safeSet(KEYS.onboarded, '1'); bg.remove(); if(askSetup) await askInitialSetup(); resolve(); }
    update();
  });
}

function canUseFS(){ return 'showSaveFilePicker' in window; }
function buildBackupPayload(){
  return {
    _meta:{ app:'86 Training & Grind', version:9, exportedAt:new Date().toISOString() },
    treinos: DB.treinos, historico: DB.historico, cardios: DB.cardios,
    perfil: loadPerfil(), customExercises: CUSTOM_EXERCISES, settings: loadSettings(),
    checkin: safeJSON(KEYS.checkin, {}), badges: loadBadges(),
    challenges: safeJSON(KEYS.challenges, {}), annual: loadAnnual(), goals: loadGoals(),
    favs: loadFavs(), exNotes: loadExNotes(),
    restDays: loadRestDays(), injuries: loadInjuries()
  };
}
async function pickBackupFile(){
  if(!canUseFS()){ showToast('Navegador não suporta'); return null; }
  try{
    const h = await window.showSaveFilePicker({ suggestedName:'86gym-backup.json', types:[{ description:'Backup', accept:{'application/json':['.json']} }] });
    await IDB.set('backupFileHandle', h);
    showToast('Configurado!'); return h;
  }catch(e){ if(e.name==='AbortError') return null; showToast('Não foi possível'); return null; }
}
async function autoBackup(force){
  const s = loadSettings();
  if(!s.autoBackup && !force) return false;
  if(!canUseFS()) return false;
  const handle = await IDB.get('backupFileHandle');
  if(!handle) return false;
  let perm = 'denied';
  try{ perm = await handle.queryPermission({ mode:'readwrite' }); }catch(e){ return false; }
  if(perm !== 'granted'){
    if(force){ try{ perm = await handle.requestPermission({ mode:'readwrite' }); }catch(e){ return false; } if(perm !== 'granted') return false; }
    else return false;
  }
  try{
    const payload = buildBackupPayload();
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    safeSet(KEYS.lastBackup, Date.now().toString());
    return true;
  }catch(e){ console.warn('[86gym] auto-backup falhou', e); return false; }
}
function scheduleAutoBackup(delayMs = 4000){
  const s = loadSettings();
  if(!s.autoBackup) return;
  if(!canUseFS()) return;
  clearTimeout(_autoBackupTimer);
  _autoBackupTimer = setTimeout(()=> autoBackup(false), delayMs);
}
function exportBackup(){
  const data = buildBackupPayload();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `86gym-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); setTimeout(()=> URL.revokeObjectURL(url), 2000);
  safeSet(KEYS.lastBackup, Date.now().toString());
  showToast('Backup exportado!');
}
function importBackup(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>{ try{ const d = JSON.parse(r.result); resolve(d); }catch(e){ reject(e); } };
    r.onerror = reject;
    r.readAsText(file);
  });
}
function exportCSV(){
  const rows = [['data','treino','divisao','exercicio','serie','reps','carga','rir','falha','aquecimento']];
  DB.historico.filter(h=>h.tipo==='forca').sort((a,b)=> a.data - b.data).forEach(h=>{
    const dt = new Date(h.data).toISOString();
    (h.exercicios||[]).forEach(e=>{
      (e.setsDetalhados||[]).forEach((s, i)=>{
        rows.push([dt, h.treinoNome||'', h.divisaoLetra||'', e.nome||'', String(i+1), String(s.reps||0), String(s.carga||0), String(s.rir ?? ''), s.falha ? '1':'0', s.warmup ? '1':'0']);
      });
    });
  });
  const csv = rows.map(r=> r.map(cell=>{ const s = String(cell).replace(/"/g,'""'); return /[",\n]/.test(s) ? '"'+s+'"' : s; }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `86gym-export-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); setTimeout(()=> URL.revokeObjectURL(url), 2000);
  showToast('CSV exportado!');
}
function parseCSVLine(line){
  const out = []; let cur = ''; let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){ if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else inQ = false; } else cur += ch; }
    else { if(ch === ','){ out.push(cur); cur = ''; } else if(ch === '"') inQ = true; else cur += ch; }
  }
  out.push(cur); return out;
}
async function importCSV(file){
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l=> l.trim());
  if(!lines.length) throw new Error('CSV vazio');
  const header = parseCSVLine(lines[0]).map(h=> h.trim().toLowerCase());
  const idx = k => header.indexOf(k);
  for(const n of ['data','treino','divisao','exercicio','serie','reps','carga']){ if(idx(n)<0) throw new Error('Faltando: '+n); }
  const sessions = new Map();
  for(let i=1;i<lines.length;i++){
    const cells = parseCSVLine(lines[i]);
    const get = k => cells[idx(k)] ?? '';
    const dt = new Date(get('data'));
    if(isNaN(dt.getTime())) continue;
    const tKey = get('treino') + '|' + get('divisao') + '|' + dt.toISOString().slice(0,16);
    if(!sessions.has(tKey)) sessions.set(tKey, { id: uid(), tipo:'forca', treinoNome: get('treino'), divisaoLetra: get('divisao'), data: dt.getTime(), duracaoSegundos:0, exercicios:[], _map:new Map() });
    const s = sessions.get(tKey);
    const exName = get('exercicio');
    if(!s._map.has(exName)) s._map.set(exName, { nome:exName, setsTotal:0, setsFeitas:0, carga:0, repsMedias:0, setsDetalhados:[] });
    const ex = s._map.get(exName);
    const warmup = get('aquecimento') === '1';
    const reps = Number(get('reps'))||0, carga = Number(get('carga'))||0;
    const rir = get('rir')==='' ? null : Number(get('rir'));
    const falha = get('falha') === '1';
    ex.setsDetalhados.push({ reps, carga, done:true, warmup, rir, falha });
    if(!warmup){ ex.setsTotal++; ex.setsFeitas++; ex.carga = carga; }
  }
  const arr = [];
  sessions.forEach(s=>{
    s.exercicios = [...s._map.values()];
    s.exercicios.forEach(e=>{ const valid = e.setsDetalhados.filter(x=> !x.warmup && x.reps>0); const reps = valid.map(x=>x.reps); e.repsMedias = reps.length ? Math.round(reps.reduce((a,b)=>a+b,0)/reps.length) : 0; });
    delete s._map; arr.push(s);
  });
  return arr;
}

function loadGistConfig(){
  return {
    token: safeGet(GIST_KEYS.token) || '', id: safeGet(GIST_KEYS.id) || '',
    lastSync: Number(safeGet(GIST_KEYS.lastSync) || 0),
    enabled: safeGet(GIST_KEYS.enabled) === '1',
    autoSync: safeGet(GIST_KEYS.autoSync) !== '0',
    localModified: Number(safeGet(GIST_KEYS.localModified) || 0)
  };
}
function saveGistConfig(c){
  if(c.token!==undefined) safeSet(GIST_KEYS.token, c.token);
  if(c.id!==undefined) safeSet(GIST_KEYS.id, c.id);
  if(c.lastSync!==undefined) safeSet(GIST_KEYS.lastSync, String(c.lastSync));
  if(c.enabled!==undefined) safeSet(GIST_KEYS.enabled, c.enabled ? '1' : '0');
  if(c.autoSync!==undefined) safeSet(GIST_KEYS.autoSync, c.autoSync ? '1' : '0');
  if(c.localModified!==undefined) safeSet(GIST_KEYS.localModified, String(c.localModified));
}
async function gistFetch(url, opts={}){
  const cfg = loadGistConfig();
  if(!cfg.token) throw new Error('Token não configurado');
  const r = await fetch(url, { ...opts, headers: { 'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + cfg.token, 'X-GitHub-Api-Version':'2022-11-28', 'Content-Type':'application/json', ...(opts.headers||{}) } });
  if(!r.ok){ const txt = await r.text().catch(()=> ''); let msg = `GitHub ${r.status}`; try{ const j = JSON.parse(txt); if(j.message) msg += ': ' + j.message; }catch(e){} throw new Error(msg); }
  return r.json();
}
function buildSyncPayload(){ const data = buildBackupPayload(); if(data.settings){ delete data.settings.gistToken; delete data.settings.gistId; } return data; }
async function gistCreate(){
  const payload = buildSyncPayload();
  const d = await gistFetch('https://api.github.com/gists', { method:'POST', body: JSON.stringify({ description:'86 TG — backup', public:false, files:{ '86gym-data.json':{ content: JSON.stringify(payload, null, 2) } } }) });
  const now = Date.now();
  saveGistConfig({ id: d.id, lastSync: now, enabled: true, localModified: now });
  return d;
}
async function gistPush(){
  const cfg = loadGistConfig();
  if(!cfg.token || !cfg.id) throw new Error('Sync não configurada');
  await gistFetch(`https://api.github.com/gists/${cfg.id}`, { method:'PATCH', body: JSON.stringify({ files:{ '86gym-data.json':{ content: JSON.stringify(buildSyncPayload(), null, 2) } } }) });
  saveGistConfig({ lastSync: Date.now() }); updateSyncBadge('ok');
}
async function gistPull(){
  const cfg = loadGistConfig();
  if(!cfg.token || !cfg.id) throw new Error('Sync não configurada');
  const d = await gistFetch(`https://api.github.com/gists/${cfg.id}`);
  const file = d.files['86gym-data.json'] || Object.values(d.files)[0];
  if(!file) throw new Error('Arquivo não encontrado');
  let content = file.content;
  if(file.truncated && file.raw_url){ const r = await fetch(file.raw_url, {headers:{'Accept':'application/vnd.github.raw'}}); content = await r.text(); }
  applySyncPayload(JSON.parse(content));
  saveGistConfig({ lastSync: Date.now(), localModified: Date.now() }); updateSyncBadge('ok');
}
function applySyncPayload(data){
  if(!data) return;
  _suppressGistSync = true;
  try{
    DB.treinos = data.treinos || []; DB.historico = data.historico || []; DB.cardios = data.cardios || [];
    saveTreinos(); saveHistorico(); saveCardios();
    if(data.perfil) savePerfil(data.perfil);
    if(data.customExercises){ CUSTOM_EXERCISES = data.customExercises; saveCustomExercises(CUSTOM_EXERCISES); }
    if(data.settings) saveSettings({ ...data.settings });
    if(data.checkin) safeSet(KEYS.checkin, JSON.stringify(data.checkin));
    if(data.badges) saveBadges(data.badges);
    if(data.goals) saveGoals(data.goals);
    if(data.favs) saveFavs(data.favs);
    if(data.exNotes) saveExNotes(data.exNotes);
    if(data.restDays) saveRestDays(data.restDays);
    if(data.injuries) saveInjuries(data.injuries);
    if(data.annual) saveAnnual(data.annual); else rebuildAnnualRecords();
  } finally { _suppressGistSync = false; }
}
async function gistSmartSync(){
  const cfg = loadGistConfig();
  if(!cfg.enabled || !cfg.token || !cfg.id) return { status:'disabled' };
  try{
    updateSyncBadge('syncing');
    const d = await gistFetch(`https://api.github.com/gists/${cfg.id}`);
    const remoteUpdated = new Date(d.updated_at).getTime();
    const localMod = cfg.localModified || 0, lastSync = cfg.lastSync || 0;
    const TOL = 5000;
    if(remoteUpdated > lastSync + TOL && remoteUpdated >= localMod){ await gistPull(); return { status:'pulled' }; }
    if(localMod > lastSync + TOL && localMod > remoteUpdated){ await gistPush(); return { status:'pushed' }; }
    saveGistConfig({ lastSync: Math.max(remoteUpdated, localMod, lastSync) });
    updateSyncBadge('ok'); return { status:'up-to-date' };
  }catch(e){ updateSyncBadge('err'); return { status:'error', error: e.message }; }
}
function scheduleGistSync(delayMs = 3000){
  if(_suppressGistSync) return;
  const cfg = loadGistConfig();
  if(!cfg.enabled || !cfg.autoSync || !cfg.token || !cfg.id) return;
  clearTimeout(_gistSyncTimer);
  _gistSyncTimer = setTimeout(async ()=>{ try{ await gistPush(); }catch(e){ updateSyncBadge('err'); } }, delayMs);
}
function rebuildAnnualRecords(){
  const anual = {};
  DB.historico.filter(h=>h.tipo==='forca').forEach(h=>{
    const ano = new Date(h.data).getFullYear();
    if(!anual[ano]) anual[ano] = {};
    (h.exercicios||[]).forEach(e=>{
      (e.setsDetalhados||[]).forEach(s=>{
        if(!s.done || s.warmup) return;
        const carga = Number(s.carga)||0, reps = Number(s.repeticoes)||0;
        if(carga<=0 || reps<=0) return;
        const oneRm = carga*(1+reps/30);
        if(!anual[ano][e.nome] || anual[ano][e.nome].oneRm < oneRm) anual[ano][e.nome] = { carga, reps, oneRm, ts:h.data };
      });
    });
  });
  saveAnnual(anual);
}

function parseWorkoutText(text){
  const linhas = text.split('\n').map(l=> l.trim()).filter(Boolean);
  const exercicios = [];
  const regex = /^[-•*]?\s*(.+?)\s+(\d+)\s*[xX×]\s*(\d+)(?:\s+(\d+(?:[.,]\d+)?)\s*kg?)?/;
  for(const l of linhas){
    const m = l.match(regex);
    if(m){
      const nome = m[1].replace(/[-,;:]$/, '').trim();
      const found = fuzzyFindExercise(nome);
      exercicios.push({
        nome: found ? found.name : nome,
        series: Number(m[2])||3, repeticoes: Number(m[3])||10,
        carga: m[4] ? Number(m[4].replace(',','.')) : 0,
        descanso: 60, nota:'', aquecimento:false, grupo:'', dropSet:false, rirAlvo:null, supersetId:null
      });
    }
  }
  return exercicios;
}

    if(!text) return;
    const exercicios = parseWorkoutText(text);
    if(!exercicios.length){ showToast('Nada reconhecido'); return; }
    DB.treinos.push({ id:uid(), nome:'Treino importado', divisoes:[{ id:uid(), letra:'A', exercicios }] });
    saveTreinos(); showToast(`${exercicios.length} exercícios importados!`); go('treinos');
  });
}

  });

    startSessionClock();

      if(SESSION.timer.endTime && SESSION.timer.endTime > Date.now()){ _restTimerRef = setInterval(restTimerTick, 200); SESSION.timer.interval = _restTimerRef; }

  const btnNovoCardio = document.getElementById('btn-novo-cardio'); if(btnNovoCardio) btnNovoCardio.addEventListener('click', ()=>{ DRAFT_CARDIO=null; go('cardio_form', {id:null}); });

  }));
  view.querySelectorAll('[data-edit-cardio]').forEach(el=> el.addEventListener('click', ()=> go('cardio_form', {id: el.dataset.editCardio})));
  view.querySelectorAll('[data-start-cardio]').forEach(el=> el.addEventListener('click', ()=>{ CARDIO_SESSION=null; go('cardio_exec', {cardioId: el.dataset.startCardio}); }));
  const cNome = document.getElementById('cardio-nome'); if(cNome) cNome.addEventListener('input', e=> DRAFT_CARDIO.nome = e.target.value);
  const cD = document.getElementById('cardio-dicas'); if(cD) cD.addEventListener('input', e=> DRAFT_CARDIO.observacoes.dicas = e.target.value.split('\n').map(s=>s.trim()).filter(Boolean));
  const cP = document.getElementById('cardio-porque'); if(cP) cP.addEventListener('input', e=> DRAFT_CARDIO.observacoes.porque = e.target.value.split('\n').map(s=>s.trim()).filter(Boolean));
  const backC = document.getElementById('btn-back-cardio'); if(backC) backC.addEventListener('click', ()=>{ DRAFT_CARDIO=null; go('cardio'); });
  const addIv = document.getElementById('btn-add-interval'); if(addIv) addIv.addEventListener('click', ()=>{ DRAFT_CARDIO.intervalos.push({id:uid(), duracaoMin:5, inclinacao:0, velocidade:0, dica:''}); render(); });
  view.querySelectorAll('[data-del-interval]').forEach(el=> el.addEventListener('click', ()=>{ DRAFT_CARDIO.intervalos.splice(Number(el.dataset.delInterval),1); render(); }));
  view.querySelectorAll('[data-cfield]').forEach(el=>{ el.addEventListener('input', ()=>{ const ii = Number(el.dataset.ii), f = el.dataset.cfield; DRAFT_CARDIO.intervalos[ii][f] = f==='dica' ? el.value : Number(el.value); }); });
  const btnSaveC = document.getElementById('btn-save-cardio');
  if(btnSaveC) btnSaveC.addEventListener('click', ()=>{
    if(!DRAFT_CARDIO.nome.trim()){ showToast('Nome vazio'); return; }
    if(!DRAFT_CARDIO.intervalos.length){ showToast('Adicione intervalo'); return; }
    const idx = DB.cardios.findIndex(c=>c.id===DRAFT_CARDIO.id);
    if(idx>=0) DB.cardios[idx]=DRAFT_CARDIO; else DB.cardios.push(DRAFT_CARDIO);
    saveCardios(); showToast('Salvo'); DRAFT_CARDIO=null; go('cardio');
  });
  const btnExitC = document.getElementById('btn-exit-cardio-exec');
  if(btnExitC) btnExitC.addEventListener('click', async ()=>{
    if(await confirmDialog('Sair?', {danger:true, okText:'Sair'})){
      if(CARDIO_SESSION && CARDIO_SESSION.interval) clearInterval(CARDIO_SESSION.interval);
      CARDIO_SESSION=null; releaseWakeLock(); stopMediaSession(); go('cardio');
    }
  });
  const btnPauseC = document.getElementById('btn-pause-cardio');
  if(btnPauseC) btnPauseC.addEventListener('click', ()=>{
    const S = CARDIO_SESSION;
    if(S.paused){ if(S.pauseStart) S.pausedSegundos = (S.pausedSegundos||0) + (Date.now()-S.pauseStart)/1000; S.pauseStart = null; }
    else S.pauseStart = Date.now();
    S.paused = !S.paused; render();
  });
  const btnSkipC = document.getElementById('btn-skip-cardio');
  if(btnSkipC) btnSkipC.addEventListener('click', ()=>{
    const S = CARDIO_SESSION;
    if(S.idx < S.intervalos.length-1){ S.idx+=1; S.secondsLeft = Number(S.intervalos[S.idx].duracaoMin)*60; }
    else { S.finished = true; if(S.interval) clearInterval(S.interval); }
    render();
  });
  const btnFinC = document.getElementById('btn-finalizar-cardio'); if(btnFinC) btnFinC.addEventListener('click', finalizeCardio);
  if(ROUTE.name==='cardio_exec' && CARDIO_SESSION) startCardioTicker();

  view.querySelectorAll('[data-hist-tipo]').forEach(c=> c.addEventListener('click', ()=>{ HIST_FILTER.tipo = c.dataset.histTipo; render(); }));
  const hs = document.getElementById('hist-search');
  if(hs){
    hs.addEventListener('input', e=>{
      HIST_FILTER.q = e.target.value;
      clearTimeout(_histSearchDebounce);
      _histSearchDebounce = setTimeout(()=>{ render(); const el = document.getElementById('hist-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 250);
    });
  }
  view.querySelectorAll('[data-edit-session]').forEach(el=> el.addEventListener('click', ()=> editSessionModal(el.dataset.editSession)));
  view.querySelectorAll('[data-repeat-session]').forEach(el=> el.addEventListener('click', async ()=>{
    const h = DB.historico.find(x=> x.id === el.dataset.repeatSession);
    if(!h || h.tipo !== 'forca') return;
    if(!await confirmDialog(`Repetir a sessão "${h.treinoNome}"?`, {okText:'Repetir'})) return;
    const exs = (h.exercicios||[]).map(e=>({
      nome: e.nome, series: e.setsTotal||3, repeticoes: e.repsMedias||10,
      carga: e.carga||0, descanso: 60, nota:'', aquecimento:false, grupo:'', dropSet:false, rirAlvo:null, supersetId:null
    }));
    const tempTreino = { id: uid(), nome: h.treinoNome + ' (repetição)', divisoes:[{ id: uid(), letra: h.divisaoLetra||'A', exercicios: exs }] };
    DB.treinos.push(tempTreino); saveTreinos();
    if(loadSettings().warmupAtivado) await showWarmupScreen(tempTreino.divisoes[0]);
    go('treino_exec', {treinoId: tempTreino.id, divisaoId: tempTreino.divisoes[0].id});
  }));
  view.querySelectorAll('.hist-item').forEach(item=>{
    const id = item.dataset.histId; if(!id) return;
    let startX = 0, curX = 0, open = false, dragging = false;
    const content = item.querySelector('.hist-content'); if(!content) return;
    const reset = ()=>{ content.style.transition = 'transform .2s'; content.style.transform = 'translateX(0)'; open = false; item.classList.remove('is-swiping'); };
    const showDel = ()=>{ content.style.transition = 'transform .2s'; content.style.transform = 'translateX(-88px)'; open = true; item.classList.add('is-swiping'); };
    content.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; curX = startX; dragging = true; content.style.transition = 'none'; item.classList.add('is-swiping'); }, {passive:true});
    content.addEventListener('touchmove', e=>{ if(!dragging) return; curX = e.touches[0].clientX; const dx = curX - startX; const base = open ? -88 : 0; let off = base + dx; off = Math.max(-96, Math.min(0, off)); content.style.transform = 'translateX(' + off + 'px)'; }, {passive:true});
    content.addEventListener('touchend', ()=>{ dragging = false; const dx = curX - startX; if(dx < -40 || (open && dx < 20)) showDel(); else reset(); });
    content.addEventListener('click', (e)=>{ if(open && !e.target.closest('button')) reset(); });
    item.querySelector('.swipe-bg').addEventListener('click', ()=>{
      const h = DB.historico.find(x=> x.id === id); if(!h) return;
      undoableAction('Excluída', ()=>{ DB.historico = DB.historico.filter(x=> x.id !== id); saveHistorico(); render(); }, ()=>{ DB.historico.push(h); saveHistorico(); render(); });
    });
  });
}

/* ============================================================
   IMAGE COMPRESS
============================================================ */
function compressImage(file, maxSize=256, quality=0.82){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if(w>h){ if(w>maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } } else { if(h>maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(e){ reject(e); }
      };
      img.onerror = reject; img.src = r.result;
    };
    r.onerror = reject; r.readAsDataURL(file);
  });
}

function buildGymPatternDataUri(opacity){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360' viewBox='0 0 360 360'><g stroke='#FFFFFF' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='${opacity}'><g transform='translate(40,50) rotate(-18)'><line x1='0' y1='14' x2='50' y2='14'/><rect x='-9' y='2' width='14' height='24' rx='4'/><rect x='76' y='2' width='14' height='24' rx='4'/></g><g transform='translate(280,260)'><circle cx='0' cy='0' r='24'/><circle cx='0' cy='0' r='7'/></g></g></svg>`;
  return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
}
function mountBgAnimation(){
  const wrap = document.getElementById('bg-anim'); if(!wrap) return;
  wrap.innerHTML = '';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const g1 = document.createElement('div'); g1.className='bg-glow'; g1.style.width='380px'; g1.style.height='380px'; g1.style.left='-90px'; g1.style.top='8%'; wrap.appendChild(g1);
  const g2 = document.createElement('div'); g2.className='bg-glow'; g2.style.width='320px'; g2.style.height='320px'; g2.style.right='-100px'; g2.style.bottom='10%'; g2.style.animationDelay='-5s'; wrap.appendChild(g2);
  const p1 = document.createElement('div'); p1.className='bg-plate-big'; p1.style.width='340px'; p1.style.height='340px'; p1.style.right='-140px'; p1.style.top='-110px'; wrap.appendChild(p1);
  const p2 = document.createElement('div'); p2.className='bg-plate-big'; p2.style.width='260px'; p2.style.height='260px'; p2.style.left='-120px'; p2.style.bottom='-80px'; p2.style.animationDuration='90s'; p2.style.animationDirection='reverse'; wrap.appendChild(p2);
  if(reduce) return;
  const W = window.innerWidth, H = window.innerHeight;
  const count = Math.max(5, Math.min(10, Math.round((W*H)/150000)));
  for(let i=0;i<count;i++){
    const el = document.createElement('div'); el.className='bg-item';
    const sz = 44 + Math.random()*70;
    el.style.width = sz+'px'; el.style.height = sz+'px';
    el.style.left = (Math.random()*90)+'%'; el.style.top = (Math.random()*85)+'%';
    el.style.setProperty('--dx', (Math.random()*50-25).toFixed(1)+'px');
    el.style.setProperty('--dy', (-30-Math.random()*50).toFixed(1)+'px');
    el.style.setProperty('--rot-start', (Math.random()*24-12).toFixed(1)+'deg');
    el.style.setProperty('--rot-end', (Math.random()*24-12).toFixed(1)+'deg');
    el.style.animationDuration = (9+Math.random()*9).toFixed(1)+'s';
    el.style.animationDelay = (-Math.random()*12).toFixed(1)+'s';
    el.style.opacity = (0.05+Math.random()*0.06).toFixed(3);
    el.innerHTML = '<svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="2"><line x1="28" y1="30" x2="72" y2="30" stroke-width="3"/><rect x="10" y="14" width="14" height="32" rx="3"/><rect x="76" y="14" width="14" height="32" rx="3"/></svg>';
    wrap.appendChild(el);
  }
  for(let i=0;i<14;i++){
    const p = document.createElement('div'); p.className='bg-particle';
    p.style.left = (Math.random()*100)+'%'; p.style.bottom = '-20px';
    const sz = (2+Math.random()*2).toFixed(1)+'px';
    p.style.width = sz; p.style.height = sz;
    p.style.animationDuration = (11+Math.random()*12).toFixed(1)+'s';
    p.style.animationDelay = (-Math.random()*20).toFixed(1)+'s';
    wrap.appendChild(p);
  }
}

async function loadExerciseDB(){
  let data = null, source = 'inline';
  try{
    const cached = await IDB.get(KEYS.exdbCache);
    if(cached && Array.isArray(cached) && cached.length > 100){ data = cached; source = 'idb'; }
  }catch(e){}
  if(!data){
    try{
      const ctrl = new AbortController(); const t = setTimeout(()=> ctrl.abort(), 20000);
      const r = await fetch(EXERCISE_DB_URL, { signal: ctrl.signal }); clearTimeout(t);
      if(r.ok){ const j = await r.json(); if(Array.isArray(j) && j.length > 100){ data = j; source = 'github'; try{ await IDB.set(KEYS.exdbCache, j); }catch(e){} } }
    }catch(e){ console.warn('[86gym] fetch falhou', e.message); }
  }
  if(data && data.length){
    EXERCISE_DB = data.map(ex=>{
      ex.nameEn = ex.name || '';
      ex.name = translateExerciseName(ex.nameEn);
      ex.primaryMuscles = translateMuscles(ex.primaryMuscles);
      ex.secondaryMuscles = translateMuscles(ex.secondaryMuscles);
      ex.equipment = translateEquipment(ex.equipment);
      ex.group = groupForExercise(ex);
      return ex;
    });
    reindexExercises();
    console.log('[86gym] ' + EXERCISE_DB.length + ' exercícios de ' + source);
    EXDB_LOADING = false;
    return { source, count: EXERCISE_DB.length };
  }
  EXDB_LOADING = false;
  return { source: 'inline', count: EXERCISE_DB.length };
}
function setupPWA(){
  const manifest = { name:'86 Training & Grind', short_name:'86 TG', start_url:'./', display:'standalone', background_color:'#0A0B0D', theme_color:'#0A0B0D', orientation:'portrait' };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
}
async function initApp(){
  migrate();
  DB = { treinos: safeJSON(KEYS.treinos, []), historico: safeJSON(KEYS.hist, []), cardios: safeJSON(KEYS.cardios, []) };
  const persisted = safeJSON(KEYS.session, null);
  if(persisted && !validateSession(persisted)){ safeDel(KEYS.session); }
  seedDefaultCardio();
  setupPWA();
  document.documentElement.style.setProperty('--gym-pattern', buildGymPatternDataUri(0.028));
  document.documentElement.style.setProperty('--gym-pattern-strong', buildGymPatternDataUri(0.09));
  mountBgAnimation();
  applyTheme();
  render();

  Promise.all([
    loadExerciseDB().catch(e=>{ console.warn(e); EXDB_LOADING = false; }),
    initServiceWorker().catch(e=> console.warn('[86gym] SW init', e))
  ]).then(()=>{
    if(ROUTE.name==='exercicios') render();
    checkPendingNotification();
  });

  const weekCount = DB.historico.filter(h=> h.tipo==='forca' && h.data >= Date.now()-7*86400000).length;
  const meta = loadPerfil().metaTreinos || 4;
  setAppBadge(Math.max(0, meta - weekCount));

  if(needsOnboarding()) await showOnboarding();
  checkImportFromURL();

  setTimeout(async ()=>{ if(loadSettings().autoBackup) await autoBackup(false); }, 3000);
  setInterval(()=>{ if(loadSettings().autoBackup) autoBackup(false); }, 10*60*1000);

  const cfg = loadGistConfig();
  if(cfg.enabled && cfg.token && cfg.id){
    setTimeout(async ()=>{ const r = await gistSmartSync(); if(r.status === 'pulled'){ showToast('✓ Dados sincronizados'); render(); } }, 2500);
  }

  const pp = loadPerfil();
  if(!pp.pesos.length || (Date.now() - pp.pesos[pp.pesos.length-1].data)/86400000 >= (pp.periodicidadeDias||14)){
    setTimeout(()=> showToast('Hora de atualizar seu peso!'), 700);
  }
}
window.addEventListener('beforeunload', ()=>{ if(SESSION) persistSession(); if(loadSettings().autoBackup) autoBackup(false); });
initApp();
