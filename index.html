<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0B0D">
<title>86 Training & Grind</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0B0D'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-weight='800' font-size='16' fill='%23C9FF4D' text-anchor='middle'%3E86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0D; --surface:#141619; --surface-2:#1C1F23;
    --line:#25282D; --line-soft:#1A1D21;
    --lime:#C9FF4D; --lime-dim:rgba(201,255,77,0.10);
    --orange:#FF6A45; --blue:#4DA6FF; --gold:#FFD166;
    --text:#F3F4F1; --muted:#8A9099; --muted-2:#5A6069;
    --danger:#FF5A5A; --radius:14px;
    --font-display:'Space Grotesk', sans-serif;
    --grp-Peito:#FF5A5A; --grp-Costas:#4DA6FF; --grp-Ombros:#FFD166;
    --grp-Bíceps:#A78BFA; --grp-Tríceps:#F472B6; --grp-Antebraço:#22D3EE;
    --grp-Pernas:#8B5CF6; --grp-Glúteos:#EC4899; --grp-Abdômen:#FB923C;
    --grp-Panturrilha:#34D399; --grp-Cardio:#FF6A45; --grp-Outros:#8A9099;
    --grp-Personalizado:#94A3B8;
  }
  :root[data-theme="light"]{
    --bg:#FAF9F5; --surface:#FFFFFF; --surface-2:#F1F0EC;
    --line:#DFE1DD; --line-soft:#EBECE8;
    --lime:#7FA800; --lime-dim:rgba(127,168,0,0.12);
    --orange:#E24E2A; --blue:#2E7DD1; --gold:#D4A017;
    --text:#141619; --muted:#4F5459; --muted-2:#6E747A; --danger:#D23D3D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  svg{width:18px;height:18px;flex-shrink:0;display:inline-block;vertical-align:middle;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{font-family:'Inter',sans-serif;color:var(--text);overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;background-color:var(--bg);
    background-image:var(--gym-pattern,none);background-repeat:repeat;
    background-size:360px 360px;transition:background-color .25s ease,color .25s ease;position:relative;}
  .card, .menu-card, .exec-ex-card, .hist-content, .stat-box, .hero, .treino-item, .cardio-item{
    transition:background-color .25s ease, border-color .25s ease, color .25s ease;
  }
  #bg-anim{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  #bg-anim .bg-glow{position:absolute;border-radius:50%;filter:blur(80px);
    background:radial-gradient(circle,var(--lime) 0%,transparent 70%);
    opacity:0.06;animation:bgGlow 12s ease-in-out infinite;}
  [data-theme="light"] #bg-anim .bg-glow{background:radial-gradient(circle,#5A7A00 0%,transparent 70%);}
  @keyframes bgGlow{0%,100%{transform:scale(1);opacity:0.05;} 50%{transform:scale(1.18);opacity:0.10;}}
  .bg-item{position:absolute;color:var(--lime);opacity:0.07;
    pointer-events:none;animation:bgBob ease-in-out infinite alternate;}
  [data-theme="light"] .bg-item{opacity:0.18;color:#5A7A00;}
  .bg-item svg{width:100%;height:100%;display:block;}
  @keyframes bgBob{0%{transform:translate3d(0,0,0) rotate(var(--rot-start,-8deg));}
    100%{transform:translate3d(var(--dx,20px),var(--dy,-30px),0) rotate(var(--rot-end,8deg));}}
  .bg-plate-big{position:absolute;border-radius:50%;border:2px solid var(--lime);opacity:0.05;
    animation:bgSpin 60s linear infinite;}
  [data-theme="light"] .bg-plate-big{opacity:0.14;border-color:#5A7A00;}
  .bg-plate-big::before{content:'';position:absolute;inset:14%;border-radius:50%;border:1.5px dashed var(--lime);}
  .bg-plate-big::after{content:'';position:absolute;inset:32%;border-radius:50%;border:1.5px solid var(--lime);}
  @keyframes bgSpin{to{transform:rotate(360deg);}}
  .bg-particle{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--lime);
    opacity:0;animation:bgRise linear infinite;box-shadow:0 0 6px var(--lime);}
  [data-theme="light"] .bg-particle{background:#5A7A00;box-shadow:0 0 4px rgba(90,122,0,0.5);}
  @keyframes bgRise{0%{transform:translateY(20vh) scale(0.5);opacity:0;} 20%{opacity:0.35;}
    80%{opacity:0.35;} 100%{transform:translateY(-30vh) scale(1);opacity:0;}}
  @media (prefers-reduced-motion: reduce){
    .bg-item,.bg-particle,.bg-plate-big,#bg-anim .bg-glow{animation:none !important;}
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}
  h1,h2,h3{margin:0;font-weight:800;}
  #view{flex:1;padding:20px 18px 104px 18px;overflow-y:auto;}
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;
    padding:7px 2px calc(7px + env(safe-area-inset-bottom)) 2px;z-index:50;}
  nav.tabbar button{flex:1;background:none;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:9.5px;font-family:'Inter';font-weight:600;padding:5px 1px;border-radius:10px;cursor:pointer;}
  nav.tabbar button svg{width:19px;height:19px;}
  nav.tabbar button.active{color:var(--lime);}
  nav.tabbar button.active svg{filter:drop-shadow(0 0 6px var(--lime-dim));}
  .hero{position:relative;margin:0 -18px 0 -18px;padding:22px 22px 16px 22px;overflow:hidden;
    background-image:var(--gym-pattern-strong,none),
      radial-gradient(100% 80% at 20% 0%,color-mix(in srgb,var(--surface-2) 80%,transparent) 0%,transparent 72%);
    background-repeat:repeat,no-repeat;background-size:300px 300px,100% 100%;}
  .brandmark{display:flex;align-items:center;gap:14px;}
  .plate-badge{position:relative;width:64px;height:64px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 32% 28%,var(--surface-2) 0%,var(--bg) 75%);
    border:3.5px solid var(--text);display:flex;align-items:center;justify-content:center;}
  .plate-badge::before{content:'';position:absolute;inset:7px;border-radius:50%;border:1.5px solid var(--line-soft);}
  .plate-badge .pnum{position:relative;font-family:var(--font-display);font-weight:700;font-size:21px;
    color:var(--lime);letter-spacing:-0.02em;line-height:1;}
  .plate-badge .pkg{position:absolute;bottom:12px;left:0;right:0;text-align:center;
    font-family:'Inter';font-weight:700;font-size:5.5px;letter-spacing:2px;color:var(--muted-2);}
  .wordmark-gym{font-weight:800;font-size:17px;line-height:1.08;text-transform:uppercase;}
  .wordmark-gym .accent{color:var(--lime);}
  .streak-chip{position:absolute; top:12px; right:18px; z-index:2;
    display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(135deg,rgba(255,106,69,0.9),rgba(255,209,102,0.9));
    color:#1a0d05; font-weight:800; font-size:11.5px;
    padding:5px 11px; border-radius:20px; box-shadow:0 6px 16px rgba(0,0,0,0.35);}
  .streak-chip.off{background:var(--surface-2); color:var(--muted);}
  .bar-divider{height:1px;background:var(--line);margin:12px 0 10px 0;width:100%;}
  .tagline{color:var(--muted);font-size:12.5px;max-width:290px;line-height:1.5;}
  .profile-strip{display:flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:14px;
    margin:14px 0 14px 0;cursor:pointer;}
  .avatar-wrap{position:relative;flex-shrink:0;}
  .avatar-circle{width:48px;height:48px;border-radius:50%;background:var(--surface-2);
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    overflow:hidden;color:var(--muted);}
  .avatar-circle img{width:100%;height:100%;object-fit:cover;}
  .avatar-circle svg{width:22px;height:22px;}
  .avatar-badge{position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;
    background:var(--orange);border:2px solid var(--bg);}
  .profile-strip .info b{font-size:12.5px;display:block;color:var(--muted);font-weight:600;}
  .profile-strip .info span{font-size:14.5px;font-weight:700;color:var(--text);}
  .profile-strip .chev{margin-left:auto;color:var(--muted-2);}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted-2);
    font-weight:700;margin:4px 0 10px 2px;}
  .home-menu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .menu-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 12px;display:flex;flex-direction:column;gap:14px;cursor:pointer;}
  .menu-card:active{transform:scale(0.97);}
  .menu-card svg{width:18px;height:18px;color:var(--muted);}
  .menu-card b{font-size:13.5px;font-weight:700;}
  .menu-card small{color:var(--muted);font-size:11px;line-height:1.3;}
  .menu-card.primary{background:var(--lime);border-color:var(--lime);grid-column:1/3;
    flex-direction:row;align-items:center;justify-content:space-between;padding:16px;}
  .menu-card.primary svg{color:#0A0B0D;width:24px;height:24px;}
  .menu-card.primary b{color:#0A0B0D;font-size:15px;}
  .menu-card.primary small{color:rgba(10,11,13,0.65);}
  .menu-card.primary .mc-text{display:flex;flex-direction:column;gap:3px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
  .stat-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 8px;text-align:center;font-family:'Inter';color:var(--text);cursor:pointer;}
  .stat-box .v{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--lime);line-height:1;}
  .stat-box .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:0.5px;margin-top:4px;font-weight:700;}
  .stat-box:active{transform:scale(0.97);}
  .page-title{font-size:24px;margin-bottom:4px;}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--lime);color:#0A0B0D;border:none;font-weight:700;font-size:14px;
    padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;font-family:'Inter';}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn.ghost{background:transparent;color:var(--lime);border:1px dashed var(--line);}
  .btn.small{padding:9px 12px;font-size:12.5px;width:auto;}
  .btn.mini{padding:6px 8px;font-size:11px;width:auto;font-weight:700;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .row{display:flex;gap:10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:12px;border-radius:10px;font-size:14px;font-family:'Inter';margin-top:6px;}
  textarea{resize:vertical;min-height:60px;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
  label.field{display:block;font-size:12px;color:var(--muted);margin-top:12px;font-weight:600;}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.6;}
  .empty svg{width:40px;height:40px;color:var(--line);margin-bottom:10px;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .icon-btn{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.mini{width:28px;height:28px;border-radius:8px;}
  .icon-btn.mini svg{width:14px;height:14px;}
  .icon-btn.fav-on{background:var(--gold);color:#1a0d05;border-color:var(--gold);}
  .chip{display:inline-flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
    margin-right:8px;margin-bottom:6px;cursor:pointer;}
  .chip.active{background:var(--lime);color:#0A0B0D;border-color:var(--lime);}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .treino-item{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;}
  .treino-item .row-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .treino-item h3{font-size:16px;}
  .treino-item .divs{margin-top:8px;}
  .treino-item small{color:var(--muted);font-size:12px;}
  .autocomplete-wrap{position:relative;}
  .ac-list{position:absolute;left:0;right:0;top:100%;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:180px;
    overflow-y:auto;z-index:20;display:none;}
  .ac-list div{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line-soft);}
  .ac-list div:last-child{border-bottom:none;}
  .help-icon{width:22px;height:22px;border-radius:50%;background:var(--surface-2);
    border:1px solid var(--line);color:var(--lime);display:inline-flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:800;
    cursor:pointer;flex-shrink:0;}
  .ex-block{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-top:12px;position:relative;}
  .ex-block .ex-head{display:flex;align-items:center;gap:8px;}
  .ex-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
  .ex-grid label{font-size:10px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px;}
  .remove-x{position:absolute;top:10px;right:10px;color:var(--muted);background:none;
    border:none;font-size:16px;cursor:pointer;}
  .division-block{border:1px solid var(--line);border-radius:var(--radius);padding:14px;
    margin-bottom:16px;background:var(--surface);}
  .division-head{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .division-head input{width:60px;text-align:center;font-weight:700;
    font-family:var(--font-display);font-size:17px;}
  .group-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;
    color:var(--lime);font-weight:800;margin:22px 0 10px 0;}
  .group-title:first-child{margin-top:0;}
  .ex-row{display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);padding:12px 14px;
    border-radius:12px;margin-bottom:8px;}
  .ex-row-info{flex:1;margin-right:8px;min-width:0;}
  .ex-row-info b{font-size:14px;font-weight:600;display:block;}
  .ex-row-info small{color:var(--muted);font-size:11px;display:block;margin-top:2px;text-transform:capitalize;}
  .ex-row.banned{opacity:0.55;}
  .banned-tag{font-size:9.5px; color:#fff; background:var(--danger);
    padding:2px 6px; border-radius:5px; font-weight:800; letter-spacing:0.5px; margin-right:6px;}

  /* ═══════════════════════════════════════════════════════════
     SET TABLE — nova estrutura com steppers + swipe
  ═══════════════════════════════════════════════════════════ */
  .set-table{width:100%;border-collapse:collapse;margin-top:10px;}
  .set-table th{font-size:9.5px;color:var(--muted);text-transform:uppercase;
    text-align:center;padding:6px 2px;font-weight:700;letter-spacing:0.3px;}
  .set-table td{text-align:center;padding:6px 2px;border-top:1px solid var(--line-soft);font-size:13px;position:relative;}
  .set-table td:first-child, .set-table th:first-child{text-align:left;padding-left:4px;}
  .set-table tbody tr{position:relative;transition:background-color .15s ease;}
  .set-table tbody tr.swipe-hit{background:color-mix(in srgb, var(--lime) 14%, transparent);}
  .set-table tbody tr.swipe-miss{background:color-mix(in srgb, var(--danger) 12%, transparent);}
  .set-table tr.warmup-row td{color:var(--muted);opacity:0.78;}
  .set-table tr.fail-row td:nth-child(3){color:var(--danger);}
  .set-table tr.done-row td{opacity:0.72;}
  .set-table tr.done-row td:last-child{opacity:1;}

  /* Stepper (reps + carga) */
  .set-stepper{display:flex;align-items:center;gap:2px;justify-content:center;}
  .set-stepper .step-btn{width:24px;height:30px;border-radius:7px;
    background:var(--surface);border:1px solid var(--line);color:var(--text);
    font-weight:800;font-size:15px;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;line-height:1;
    font-family:'Inter';-webkit-user-select:none;user-select:none;flex-shrink:0;
    transition:background-color .1s ease,transform .08s ease;}
  .set-stepper .step-btn:active{background:var(--lime);color:#0A0B0D;border-color:var(--lime);
    transform:scale(0.92);}
  .set-stepper .step-btn:disabled{opacity:0.28;pointer-events:none;}
  .set-stepper input{width:100%;min-width:38px;padding:6px 2px;text-align:center;
    margin-top:0;font-family:var(--font-display);font-weight:700;font-size:14.5px;
    background:transparent;border:none;color:var(--text);
  appearance:textfield;-moz-appearance:textfield;-webkit-appearance:textfield;}
  .set-stepper input::-webkit-outer-spin-button,
  .set-stepper input::-webkit-inner-spin-button{appearance:none;-webkit-appearance:none;margin:0;}
  .set-stepper input:focus{outline:none;background:var(--surface-2);border-radius:6px;}

  /* RPE button */
  .rpe-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--line);border-radius:9px;
    padding:3px 6px;min-width:44px;cursor:pointer;gap:0;line-height:1;
    transition:border-color .15s ease, background-color .15s ease;}
  .rpe-btn:active{transform:scale(0.94);}
  .rpe-btn .em{font-size:15px;line-height:1;display:block;}
  .rpe-btn .nm{font-size:9.5px;font-weight:800;color:var(--muted);margin-top:1px;
    font-family:var(--font-display);}
  .rpe-btn.set{border-color:var(--lime);background:var(--lime-dim);}
  .rpe-btn.set .nm{color:var(--lime);}
  .rpe-btn:disabled{opacity:0.5;pointer-events:none;}

  /* RPE picker (bottom sheet) */
  .rpe-picker{display:flex;gap:8px;justify-content:space-between;margin:16px 0 8px 0;}
  .rpe-opt{flex:1;padding:14px 4px;border-radius:14px;background:var(--surface-2);
    border:2px solid var(--line);cursor:pointer;text-align:center;
    transition:all .15s ease;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .rpe-opt:active{transform:scale(0.95);}
  .rpe-opt.active{border-color:var(--lime);background:var(--lime-dim);
    box-shadow:0 0 0 3px var(--lime-dim);}
  .rpe-opt .emoji{font-size:26px;line-height:1;display:block;}
  .rpe-opt .num{font-size:12px;font-weight:800;color:var(--muted);
    font-family:var(--font-display);}
  .rpe-opt.active .num{color:var(--lime);}
  .rpe-opt .hint{font-size:9px;color:var(--muted-2);font-weight:600;}

  /* Set row actions (small buttons under series number) */
  .set-actions{display:flex;gap:2px;margin-top:3px;justify-content:flex-start;}

  /* ═══════════════════════════════════════════════════════════
     DASHBOARD CARD (home)
  ═══════════════════════════════════════════════════════════ */
  .dash-card{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);
    border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px 0;
    position:relative;overflow:hidden;
    animation:dashIn .35s ease-out;}
  @keyframes dashIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--lime) 0%,var(--orange) 100%);}
  .dash-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;}
  .dash-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:800;}
  .dash-name{font-size:20px;font-weight:800;line-height:1.12;margin-top:5px;letter-spacing:-0.01em;}
  .dash-name .div-badge{display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:8px;background:var(--lime);color:#0A0B0D;
    font-family:var(--font-display);font-weight:800;font-size:14px;
    vertical-align:middle;margin-left:6px;letter-spacing:0;}
  .dash-streak{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;
    padding-left:12px;border-left:1px solid var(--line-soft);}
  .dash-streak .num{font-family:var(--font-display);font-weight:800;font-size:28px;
    color:var(--orange);line-height:1;display:flex;align-items:center;gap:4px;}
  .dash-streak .num .fl{font-size:20px;}
  .dash-streak .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;
    letter-spacing:0.8px;font-weight:700;text-align:right;}
  .dash-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    font-size:11.5px;color:var(--muted);margin-bottom:12px;font-weight:600;}
  .dash-meta .item{display:inline-flex;align-items:center;gap:5px;}
  .dash-meta .item b{color:var(--text);font-family:var(--font-display);font-weight:700;}
  .dash-progress{height:5px;background:var(--surface-2);border-radius:3px;
    overflow:hidden;margin-bottom:14px;}
  .dash-progress .fill{height:100%;background:var(--lime);border-radius:3px;
    transition:width .5s ease;}
  .dash-actions{display:flex;gap:8px;}
  .dash-actions .btn{flex:1;}
  .dash-resume{background:var(--lime-dim);border:1px solid var(--lime);
    border-radius:12px;padding:10px 12px;margin-top:10px;
    display:flex;align-items:center;gap:10px;}
  .dash-resume .pulse{width:8px;height:8px;border-radius:50%;background:var(--lime);
    box-shadow:0 0 0 0 var(--lime);animation:pulseDot 2s ease-in-out infinite;}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(201,255,77,0.7);}
    70%{box-shadow:0 0 0 8px rgba(201,255,77,0);}
    100%{box-shadow:0 0 0 0 rgba(201,255,77,0);}}
  .dash-resume .txt{flex:1;font-size:12px;font-weight:600;}
  .dash-empty{padding:12px 0 6px 0;text-align:center;}

  /* ═══════════════════════════════════════════════════════════
     MINI CALENDAR (home)
  ═══════════════════════════════════════════════════════════ */
    .mini-cal{display:flex;gap:7px;margin-top:8px;} /*gap é para espaço da letra para o numero*/
  .mini-cal .day{flex:1;aspect-ratio:1.05;border-radius:9px;background:var(--surface-2); /*aspect-radio para deixar linha mais alta*/
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    color:var(--muted);font-weight:700;border:1.5px solid transparent;
    transition:transform .12s ease;padding:4px 0;position:relative;cursor:pointer;
    overflow:hidden;}
  .mini-cal .day .d{font-size:13px;font-weight:800;color:var(--text);
    font-family:var(--font-display);line-height:1;}
  .mini-cal .day .wd{font-size:8px;opacity:0.65;line-height:1;letter-spacing:0.3px;}
  .mini-cal .day .dots{position:absolute;top:5px;right:5px;display:flex;gap:3px;align-items:center;}
  .mini-cal .day .dots span{width:5px;height:5px;border-radius:50%;display:block;}
  .mini-cal .day .dots .dot-force{background:var(--orange);}
  .mini-cal .day .dots .dot-cardio{background:#22D3EE;}
  .mini-cal .day.trained .dots span,
  .mini-cal .day.rest .dots span{box-shadow:0 0 0 1px rgba(0,0,0,0.25);}
  .mini-cal .day:active{transform:scale(0.92);}
  .mini-cal .day.trained{background:var(--lime);border-color:var(--lime);}
  .mini-cal .day.trained .d{color:#0A0B0D;}
  .mini-cal .day.trained .wd{color:rgba(10,11,13,0.55);}
  .mini-cal .day.rest{background:var(--blue);border-color:var(--blue);}
  .mini-cal .day.rest .d{color:#fff;}
  .mini-cal .day.rest .wd{color:rgba(255,255,255,0.65);}
  .mini-cal .day.today{border-color:var(--lime);border-width:2px;}
  .mini-cal .day.today.trained{border-color:var(--orange);}
  .mini-cal .day.rest-day-pending{border:1.5px dashed var(--line);}
  
  /* ═══ Legenda (mini-cal + calendário mensal) ═══ */
  .mini-cal-legend{display:flex;gap:10px;margin-top:10px;font-size:10px;
    color:var(--muted);justify-content:center;align-items:center;flex-wrap:wrap;}
  .mini-cal-legend > span{display:inline-flex;align-items:center;gap:5px;}
  .mini-cal-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
      .mini-cal-legend .dot-square{display:inline-block;width:11px;height:11px;
    border-radius:3px;flex-shrink:0;}
    flex-shrink:0;}

      /* ═══ Resumo mensal (carrossel de cartões) ═══ */
  .summary-bg{position:fixed;inset:0;z-index:500;
    background:rgba(6,7,8,0.96);
    display:flex;flex-direction:column;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;transition:opacity .3s ease;overflow:hidden;}
  .summary-bg.show{opacity:1;}
  .summary-close{position:absolute;top:16px;right:16px;z-index:3;
    width:38px;height:38px;border-radius:12px;
    background:var(--surface);border:1px solid var(--line);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:18px;padding:0;}
  .summary-head{text-align:center;padding:26px 20px 14px 20px;flex-shrink:0;}
  .summary-head .sh-spark{font-size:34px;display:block;margin-bottom:10px;
    animation:sparkPulse 2s ease-in-out infinite;}
  @keyframes sparkPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
  .summary-head h2{font-family:var(--font-display);font-weight:800;font-size:20px;
    color:var(--text);margin:0;letter-spacing:-0.01em;line-height:1.2;padding:0 16px;}
  .summary-head .sh-sub{color:var(--muted);font-size:12.5px;margin-top:8px;}
    .summary-scroll{flex:1;overflow-y:auto;overflow-x:hidden;
    padding:6px 16px calc(24px + env(safe-area-inset-bottom)) 16px;
    scrollbar-width:none;}
  .summary-scroll::-webkit-scrollbar{display:none;}
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);
    gap:10px;}
  .summary-card{aspect-ratio:0.82;border-radius:16px;position:relative;
    display:flex;flex-direction:column;padding:12px 10px 10px 10px;
    cursor:pointer;overflow:hidden;
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    transition:transform .15s ease;}
  .summary-card:active{transform:scale(0.94);}
  .summary-card .sc-tag{font-size:8px;font-weight:800;text-transform:uppercase;
    letter-spacing:1px;opacity:0.75;line-height:1.1;}
  .summary-card .sc-body{font-family:var(--font-display);font-weight:800;
    font-size:10.5px;line-height:1.2;letter-spacing:-0.01em;
    margin-top:auto;margin-bottom:0;position:relative;z-index:1;
    padding-right:2px;}
  .summary-card .sc-body .big{font-size:30px;display:block;line-height:1;
    margin-bottom:6px;letter-spacing:-0.03em;}
  .summary-card .sc-body .big.small{font-size:19px;line-height:1.05;}
  .summary-card .sc-emoji{position:absolute;bottom:-18px;right:-18px;
    font-size:82px;opacity:0.18;line-height:1;pointer-events:none;
    transform:rotate(-12deg);}


      /* ═══ Grid de grupos musculares (Exercícios) ═══ */
  .grp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  .grp-card{background:linear-gradient(160deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--line);border-radius:14px;padding:12px 10px 10px 10px;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    gap:6px;cursor:pointer;position:relative;overflow:hidden;
    min-height:148px;
    transition:transform .12s ease, border-color .2s ease, box-shadow .2s ease;}
  .grp-card:active{transform:scale(0.97);}
  .grp-card:hover{border-color:color-mix(in srgb, var(--line) 40%, var(--lime) 60%);
    box-shadow:0 4px 14px rgba(0,0,0,0.25);}
  .grp-card.fav{background:linear-gradient(160deg, rgba(255,209,102,0.10) 0%, var(--surface) 60%);
    border-color:rgba(255,209,102,0.3);}
  .grp-card.fav .grp-card-name{color:var(--gold);}
  .grp-card-art{flex:1;width:100%;display:flex;align-items:center;justify-content:center;
    min-height:88px;pointer-events:none;}
  .grp-card-art svg{width:auto;height:100%;max-height:96px;max-width:80px;display:block;}
  .grp-card-icon{width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:800;font-size:24px;color:#0A0B0D;}
  .grp-card-info{text-align:center;width:100%;}
  .grp-card-name{font-size:13.5px;font-weight:800;letter-spacing:-0.01em;line-height:1.1;}
  .grp-card-count{font-size:10px;color:var(--muted);font-weight:600;margin-top:3px;
    text-transform:uppercase;letter-spacing:0.4px;}

    
  /* ═══ Expansão + filtros de equipamento (Exercícios) ═══ */
  .grp-card .expand-btn{position:absolute;top:8px;right:8px;
    width:26px;height:26px;border-radius:8px;
    background:rgba(0,0,0,0.35);border:1px solid var(--line);
    color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:0;z-index:2;transition:all .15s ease;}
  .grp-card .expand-btn:hover{color:var(--lime);border-color:var(--lime);}
  .grp-card .expand-btn svg{width:14px;height:14px;transition:transform .2s ease;}
  .grp-card .expand-btn.expanded{color:var(--lime);border-color:var(--lime);}
  .grp-card .expand-btn.expanded svg{transform:rotate(180deg);}

  .grp-card.expanded{grid-column:1/-1;padding:16px 14px 12px 14px;
    align-items:flex-start;}
  .grp-card.expanded .grp-card-art{max-height:78px;min-height:64px;width:auto;
    align-self:center;}
  .grp-card.expanded .grp-card-art svg{max-height:78px;}
  .grp-card.expanded .grp-card-info{text-align:left;padding:0 4px;}

  .grp-expanded-list{width:100%;margin-top:10px;
    border-top:1px solid var(--line);padding-top:8px;}
  .grp-expanded-row{display:flex;align-items:center;justify-content:space-between;
    padding:8px 6px;border-radius:8px;cursor:pointer;font-size:13px;
    transition:background .12s ease;}
  .grp-expanded-row:hover{background:var(--surface);}
  .grp-expanded-row .name{font-weight:600;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grp-expanded-row .equip{font-size:9.5px;color:var(--muted);margin-left:8px;
    text-transform:uppercase;letter-spacing:0.4px;font-weight:700;}
  .grp-expanded-all{display:block;text-align:center;margin-top:6px;padding:10px 8px;
    color:var(--lime);font-weight:700;font-size:12px;cursor:pointer;
    border-top:1px solid var(--line-soft);border-radius:8px;}
  .grp-expanded-all:hover{background:var(--surface);}

  .equip-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px 0;
    margin-bottom:8px;}
  .equip-chips::-webkit-scrollbar{display:none;}
  .equip-chips .equip-chip{flex-shrink:0;padding:6px 12px;border-radius:20px;
    background:var(--surface-2);border:1px solid var(--line);
    font-size:11.5px;font-weight:700;cursor:pointer;color:var(--text);
    white-space:nowrap;transition:all .15s ease;}
  .equip-chips .equip-chip:active{transform:scale(0.94);}
  .equip-chips .equip-chip.active{background:var(--lime);color:#0A0B0D;
    border-color:var(--lime);}

  /* ═══ Header de grupo (voltar) ═══ */
  .grp-back-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;
    padding-bottom:12px;border-bottom:1px solid var(--line);}
  .grp-back-header .back-btn{background:var(--surface-2);border:1px solid var(--line);
    color:var(--text);width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .grp-back-header .back-btn svg{width:16px;height:16px;}
  .grp-back-header .grp-title{flex:1;font-size:19px;font-weight:800;letter-spacing:-0.01em;}
  .grp-back-header .grp-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;}
  
  /* ═══════════════════════════════════════════════════════════
     CALENDÁRIO MENSAL (histórico)
  ═══════════════════════════════════════════════════════════ */
  .hc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .hc-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
    font-size:10px;color:var(--muted);text-align:center;font-weight:700;
    text-transform:uppercase;margin-bottom:6px;letter-spacing:0.5px;}
  .hc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .hc-day{aspect-ratio:1;border-radius:9px;background:var(--surface-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;cursor:pointer;position:relative;border:1.5px solid transparent;
    transition:transform .12s ease,background-color .2s ease;
    font-family:var(--font-display);}
  .hc-day:active{transform:scale(0.92);}
  .hc-day.empty{background:transparent;cursor:default;pointer-events:none;}
  .hc-day .hc-num{font-size:13px;font-weight:700;color:var(--text);line-height:1;}
  .hc-day.trained{background:color-mix(in srgb, var(--lime) 22%, var(--surface-2));}
  .hc-day.trained .hc-num{color:var(--lime);}
  .hc-day.rest{background:color-mix(in srgb, var(--blue) 18%, var(--surface-2));}
  .hc-day.rest .hc-num{color:var(--blue);}
  .hc-day.today{border-color:var(--lime);border-width:2px;}
  .hc-day.today .hc-num{font-weight:800;}
  .hc-dots{display:flex;gap:2px;align-items:center;margin-top:1px;}
  .hc-dots span{width:4px;height:4px;border-radius:50%;display:block;}
  .hc-dots .dot-force{background:var(--orange);}
  .hc-dots .dot-cardio{background:#22D3EE;}

  /* ═══════════════════════════════════════════════════════════
     BOTTOM SHEET (modais arrastáveis)
  ═══════════════════════════════════════════════════════════ */
  .modal-bg{position:fixed;inset:0;background:rgba(6,7,8,0.72);z-index:200;
    display:flex;align-items:flex-end;justify-content:center;
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    animation:modalFade .22s ease-out;}
  @keyframes modalFade{from{opacity:0;}to{opacity:1;}}
  .modal-box{background:var(--surface);border:1px solid var(--line);
    border-top:1px solid var(--line);border-radius:26px 26px 0 0;
    width:100%;max-width:520px;padding:8px 22px 22px 22px;
    max-height:92vh;overflow-y:auto;position:relative;
    animation:modalSlideUp .32s cubic-bezier(.22,1.2,.36,1);
    transition:transform .22s cubic-bezier(.22,1.2,.36,1);
    overscroll-behavior:contain;
    box-shadow:0 -12px 40px rgba(0,0,0,0.5);}
  @keyframes modalSlideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .modal-box.dragging{transition:none;}
  .modal-box::before{content:'';display:block;width:44px;height:4.5px;border-radius:3px;
    background:var(--line);margin:0 auto 14px auto;
    cursor:grab;touch-action:none;}
  .modal-box.dragging::before{cursor:grabbing;background:var(--muted);}
  .modal-box .close-x{float:right;color:var(--muted);background:none;border:none;
    font-size:22px;cursor:pointer;line-height:1;margin-top:-15px;padding:8px;margin-right:-4px}
  @media (min-width:768px){
    .modal-box{max-width:600px;border-radius:20px;margin:auto;padding:20px 24px;}
    .modal-box::before{display:none;}
    .modal-bg{align-items:center;}
  }

  /* ============================================================
     Restante inalterado
  ============================================================ */
  .carga-wrap{display:flex;align-items:center;justify-content:center;gap:3px;}
  .carga-btn{width:26px;height:34px;border-radius:7px;background:var(--surface);
    border:1px solid var(--line);color:var(--text);font-weight:800;font-size:15px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    flex-shrink:0;font-family:'Inter';line-height:1;}
  .carga-btn:active{background:var(--lime);color:#0A0B0D;border-color:var(--lime);}
  .carga-btn:disabled{opacity:0.35;}
  .exec-ex-card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;margin-bottom:12px;position:relative;}
      /* Thumb do exercício (miniatura) */
  .ex-thumb{flex-shrink:0;width:44px;height:44px;border-radius:10px;
    background:var(--surface-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
    transition:background-color .25s ease,border-color .25s ease;}
  .ex-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .ex-thumb-letter{font-family:var(--font-display);font-weight:800;font-size:18px;
    color:#0A0B0D;line-height:1;letter-spacing:-0.02em;text-transform:uppercase;}
  .exec-ex-titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .exec-ex-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    font-size:14.5px;font-weight:700;line-height:1.2;}
  .exec-ex-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    justify-content:flex-end;flex-shrink:0;}
  .exec-ex-card.done{border-color:var(--lime);}
  .exec-ex-card.pr{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 20px rgba(255,209,102,0.2);}
  .exec-ex-card.collapsed{padding:10px 14px;}
  .exec-ex-card.collapsed .exec-body{display:none;}
  .exec-ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    position:sticky;top:0;background:var(--surface);z-index:5;padding:4px 0;margin:-4px 0 0 0;}
  .exec-ex-head h3{font-size:14.5px;flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .exec-ex-head .toggle-btn{background:none;border:none;color:var(--muted);
    cursor:pointer;padding:2px;display:flex;align-items:center;}
  .exec-ex-head .toggle-btn svg{width:16px;height:16px;transition:transform .2s;}
  .exec-ex-card.collapsed .toggle-btn svg{transform:rotate(-90deg);}
  .superset-badge{display:inline-block;background:#7C3AED;color:#fff;
    padding:2px 8px;border-radius:8px;font-weight:800;font-size:10px;letter-spacing:0.5px;}
  .exec-ex-card.superset-1{border-left:4px solid #8B5CF6;}
  .exec-ex-card.superset-2{border-left:4px solid #F472B6;}
  .exec-ex-card.superset-3{border-left:4px solid #22D3EE;}
  .grp-chip{display:inline-block;padding:2px 7px;border-radius:6px;font-weight:800;
    font-size:9.5px;letter-spacing:0.5px;color:#0A0B0D;text-transform:uppercase;}
  [data-grp="Peito"]{background:var(--grp-Peito);color:#0A0B0D;}
  [data-grp="Costas"]{background:var(--grp-Costas);color:#0A0B0D;}
  [data-grp="Ombros"]{background:var(--grp-Ombros);color:#0A0B0D;}
  [data-grp="Bíceps"]{background:var(--grp-Bíceps);color:#0A0B0D;}
  [data-grp="Tríceps"]{background:var(--grp-Tríceps);color:#0A0B0D;}
  [data-grp="Antebraço"]{background:var(--grp-Antebraço);color:#0A0B0D;}
  [data-grp="Pernas"]{background:var(--grp-Pernas);color:#fff;}
  [data-grp="Glúteos"]{background:var(--grp-Glúteos);color:#fff;}
  [data-grp="Abdômen"]{background:var(--grp-Abdômen);color:#0A0B0D;}
  [data-grp="Panturrilha"]{background:var(--grp-Panturrilha);color:#0A0B0D;}
  [data-grp="Cardio"]{background:var(--grp-Cardio);color:#0A0B0D;}
  [data-grp="Outros"]{background:var(--grp-Outros);color:#0A0B0D;}
  [data-grp="Personalizado"]{background:var(--grp-Personalizado);color:#0A0B0D;}
  .rm-preview{font-size:10.5px;color:var(--blue);text-align:center;margin-top:2px;font-weight:600;}
  .compare-badge{font-size:11px;padding:4px 8px;border-radius:8px;font-weight:700;}
  .compare-badge.up{background:rgba(201,255,77,0.15);color:var(--lime);}

  el.className = 'err-overlay';
  el.innerHTML = `⚠️ ${escapeHtml(msg)}<br><button id="err-dismiss">Fechar</button>`;
  document.body.appendChild(el);
  el.querySelector('#err-dismiss').onclick = ()=>{ el.remove(); _errShown = false; };
  setTimeout(()=>{ if(el.parentElement){ el.remove(); _errShown = false; } }, 8000);
}

  async open(){
    if(this.db) return this.db;
    return new Promise((res, rej)=>{
      const req = indexedDB.open(KEYS.idb, 1);
      req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv', {keyPath:'k'}); };
      req.onsuccess = ()=>{ this.db = req.result; res(this.db); };
      req.onerror = ()=> rej(req.error);
    });
  },
  async get(k){ try{ const db = await this.open(); return new Promise(res=>{ const tx = db.transaction('kv','readonly').objectStore('kv').get(k); tx.onsuccess=()=>res(tx.result?tx.result.v:null); tx.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db = await this.open(); return new Promise(res=>{ const tx = db.transaction('kv','readwrite').objectStore('kv').put({k,v}); tx.onsuccess=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } },
  async del(k){ try{ const db = await this.open(); return new Promise(res=>{ const tx = db.transaction('kv','readwrite').objectStore('kv').delete(k); tx.onsuccess=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } }

function translateExerciseName(en){
  if(!en) return en;
  const lower = String(en).toLowerCase().trim();
  if(PT_NAME_DICT[lower]) return PT_NAME_DICT[lower];
  let out = en;
  const compounds = Object.keys(PT_NAME_DICT).filter(k=>k.includes(' ')).sort((a,b)=>b.length-a.length);
  for(const c of compounds){
    const re = new RegExp('\\b' + c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','gi');
    if(re.test(out)) out = out.replace(re, PT_NAME_DICT[c]);
  }
  const words = Object.keys(PT_WORDS).sort((a,b)=>b.length-a.length);
  for(const w of words){
    const re = new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','gi');
    out = out.replace(re, PT_WORDS[w]);
  }
  out = out.trim().replace(/\s+/g,' ');
  return out.charAt(0).toUpperCase() + out.slice(1);
}

function allExerciseGroups(){
  const groups = GROUP_ORDER.map(g=> [g, EXERCISE_DB.filter(ex=>ex.group===g).map(ex=>ex.name)]).filter(([,l])=>l.length);
  if(CUSTOM_EXERCISES.length){
    const byGroup = {};
    CUSTOM_EXERCISES.forEach(c=>{ const g = (c.group && c.group.trim()) ? c.group.trim() : 'Personalizados'; (byGroup[g] = byGroup[g]||[]).push(c.name); });
    Object.keys(byGroup).forEach(g=>{
      const idx = groups.findIndex(([gg])=>gg===g);
      if(idx>=0) groups[idx][1] = groups[idx][1].concat(byGroup[g]);
      else groups.push([g, byGroup[g]]);
    });
  }
  return groups;
}
function exerciseFlat(){ const flat = []; allExerciseGroups().forEach(([g,l])=> l.forEach(n=> flat.push({name:n, group:g}))); return flat; }
function exerciseGroup(name){ const f = exerciseFlat().find(e=> e.name.toLowerCase()===String(name).toLowerCase()); return f ? f.group : 'Personalizado'; }
function isCustomExercise(name){ return CUSTOM_EXERCISES.some(c=> c.name.toLowerCase() === String(name).toLowerCase()); }

function suggestSubstitutes(name, limit = 5){
  const target = exerciseData(name);
  const group = exerciseGroup(name);
  const favs = loadFavs();
  const blocked = loadInjuries();
  let pool = exerciseFlat().filter(e =>
    e.group === group &&
    e.name.toLowerCase() !== String(name).toLowerCase() &&
    !blocked.includes(e.group)
  );
  if(!pool.length) return [];
  const lastUse = {};
  DB.historico.filter(h => h.tipo === 'forca').forEach(h => {
    (h.exercicios||[]).forEach(ex => {
      const k = (ex.nome||'').toLowerCase();
      if(!lastUse[k] || lastUse[k] < h.data) lastUse[k] = h.data;
    });
  });
  const score = e => {
    let s = 0;
    const k = e.name.toLowerCase();
    if(favs[k]) s += 5;
    const lu = lastUse[k] || 0;
    const days = lu ? (Date.now() - lu)/86400000 : 999;
    s += Math.min(5, days/7);
    if(target){
      const d = exerciseData(e.name);
      if(d && d.equipment === target.equipment) s += 2;
      if(d && d.level === target.level) s += 1;
    }
    return s;
  };
  pool.sort((a,b)=> score(b) - score(a));
  return pool.slice(0, limit);
}
function normalizeStr(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function fuzzyFindExercise(input){
  const q = normalizeStr(input); if(!q) return null;
  const flat = exerciseFlat();
  for(const e of flat){ if(normalizeStr(e.name) === q) return e; }
  for(const e of flat){ if(normalizeStr(e.name).includes(q)) return e; }
  const qTokens = q.split(' ').filter(Boolean);
  let best = null, bestScore = 0;
  for(const e of flat){
    const n = normalizeStr(e.name);
    let score = 0;
    for(const t of qTokens){ if(n.includes(t)) score++; }
    if(score > bestScore && score >= Math.max(2, qTokens.length*0.6)){ best = e; bestScore = score; }
  }
  return best;
}

async function syncExerciseDBFull(onProgress){
  const key = getEDBKey();
  if(!key) throw new Error('Configure a chave RapidAPI primeiro');
  const PAGE = 10;
  let offset = 0;
  let all = [];
  const MAX_PAGES = 200;
  for(let page = 0; page < MAX_PAGES; page++){
    const url = `https://exercisedb.p.rapidapi.com/exercises?limit=${PAGE}&offset=${offset}`;
    const r = await fetch(url, { headers: { 'X-RapidAPI-Key': key, 'X-RapidAPI-Host': 'exercisedb.p.rapidapi.com' } });
    if(r.status === 429) throw new Error('Limite de requisições atingido.');
    if(r.status === 403) throw new Error('Chave inválida.');
    if(r.status === 401) throw new Error('Chave não reconhecida.');
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if(!Array.isArray(data) || data.length === 0) break;
    all = all.concat(data);
    if(onProgress) onProgress(all.length);
    if(data.length < PAGE) break;
    offset += PAGE;
    await new Promise(res => setTimeout(res, 220));
  }
  if(!all.length) throw new Error('Nenhum exercício retornado.');
  await IDB.set(KEYS.edbCache, { ts: Date.now(), count: all.length, items: all });
  return all.length;
}

}
async function findEDBItem(name){
  try{
    const c = await IDB.get(KEYS.edbCache);
    if(!c || !Array.isArray(c.items)) return null;
    const target = normalizeStr(name); if(!target) return null;
    for(const ex of c.items){ if(normalizeStr(ex.name) === target) return ex; }
    for(const ex of c.items){ const n = normalizeStr(ex.name); if(n.includes(target) || target.includes(n)) return ex; }
    const tT = target.split(' ').filter(Boolean);
    let best = null, bestScore = 0;
    for(const ex of c.items){
      const nT = normalizeStr(ex.name).split(' ').filter(Boolean);
      let score = 0;
      tT.forEach(t=>{ if(nT.includes(t)) score++; });
      if(score > bestScore && score >= Math.max(2, tT.length * 0.6)){ best = ex; bestScore = score; }
    }
    return best;
  }catch(e){ return null; }
}

let _swRegistration = null;
async function initServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol === 'file:') return;
  try{
    const swCode = `self.addEventListener('message', function(e){ if(e.data && e.data.type === 'scheduleNotification'){ var delay = e.data.endTime - Date.now(); if(delay < 0) delay = 0; setTimeout(function(){ self.registration.showNotification(e.data.title || 'Descanso terminou', { body: e.data.body || 'Hora da próxima série', tag: '86gym-rest', renotify: true, vibrate: [200,100,200,100,200] }); }, delay); } }); self.addEventListener('notificationclick', function(e){ e.notification.close(); e.waitUntil(clients.matchAll({type:'window'}).then(function(cs){ for(var i=0;i<cs.length;i++){ if('focus' in cs[i]) return cs[i].focus(); } if(clients.openWindow) return clients.openWindow('./'); })); });`;
    const blob = new Blob([swCode], {type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    _swRegistration = await navigator.serviceWorker.register(url, { scope: './' });
  }catch(e){ console.warn('[86gym] SW falhou', e); }
}
async function requestNotificationPermission(){
  if(!('Notification' in window)) return false;

}

  safeSet(KEYS.pendingNotif, JSON.stringify({ endTime, exName }));

const escapeHtml = str => String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatSeconds(total){
  total = Math.max(0, Math.round(total));
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60).toString().padStart(2,'0');
  const s = (total%60).toString().padStart(2,'0');
  return h>0 ? `${h}:${m}:${s}` : `${m}:${s}`;
}

function showToast(msg, opts={}){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (opts.gold?' gold':(opts.dark?' dark':''));
  t.innerHTML = `<span>${escapeHtml(msg)}</span>` + (opts.undo ? '<span class="undo">Desfazer</span>' : '');
  document.body.appendChild(t);
  if(opts.undo) t.querySelector('.undo').addEventListener('click', ()=>{ opts.undo(); t.remove(); });
  setTimeout(()=> t.remove(), opts.duration || 3000);
}
function undoableAction(msg, action, undo){ action(); showToast(msg, {dark:true, duration:5000, undo}); }
function playBeep(times=2){
  if(!loadSettings().sound) return;
  if(_beepGuard) return; _beepGuard = true;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx){ _beepGuard = false; return; }
    if(!_sharedAudioCtx || _sharedAudioCtx.state === 'closed') _sharedAudioCtx = new Ctx();
    const ctx = _sharedAudioCtx;
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    for(let i=0;i<times;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = 880;
      const st = now + i*0.22;
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(0.25, st+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, st+0.18);
      o.start(st); o.stop(st+0.2);
    }
    setTimeout(()=>{ _beepGuard = false; }, times*220 + 400);
  }catch(e){ _beepGuard = false; }
}

const RPE_SCALE = [

  { rpe:8, rir:2, emoji:'😤', hint:'Difícil' },

function rpeFromRIR(rir){
  if(rir === null || rir === undefined) return null;
  const n = Number(rir);
  if(isNaN(n)) return null;
  const hit = RPE_SCALE.find(x => x.rir === n);
  if(hit) return hit;
  if(n > 4) return RPE_SCALE[0];
  if(n < 0) return RPE_SCALE[RPE_SCALE.length-1];
  return null;
}

  `);
  bg.querySelector('.close-x').onclick = ()=> closeModal(bg);

}

function buildSvgLineChart(points, opts={}){
  const w = opts.width||300, h = opts.height||130, pad = 30;
  if(!points || !points.length) return `<div style="color:var(--muted); font-size:12.5px; text-align:center; padding:20px 0;">Sem dados suficientes.</div>`;
  const capped = opts.maxPoints && points.length > opts.maxPoints ? points.slice(-opts.maxPoints) : points;
  let pts = capped;
  if(pts.length===1) pts = [pts[0], pts[0]];
  const ys = pts.map(p=>p.y);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if(minY===maxY){ minY -= 1; maxY += 1; }
  const stepX = (w - pad*2) / (pts.length-1);
  const scaleY = v => h - pad - ((v-minY)/(maxY-minY)) * (h - pad*2 - 12);
  const coords = pts.map((p,i)=> [pad + i*stepX, scaleY(p.y)]);
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  let maxIdx = -1;
  if(opts.markMax){ let m=-Infinity; pts.forEach((p,i)=>{ if(p.y>m){ m=p.y; maxIdx=i; } }); }
  const dots = coords.map((c,i)=> i===maxIdx
    ? `<g><circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="6.5" fill="var(--orange)" fill-opacity="0.25"/><circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="4" fill="var(--orange)" stroke="#fff" stroke-width="1.2"/><title>PR: ${pts[i].y}${opts.unit||''}</title></g>`
    : `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#C9FF4D"><title>${pts[i].y}${opts.unit||''}</title></circle>`
  ).join('');
  const fL = pts[0].x, lL = pts[pts.length-1].x;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="#C9FF4D" stroke-width="2.5"/>
    ${dots}
    <text x="${pad}" y="${h-6}" fill="var(--muted)" font-size="10" font-family="Inter">${escapeHtml(fL)}</text>
    <text x="${w-pad}" y="${h-6}" fill="var(--muted)" font-size="10" font-family="Inter" text-anchor="end">${escapeHtml(lL)}</text>
    <text x="${pad}" y="14" fill="var(--text)" font-size="11" font-family="Inter" font-weight="700">${maxY}${opts.unit||''}</text>
    <text x="${pad}" y="${h-pad-4}" fill="var(--text)" font-size="11" font-family="Inter" font-weight="700">${minY}${opts.unit||''}</text>
  </svg>`;
}

function drawStatCanvas(ctx, x, y, value, label){
  ctx.fillStyle = '#C9FF4D';
  ctx.font = '800 56px "Space Grotesk", Inter, sans-serif';
  ctx.fillText(value, x, y);
  ctx.fillStyle = '#8A9099';
  ctx.font = '700 20px Inter, sans-serif';
  ctx.fillText(label, x, y + 34);
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text).split(' ');
  let line = '', lines = [];
  for(const w of words){
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if(line) lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lineHeight));
  return lines.length;
}
const truncateStr = (s, n) => s.length > n ? s.slice(0, n-1) + '…' : s;

function cargaHistoryFor(name){
  const rows = [];
  DB.historico.filter(h=> h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(e.nome && e.nome.toLowerCase()===String(name).toLowerCase() && e.setsFeitas>0){
        rows.push({ x: dateShort(h.data), y: Number(e.carga)||0, ts:h.data, setsFeitas:e.setsFeitas, setsTotal:e.setsTotal, repsMedias:e.repsMedias||0 });
      }
    });
  });
  rows.sort((a,b)=> a.ts-b.ts);
  return rows;
}
function exerciseMetricHistory(name, metric){
  const rows = [];
  DB.historico.filter(h=> h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(!(e.nome && e.nome.toLowerCase()===String(name).toLowerCase() && e.setsFeitas>0)) return;
      let y;
      if(metric==='volume'){ y = (Number(e.carga)||0) * (Number(e.setsFeitas)||0) * (Number(e.repsMedias)||0); }
      else if(metric==='e1rm'){
        let best = 0;
        (e.setsDetalhados||[]).forEach(s=>{
          if(!s.done || s.warmup) return;
          const c = Number(s.carga)||0, r = Number(s.repeticoes)||0;
          if(c<=0 || r<=0) return;
          const rm = c*(1+r/30);
          if(rm > best) best = rm;
        });
        y = best || calcE1RM(e.carga, e.repsMedias);
      } else { y = Number(e.carga)||0; }
      rows.push({ x: dateShort(h.data), y: +y.toFixed(1), ts: h.data });
    });
  });
  rows.sort((a,b)=> a.ts-b.ts);
  return rows;
}
function lastSessionFor(name, treinoNome, divisaoLetra){
  let pool = DB.historico.filter(h=>h.tipo==='forca')
    .filter(h=> (h.exercicios||[]).some(e=> e.nome && e.nome.toLowerCase()===String(name).toLowerCase() && e.setsFeitas>0));
  if(treinoNome){
    const same = pool.filter(h=> h.treinoNome === treinoNome && (!divisaoLetra || h.divisaoLetra === divisaoLetra));
    if(same.length) pool = same;
  }
  pool.sort((a,b)=> b.data - a.data);
  if(!pool.length) return null;
  const h = pool[0];
  const e = h.exercicios.find(e=> e.nome.toLowerCase()===String(name).toLowerCase());
  return { ts:h.data, ex:e, treinoNome:h.treinoNome, divisaoLetra:h.divisaoLetra };
}
function lastNRIRsFor(name, n=3){
  const hist = DB.historico.filter(h=>h.tipo==='forca')
    .filter(h=> (h.exercicios||[]).some(e=> e.nome && e.nome.toLowerCase()===String(name).toLowerCase() && e.setsFeitas>0))
    .sort((a,b)=> b.data - a.data).slice(0, n);
  return hist.map(h=>{
    const e = h.exercicios.find(e=> e.nome.toLowerCase()===String(name).toLowerCase());
    const rirs = (e.setsDetalhados||[]).filter(s=> s.done && !s.warmup && s.rir !== null && s.rir !== undefined).map(s=> Number(s.rir));
    return rirs.length ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  }).filter(x=> x !== null);
}
function leavingRepsInTank(name){
  const rirs = lastNRIRsFor(name, 3);
  if(rirs.length < 3) return false;
  return rirs.every(r=> r >= 3);
}
function bestSetFor(name){
  let best = null;
  DB.historico.filter(h=>h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(e.nome && e.nome.toLowerCase()===String(name).toLowerCase()){
        (e.setsDetalhados||[]).forEach(s=>{
          if(!s.done || s.warmup) return;
          const c = Number(s.carga)||0, r = Number(s.repeticoes)||0;
          if(c<=0 || r<=0) return;
          const oneRm = c*(1+r/30);
          if(!best || oneRm>best.oneRm) best = {carga:c, reps:r, oneRm, ts:h.data};
        });
      }
    });
  });
  return best;
}
function isStagnant(name, weeks=3){
  const h = cargaHistoryFor(name);
  if(h.length<weeks) return false;
  const recent = h.slice(-weeks);
  return recent[recent.length-1].y <= recent[0].y && (Date.now() - h[h.length-1].ts) < 14*86400000;
}
function suggestProgression(name, targetReps){
  const last = lastSessionFor(name);
  if(!last) return null;
  const ex = last.ex;
  const workingSets = (ex.setsDetalhados||[]).filter(s => s.done && !s.warmup);
  if(!workingSets.length) return null;
  const repsAlvo = Number(targetReps) || Number(ex.repsMedias) || 0;
  const totalPlan = Math.max(1, Number(ex.setsTotal) || workingSets.length);
  const completedAll = workingSets.length >= totalPlan;
  const allHitTop = repsAlvo > 0 && workingSets.every(s => (Number(s.repeticoes)||0) >= repsAlvo);
  const rirs = workingSets.filter(s => s.rir !== null && s.rir !== undefined).map(s => Number(s.rir));
  const avgRIR = rirs.length ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  if(completedAll && allHitTop){
    let pct = 0.05;
    let motivo = 'Bateu o topo de reps — sobe carga';
    if(avgRIR !== null && avgRIR >= 3){ pct = 0.075; motivo = 'Topo fácil (RIR alto) — sobe mais carga'; }
    else if(avgRIR !== null && avgRIR <= 0.5){ pct = 0.025; motivo = 'Quase na falha — sobe pouco'; }
    const inc = Math.max(2.5, Math.round((Number(ex.carga||0)*pct)/2.5)*2.5);
    return { tipo:'up', carga: Number(ex.carga||0) + inc, reps: repsAlvo, atual: ex.carga, motivo };
  }
  if(completedAll){
    const maxReps = Math.max(...workingSets.map(s => Number(s.repeticoes)||0));
    const nextReps = Math.min(repsAlvo + 2, Math.max(maxReps, repsAlvo) + 1);
    return { tipo:'reps', carga: Number(ex.carga||0), reps: nextReps, atual: ex.carga, motivo:'Completou tudo — suba reps antes de subir carga' };
  }
  if(workingSets.length < totalPlan * 0.7){
    return { tipo:'down', carga: Math.max(0, Number(ex.carga||0) - 2.5), atual: ex.carga, motivo:'Falhou em várias séries — reduz carga' };
  }
  return null;
}
function suggText(sugg){
  if(!sugg) return '';
  if(sugg.tipo === 'up')   return `${sugg.carga}kg × ${sugg.reps}`;
  if(sugg.tipo === 'reps') return `${sugg.reps} reps @ ${sugg.atual}kg`;
  if(sugg.tipo === 'down') return `reduzir para ${sugg.carga}kg`;
  return '';
}
function calcWarmup(c){
  const num = Number(c); if(!num) return null;
  const round = v => Math.max(0, Math.round(v/2.5)*2.5);
  return [{pct:40,kg:round(num*0.4)},{pct:60,kg:round(num*0.6)},{pct:80,kg:round(num*0.8)}];
}
function calcPlates(target){
  const bar = Number(loadSettings().barWeight) || 20;
  const num = Number(target); if(!num || num < bar) return null;
  const perSide = (num - bar) / 2;
  const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
  let rem = perSide; const used = [];
  for(const p of plates){ const n = Math.floor(rem / p + 0.0001); if(n > 0){ used.push({p, n}); rem = +(rem - n*p).toFixed(2); } }
  return { perSide, used, resto: rem, bar };
}
function calcE1RM(carga, reps){ const c = Number(carga)||0, r = Number(reps)||0; return c<=0||r<=0 ? 0 : c*(1+r/30); }

function weekVolume(){ const w = Date.now() - 7*86400000; let vol = 0; DB.historico.filter(h=> h.data>=w && h.tipo==='forca').forEach(h=>{ (h.exercicios||[]).forEach(e=>{ vol += (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0); }); }); return Math.round(vol); }
function prevWeekVolume(){ const now = Date.now(), w1 = now - 14*86400000, w2 = now - 7*86400000; let vol = 0; DB.historico.filter(h=> h.data>=w1 && h.data<w2 && h.tipo==='forca').forEach(h=>{ (h.exercicios||[]).forEach(e=>{ vol += (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0); }); }); return Math.round(vol); }
function totalVolume(){ let vol = 0; DB.historico.filter(h=> h.tipo==='forca').forEach(h=>{ (h.exercicios||[]).forEach(e=>{ vol += (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0); }); }); return Math.round(vol); }
function monthVolume(){ const m = Date.now() - 30*86400000; let vol = 0; DB.historico.filter(h=> h.data>=m && h.tipo==='forca').forEach(h=>{ (h.exercicios||[]).forEach(e=>{ vol += (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0); }); }); return Math.round(vol); }
function isoWeek(d){
  const date = new Date(d); date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - ((date.getDay()+6)%7));
  const week1 = new Date(date.getFullYear(),0,4);
  const wk = 1 + Math.round(((date - week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
  return date.getFullYear()+'-'+wk;
}
function computeStreak(){
  if(!DB.historico.length) return 0;
  const weeks = new Set(DB.historico.map(h=>isoWeek(h.data)));
  const cursor = new Date();
  if(!weeks.has(isoWeek(cursor))) cursor.setDate(cursor.getDate()-7);
  let streak = 0;
  while(weeks.has(isoWeek(cursor)) && streak<500){ streak++; cursor.setDate(cursor.getDate()-7); }
  return streak;
}
function computeStreakDays(){
  const days = new Set(DB.historico.map(h=> todayKey(h.data)));
  Object.keys(loadRestDays()).forEach(k=> days.add(k));
  let streak = 0; const cursor = new Date();
  while(days.has(todayKey(cursor)) && streak<365){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}
function lastTrainingOfGroup(group){
  const hist = DB.historico.filter(h=>h.tipo==='forca').sort((a,b)=> b.data-a.data);
  for(const h of hist){ for(const e of (h.exercicios||[])){ if(exerciseGroup(e.nome) === group && e.setsFeitas>0) return h.data; } }
  return null;
}
function buildHeatmapData(){
  const map = {};
  DB.historico.forEach(h=>{
    const k = todayKey(h.data);
    const vol = (h.exercicios||[]).reduce((a,e)=> a + (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0), 0);
    map[k] = (map[k]||0) + Math.max(1, vol);
  });
  return map;
}
function detectOvertraining(){
  const cur = weekVolume(), prev = prevWeekVolume();
  if(!prev || !cur) return null;
  const ratio = cur/prev;
  if(ratio > 1.5) return { tipo:'up', msg:`Volume subiu ${Math.round((ratio-1)*100)}% vs semana passada` };
  if(ratio < 0.5) return { tipo:'down', msg:`Volume caiu ${Math.round((1-ratio)*100)}% vs semana passada` };
  return null;
}
function detectDeload(){
  const w = Date.now() - 7*86400000;
  const hist = DB.historico.filter(h=> h.tipo==='forca' && h.data >= w);
  if(hist.length < 3) return false;
  let falhas = 0, total = 0;
  hist.forEach(h=>{ (h.exercicios||[]).forEach(e=>{ (e.setsDetalhados||[]).forEach(s=>{ if(s.done && !s.warmup){ total++; if(s.falha) falhas++; } }); }); });
  return total > 10 && falhas/total > 0.5;
}
function suggestDeload(){
  const nomes = [...new Set(DB.historico.filter(h=>h.tipo==='forca').slice(-30).flatMap(h=> (h.exercicios||[]).map(e=>e.nome)).filter(Boolean))];
  const estagnados = nomes.filter(n=> isStagnant(n));
  const del = detectDeload();
  if(del && estagnados.length >= 2) return { motivo:`Falhas em mais de 50% das séries + ${estagnados.length} exercícios estagnados` };
  if(estagnados.length >= 3) return { motivo:`${estagnados.length} exercícios estagnados há 3 semanas` };
  return null;
}
function pushPullBalance(){
  const m = Date.now() - 30*86400000;
  const push = new Set(['Peito','Ombros','Tríceps']); const pull = new Set(['Costas','Bíceps']);
  let pv = 0, pu = 0;
  DB.historico.filter(h=> h.data>=m && h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      const g = exerciseGroup(e.nome);
      const vol = (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0);
      if(push.has(g)) pv += vol; else if(pull.has(g)) pu += vol;
    });
  });
  if(!pv || !pu) return null;
  const r = pv/pu;
  if(r > 1.3) return { msg:`Você empurra ${Math.round((r-1)*100)}% mais que puxa` };
  if(r < 0.77) return { msg:`Você puxa ${Math.round((1/r-1)*100)}% mais que empurra` };
  return null;
}
function calcTMB(){
  const p = loadPerfil();
  if(!p.altura || !p.idade || !p.pesos.length) return null;
  const peso = p.pesos[p.pesos.length-1].peso;
  const base = 10*peso + 6.25*p.altura - 5*p.idade;
  const tmb = p.sexo === 'M' ? base + 5 : base - 161;
  const treinosSemana = DB.historico.filter(h=> h.data >= Date.now()-7*86400000 && h.tipo==='forca').length;
  const fator = treinosSemana >= 5 ? 1.725 : treinosSemana >= 3 ? 1.55 : treinosSemana >= 1 ? 1.375 : 1.2;
  const tdee = tmb * fator;
  const objetivo = p.objetivo || 'manutencao';
  let alvo = tdee;
  if(objetivo === 'cutting') alvo = tdee - 500;
  if(objetivo === 'bulking') alvo = tdee + 350;
  return { peso, tmb: Math.round(tmb), tdee: Math.round(tdee), alvo: Math.round(alvo) };
}
function suggestNextWorkout(){
  const hist = DB.historico.filter(h=>h.tipo==='forca').sort((a,b)=> b.data - a.data);
  if(!DB.treinos.length) return null;
  if(!hist.length){ const t = DB.treinos[0]; return { treino:t, divisao:t.divisoes[0] }; }
  const last = hist[0];
  const treino = DB.treinos.find(t=> t.id === last.treinoId) || DB.treinos.find(t=> t.nome === last.treinoNome);
  if(!treino) return { treino: DB.treinos[0], divisao: DB.treinos[0].divisoes[0] };
  const lastDiv = treino.divisoes.find(d=> d.letra === last.divisaoLetra) || treino.divisoes[0];
  const idx = treino.divisoes.indexOf(lastDiv);
  const next = treino.divisoes[(idx+1) % treino.divisoes.length];
  return { treino, divisao: next };
}
function suggestCardio(){
  const now = Date.now();
  const ontem = DB.historico.filter(h=> h.tipo==='forca' && h.data >= now - 36*3600*1000 && h.data <= now - 12*3600*1000).length;
  const cardioHoje = DB.historico.filter(h=> h.tipo==='cardio' && todayKey(h.data) === todayKey()).length;
  return ontem > 0 && !cardioHoje && DB.cardios.length > 0;
}

function computeBadgeStats(){
  const prsTotal = new Set();
  DB.historico.filter(h=>h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      (e.setsDetalhados||[]).forEach(s=>{
        if(!s.done || s.warmup) return;
        const carga = Number(s.carga)||0, reps = Number(s.repeticoes)||0;
        if(carga<=0 || reps<=0) return;
        const best = bestSetFor(e.nome);
        if(best && Math.abs(best.carga - carga) < 0.01 && Math.abs(best.reps - reps) < 0.01) prsTotal.add(e.nome + h.id);
      });
    });
  });
  return { treinos: DB.historico.filter(h=>h.tipo==='forca').length, prsTotal: prsTotal.size };
}
function checkNewBadges(){
  const stats = computeBadgeStats();
  const owned = loadBadges();
  const novos = [];
  BADGES.forEach(b=>{ if(!owned[b.id]){ try{ if(b.check(stats)){ owned[b.id] = Date.now(); novos.push(b); } }catch(e){} } });
  if(novos.length) saveBadges(owned);
  return novos;
}

function updateFAB(){
  const fab = document.getElementById('fab-action');
  if(!fab) return;
  if(_fabInterval){ clearInterval(_fabInterval); _fabInterval = null; }
  const onExec = ROUTE.name === 'treino_exec';
  if(SESSION && !onExec){
    const isRest = SESSION.timer && SESSION.timer.running;
    const urgent = isRest && SESSION.timer.secondsLeft <= 10;
    fab.className = 'fab-action show rest' + (urgent ? ' urgent' : '');
    fab.innerHTML = `
      ${isRest
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/></svg>'}
      <span class="fab-time" id="fab-time">${isRest ? formatSeconds(SESSION.timer.secondsLeft) : formatSeconds(sessionElapsedSeconds())}</span>`;
    fab.onclick = ()=> go('treino_exec', {treinoId:SESSION.treinoId, divisaoId:SESSION.divisaoId});
    _fabInterval = setInterval(()=>{
      const t = document.getElementById('fab-time');
      const f = document.getElementById('fab-action');
      if(!t || !f) return;
      if(SESSION && SESSION.timer && SESSION.timer.running){
        t.textContent = formatSeconds(SESSION.timer.secondsLeft);
        f.classList.toggle('urgent', SESSION.timer.secondsLeft <= 10);
      } else if(SESSION){ t.textContent = formatSeconds(sessionElapsedSeconds()); }
      else { clearInterval(_fabInterval); _fabInterval = null; updateFAB(); }
    }, 500);
    return;
  }
  if(!SESSION && DB.cardios.length > 0 && ROUTE.name !== 'cardio' && ROUTE.name !== 'cardio_exec' && ROUTE.name !== 'cardio_form'){
    fab.className = 'fab-action show cardio';
    fab.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.5 7-6.5 0-3-2-5-3-7-.3 2-1.3 3-2 3 .5-3-1-6-4-7.5.5 2.5-.5 4.5-2 6-1.2 1.2-3 3-3 5.5C5 19.5 8 22 12 22z"/></svg><span>Cardio</span>`;
    fab.onclick = ()=> go('cardio');
    return;
  }
  fab.classList.remove('show');
}

/* ============================================================
   MODAL (bottom sheet com drag-to-close)
============================================================ */
function openModal(html, opts={}){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal-box">${html}</div>`;
  document.body.appendChild(bg);
  const box = bg.querySelector('.modal-box');

  // Drag-to-close pelo topo (handle)
  let startY = 0, curY = 0, dragging = false, startTime = 0;
  const onStart = (e)=>{
    const touch = e.touches ? e.touches[0] : e;
    const rect = box.getBoundingClientRect();
    const relY = touch.clientY - rect.top;
    // Só permite arrastar do topo (área do handle + 20px)
    if(relY > 46) return;
    // Ignora se começou num botão/link
    if(e.target.closest('button, a, input')) return;
    startY = touch.clientY; curY = startY;
    dragging = true; startTime = Date.now();
    box.classList.add('dragging');
    box.style.transition = 'none';
  };
  const onMove = (e)=>{
    if(!dragging) return;
    const touch = e.touches ? e.touches[0] : e;
    curY = touch.clientY;
    const dy = Math.max(0, curY - startY);
    box.style.transform = `translateY(${dy}px)`;
    // Reduz a opacidade do fundo conforme arrasta
    const op = Math.max(0.1, 1 - dy/400);
    bg.style.background = `rgba(6,7,8,${op * 0.72})`;
    if(e.cancelable) e.preventDefault();
  };
  const onEnd = ()=>{
    if(!dragging) return;
    const dy = curY - startY;
    const elapsed = Date.now() - startTime;
    const vel = dy / Math.max(1, elapsed);
    box.classList.remove('dragging');
    // Fecha se: arrastou >100px OU velocidade alta (>0.6 px/ms)
    if(dy > 100 || vel > 0.6){
      box.style.transition = 'transform .25s cubic-bezier(.4,0,1,1)';
      box.style.transform = 'translateY(110%)';
      bg.style.transition = 'opacity .25s ease';
      bg.style.opacity = '0';
      setTimeout(()=>{ bg.remove(); }, 260);
    } else {
      box.style.transition = 'transform .22s cubic-bezier(.22,1.2,.36,1)';
      box.style.transform = '';
      bg.style.transition = 'background .2s ease';
      bg.style.background = '';
      setTimeout(()=>{ box.style.transition = ''; }, 240);
    }
    dragging = false;
  };
  box.addEventListener('touchstart', onStart, {passive:true});
  box.addEventListener('touchmove', onMove, {passive:false});
  box.addEventListener('touchend', onEnd);
  box.addEventListener('touchcancel', onEnd);
  // Mouse drag (desktop opcional)
  box.addEventListener('mousedown', (e)=>{
    if(e.target.closest('button, a, input')) return;
    const rect = box.getBoundingClientRect();
    const relY = e.clientY - rect.top;
    if(relY > 46) return;
    startY = e.clientY; curY = startY; dragging = true; startTime = Date.now();
    box.classList.add('dragging');
    const mm = (ev)=>{ if(!dragging) return; curY = ev.clientY; box.style.transform = `translateY(${Math.max(0,curY-startY)}px)`; };
    const mu = ()=>{ document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); onEnd(); };
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });

  if(opts.dismissable!==false) bg.addEventListener('click', e=>{ if(e.target===bg) closeModal(bg); });
  return bg;
}
function closeModal(bg){
  if(!bg || !bg.parentElement) return;
  const box = bg.querySelector('.modal-box');
  if(box){
    box.style.transition = 'transform .25s cubic-bezier(.4,0,1,1)';
    box.style.transform = 'translateY(110%)';
    bg.style.transition = 'opacity .25s ease';
    bg.style.opacity = '0';
    setTimeout(()=>{ if(bg.parentElement) bg.remove(); }, 260);
  } else {
    bg.remove();
  }
}
function confirmDialog(msg, {title='Confirmar', okText='Confirmar', danger=false}={}){
  return new Promise(resolve=>{
    const bg = openModal(`
      <button class="close-x">&times;</button>

/* ============================================================
   WAKE LOCK
============================================================ */
async function requestWakeLock(){
  try{ if('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock = null; }); } }catch(e){}
}
function releaseWakeLock(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    if(ROUTE.name==='treino_exec' || ROUTE.name==='cardio_exec') requestWakeLock();
    checkPendingNotification();
    updateFAB();
  }
  if(document.visibilityState==='hidden'){
    autoBackup(false);
    const cfg = loadGistConfig();
    if(cfg.enabled && cfg.autoSync && cfg.token && cfg.id && !_suppressGistSync) gistPush().catch(()=>{});
  }
});

/* ============================================================

function renderMiniCalendar(){
  const trained = new Set(DB.historico.filter(h=>h.tipo==='forca').map(h=> todayKey(h.data)));
  const restDays = loadRestDays();
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=6; i>=0; i--){ const d = new Date(today); d.setDate(d.getDate()-i); days.push(d); }
    const wd = ['D','S','T','Q','Q','S','S'];
  const hojeK = todayKey();
    const daysForce = new Set(DB.historico.filter(h => h.tipo === 'forca').map(h => todayKey(h.data)));
  const daysCardio = new Set(DB.historico.filter(h => h.tipo === 'cardio').map(h => todayKey(h.data)));
  return `<div class="card" style="padding:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span class="section-label" style="margin:0;">Últimos 7 dias</span>
      <span style="font-size:10.5px;color:var(--muted);font-weight:600;">${trained.size ? [...trained].filter(k=> days.some(d=> todayKey(d)===k)).length + '/7' : '0/7'}</span>
    </div>
    <div class="mini-cal">
      ${days.map(d=>{
        const k = todayKey(d);
        const isToday = k === hojeK;
        const cls = trained.has(k) ? 'trained' : (restDays[k] ? 'rest' : '');
        const hasForce = daysForce.has(k);
        const hasCardio = daysCardio.has(k);
        const dots = (hasForce || hasCardio)
          ? `<span class="dots">${hasForce ? '<span class="dot-force"></span>' : ''}${hasCardio ? '<span class="dot-cardio"></span>' : ''}</span>`
          : '';
        return `<div class="day ${cls} ${isToday?'today':''}" data-day-key="${k}" title="${k}">
          ${dots}
          <span class="wd">${wd[d.getDay()]}</span>
          <span class="d">${d.getDate()}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="mini-cal-legend" style="display:flex;gap:12px;margin-top:10px;font-size:10.5px;color:var(--muted);justify-content:center;align-items:center;flex-wrap:wrap;">
      <span style="display:inline-flex;align-items:center;gap:5px;">
        <span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--lime);flex-shrink:0;"></span>
        Treinou
      </span>
      <span style="display:inline-flex;align-items:center;gap:5px;">
        <span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--blue);flex-shrink:0;"></span>
        Descanso
      </span>
      <span style="display:inline-flex;align-items:center;gap:5px;">
        <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange);flex-shrink:0;"></span>
        Força
      </span>
      <span style="display:inline-flex;align-items:center;gap:5px;">
        <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#22D3EE;flex-shrink:0;"></span>
        Cardio
      </span>
    </div>
  </div>`;
}
