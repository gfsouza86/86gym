<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0B0D">
<title>86 Training & Grind</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0B0D'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-weight='800' font-size='16' fill='%23C9FF4D' text-anchor='middle'%3E86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0D; --surface:#141619; --surface-2:#1C1F23;
    --line:#25282D; --line-soft:#1A1D21;
    --lime:#C9FF4D; --lime-dim:rgba(201,255,77,0.10);
    --orange:#FF6A45; --blue:#4DA6FF; --gold:#FFD166;
    --text:#F3F4F1; --muted:#8A9099; --muted-2:#5A6069;
    --danger:#FF5A5A; --radius:14px;
    --font-display:'Space Grotesk', sans-serif;
    --grp-Peito:#FF5A5A; --grp-Costas:#4DA6FF; --grp-Ombros:#FFD166;
    --grp-Bíceps:#A78BFA; --grp-Tríceps:#F472B6; --grp-Antebraço:#22D3EE;
    --grp-Pernas:#8B5CF6; --grp-Glúteos:#EC4899; --grp-Abdômen:#FB923C;
    --grp-Panturrilha:#34D399; --grp-Cardio:#FF6A45; --grp-Outros:#8A9099;
    --grp-Personalizado:#94A3B8;
  }
  :root[data-theme="light"]{
    --bg:#FAF9F5; --surface:#FFFFFF; --surface-2:#F1F0EC;
    --line:#DFE1DD; --line-soft:#EBECE8;
    --lime:#7FA800; --lime-dim:rgba(127,168,0,0.12);
    --orange:#E24E2A; --blue:#2E7DD1; --gold:#D4A017;
    --text:#141619; --muted:#4F5459; --muted-2:#6E747A; --danger:#D23D3D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  svg{width:18px;height:18px;flex-shrink:0;display:inline-block;vertical-align:middle;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{font-family:'Inter',sans-serif;color:var(--text);overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;background-color:var(--bg);
    background-image:var(--gym-pattern,none);background-repeat:repeat;
    background-size:360px 360px;transition:background-color .25s ease,color .25s ease;position:relative;}
  .card, .menu-card, .exec-ex-card, .hist-content, .stat-box, .hero, .treino-item, .cardio-item{
    transition:background-color .25s ease, border-color .25s ease, color .25s ease;
  }
  #bg-anim{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  #bg-anim .bg-glow{position:absolute;border-radius:50%;filter:blur(80px);
    background:radial-gradient(circle,var(--lime) 0%,transparent 70%);
    opacity:0.06;animation:bgGlow 12s ease-in-out infinite;}
  [data-theme="light"] #bg-anim .bg-glow{background:radial-gradient(circle,#5A7A00 0%,transparent 70%);}
  @keyframes bgGlow{0%,100%{transform:scale(1);opacity:0.05;} 50%{transform:scale(1.18);opacity:0.10;}}
  .bg-item{position:absolute;color:var(--lime);opacity:0.07;
    pointer-events:none;animation:bgBob ease-in-out infinite alternate;}
  [data-theme="light"] .bg-item{opacity:0.18;color:#5A7A00;}
  .bg-item svg{width:100%;height:100%;display:block;}
  @keyframes bgBob{0%{transform:translate3d(0,0,0) rotate(var(--rot-start,-8deg));}
    100%{transform:translate3d(var(--dx,20px),var(--dy,-30px),0) rotate(var(--rot-end,8deg));}}
  .bg-plate-big{position:absolute;border-radius:50%;border:2px solid var(--lime);opacity:0.05;
    animation:bgSpin 60s linear infinite;}
  [data-theme="light"] .bg-plate-big{opacity:0.14;border-color:#5A7A00;}
  .bg-plate-big::before{content:'';position:absolute;inset:14%;border-radius:50%;border:1.5px dashed var(--lime);}
  .bg-plate-big::after{content:'';position:absolute;inset:32%;border-radius:50%;border:1.5px solid var(--lime);}
  @keyframes bgSpin{to{transform:rotate(360deg);}}
  .bg-particle{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--lime);
    opacity:0;animation:bgRise linear infinite;box-shadow:0 0 6px var(--lime);}
  [data-theme="light"] .bg-particle{background:#5A7A00;box-shadow:0 0 4px rgba(90,122,0,0.5);}
  @keyframes bgRise{0%{transform:translateY(20vh) scale(0.5);opacity:0;} 20%{opacity:0.35;}
    80%{opacity:0.35;} 100%{transform:translateY(-30vh) scale(1);opacity:0;}}
  @media (prefers-reduced-motion: reduce){
    .bg-item,.bg-particle,.bg-plate-big,#bg-anim .bg-glow{animation:none !important;}
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}
  h1,h2,h3{margin:0;font-weight:800;}
  #view{flex:1;padding:20px 18px 104px 18px;overflow-y:auto;}
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;
    padding:7px 2px calc(7px + env(safe-area-inset-bottom)) 2px;z-index:50;}
  nav.tabbar button{flex:1;background:none;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:9.5px;font-family:'Inter';font-weight:600;padding:5px 1px;border-radius:10px;cursor:pointer;}
  nav.tabbar button svg{width:19px;height:19px;}
  nav.tabbar button.active{color:var(--lime);}
  nav.tabbar button.active svg{filter:drop-shadow(0 0 6px var(--lime-dim));}
  .hero{position:relative;margin:0 -18px 0 -18px;padding:26px 22px 20px 22px;overflow:hidden;
    background-image:var(--gym-pattern-strong,none),
      radial-gradient(100% 80% at 20% 0%,color-mix(in srgb,var(--surface-2) 80%,transparent) 0%,transparent 72%);
    background-repeat:repeat,no-repeat;background-size:300px 300px,100% 100%;}
  .brandmark{display:flex;align-items:center;gap:14px;}
  .plate-badge{position:relative;width:76px;height:76px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 32% 28%,var(--surface-2) 0%,var(--bg) 75%);
    border:4px solid var(--text);display:flex;align-items:center;justify-content:center;}
  .plate-badge::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1.5px solid var(--line-soft);}
  .plate-badge .pnum{position:relative;font-family:var(--font-display);font-weight:700;font-size:24px;
    color:var(--lime);letter-spacing:-0.02em;line-height:1;}
  .plate-badge .pkg{position:absolute;bottom:15px;left:0;right:0;text-align:center;
    font-family:'Inter';font-weight:700;font-size:6.5px;letter-spacing:2px;color:var(--muted-2);}
  .wordmark-gym{font-weight:800;font-size:19px;line-height:1.08;text-transform:uppercase;}
  .wordmark-gym .accent{color:var(--lime);}
  .streak-chip{position:absolute; top:14px; right:18px; z-index:2;
    display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(135deg,rgba(255,106,69,0.9),rgba(255,209,102,0.9));
    color:#1a0d05; font-weight:800; font-size:12.5px;
    padding:6px 12px; border-radius:20px; box-shadow:0 6px 16px rgba(0,0,0,0.35);}
  .streak-chip.off{background:var(--surface-2); color:var(--muted);}
  .bar-divider{height:1px;background:var(--line);margin:16px 0 12px 0;width:100%;}
  .tagline{color:var(--muted);font-size:13px;max-width:290px;line-height:1.5;}
  .profile-strip{display:flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:14px;
    margin:14px 0 14px 0;cursor:pointer;}
  .avatar-wrap{position:relative;flex-shrink:0;}
  .avatar-circle{width:48px;height:48px;border-radius:50%;background:var(--surface-2);
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    overflow:hidden;color:var(--muted);}
  .avatar-circle img{width:100%;height:100%;object-fit:cover;}
  .avatar-circle svg{width:22px;height:22px;}
  .avatar-badge{position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;
    background:var(--orange);border:2px solid var(--bg);}
  .profile-strip .info b{font-size:12.5px;display:block;color:var(--muted);font-weight:600;}
  .profile-strip .info span{font-size:14.5px;font-weight:700;color:var(--text);}
  .profile-strip .chev{margin-left:auto;color:var(--muted-2);}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted-2);
    font-weight:700;margin:4px 0 10px 2px;}
  .home-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .menu-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 12px;display:flex;flex-direction:column;gap:14px;cursor:pointer;}
  .menu-card:active{transform:scale(0.97);}
  .menu-card svg{width:18px;height:18px;color:var(--muted);}
  .menu-card b{font-size:13.5px;font-weight:700;}
  .menu-card small{color:var(--muted);font-size:11px;line-height:1.3;}
  .menu-card.primary{background:var(--lime);border-color:var(--lime);grid-column:1/3;
    flex-direction:row;align-items:center;justify-content:space-between;padding:16px;}
  .menu-card.primary svg{color:#0A0B0D;width:24px;height:24px;}
  .menu-card.primary b{color:#0A0B0D;font-size:15px;}
  .menu-card.primary small{color:rgba(10,11,13,0.65);}
  .menu-card.primary .mc-text{display:flex;flex-direction:column;gap:3px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
  .stat-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 8px;text-align:center;font-family:'Inter';color:var(--text);cursor:pointer;}
  .stat-box .v{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--lime);line-height:1;}
  .stat-box .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:0.5px;margin-top:4px;font-weight:700;}
  .stat-box:active{transform:scale(0.97);}
  .page-title{font-size:24px;margin-bottom:4px;}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--lime);color:#0A0B0D;border:none;font-weight:700;font-size:14px;
    padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;font-family:'Inter';}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn.ghost{background:transparent;color:var(--lime);border:1px dashed var(--line);}
  .btn.small{padding:9px 12px;font-size:12.5px;width:auto;}
  .btn.mini{padding:6px 8px;font-size:11px;width:auto;font-weight:700;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .row{display:flex;gap:10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:12px;border-radius:10px;font-size:14px;font-family:'Inter';margin-top:6px;}
  textarea{resize:vertical;min-height:60px;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
  label.field{display:block;font-size:12px;color:var(--muted);margin-top:12px;font-weight:600;}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.6;}
  .empty svg{width:40px;height:40px;color:var(--line);margin-bottom:10px;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .icon-btn{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.mini{width:28px;height:28px;border-radius:8px;}
  .icon-btn.mini svg{width:14px;height:14px;}
  .icon-btn.fav-on{background:var(--gold);color:#1a0d05;border-color:var(--gold);}
  .chip{display:inline-flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
    margin-right:8px;margin-bottom:6px;cursor:pointer;}
  .chip.active{background:var(--lime);color:#0A0B0D;border-color:var(--lime);}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .treino-item{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;}
  .treino-item .row-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .treino-item h3{font-size:16px;}
  .treino-item .divs{margin-top:8px;}
  .treino-item small{color:var(--muted);font-size:12px;}
  .autocomplete-wrap{position:relative;}
  .ac-list{position:absolute;left:0;right:0;top:100%;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:180px;
    overflow-y:auto;z-index:20;display:none;}
  .ac-list div{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line-soft);}
  .ac-list div:last-child{border-bottom:none;}
  .help-icon{width:22px;height:22px;border-radius:50%;background:var(--surface-2);
    border:1px solid var(--line);color:var(--lime);display:inline-flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:800;
    cursor:pointer;flex-shrink:0;}
  .ex-block{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-top:12px;position:relative;}
  .ex-block .ex-head{display:flex;align-items:center;gap:8px;}
  .ex-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
  .ex-grid label{font-size:10px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px;}
  .remove-x{position:absolute;top:10px;right:10px;color:var(--muted);background:none;
    border:none;font-size:16px;cursor:pointer;}
  .division-block{border:1px solid var(--line);border-radius:var(--radius);padding:14px;
    margin-bottom:16px;background:var(--surface);}
  .division-head{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .division-head input{width:60px;text-align:center;font-weight:700;
    font-family:var(--font-display);font-size:17px;}
  .group-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;
    color:var(--lime);font-weight:800;margin:22px 0 10px 0;}
  .group-title:first-child{margin-top:0;}
  .ex-row{display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);padding:12px 14px;
    border-radius:12px;margin-bottom:8px;}
  .ex-row-info{flex:1;margin-right:8px;min-width:0;}
  .ex-row-info b{font-size:14px;font-weight:600;display:block;}
  .ex-row-info small{color:var(--muted);font-size:11px;display:block;margin-top:2px;text-transform:capitalize;}
  .ex-row.banned{opacity:0.55;}
  .banned-tag{font-size:9.5px; color:#fff; background:var(--danger);
    padding:2px 6px; border-radius:5px; font-weight:800; letter-spacing:0.5px; margin-right:6px;}
  .set-table{width:100%;border-collapse:collapse;margin-top:10px;}
  .set-table th{font-size:10px;color:var(--muted);text-transform:uppercase;
    text-align:center;padding:6px 2px;font-weight:700;}
  .set-table td{text-align:center;padding:6px 2px;border-top:1px solid var(--line-soft);font-size:13px;}
  .set-table td:first-child, .set-table th:first-child{text-align:left;padding-left:4px;}
  .set-table input[type=number],.set-table input[type=text]{padding:8px 4px;text-align:center;margin-top:0;
    width:100%;min-width:48px;font-size:14.5px;font-weight:600;font-family:var(--font-display);}
  .set-table input[type=checkbox]{width:22px;height:22px;accent-color:var(--lime);}
  .set-table tr.warmup-row td{color:var(--muted);opacity:0.75;}
  .set-table tr.fail-row td:nth-child(2),.set-table tr.fail-row td:nth-child(3){color:var(--danger);}
  .carga-wrap{display:flex;align-items:center;justify-content:center;gap:3px;}
  .carga-btn{width:26px;height:34px;border-radius:7px;background:var(--surface);
    border:1px solid var(--line);color:var(--text);font-weight:800;font-size:15px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    flex-shrink:0;font-family:'Inter';line-height:1;}
  .carga-btn:active{background:var(--lime);color:#0A0B0D;border-color:var(--lime);}
  .carga-btn:disabled{opacity:0.35;}
  .exec-ex-card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;margin-bottom:12px;position:relative;}
  .exec-ex-card.done{border-color:var(--lime);}
  .exec-ex-card.pr{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 20px rgba(255,209,102,0.2);}
  .exec-ex-card.collapsed{padding:10px 14px;}
  .exec-ex-card.collapsed .exec-body{display:none;}
  .exec-ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    position:sticky;top:0;background:var(--surface);z-index:5;padding:4px 0;margin:-4px 0 0 0;}
  .exec-ex-head h3{font-size:14.5px;flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .exec-ex-head .toggle-btn{background:none;border:none;color:var(--muted);
    cursor:pointer;padding:2px;display:flex;align-items:center;}
  .exec-ex-head .toggle-btn svg{width:16px;height:16px;transition:transform .2s;}
  .exec-ex-card.collapsed .toggle-btn svg{transform:rotate(-90deg);}
  .superset-badge{display:inline-block;background:#7C3AED;color:#fff;
    padding:2px 8px;border-radius:8px;font-weight:800;font-size:10px;letter-spacing:0.5px;}
  .exec-ex-card.superset-1{border-left:4px solid #8B5CF6;}
  .exec-ex-card.superset-2{border-left:4px solid #F472B6;}
  .exec-ex-card.superset-3{border-left:4px solid #22D3EE;}
  .grp-chip{display:inline-block;padding:2px 7px;border-radius:6px;font-weight:800;
    font-size:9.5px;letter-spacing:0.5px;color:#0A0B0D;text-transform:uppercase;}
  [data-grp="Peito"]{background:var(--grp-Peito);color:#0A0B0D;}
  [data-grp="Costas"]{background:var(--grp-Costas);color:#0A0B0D;}
  [data-grp="Ombros"]{background:var(--grp-Ombros);color:#0A0B0D;}
  [data-grp="Bíceps"]{background:var(--grp-Bíceps);color:#0A0B0D;}
  [data-grp="Tríceps"]{background:var(--grp-Tríceps);color:#0A0B0D;}
  [data-grp="Antebraço"]{background:var(--grp-Antebraço);color:#0A0B0D;}
  [data-grp="Pernas"]{background:var(--grp-Pernas);color:#fff;}
  [data-grp="Glúteos"]{background:var(--grp-Glúteos);color:#fff;}
  [data-grp="Abdômen"]{background:var(--grp-Abdômen);color:#0A0B0D;}
  [data-grp="Panturrilha"]{background:var(--grp-Panturrilha);color:#0A0B0D;}
  [data-grp="Cardio"]{background:var(--grp-Cardio);color:#0A0B0D;}
  [data-grp="Outros"]{background:var(--grp-Outros);color:#0A0B0D;}
  [data-grp="Personalizado"]{background:var(--grp-Personalizado);color:#0A0B0D;}
  .rm-preview{font-size:11px;color:var(--blue);text-align:center;margin-top:3px;font-weight:600;}
  .compare-badge{font-size:11px;padding:4px 8px;border-radius:8px;font-weight:700;}
  .compare-badge.up{background:rgba(201,255,77,0.15);color:var(--lime);}
  .compare-badge.down{background:rgba(255,90,90,0.15);color:var(--danger);}
  .compare-badge.same{background:var(--surface-2);color:var(--muted);}
  .last-time-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
    background:rgba(77,166,255,0.12);border:1px solid rgba(77,166,255,0.25);
    border-radius:8px;padding:4px 9px;margin-top:6px;color:var(--blue);font-weight:700;}

  .feat-item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;font-weight:600;}
  .feat-item summary::-webkit-details-marker{display:none;}
  .feat-item summary::after{content:'▸';color:var(--muted);font-weight:800;font-size:14px;transition:transform .2s;flex-shrink:0;}
  .feat-item[open]{border-color:var(--lime);}
  .feat-item[open] summary::after{transform:rotate(90deg);color:var(--lime);}
  .feat-item .feat-body{padding:8px 0 2px 0;font-size:12.8px;line-height:1.55;color:var(--muted);border-top:1px solid var(--line-soft);margin-top:10px;}
  .feat-item .feat-where{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:11px;color:var(--blue);font-weight:600;background:rgba(77,166,255,0.10);padding:3px 8px;border-radius:6px;}
  .feat-toc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .feat-toc a{font-size:11.5px;color:var(--muted);text-decoration:none;padding:5px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;font-weight:600;}
  .learning-card{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .learning-card .lc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .learning-card .lc-head b{font-size:13.5px;}
  .learning-card .lc-head span{font-size:11px;color:var(--lime);font-weight:700;}
  .learning-step{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:12.5px;}
  .learning-step:first-child{border-top:none;}
  .learning-step .ls-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .learning-step.done .ls-check{background:var(--lime);border-color:var(--lime);color:#0A0B0D;}
  .learning-step.done .ls-text{color:var(--muted);text-decoration:line-through;}
  .backup-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:12.5px;background:var(--surface-2);}
  @media print{
    body * { visibility:hidden; }
    #print-area, #print-area * { visibility:visible; }
    #print-area{position:absolute;left:0;top:0;width:100%;padding:20px;background:#fff;color:#000;}
    .tabbar, .fab-top, .fab-action{display:none !important;}
  }
  @media (min-width:768px){
    #app{max-width:760px;}
    nav.tabbar{max-width:760px;}
    .home-menu{grid-template-columns:1fr 1fr 1fr;}
    .menu-card.primary{grid-column:1/4;}
    .stat-grid{grid-template-columns:repeat(3,1fr);}
    #view{padding:28px 30px 120px 30px;}
    .modal-box{max-width:600px;border-radius:20px;margin-bottom:auto;}
    .modal-bg{align-items:center;}
  }

/* ============================================================

============================================================ */
let _errShown = false;
function showGlobalError(msg){
  if(_errShown) return; _errShown = true;
  const el = document.createElement('div');
  el.className = 'err-overlay';
  el.innerHTML = `⚠️ ${escapeHtml(msg)}<br><button id="err-dismiss">Fechar</button>`;
  document.body.appendChild(el);
  el.querySelector('#err-dismiss').onclick = ()=>{ el.remove(); _errShown = false; };
  setTimeout(()=>{ if(el.parentElement){ el.remove(); _errShown = false; } }, 8000);
}
window.addEventListener('error', e=>{ console.error('[86gym]', e.error || e.message); showGlobalError((e.error && e.error.message) || 'Algo deu errado.'); });
window.addEventListener('unhandledrejection', e=> console.error('[86gym promise]', e.reason));

  token:'86gym_gist_token', id:'86gym_gist_id', lastSync:'86gym_gist_last_sync',

const safeGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const safeSet = (k,v) => { try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };
const safeDel = k => { try{ localStorage.removeItem(k); }catch(e){} };
const safeJSON = (k,f) => { try{ const r = safeGet(k); return r ? JSON.parse(r) : f; }catch(e){ return f; } };
function migrate(){ LEGACY_KEYS.forEach(safeDel); }

const IDB = {
  db:null,
  async open(){
    if(this.db) return this.db;
    return new Promise((res, rej)=>{
      const req = indexedDB.open(KEYS.idb, 1);
      req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv', {keyPath:'k'}); };
      req.onsuccess = ()=>{ this.db = req.result; res(this.db); };
      req.onerror = ()=> rej(req.error);
    });
  },
  async get(k){ try{ const db = await this.open(); return new Promise(res=>{ const tx = db.transaction('kv','readonly').objectStore('kv').get(k); tx.onsuccess=()=>res(tx.result?tx.result.v:null); tx.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db = await this.open(); return new Promise(res=>{ const tx = db.transaction('kv','readwrite').objectStore('kv').put({k,v}); tx.onsuccess=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } },
  async del(k){ try{ const db = await this.open(); return new Promise(res=>{ const tx = db.transaction('kv','readwrite').objectStore('kv').delete(k); tx.onsuccess=()=>res(true); tx.onerror=()=>res(false); }); }catch(e){ return false; } }
};

  const p = safeJSON(KEYS.perfil, null) || {};
  if(!p.pesos) p.pesos = [];
  if(!p.medidas) p.medidas = [];
  if(!p.periodicidadeDias) p.periodicidadeDias = 14;
  if(!p.metaTreinos) p.metaTreinos = 4;
  if(p.metaPeso === undefined) p.metaPeso = null;
  if(p.altura === undefined) p.altura = null;
  if(p.idade === undefined) p.idade = null;
  if(!p.sexo) p.sexo = 'M';
  if(!p.objetivo) p.objetivo = 'manutencao';
  if(!p.avatar) p.avatar = null;
  return p;
}

function loadSettings(){
  const s = safeJSON(KEYS.settings, {});
  const defaults = {
    theme:'dark', themeAuto:false, sound:true, vibrate:true, pausaAuto:true,
    warmupAtivado:true, compactExec:true, notif:false, backupReminder:true, autoBackup:true,
    barWeight:20, restWarmup:30, restDrop:10, notifBackground:true

  for(const k in defaults){ if(s[k]===undefined) s[k] = defaults[k]; }
  return s;

function translateExerciseName(en){
  if(!en) return en;
  const lower = String(en).toLowerCase().trim();
  if(PT_NAME_DICT[lower]) return PT_NAME_DICT[lower];
  let out = en;
  const compounds = Object.keys(PT_NAME_DICT).filter(k=>k.includes(' ')).sort((a,b)=>b.length-a.length);
  for(const c of compounds){
    const re = new RegExp('\\b' + c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','gi');
    if(re.test(out)) out = out.replace(re, PT_NAME_DICT[c]);
  }
  const words = Object.keys(PT_WORDS).sort((a,b)=>b.length-a.length);
  for(const w of words){
    const re = new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','gi');
    out = out.replace(re, PT_WORDS[w]);
  }
  out = out.trim().replace(/\s+/g,' ');
  return out.charAt(0).toUpperCase() + out.slice(1);
}

let CUSTOM_EXERCISES = loadCustomExercises();
function allExerciseGroups(){
  const groups = GROUP_ORDER.map(g=> [g, EXERCISE_DB.filter(ex=>ex.group===g).map(ex=>ex.name)]).filter(([,l])=>l.length);
  if(CUSTOM_EXERCISES.length){
    const byGroup = {};
    CUSTOM_EXERCISES.forEach(c=>{ const g = (c.group && c.group.trim()) ? c.group.trim() : 'Personalizados'; (byGroup[g] = byGroup[g]||[]).push(c.name); });
    Object.keys(byGroup).forEach(g=>{
      const idx = groups.findIndex(([gg])=>gg===g);
      if(idx>=0) groups[idx][1] = groups[idx][1].concat(byGroup[g]);
      else groups.push([g, byGroup[g]]);
    });
  }
  return groups;
}
function exerciseFlat(){ const flat = []; allExerciseGroups().forEach(([g,l])=> l.forEach(n=> flat.push({name:n, group:g}))); return flat; }
function exerciseGroup(name){ const f = exerciseFlat().find(e=> e.name.toLowerCase()===String(name).toLowerCase()); return f ? f.group : 'Personalizado'; }
function isCustomExercise(name){ return CUSTOM_EXERCISES.some(c=> c.name.toLowerCase() === String(name).toLowerCase()); }
function exerciseData(name){ return EXERCISE_BY_NAME.get(String(name||'').toLowerCase().trim()) || null; }
function exerciseImages(name){
  const d = exerciseData(name);
  if(!d || !d.images || !d.images.length) return [];
  return d.images.map(p=> EXERCISE_IMG_BASE + p);

function exerciseThumb(name, size){
  const imgs = exerciseImages(name);
  const cls = 'ex-thumb' + (size === 'sm' ? ' sm' : size === 'lg' ? ' lg' : '');
  const initial = escapeHtml((name||'?').trim().charAt(0).toUpperCase());
  if(imgs.length){
    const src = escapeHtml(imgs[0]);
    return `<div class="${cls}"><img src="${src}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">` +
           `<span class="ex-thumb-fallback" style="display:none;">${initial}</span></div>`;
  }
  return `<div class="${cls}"><span class="ex-thumb-fallback">${initial}</span></div>`;
}

function normalizeStr(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function fuzzyFindExercise(input){
  const q = normalizeStr(input); if(!q) return null;
  const flat = exerciseFlat();
  for(const e of flat){ if(normalizeStr(e.name) === q) return e; }
  for(const e of flat){ if(normalizeStr(e.name).includes(q)) return e; }
  const qTokens = q.split(' ').filter(Boolean);
  let best = null, bestScore = 0;
  for(const e of flat){
    const n = normalizeStr(e.name);
    let score = 0;
    for(const t of qTokens){ if(n.includes(t)) score++; }
    if(score > bestScore && score >= Math.max(2, qTokens.length*0.6)){ best = e; bestScore = score; }
  }
  return best;
}

function getEDBKey(){ return safeGet(KEYS.edbKey) || EDB_KEY_DEFAULT; }
function setEDBKey(k){ if(k) safeSet(KEYS.edbKey, k); else safeDel(KEYS.edbKey); }

async function syncExerciseDBFull(onProgress){
  const key = getEDBKey();
  if(!key) throw new Error('Configure a chave RapidAPI primeiro');

  const PAGE = 10; // plano Free aceita no máximo 10 por request
  let offset = 0;
  let all = [];
  const MAX_PAGES = 200; // trava de segurança

  for(let page = 0; page < MAX_PAGES; page++){
    const url = `https://exercisedb.p.rapidapi.com/exercises?limit=${PAGE}&offset=${offset}`;
    const r = await fetch(url, {
      headers: {
        'X-RapidAPI-Key': key,
        'X-RapidAPI-Host': 'exercisedb.p.rapidapi.com'
      }
    });

    if(r.status === 429) throw new Error('Limite de requisições atingido. Aguarde o reset mensal.');
    if(r.status === 403) throw new Error('Chave inválida ou não inscrita no plano Free.');
    if(r.status === 401) throw new Error('Chave não reconhecida. Confira se copiou corretamente.');
    if(!r.ok) throw new Error(`Falha HTTP ${r.status} na página ${page+1}`);

    const data = await r.json();
    if(!Array.isArray(data) || data.length === 0) break;
    all = all.concat(data);
    if(onProgress) onProgress(all.length);

    if(data.length < PAGE) break;

    offset += PAGE;
    await new Promise(res => setTimeout(res, 220)); // rate limit protection
  }

  if(!all.length) throw new Error('Nenhum exercício retornado.');

  await IDB.set(KEYS.edbCache, { ts: Date.now(), count: all.length, items: all });
  return all.length;
}

async function getEDBCacheInfo(){
  try{
    const c = await IDB.get(KEYS.edbCache);
    if(!c || !c.items) return null;
    return { ts: c.ts, count: c.count };
  }catch(e){ return null; }
}

async function findEDBItem(name){
  try{
    const c = await IDB.get(KEYS.edbCache);
    if(!c || !Array.isArray(c.items)) return null;
    const target = normalizeStr(name);
    if(!target) return null;

    for(const ex of c.items){ if(normalizeStr(ex.name) === target) return ex; }
    for(const ex of c.items){ const n = normalizeStr(ex.name); if(n.includes(target) || target.includes(n)) return ex; }

    const tT = target.split(' ').filter(Boolean);
    let best = null, bestScore = 0;
    for(const ex of c.items){
      const nT = normalizeStr(ex.name).split(' ').filter(Boolean);
      let score = 0;
      tT.forEach(t=>{ if(nT.includes(t)) score++; });
      if(score > bestScore && score >= Math.max(2, tT.length * 0.6)){ best = ex; bestScore = score; }
    }
    return best;
  }catch(e){ return null; }
}

let _swRegistration = null;
async function initServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol === 'file:') return;
  try{
    const swCode = `
      self.addEventListener('message', function(e){
        if(e.data && e.data.type === 'scheduleNotification'){
          var delay = e.data.endTime - Date.now();
          if(delay < 0) delay = 0;
          setTimeout(function(){
            self.registration.showNotification(e.data.title || 'Descanso terminou', {
              body: e.data.body || 'Hora da próxima série',
              tag: '86gym-rest', renotify: true,
              vibrate: [200,100,200,100,200]
            });
          }, delay);
        }
      });
      self.addEventListener('notificationclick', function(e){
        e.notification.close();
        e.waitUntil(clients.matchAll({type:'window'}).then(function(cs){
          for(var i=0;i<cs.length;i++){ if('focus' in cs[i]) return cs[i].focus(); }
          if(clients.openWindow) return clients.openWindow('./');
        }));
      });
    `;
    const blob = new Blob([swCode], {type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    _swRegistration = await navigator.serviceWorker.register(url, { scope: './' });
  }catch(e){ console.warn('[86gym] SW falhou', e); }
}
async function requestNotificationPermission(){
  if(!('Notification' in window)) return false;
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied') return false;
  return (await Notification.requestPermission()) === 'granted';
}
function notifyRestEnd(exName){
  if(!loadSettings().notif) return;
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      if(_swRegistration && _swRegistration.active){
        _swRegistration.active.postMessage({ type:'scheduleNotification', endTime: Date.now() + 50, title:'Descanso terminou', body: (exName||'') + ' — próxima série!' });
      } else {
        const n = new Notification('Descanso terminou', { body: (exName||'') + ' — próxima série!', tag:'86gym-rest' });
        setTimeout(()=> n.close(), 8000);
      }
    }
  }catch(e){}
  safeDel(KEYS.pendingNotif);
}

function playBeep(times=2){
  if(!loadSettings().sound) return;
  if(_beepGuard) return; _beepGuard = true;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx){ _beepGuard = false; return; }
    if(!_sharedAudioCtx || _sharedAudioCtx.state === 'closed') _sharedAudioCtx = new Ctx();
    const ctx = _sharedAudioCtx;
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    for(let i=0;i<times;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = 880;
      const st = now + i*0.22;
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(0.25, st+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, st+0.18);
      o.start(st); o.stop(st+0.2);
    }
    setTimeout(()=>{ _beepGuard = false; }, times*220 + 400);
  }catch(e){ _beepGuard = false; }
}

function buildSvgLineChart(points, opts={}){
  const w = opts.width||300, h = opts.height||130, pad = 30;
  if(!points || !points.length) return `<div style="color:var(--muted); font-size:12.5px; text-align:center; padding:20px 0;">Ainda não há dados suficientes.</div>`;
  if(points.length===1) points = [points[0], points[0]];
  const ys = points.map(p=>p.y);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if(minY===maxY){ minY -= 1; maxY += 1; }
  const stepX = (w - pad*2) / (points.length-1);
  const scaleY = v => h - pad - ((v-minY)/(maxY-minY)) * (h - pad*2 - 12);
  const coords = points.map((p,i)=> [pad + i*stepX, scaleY(p.y)]);
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=> `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#C9FF4D"/>`).join('');
  const fL = points[0].x, lL = points[points.length-1].x;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="#C9FF4D" stroke-width="2.5"/>
    ${dots}
    <text x="${pad}" y="${h-6}" fill="var(--muted)" font-size="10" font-family="Inter">${escapeHtml(fL)}</text>
    <text x="${w-pad}" y="${h-6}" fill="var(--muted)" font-size="10" font-family="Inter" text-anchor="end">${escapeHtml(lL)}</text>
    <text x="${pad}" y="14" fill="var(--text)" font-size="11" font-family="Inter" font-weight="700">${maxY}${opts.unit||''}</text>
    <text x="${pad}" y="${h-pad-4}" fill="var(--text)" font-size="11" font-family="Inter" font-weight="700">${minY}${opts.unit||''}</text>
  </svg>`;
}

function cargaHistoryFor(name){
  const rows = [];
  DB.historico.filter(h=> h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(e.nome && e.nome.toLowerCase()===String(name).toLowerCase() && e.setsFeitas>0){
        rows.push({ x: dateShort(h.data), y: Number(e.carga)||0, ts:h.data, setsFeitas:e.setsFeitas, setsTotal:e.setsTotal, repsMedias:e.repsMedias||0 });
      }
    });
  });
  rows.sort((a,b)=> a.ts-b.ts);
  return rows;
}
function lastSessionFor(name, treinoNome, divisaoLetra){
  let pool = DB.historico.filter(h=>h.tipo==='forca')
    .filter(h=> (h.exercicios||[]).some(e=> e.nome && e.nome.toLowerCase()===String(name).toLowerCase() && e.setsFeitas>0));
  if(treinoNome){
    const same = pool.filter(h=> h.treinoNome === treinoNome && (!divisaoLetra || h.divisaoLetra === divisaoLetra));
    if(same.length) pool = same;
  }
  pool.sort((a,b)=> b.data - a.data);
  if(!pool.length) return null;
  const h = pool[0];
  const e = h.exercicios.find(e=> e.nome.toLowerCase()===String(name).toLowerCase());
  return { ts:h.data, ex:e, treinoNome:h.treinoNome, divisaoLetra:h.divisaoLetra };
}
function lastNRIRsFor(name, n=3){
  const hist = DB.historico.filter(h=>h.tipo==='forca')
    .filter(h=> (h.exercicios||[]).some(e=> e.nome && e.nome.toLowerCase()===String(name).toLowerCase() && e.setsFeitas>0))
    .sort((a,b)=> b.data - a.data).slice(0, n);
  return hist.map(h=>{
    const e = h.exercicios.find(e=> e.nome.toLowerCase()===String(name).toLowerCase());
    const rirs = (e.setsDetalhados||[]).filter(s=> s.done && !s.warmup && s.rir !== null && s.rir !== undefined).map(s=> Number(s.rir));
    return rirs.length ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  }).filter(x=> x !== null);
}
function leavingRepsInTank(name){
  const rirs = lastNRIRsFor(name, 3);
  if(rirs.length < 3) return false;
  return rirs.every(r=> r >= 3);
}
function bestSetFor(name){
  let best = null;
  DB.historico.filter(h=>h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(e.nome && e.nome.toLowerCase()===String(name).toLowerCase()){
        (e.setsDetalhados||[]).forEach(s=>{
          if(!s.done || s.warmup) return;
          const c = Number(s.carga)||0, r = Number(s.repeticoes)||0;
          if(c<=0 || r<=0) return;
          const oneRm = c*(1+r/30);
          if(!best || oneRm>best.oneRm) best = {carga:c, reps:r, oneRm, ts:h.data};
        });
      }
    });
  });
  return best;
}
function isStagnant(name, weeks=3){
  const h = cargaHistoryFor(name);
  if(h.length<weeks) return false;
  const recent = h.slice(-weeks);
  return recent[recent.length-1].y <= recent[0].y && (Date.now() - h[h.length-1].ts) < 14*86400000;
}
function suggestProgression(name){
  const last = lastSessionFor(name);
  if(!last) return null;
  const ex = last.ex;
  const repsAlvo = Number(ex.repsMedias)||0;
  const leaving = leavingRepsInTank(name);
  if(ex.setsFeitas === ex.setsTotal && ex.setsFeitas > 0){
    if(leaving) return { tipo:'up', carga: ex.carga + Math.max(2.5, Math.round((ex.carga*0.05)/2.5)*2.5), reps: Math.round(repsAlvo*0.8), atual: ex.carga, motivo:'RIR alto por 3 sessões — suba carga' };
    if(repsAlvo < 12) return { tipo:'reps', reps: Math.min(repsAlvo+2, 20), atual: ex.carga, motivo:'Complete todas as séries; sobe reps' };
    const next = Math.max(2.5, Math.round((ex.carga*0.05)/2.5)*2.5);
    return { tipo:'up', carga: ex.carga + next, atual: ex.carga, reps: Math.round(repsAlvo*0.8), motivo:'Bateu o teto de reps; sobe carga' };
  }
  if(ex.setsFeitas < ex.setsTotal * 0.7) return { tipo:'down', carga: Math.max(0, ex.carga - 2.5), atual: ex.carga, motivo:'Falhou em várias séries' };
  return null;
}
function suggText(sugg){
  if(!sugg) return '';
  if(sugg.tipo === 'up')   return `${sugg.carga}kg × ${sugg.reps}`;
  if(sugg.tipo === 'reps') return `${sugg.reps} reps @ ${sugg.atual}kg`;
  if(sugg.tipo === 'down') return `reduzir para ${sugg.carga}kg`;

}
function calcWarmup(c){

  const round = v => Math.max(0, Math.round(v/2.5)*2.5);

}
function calcPlates(target){
  const bar = Number(loadSettings().barWeight) || 20;
  const num = Number(target); if(!num || num < bar) return null;
  const perSide = (num - bar) / 2;
  const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
  let rem = perSide; const used = [];
  for(const p of plates){ const n = Math.floor(rem / p + 0.0001); if(n > 0){ used.push({p, n}); rem = +(rem - n*p).toFixed(2); } }
  return { perSide, used, resto: rem, bar };
}

function isoWeek(d){
  const date = new Date(d); date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - ((date.getDay()+6)%7));
  const week1 = new Date(date.getFullYear(),0,4);
  const wk = 1 + Math.round(((date - week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
  return date.getFullYear()+'-'+wk;
}
function computeStreak(){
  if(!DB.historico.length) return 0;
  const weeks = new Set(DB.historico.map(h=>isoWeek(h.data)));
  const cursor = new Date();
  if(!weeks.has(isoWeek(cursor))) cursor.setDate(cursor.getDate()-7);
  let streak = 0;
  while(weeks.has(isoWeek(cursor)) && streak<500){ streak++; cursor.setDate(cursor.getDate()-7); }
  return streak;
}

function pushPullBalance(){
  const m = Date.now() - 30*86400000;
  const push = new Set(['Peito','Ombros','Tríceps']); const pull = new Set(['Costas','Bíceps']);
  let pv = 0, pu = 0;
  DB.historico.filter(h=> h.data>=m && h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      const g = exerciseGroup(e.nome);
      const vol = (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0);
      if(push.has(g)) pv += vol; else if(pull.has(g)) pu += vol;
    });
  });
  if(!pv || !pu) return null;
  const r = pv/pu;
  if(r > 1.3) return { msg:`Você empurra ${Math.round((r-1)*100)}% mais que puxa` };
  if(r < 0.77) return { msg:`Você puxa ${Math.round((1/r-1)*100)}% mais que empurra` };
  return null;
}
function calcTMB(){
  const p = loadPerfil();
  if(!p.altura || !p.idade || !p.pesos.length) return null;
  const peso = p.pesos[p.pesos.length-1].peso;
  const base = 10*peso + 6.25*p.altura - 5*p.idade;
  const tmb = p.sexo === 'M' ? base + 5 : base - 161;
  const treinosSemana = DB.historico.filter(h=> h.data >= Date.now()-7*86400000 && h.tipo==='forca').length;
  const fator = treinosSemana >= 5 ? 1.725 : treinosSemana >= 3 ? 1.55 : treinosSemana >= 1 ? 1.375 : 1.2;
  const tdee = tmb * fator;
  const objetivo = p.objetivo || 'manutencao';
  let alvo = tdee;
  if(objetivo === 'cutting') alvo = tdee - 500;
  if(objetivo === 'bulking') alvo = tdee + 350;
  return { peso, tmb: Math.round(tmb), tdee: Math.round(tdee), alvo: Math.round(alvo) };
}

/* ============================================================
   ROUTER
============================================================ */
let ROUTE = { name:'treinar', params:{} };
const TABS = [
  {key:'treinar', label:'Treinar', icon:'play'},
  {key:'historico', label:'Histórico', icon:'history'},
  {key:'exercicios', label:'Exercícios', icon:'dumbbell'},
  {key:'perfil', label:'Perfil', icon:'person'}
];
function go(name, params={}){ ROUTE = {name, params}; render(); document.getElementById('view').scrollTop = 0; }
function renderTabbar(){
  const tb = document.getElementById('tabbar');
  tb.innerHTML = TABS.map(t=>`<button class="${ROUTE.name===t.key?'active':''}" data-tab="${t.key}">${ICONS[t.icon]}<span>${t.label}</span></button>`).join('');
  tb.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=> go(b.dataset.tab)));
}
function applyTheme(){
  const s = loadSettings();
  let theme = s.theme;
  if(s.themeAuto){ const h = new Date().getHours(); theme = (h>=20 || h<7) ? 'dark' : 'light'; }
  document.documentElement.setAttribute('data-theme', theme);
  const tc = document.querySelector('meta[name=theme-color]');
  if(tc) tc.setAttribute('content', theme==='light'?'#FAF9F5':'#0A0B0D');
}
function render(){
  applyTheme();
  renderTabbar();
  const view = document.getElementById('view');
  try{
    if(ROUTE.name==='treinar') view.innerHTML = TreinarScreen();
    else if(ROUTE.name==='historico') view.innerHTML = HistoricoScreen();
    else if(ROUTE.name==='exercicios') view.innerHTML = ExerciciosScreen();
    else if(ROUTE.name==='perfil') view.innerHTML = PerfilScreen();
    else if(ROUTE.name==='treinos') view.innerHTML = TreinosListScreen();
    else if(ROUTE.name==='treino_form') view.innerHTML = TreinoFormScreen(ROUTE.params.id);
    else if(ROUTE.name==='treino_exec') view.innerHTML = ExecucaoScreen(ROUTE.params.treinoId, ROUTE.params.divisaoId);
    else if(ROUTE.name==='cardio') view.innerHTML = CardioListScreen();
    else if(ROUTE.name==='cardio_form') view.innerHTML = CardioFormScreen(ROUTE.params.id);
    else if(ROUTE.name==='cardio_exec') view.innerHTML = CardioExecScreen(ROUTE.params.cardioId);
    else view.innerHTML = TreinarScreen();
  }catch(err){
    console.error('[86gym render]', err);
    view.innerHTML = `<div class="empty">${ICONS.empty}<div>Erro ao carregar. Recarregue o app.</div></div>`;
  }
  bindScreenEvents();
  updateFAB();
  if(ROUTE.name==='treino_exec' || ROUTE.name==='cardio_exec') requestWakeLock();
  else releaseWakeLock();
}

/* ============================================================
   FAB
============================================================ */
function updateFAB(){
  const fab = document.getElementById('fab-action');
  if(!fab) return;
  if(_fabInterval){ clearInterval(_fabInterval); _fabInterval = null; }
  const onExec = ROUTE.name === 'treino_exec';

  if(SESSION && !onExec){
    const isRest = SESSION.timer && SESSION.timer.running;
    const urgent = isRest && SESSION.timer.secondsLeft <= 10;
    fab.className = 'fab-action show rest' + (urgent ? ' urgent' : '');
    fab.innerHTML = `
      ${isRest
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/></svg>'
      }
      <span class="fab-time" id="fab-time">${isRest ? formatSeconds(SESSION.timer.secondsLeft) : formatSeconds(sessionElapsedSeconds())}</span>
    `;
    fab.onclick = ()=> go('treino_exec', {treinoId:SESSION.treinoId, divisaoId:SESSION.divisaoId});
    _fabInterval = setInterval(()=>{
      const t = document.getElementById('fab-time');
      const f = document.getElementById('fab-action');
      if(!t || !f) return;
      if(SESSION && SESSION.timer && SESSION.timer.running){
        t.textContent = formatSeconds(SESSION.timer.secondsLeft);
        f.classList.toggle('urgent', SESSION.timer.secondsLeft <= 10);
      } else if(SESSION){
        t.textContent = formatSeconds(sessionElapsedSeconds());
      } else {
        clearInterval(_fabInterval); _fabInterval = null; updateFAB();
      }
    }, 500);
    return;
  }

  if(!SESSION && DB.cardios.length > 0 && ROUTE.name !== 'cardio' && ROUTE.name !== 'cardio_exec' && ROUTE.name !== 'cardio_form'){
    fab.className = 'fab-action show cardio';
    fab.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.5 7-6.5 0-3-2-5-3-7-.3 2-1.3 3-2 3 .5-3-1-6-4-7.5.5 2.5-.5 4.5-2 6-1.2 1.2-3 3-3 5.5C5 19.5 8 22 12 22z"/></svg>
      <span>Cardio</span>
    `;
    fab.onclick = ()=> go('cardio');
    return;
  }

  fab.classList.remove('show');
}

/* ============================================================
   MODAIS
============================================================ */
function openModal(html, opts={}){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal-box">${html}</div>`;
  document.body.appendChild(bg);
  if(opts.dismissable!==false) bg.addEventListener('click', e=>{ if(e.target===bg) closeModal(bg); });
  return bg;
}
function closeModal(bg){ if(bg && bg.parentElement) bg.remove(); }
function confirmDialog(msg, {title='Confirmar', okText='Confirmar', danger=false}={}){
  return new Promise(resolve=>{
    const bg = openModal(`
      <h3 style="margin-bottom:10px;">${escapeHtml(title)}</h3>
      <p style="color:var(--muted); font-size:14px; margin:0 0 20px 0; line-height:1.5;">${escapeHtml(msg)}</p>
      <div class="row"><button class="btn secondary" id="cf-no" style="flex:1;">Cancelar</button><button class="btn ${danger?'danger':''}" id="cf-yes" style="flex:1;">${escapeHtml(okText)}</button></div>`, {dismissable:false});
    bg.querySelector('#cf-no').onclick = ()=>{ closeModal(bg); resolve(false); };
    bg.querySelector('#cf-yes').onclick = ()=>{ closeModal(bg); resolve(true); };
  });
}
function promptDialog(msg, {title='', defaultValue='', placeholder=''}={}){
  return new Promise(resolve=>{
    const bg = openModal(`
      <h3 style="margin-bottom:10px;">${escapeHtml(title||msg)}</h3>
      ${title? `<p style="color:var(--muted); font-size:13px; margin:0 0 8px 0;">${escapeHtml(msg)}</p>`:''}
      <input type="text" id="pm-input" value="${escapeHtml(defaultValue)}" placeholder="${escapeHtml(placeholder)}">
      <div class="row" style="margin-top:16px;"><button class="btn secondary" id="pm-no" style="flex:1;">Cancelar</button><button class="btn" id="pm-yes" style="flex:1;">OK</button></div>`, {dismissable:false});
    const inp = bg.querySelector('#pm-input');
    setTimeout(()=> inp.focus(), 80);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ resolve(inp.value); closeModal(bg); } });
    bg.querySelector('#pm-no').onclick = ()=>{ closeModal(bg); resolve(null); };
    bg.querySelector('#pm-yes').onclick = ()=>{ const v = inp.value; closeModal(bg); resolve(v); };
  });
}
function textareaDialog(msg, {title='', defaultValue='', placeholder=''}={}){
  return new Promise(resolve=>{
    const bg = openModal(`
      <h3 style="margin-bottom:10px;">${escapeHtml(title||msg)}</h3>
      ${title? `<p style="color:var(--muted); font-size:13px; margin:0 0 8px 0;">${escapeHtml(msg)}</p>`:''}
      <textarea id="ta-input" placeholder="${escapeHtml(placeholder)}" style="min-height:140px; font-family:monospace; font-size:13px;">${escapeHtml(defaultValue)}</textarea>
      <div class="row" style="margin-top:16px;"><button class="btn secondary" id="ta-no" style="flex:1;">Cancelar</button><button class="btn" id="ta-yes" style="flex:1;">OK</button></div>`, {dismissable:false});
    const inp = bg.querySelector('#ta-input');
    setTimeout(()=> inp.focus(), 80);
    bg.querySelector('#ta-no').onclick = ()=>{ closeModal(bg); resolve(null); };
    bg.querySelector('#ta-yes').onclick = ()=>{ const v = inp.value; closeModal(bg); resolve(v); };
  });
}

/* ============================================================
   WAKE LOCK
============================================================ */
async function requestWakeLock(){
  try{ if('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock = null; }); } }catch(e){}
}
function releaseWakeLock(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    if(ROUTE.name==='treino_exec' || ROUTE.name==='cardio_exec') requestWakeLock();
    checkPendingNotification();
    updateFAB();
  }
  if(document.visibilityState==='hidden'){
    autoBackup(false);
    const cfg = loadGistConfig();
    if(cfg.enabled && cfg.autoSync && cfg.token && cfg.id && !_suppressGistSync) gistPush().catch(()=>{});
  }
});

/* ============================================================
   TELA PRINCIPAL
============================================================ */
function TreinarScreen(){
  const p = loadPerfil();
  const last = p.pesos.length ? p.pesos[p.pesos.length-1] : null;
  const caption = last ? `${last.peso} kg · ${dateShort(last.data)}` : 'Toque para registrar';
  const streakDias = computeStreakDays();
  const streak = computeStreak();
  const weekCount = DB.historico.filter(h=> h.tipo==='forca' && h.data >= Date.now()-7*86400000).length;
  const meta = p.metaTreinos || 4;
  const metaPct = Math.min(100, Math.round(weekCount/meta*100));
  const saved = loadPersistedSession();
  const hojeRest = isRestDay();
  const next = suggestNextWorkout();
  const cardioSug = suggestCardio();
  const deloadAtivo = isDeloadActive();

  const alertas = [];
  const over = detectOvertraining();
  if(over) alertas.push({ icon:'⚠️', title: over.tipo==='up'?'Volume subiu muito':'Volume caindo', sub: over.msg });
  const imbalance = pushPullBalance();
  if(imbalance) alertas.push({ icon:'⚖️', title:'Desequilíbrio empurrar/puxar', sub: imbalance.msg });
  const deload = suggestDeload();
  if(deload && !deloadAtivo) alertas.push({ icon:'💡', title:'Deload sugerido', sub: deload.motivo, action:'apply-deload' });
  const atrasados = [];
  ['Peito','Costas','Ombros','Bíceps','Tríceps','Pernas','Glúteos','Abdômen','Panturrilha'].forEach(g=>{
    const lastT = lastTrainingOfGroup(g);
    if(!lastT) atrasados.push({g, dias:'nunca'});
    else { const d = Math.floor((Date.now()-lastT)/86400000); if(d >= 7) atrasados.push({g, dias:d+'d'}); }
  });
  if(atrasados.length) alertas.push({ icon:'📅', title:'Grupos atrasados', sub: atrasados.map(a=>`${a.g} (${a.dias})`).join(' · ') });

  const sugestoes = [];
  const ultimos = [...new Set(DB.historico.filter(h=>h.tipo==='forca').slice(-6).flatMap(h=> (h.exercicios||[]).map(e=>e.nome)))].slice(0,3);
  ultimos.forEach(n=>{ const sg = suggestProgression(n); if(sg && (sg.tipo==='up' || sg.tipo==='reps')) sugestoes.push({n, s:sg}); });

  const learning = nextLearningStep();
  const gistCfg = loadGistConfig();
  const gistBadge = !gistCfg.enabled ? '' : (!gistCfg.lastSync ? 'syncing' : ((Date.now() - gistCfg.lastSync) < 120000 ? 'ok' : ''));

  return `
  <div class="hero">
    <div class="streak-chip ${streakDias<1?'off':''}">🔥 ${streakDias}</div>
    <div class="brandmark">
      <div class="plate-badge"><span class="pnum">86</span><span class="pkg">TG</span></div>
      <div class="wordmark-gym">TRAINING &<br><span class="accent">GRIND</span></div>
    </div>
    <div class="bar-divider"></div>
    <div class="tagline">Monte divisões, registre cargas, acompanhe padrões.</div>
  </div>

  <div class="profile-strip" id="open-profile" role="button" tabindex="0">
    <div class="avatar-wrap">
      <div class="avatar-circle">${p.avatar? `<img src="${p.avatar}" alt="Avatar">` : ICONS.person}</div>
      ${(!p.pesos.length || (Date.now()-p.pesos[p.pesos.length-1].data)/86400000 >= (p.periodicidadeDias||14)) ? '<span class="avatar-badge"></span>' : ''}
    </div>
    <div class="info"><b>Seu peso</b><span>${caption}</span></div>
    <div class="chev">${ICONS.chevron}</div>
  </div>

  ${gistCfg.enabled ? `<div class="card" style="padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px;">
    <span id="sync-badge" class="sync-badge ${gistBadge}"></span>
    <span style="font-size:12px; color:var(--muted); flex:1;">Sync ativa${gistCfg.lastSync ? ' · ' + new Date(gistCfg.lastSync).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : ''}</span>
    <button class="btn mini secondary" id="home-sync-now" style="padding:4px 10px;">Sincronizar</button>
  </div>` : ''}

  <div class="stat-grid">
    <button class="stat-box" data-stat-go="historico"><div class="v">${DB.historico.filter(h=>h.tipo==='forca').length}</div><div class="l">Treinos</div></button>
    <button class="stat-box" data-stat-go="perfil-an"><div class="v">${streak}</div><div class="l">Sem. seguidas</div></button>
    <button class="stat-box" data-stat-go="treinar"><div class="v">${weekCount}/${meta}</div><div class="l">Meta semanal</div></button>
  </div>

  ${deloadAtivo ? `<div class="card" style="border-left:3px solid var(--blue);">
    <div style="display:flex;gap:10px;align-items:center;">
      <div style="width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;">${ICONS.moon}</div>
      <div style="flex:1;"><b style="font-size:13px;">Deload ativo</b><div style="color:var(--muted);font-size:11.5px;">Séries reduzidas e descanso aumentado.</div></div>
      <button class="btn mini ghost" data-action="cancel-deload">Desativar</button>
    </div>

/* ============================================================
   CALENDÁRIO
============================================================ */
function renderCalendar(){
  const trained = new Set(DB.historico.filter(h=>h.tipo==='forca').map(h=> todayKey(h.data)));
  const restDays = loadRestDays();
  const first = new Date(CAL_YEAR, CAL_MONTH, 1);
  const lastDay = new Date(CAL_YEAR, CAL_MONTH+1, 0).getDate();
  const startWd = (first.getDay()+6)%7;
  const monthNames = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const hoje = todayKey();
  const cells = [];
  for(let i=0;i<startWd;i++) cells.push('');
  for(let d=1; d<=lastDay; d++){
    const dt = new Date(CAL_YEAR, CAL_MONTH, d);
    const k = todayKey(dt);
    const cls = trained.has(k) ? 'trained' : (restDays[k] ? 'rest' : '');
    cells.push(`<div class="cal-day ${cls} ${k===hoje?'today':''}" title="${k}">${d}</div>`);
  }
  return `<div class="card">
    <div class="cal-header">
      <button class="icon-btn mini" data-cal-prev>${ICONS.back}</button>
      <b>${monthNames[CAL_MONTH]} ${CAL_YEAR}</b>
      <button class="icon-btn mini" data-cal-next style="transform:rotate(180deg);">${ICONS.back}</button>
    </div>
    <div class="cal-weekdays"><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span></div>
    <div class="cal-grid">${cells.map(c=> c || '<div></div>').join('')}</div>
    <div style="display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--muted);">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--lime);border-radius:3px;vertical-align:middle;"></span> Treinou</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:3px;vertical-align:middle;"></span> Descanso</span>
    </div>
  </div>`;
}

/* ============================================================
   SESSÃO
============================================================ */
function buildSessionFromDivisao(treino, divisao){
  const deloadAtivo = isDeloadActive();
  return {
    treinoId: treino.id, divisaoId: divisao.id,
    treinoNome: treino.nome, divisaoLetra: divisao.letra,
    startTime: Date.now(), lastAction: Date.now(),
    paused: false, pausedSegundos: 0, pausedAt: null,
    isDeload: deloadAtivo,
    timer: { running:false, secondsLeft:0, exIdx:null, interval:null, total:0, endTime:null },
    exercicios: divisao.exercicios.map(ex=>({
      nome: ex.nome,
      descanso: deloadAtivo ? Math.round((Number(ex.descanso)||60)*1.5) : (Number(ex.descanso)||60),
      carga: (lastSessionFor(ex.nome)?.ex?.carga) ?? (Number(ex.carga)||0),
      repeticoes: Number(ex.repeticoes)||10,
      nota: ex.nota||'', grupo: (ex.grupo||'').toUpperCase(),
      rirAlvo: ex.rirAlvo!==undefined && ex.rirAlvo!=='' ? Number(ex.rirAlvo) : null,
      aquecimento: !!ex.aquecimento, dropSet: !!ex.dropSet, supersetId: ex.supersetId || null,
      sets: (()=>{
        const arr = [];
        if(ex.aquecimento) arr.push({ repeticoes: Math.max(6, Math.round((Number(ex.repeticoes)||10)*0.6)), carga: Math.max(0, Math.round(((Number(ex.carga)||0)*0.5)*2)/2), done:false, warmup:true, rir:null, falha:false, isDrop:false });
        const n = deloadAtivo ? Math.max(1, Math.round((Number(ex.series)||3)/2)) : (Number(ex.series)||1);
        const cargaBase = (lastSessionFor(ex.nome)?.ex?.carga) ?? (Number(ex.carga)||0);
        for(let i=0;i<n;i++) arr.push({ repeticoes: Number(ex.repeticoes)||10, carga: cargaBase, done:false, rir:null, falha:false, isDrop:false });
        return arr;
      })()
    }))
  };
}
function validateSession(s){
  if(!s || typeof s !== 'object') return false;
  if(!s.treinoId || !s.divisaoId || !s.startTime) return false;
  if(!Array.isArray(s.exercicios) || !s.exercicios.length) return false;
  return s.exercicios.every(ex => ex && typeof ex.nome === 'string' && Array.isArray(ex.sets));
}
function persistSession(){
  try{
    if(SESSION && validateSession(SESSION)){
      const copy = JSON.parse(JSON.stringify(SESSION, (k,v)=> k === 'interval' ? null : v));
      safeSet(KEYS.session, JSON.stringify(copy));
    } else safeSet(KEYS.session, 'null');
  }catch(e){ console.warn('[86gym] persistSession falhou', e); }
}
function loadPersistedSession(){
  const s = safeJSON(KEYS.session, null);
  if(!validateSession(s)) return null;
  if(Date.now() - s.startTime > 24*3600*1000) return null;
  if(s.timer) s.timer.interval = null;
  if(s.pausedAt) s.pausedAt = null;
  return s;
}
function pauseSession(){ if(!SESSION || SESSION.paused) return; SESSION.paused = true; SESSION.pausedAt = Date.now(); }
function resumeSession(){
  if(!SESSION || !SESSION.paused) return;
  if(SESSION.pausedAt){ SESSION.pausedSegundos = (SESSION.pausedSegundos||0) + (Date.now() - SESSION.pausedAt)/1000; SESSION.pausedAt = null; }
  SESSION.paused = false; lastActionTime = Date.now(); autoPaused = false;
}
function sessionElapsedSeconds(){
  if(!SESSION) return 0;
  const pausedMs = (SESSION.pausedSegundos||0)*1000 + (SESSION.pausedAt ? Date.now() - SESSION.pausedAt : 0);
  return Math.max(0, (Date.now() - SESSION.startTime - pausedMs)/1000);
}
function stopRestTimer(){
  if(_restTimerRef){ clearInterval(_restTimerRef); _restTimerRef = null; }
  if(SESSION && SESSION.timer){ SESSION.timer.running = false; SESSION.timer.exIdx = null; SESSION.timer.interval = null; SESSION.timer.endTime = null; SESSION.timer.secondsLeft = 0; }
  safeDel(KEYS.pendingNotif);
}
function startRestTimer(exi){
  const ex = SESSION.exercicios[exi];
  stopRestTimer();
  if(!ex.descanso || ex.descanso <= 0){ render(); return; }
  SESSION.timer.running = true;
  SESSION.timer.exIdx = exi;
  SESSION.timer.total = ex.descanso;
  SESSION.timer.endTime = Date.now() + ex.descanso * 1000;
  SESSION.timer.secondsLeft = ex.descanso;
  haptic('medium');
  render();
  _restTimerRef = setInterval(restTimerTick, 200);
  SESSION.timer.interval = _restTimerRef;
  scheduleRestNotification(SESSION.timer.endTime, ex.nome);
}
function restTimerTick(){
  if(!SESSION || !SESSION.timer || !SESSION.timer.running){ stopRestTimer(); return; }
  const t = SESSION.timer;
  if(!t.endTime){ stopRestTimer(); return; }
  const remaining = Math.max(0, Math.ceil((t.endTime - Date.now()) / 1000));
  t.secondsLeft = remaining;
  const numEl = document.getElementById('timer-num');
  if(numEl) numEl.textContent = formatSeconds(remaining);
  const fillEl = document.getElementById('timer-fill');
  if(fillEl && t.total) fillEl.style.width = Math.max(0, Math.min(100, (remaining / t.total) * 100)) + '%';
  if(remaining <= 0){
    stopRestTimer();
    haptic('success');
    vibrateRestEnd();
    playBeep(2);
    notifyRestEnd(SESSION ? SESSION.exercicios[t.exIdx]?.nome : '');
    render();
  }
}

function ExecucaoScreen(treinoId, divisaoId){
  const treino = DB.treinos.find(t=>t.id===treinoId);
  if(!treino) return `<div class="empty">Treino não encontrado.</div>`;
  const divisao = treino.divisoes.find(d=>d.id===divisaoId);
  if(!divisao) return `<div class="empty">Divisão não encontrada.</div>`;
  if(!SESSION || SESSION.treinoId!==treinoId || SESSION.divisaoId!==divisaoId){
    SESSION = buildSessionFromDivisao(treino, divisao);
    persistSession();
    startMediaSession(treino.nome + ' · ' + divisao.letra);
    collapsedExIdx = {};
  }
  const s = loadSettings();
  const compact = !!s.compactExec;
  const allDone = SESSION.exercicios.every(ex=> ex.sets.every(st=>st.done));

  let totalSets = 0, doneSets = 0;
  SESSION.exercicios.forEach(ex=>{ ex.sets.forEach(st=>{ if(!st.warmup){ totalSets++; if(st.done) doneSets++; } }); });
  const pct = totalSets ? Math.round(doneSets/totalSets*100) : 0;

  const ssLabels = {}; let ssLetter = 0; const seenSS = new Set();
  SESSION.exercicios.forEach(ex=>{
    if(ex.supersetId && !seenSS.has(ex.supersetId)){ seenSS.add(ex.supersetId); ssLabels[ex.supersetId] = 'SS-' + String.fromCharCode(65 + ssLetter++); }
  });

  const timerHtml = SESSION.timer.running ? `<div class="timer-banner" id="timer-banner">
    <div class="t-info">
      <div class="t-label">⏱ Descanso</div>
      <div class="t-ex">${escapeHtml(SESSION.exercicios[SESSION.timer.exIdx]?.nome||'')}</div>
    </div>
    <div class="t-num" id="timer-num">${formatSeconds(SESSION.timer.secondsLeft)}</div>
    <button class="t-stop" id="timer-skip" type="button">Pular</button>
    <div class="t-progress" id="timer-fill" style="width:${SESSION.timer.total? (SESSION.timer.secondsLeft/SESSION.timer.total*100):0}%"></div>
  </div>`:'';

  const exHtml = SESSION.exercicios.map((ex, exi)=>{
    const done = ex.sets.every(st=>st.done);
    const lastSess = lastSessionFor(ex.nome, SESSION.treinoNome, SESSION.divisaoLetra);
    let compareBadge = '';
    if(lastSess){
      const cargaAtual = ex.sets[0]?.carga || ex.carga;
      const diff = cargaAtual - Number(lastSess.ex.carga);
      if(diff > 0) compareBadge = `<span class="compare-badge up">↑ +${diff}kg</span>`;
      else if(diff < 0) compareBadge = `<span class="compare-badge down">↓ ${diff}kg</span>`;
      else compareBadge = `<span class="compare-badge same">=</span>`;
    }
    const sugg = suggestProgression(ex.nome);
    const stagnant = isStagnant(ex.nome);
    const leaving = leavingRepsInTank(ex.nome);
    const collapsed = compact && done && collapsedExIdx[exi] !== false;
    const ssLabel = ex.supersetId ? ssLabels[ex.supersetId] : null;
    const ssClass = ex.supersetId ? ('superset-' + ((Object.keys(ssLabels).indexOf(ex.supersetId) % 3) + 1)) : '';
    const eGrp = exerciseGroup(ex.nome);
    const injured = hasInjury(eGrp);

    const rows = ex.sets.map((st, si)=>{
      const prevDone = si===0 ? true : ex.sets[si-1].done;
      const lockedByTimer = SESSION.timer.running && SESSION.timer.exIdx===exi;
      const disabled = (!prevDone) || st.done || lockedByTimer;
      const e1rm = calcE1RM(st.carga, st.repeticoes);
      return `<tr class="${st.warmup ? 'warmup-row' : ''} ${st.falha ? 'fail-row' : ''}">
        <td style="white-space:nowrap;">
          ${st.warmup ? '<span style="font-weight:800;color:var(--orange);">A</span>' : (ex.sets.slice(0,si).filter(x=>!x.warmup).length + 1)}
          ${!st.warmup ? `<button class="icon-btn mini" style="padding:0;width:18px;height:18px;font-weight:800;" data-mark-warmup="${exi}:${si}" title="Marcar como aquecimento">A</button>` : `<button class="icon-btn mini" style="padding:0;width:18px;height:18px;" data-unmark-warmup="${exi}:${si}">A</button>`}
          <button class="icon-btn mini" style="padding:0;width:20px;height:20px;" data-copy-set="${exi}:${si}">${ICONS.copy}</button>
          ${!st.warmup ? `<button class="icon-btn mini" style="padding:0;width:20px;height:20px;" data-del-set="${exi}:${si}">✕</button>` : ''}
        </td>
        <td><input type="text" inputmode="numeric" data-set-field="repeticoes" data-exi="${exi}" data-si="${si}" value="${st.repeticoes}" ${st.done?'disabled':''}></td>
        <td>
          <div class="carga-wrap">
            <button type="button" class="carga-btn" data-carga-delta="${exi}:${si}:-2.5" ${st.done?'disabled':''}>−</button>
            <input type="text" inputmode="decimal" data-set-field="carga" data-exi="${exi}" data-si="${si}" value="${st.carga}" ${st.done?'disabled':''}>
            <button type="button" class="carga-btn" data-carga-delta="${exi}:${si}:2.5" ${st.done?'disabled':''}>+</button>
          </div>
          ${e1rm>0 ? `<div class="rm-preview">1RM ~ ${e1rm.toFixed(1)}kg</div>` : ''}
        </td>
        <td><input type="text" inputmode="numeric" data-set-field="rir" data-exi="${exi}" data-si="${si}" value="${st.rir ?? ''}" ${st.done?'disabled':''} style="width:42px;"></td>
        <td><input type="checkbox" data-set-field="falha" data-exi="${exi}" data-si="${si}" ${st.falha?'checked':''} ${st.done?'disabled':''} style="width:18px;height:18px;accent-color:var(--orange);"></td>
        <td><input type="checkbox" data-check-set="${exi}:${si}" ${st.done?'checked':''} ${disabled && !st.done ? 'disabled':''}></td>
      </tr>`;
    }).join('');
    const nextSet = ex.sets.find(st=> !st.done);
    const previewHtml = nextSet ? `<div style="font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;">
      <span style="color:var(--blue);font-weight:700;">▶ Próxima:</span>
      <b>${nextSet.carga}kg × ${nextSet.repeticoes}</b>${nextSet.rir!==null? ` · RIR ${nextSet.rir}`:''}
      <button class="btn mini secondary" data-repeat-last="${exi}" style="margin-left:auto;">Repetir anterior</button>
    </div>` : '';

    return `<div class="exec-ex-card ${done?'done':''} ${collapsed?'collapsed':''} ${ssClass}" data-exi="${exi}">
      <div class="exec-ex-head">
        <button class="toggle-btn" data-toggle-collapse="${exi}">${ICONS.chevronDown}</button>
        <div class="exec-ex-head">
  <button class="toggle-btn" data-toggle-collapse="${exi}">${ICONS.chevronDown}</button>
  ${exerciseThumb(ex.nome, 'sm')}
        <h3>
          ${ssLabel?`<span class="superset-badge">${ssLabel}</span>`:''}
          <span class="grp-chip" data-grp="${escapeHtml(eGrp)}">${escapeHtml(eGrp)}</span>
          ${escapeHtml(ex.nome)}
          ${injured?'<span class="banned-tag">EVITAR</span>':''}
          ${ex.dropSet? '<span class="grp-chip" data-grp="Outros" style="background:var(--orange);">DS</span>':''}
        </h3>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
          ${compareBadge}
          ${!ex.sets.some(st=>st.warmup) ? `<button class="icon-btn mini" data-gen-warmup="${exi}" title="Gerar aquecimento" style="color:var(--orange);">${ICONS.bolt}</button>` : ''}
          <button class="icon-btn mini" data-swap-ex="${exi}" title="Trocar">${ICONS.swap}</button>
          <button class="icon-btn mini" data-postpone-ex="${exi}" title="Adiar">${ICONS.arrowDown}</button>
          <div class="help-icon" data-help="${escapeHtml(ex.nome)}" role="button" tabindex="0">?</div>
        </div>
      </div>
      <div class="exec-body">
        ${lastSess ? `<div class="last-time-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;"><path d="M3 12a9 9 0 109-9"/><path d="M3 5v5h5"/><path d="M12 7v6l4 2"/></svg>
          Última: ${lastSess.ex.carga}kg × ${lastSess.ex.repsMedias||'-'} em ${dateShort(lastSess.ts)}
        </div>`:''}
        ${ex.nota? `<div style="font-size:11.5px;color:var(--muted);margin-top:4px;">📝 ${escapeHtml(ex.nota)}</div>`:''}
        ${stagnant? `<div class="stagnation-alert">⚠ Estagnado.</div>`:''}
        ${leaving? `<div class="suggestion-banner" style="margin-top:10px;font-size:12px;">${ICONS.star} Você está deixando reps na reserva — tente subir a carga.</div>`:''}
        ${sugg && !stagnant && !leaving? `<div class="suggestion-banner" style="margin-top:10px;font-size:12px;">${ICONS.star} Sugestão: <b>${suggText(sugg)}</b></div>`:''}
        <table class="set-table">
          <tr><th>Série</th><th>Reps</th><th>Carga</th><th>RIR</th><th>Falha</th><th>OK</th></tr>
          ${rows}
        </table>
        ${previewHtml}
        <button class="btn mini ghost" data-add-set="${exi}" style="margin-top:8px;">${ICONS.plus} Série</button>
      </div>
    </div>`;
  }).join('');
  const paused = SESSION.paused;
  return `
    <div class="top-actions">
      <button class="icon-btn" id="btn-exit-exec">${ICONS.back}</button>
      <h1 class="page-title" style="margin:0;font-size:17px;">${escapeHtml(treino.nome)} · ${escapeHtml(divisao.letra)}${SESSION.isDeload ? ' 🧊' : ''}</h1>
      <div style="width:38px;"></div>
    </div>
    <div class="session-clock">Tempo de treino<br><b id="session-clock-num">${formatSeconds(sessionElapsedSeconds())}</b>${paused?' <span class="paused-tag">· pausado</span>':''}
      ${paused? '<br><button class="resume-btn" id="btn-resume-session">Retomar treino</button>':''}
    </div>
    <div class="session-progress-bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="session-progress-lbl"><span>${doneSets}/${totalSets} séries</span><span>${pct}%</span></div>
    ${timerHtml}
    <div id="exec-container">${exHtml}</div>
    <button class="btn" id="btn-finalizar-treino" style="margin-top:10px;">${allDone? 'Finalizar treino ✓':'Finalizar treino'}</button>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <button class="btn mini ghost" id="btn-plank">${ICONS.bolt} Prancha</button>
    </div>`;
}
function startSessionClock(){
  clearInterval(clockInterval);
  const tick = ()=>{
    const el = document.getElementById('session-clock-num');
    if(!el || !SESSION){ clearInterval(clockInterval); return; }
    const s = loadSettings();
    if(s.pausaAuto && !SESSION.paused){
      const inativo = Date.now() - lastActionTime;
      if(inativo > 10*60*1000 && !autoPaused){ autoPaused = true; pauseSession(); persistSession(); render(); return; }
    }
    el.textContent = formatSeconds(sessionElapsedSeconds());
  };
  tick();
  clockInterval = setInterval(tick, 1000);
}

function editSessionModal(sessionId){
  const h = DB.historico.find(x=> x.id === sessionId);
  if(!h) return;
  const bg = openModal(`
    <button class="close-x">&times;</button>
    <h3 style="margin-bottom:4px;">Editar sessão</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">${escapeHtml(h.treinoNome)} · ${new Date(h.data).toLocaleDateString('pt-BR')}</p>
    <div id="edit-body">
      ${h.exercicios.map((e, ei)=>`
        <div class="card" style="padding:12px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <b style="font-size:13px;">${escapeHtml(e.nome)}</b>
            <button class="icon-btn mini" data-edit-del-ex="${ei}">${ICONS.trash}</button>
          </div>
          <table style="width:100%;border-collapse:collapse;">
            <tr><th style="font-size:10px;color:var(--muted);text-align:center;">Série</th><th style="font-size:10px;color:var(--muted);text-align:center;">Reps</th><th style="font-size:10px;color:var(--muted);text-align:center;">Carga</th></tr>
            ${(e.setsDetalhados||[]).filter(s=>!s.warmup).map((s, si)=>`
              <tr>
                <td style="text-align:center;font-size:12px;padding:4px;">${si+1}</td>
                <td><input type="text" inputmode="numeric" value="${s.reps||0}" data-edit-set="${ei}:${si}:reps" style="padding:6px;font-size:13px;text-align:center;"></td>
                <td><input type="text" inputmode="decimal" value="${s.carga||0}" data-edit-set="${ei}:${si}:carga" style="padding:6px;font-size:13px;text-align:center;"></td>
              </tr>`).join('')}
          </table>
        </div>
      `).join('')}
    </div>
    <div class="row" style="margin-top:16px;">
      <button class="btn secondary" id="edit-cancel" style="flex:1;">Cancelar</button>
      <button class="btn" id="edit-save" style="flex:1;">Salvar</button>
    </div>
  `);
  const edit = JSON.parse(JSON.stringify(h));
  bg.querySelector('.close-x').onclick = ()=> closeModal(bg);
  bg.querySelector('#edit-cancel').onclick = ()=> closeModal(bg);
  bg.querySelectorAll('[data-edit-set]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const [ei, si, f] = inp.dataset.editSet.split(':');
      const e = edit.exercicios[Number(ei)];
      let counter = 0;
      e.setsDetalhados.forEach(s=>{
        if(!s.warmup){
          if(counter === Number(si)){
            if(f === 'reps') s.reps = Number(inp.value)||0;
            if(f === 'carga') s.carga = Number(inp.value)||0;
          }
          counter++;
        }
      });
    });
  });
  bg.querySelectorAll('[data-edit-del-ex]').forEach(el=> el.addEventListener('click', ()=>{
    if(!confirm('Excluir este exercício da sessão?')) return;
    edit.exercicios.splice(Number(el.dataset.editDelEx), 1);
    closeModal(bg);
    const h2 = DB.historico.find(x=> x.id === sessionId);
    h2.exercicios = edit.exercicios;
    saveHistorico();
    showToast('Exercício removido');
    editSessionModal(sessionId);
  }));
  bg.querySelector('#edit-save').onclick = ()=>{
    edit.exercicios.forEach(e=>{
      const valid = (e.setsDetalhados||[]).filter(s=>!s.warmup);
      const reps = valid.map(s=>Number(s.reps)||0).filter(r=>r>0);
      e.repsMedias = reps.length ? Math.round(reps.reduce((a,b)=>a+b,0)/reps.length) : 0;
      const lastDone = valid[valid.length-1];
      if(lastDone) e.carga = Number(lastDone.carga)||0;
    });
    const idx = DB.historico.findIndex(x=> x.id === sessionId);
    if(idx >= 0){ DB.historico[idx] = edit; saveHistorico(); }
    closeModal(bg);
    showToast('Sessão atualizada');
    render();
  };
}
