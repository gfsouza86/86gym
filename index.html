<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0B0D">
<title>86 Training & Grind</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0B0D'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-weight='800' font-size='16' fill='%23C9FF4D' text-anchor='middle'%3E86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0D; --surface:#141619; --surface-2:#1C1F23;
    --line:#25282D; --line-soft:#1A1D21;
    --lime:#C9FF4D; --lime-dim:rgba(201,255,77,0.10);
    --orange:#FF6A45; --blue:#4DA6FF; --gold:#FFD166;
    --text:#F3F4F1; --muted:#8A9099; --muted-2:#5A6069;
    --danger:#FF5A5A; --radius:14px;
    --font-display:'Space Grotesk', sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#F0F1EE;
    --line:#DFE1DD; --line-soft:#EBECE8;
    --lime:#7FA800; --lime-dim:rgba(127,168,0,0.12);
    --orange:#E24E2A; --blue:#2E7DD1; --gold:#D4A017;
    --text:#141619; --muted:#4F5459; --muted-2:#6E747A; --danger:#D23D3D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  svg{width:18px;height:18px;flex-shrink:0;display:inline-block;vertical-align:middle;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{font-family:'Inter',sans-serif;color:var(--text);overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;background-color:var(--bg);
    background-image:var(--gym-pattern,none);background-repeat:repeat;
    background-size:360px 360px;transition:background-color .2s,color .2s;position:relative;}
  #bg-anim{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  #bg-anim .bg-glow{position:absolute;border-radius:50%;filter:blur(80px);
    background:radial-gradient(circle,var(--lime) 0%,transparent 70%);
    opacity:0.06;animation:bgGlow 12s ease-in-out infinite;will-change:transform,opacity;}
  [data-theme="light"] #bg-anim .bg-glow{background:radial-gradient(circle,#5A7A00 0%,transparent 70%);animation-name:bgGlowLight;}
  @keyframes bgGlow{0%,100%{transform:scale(1);opacity:0.05;} 50%{transform:scale(1.18);opacity:0.10;}}
  @keyframes bgGlowLight{0%,100%{transform:scale(1);opacity:0.08;} 50%{transform:scale(1.18);opacity:0.14;}}
  .bg-item{position:absolute;color:var(--lime);opacity:0.07;will-change:transform,opacity;
    pointer-events:none;animation:bgBob ease-in-out infinite alternate;transform-origin:center;}
  [data-theme="light"] .bg-item{opacity:0.18;color:#5A7A00;}
  .bg-item svg{width:100%;height:100%;display:block;}
  @keyframes bgBob{0%{transform:translate3d(0,0,0) rotate(var(--rot-start,-8deg));}
    100%{transform:translate3d(var(--dx,20px),var(--dy,-30px),0) rotate(var(--rot-end,8deg));}}
  .bg-plate-big{position:absolute;border-radius:50%;border:2px solid var(--lime);opacity:0.05;
    animation:bgSpin 60s linear infinite;will-change:transform;}
  [data-theme="light"] .bg-plate-big{opacity:0.14;border-color:#5A7A00;}
  .bg-plate-big::before{content:'';position:absolute;inset:14%;border-radius:50%;border:1.5px dashed var(--lime);}
  [data-theme="light"] .bg-plate-big::before{border-color:#5A7A00;}
  .bg-plate-big::after{content:'';position:absolute;inset:32%;border-radius:50%;border:1.5px solid var(--lime);}
  [data-theme="light"] .bg-plate-big::after{border-color:#5A7A00;}
  @keyframes bgSpin{to{transform:rotate(360deg);}}
  .bg-particle{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--lime);
    opacity:0;animation:bgRise linear infinite;will-change:transform,opacity;box-shadow:0 0 6px var(--lime);}
  [data-theme="light"] .bg-particle{background:#5A7A00;box-shadow:0 0 4px rgba(90,122,0,0.5);}
  @keyframes bgRise{0%{transform:translateY(20vh) scale(0.5);opacity:0;} 20%{opacity:0.35;}
    80%{opacity:0.35;} 100%{transform:translateY(-30vh) scale(1);opacity:0;}}
  @media (prefers-reduced-motion: reduce){
    .bg-item,.bg-particle,.bg-plate-big,#bg-anim .bg-glow{animation:none !important;}
    .bg-item{opacity:0.05;}
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}
  h1,h2,h3{margin:0;font-weight:800;}
  .display{font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;}
  #view{flex:1;padding:20px 18px 104px 18px;overflow-y:auto;}
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;
    padding:7px 2px calc(7px + env(safe-area-inset-bottom)) 2px;z-index:50;}
  nav.tabbar button{flex:1;background:none;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:9.5px;font-family:'Inter';font-weight:600;padding:5px 1px;border-radius:10px;cursor:pointer;}
  nav.tabbar button svg{width:19px;height:19px;}
  nav.tabbar button.active{color:var(--lime);}
  nav.tabbar button.active svg{filter:drop-shadow(0 0 6px var(--lime-dim));}
  .hero{position:relative;margin:0 -18px 0 -18px;padding:34px 22px 26px 22px;overflow:hidden;
    background-color:transparent;
    background-image:var(--gym-pattern-strong,none),
      radial-gradient(100% 80% at 20% 0%,color-mix(in srgb,var(--surface-2) 80%,transparent) 0%,transparent 72%);
    background-repeat:repeat,no-repeat;background-size:300px 300px,100% 100%;}
  .brandmark{display:flex;align-items:center;gap:16px;}
  .plate-badge{position:relative;width:88px;height:88px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 32% 28%,var(--surface-2) 0%,var(--bg) 75%);
    border:4px solid var(--text);display:flex;align-items:center;justify-content:center;}
  .plate-badge::before{content:'';position:absolute;inset:9px;border-radius:50%;border:1.5px solid var(--line-soft);}
  .plate-badge .pnum{position:relative;font-family:var(--font-display);font-weight:700;font-size:28px;
    color:var(--lime);letter-spacing:-0.02em;line-height:1;}
  .plate-badge .pkg{position:absolute;bottom:17px;left:0;right:0;text-align:center;
    font-family:'Inter';font-weight:700;font-size:7.5px;letter-spacing:2px;color:var(--muted-2);}
  .wordmark-gym{font-family:'Inter',sans-serif;font-weight:800;font-size:21px;line-height:1.08;
    color:var(--text);text-transform:uppercase;}
  .wordmark-gym .accent{color:var(--lime);}
  .bar-divider{height:1px;background:var(--line);margin:20px 0 14px 0;width:100%;}
  .tagline{color:var(--muted);font-size:14px;max-width:290px;line-height:1.5;}
  .profile-strip{display:flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:14px;
    margin:18px 0 16px 0;cursor:pointer;backdrop-filter:blur(6px);}
  .avatar-wrap{position:relative;flex-shrink:0;}
  .avatar-circle{width:52px;height:52px;border-radius:50%;background:var(--surface-2);
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    overflow:hidden;color:var(--muted);}
  .avatar-circle img{width:100%;height:100%;object-fit:cover;}
  .avatar-circle svg{width:24px;height:24px;}
  .avatar-badge{position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;
    background:var(--orange);border:2px solid var(--bg);}
  .profile-strip .info b{font-size:13.5px;display:block;color:var(--muted);font-weight:600;}
  .profile-strip .info span{font-size:15px;font-weight:700;color:var(--text);}
  .profile-strip .chev{margin-left:auto;color:var(--muted-2);}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted-2);
    font-weight:700;margin:4px 0 12px 2px;}
  .home-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .menu-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 14px;display:flex;flex-direction:column;gap:20px;cursor:pointer;
    transition:transform .15s,border-color .15s;}
  .menu-card:active{transform:scale(0.97);}
  .menu-card svg{width:20px;height:20px;color:var(--muted);}
  .menu-card b{font-size:14px;font-weight:700;}
  .menu-card small{color:var(--muted);font-size:11.5px;line-height:1.3;}
  .menu-card.primary{background:var(--lime);border-color:var(--lime);grid-column:1/3;
    flex-direction:row;align-items:center;justify-content:space-between;padding:18px;}
  .menu-card.primary svg{color:#0A0B0D;width:26px;height:26px;}
  .menu-card.primary b{color:#0A0B0D;font-size:16px;}
  .menu-card.primary small{color:rgba(10,11,13,0.65);}
  .menu-card.primary .mc-text{display:flex;flex-direction:column;gap:3px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
  .stat-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 8px;text-align:center;}
  .stat-box .v{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--lime);line-height:1;}
  .stat-box .l{font-size:10px;color:var(--muted);text-transform:uppercase;
    letter-spacing:0.5px;margin-top:4px;font-weight:700;}
  .page-title{font-size:26px;margin-bottom:4px;}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--lime);color:#0A0B0D;border:none;font-weight:700;font-size:14px;
    padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;font-family:'Inter';}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn.ghost{background:transparent;color:var(--lime);border:1px dashed var(--line);}
  .btn.gold{background:var(--gold);color:#1a0d05;border:none;}
  .btn.small{padding:9px 12px;font-size:12.5px;width:auto;}
  .btn.mini{padding:6px 8px;font-size:11px;width:auto;font-weight:700;}
  .btn:active{opacity:0.85;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .row{display:flex;gap:10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:12px;border-radius:10px;font-size:14px;font-family:'Inter';margin-top:6px;}
  textarea{resize:vertical;min-height:60px;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
  label.field{display:block;font-size:12px;color:var(--muted);margin-top:12px;font-weight:600;}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;line-height:1.6;}
  .empty svg{width:40px;height:40px;color:var(--line);margin-bottom:10px;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .icon-btn{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;flex-shrink:0;}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.mini{width:28px;height:28px;border-radius:8px;}
  .icon-btn.mini svg{width:14px;height:14px;}
  .chip{display:inline-flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
    margin-right:8px;margin-bottom:6px;cursor:pointer;}
  .chip.active{background:var(--lime);color:#0A0B0D;border-color:var(--lime);}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  .treino-item{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;}
  .treino-item .row-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .treino-item h3{font-size:17px;}
  .treino-item .divs{margin-top:8px;}
  .treino-item small{color:var(--muted);font-size:12px;}
  .autocomplete-wrap{position:relative;}
  .ac-list{position:absolute;left:0;right:0;top:100%;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:180px;
    overflow-y:auto;z-index:20;display:none;}
  .ac-list div{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .ac-list div:last-child{border-bottom:none;}
  .ac-list div:active{background:var(--bg);}
  .help-icon{width:22px;height:22px;border-radius:50%;background:var(--surface-2);
    border:1px solid var(--line);color:var(--lime);display:inline-flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:800;
    cursor:pointer;flex-shrink:0;}
  .ex-block{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-top:12px;position:relative;}
  .ex-block .ex-head{display:flex;align-items:center;gap:8px;}
  .ex-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
  .ex-grid label{font-size:10px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px;}
  .remove-x{position:absolute;top:10px;right:10px;color:var(--muted);background:none;
    border:none;font-size:16px;cursor:pointer;}
  .last-record{font-size:11.5px;color:var(--lime);margin-top:8px;
    display:flex;justify-content:space-between;align-items:center;}
  .division-block{border:1px solid var(--line);border-radius:var(--radius);padding:14px;
    margin-bottom:16px;background:var(--surface);}
  .division-head{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .division-head input{width:60px;text-align:center;font-weight:700;
    font-family:var(--font-display);font-size:17px;}
  .group-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;
    color:var(--lime);font-weight:800;margin:22px 0 10px 0;}
  .group-title:first-child{margin-top:0;}
  .ex-row{display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);padding:12px 14px;
    border-radius:12px;margin-bottom:8px;}
  .ex-row span{font-size:14px;font-weight:600;flex:1;margin-right:8px;}
  .set-table{width:100%;border-collapse:collapse;margin-top:10px;}
  .set-table th{font-size:10px;color:var(--muted);text-transform:uppercase;
    text-align:center;padding:6px 2px;font-weight:700;}
  .set-table td{text-align:center;padding:6px 2px;border-top:1px solid var(--line);font-size:13px;}
  .set-table td:first-child, .set-table th:first-child{text-align:left;padding-left:4px;}
  .set-table input[type=number]{padding:5px;text-align:center;margin-top:0;width:52px;}
  .set-table input[type=checkbox]{width:22px;height:22px;accent-color:var(--lime);}
  .exec-ex-card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;margin-bottom:14px;transition:border-color .3s;}
  .exec-ex-card.done{border-color:var(--lime);}
  .exec-ex-card.pr{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 20px rgba(255,209,102,0.2);}
  .exec-ex-card.focused{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);}
  .exec-ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .exec-ex-head h3{font-size:15px;flex:1;}
  .rest-badge{font-size:11px;color:var(--muted);background:var(--surface-2);
    padding:4px 8px;border-radius:8px;}
  .compare-badge{font-size:11px;padding:4px 8px;border-radius:8px;font-weight:700;}
  .compare-badge.up{background:rgba(201,255,77,0.15);color:var(--lime);}
  .compare-badge.down{background:rgba(255,90,90,0.15);color:var(--danger);}
  .compare-badge.same{background:var(--surface-2);color:var(--muted);}
  .group-tag{font-size:10px;background:var(--blue);color:#0A0B0D;padding:2px 6px;
    border-radius:5px;font-weight:800;letter-spacing:0.5px;}
  .stagnation-alert{font-size:11.5px;color:var(--orange);margin-top:6px;
    padding:6px 10px;background:rgba(255,106,69,0.1);border-radius:8px;}
  .timer-banner{position:sticky;top:0;z-index:10;background:var(--orange);color:#1a0d05;
    border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;
    align-items:center;justify-content:space-between;}
  .timer-banner .t-num{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;}
  .session-clock{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px;}
  .session-clock b{color:var(--text);font-family:var(--font-display);font-weight:700;font-size:19px;}
  .hist-item{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .hist-item .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .hist-item .dur{color:var(--lime);font-family:var(--font-display);font-weight:700;font-size:17px;}
  .hist-ex-line{display:flex;justify-content:space-between;font-size:12.5px;
    color:var(--muted);padding:4px 0;border-top:1px solid var(--line);margin-top:6px;}
  .tipo-tag{font-size:10px;font-weight:800;text-transform:uppercase;
    letter-spacing:0.5px;padding:3px 8px;border-radius:6px;}
  .tipo-tag.forca{background:var(--lime-dim);color:var(--lime);}
  .tipo-tag.cardio{background:rgba(255,90,54,0.15);color:var(--orange);}
  .cardio-item{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .interval-block{border:1px solid var(--line);border-radius:12px;padding:12px;
    margin-top:12px;background:var(--surface-2);position:relative;}
  .interval-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;}
  .interval-grid label{font-size:10px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px;}
  .dash-box{background:var(--surface-2);border:1px solid var(--line);
    border-radius:14px;padding:16px;text-align:center;}
  .dash-box .val{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--lime);line-height:1;}
  .dash-box .lbl{font-size:11px;color:var(--muted);margin-top:4px;
    text-transform:uppercase;letter-spacing:0.5px;}
  .cardio-countdown{text-align:center;margin:18px 0;}
  .cardio-countdown .num{font-family:var(--font-display);font-weight:700;font-size:56px;
    color:var(--text);line-height:1;letter-spacing:-0.02em;}
  .cardio-countdown .sub{color:var(--muted);font-size:12px;text-transform:uppercase;
    letter-spacing:1px;margin-top:2px;}
  .interval-dots{display:flex;gap:6px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
  .interval-dot{width:30px;height:6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);}
  .interval-dot.done{background:var(--lime);border-color:var(--lime);}
  .interval-dot.active{background:var(--orange);border-color:var(--orange);}
  .dica-box{background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:14px;font-size:13px;line-height:1.5;margin-top:14px;}
  .tips-list{list-style:none;padding:0;margin:8px 0 0 0;}
  .tips-list li{font-size:13px;color:var(--muted);padding:4px 0 4px 22px;position:relative;}
  .tips-list li:before{content:'✓';position:absolute;left:0;color:var(--lime);font-weight:800;}
  .modal-bg{position:fixed;inset:0;background:rgba(10,11,12,0.85);z-index:200;
    display:flex;align-items:flex-end;justify-content:center;}
  .modal-box{background:var(--surface);border:1px solid var(--line);
    border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:22px;
    max-height:90vh;overflow-y:auto;}
  .modal-box .close-x{float:right;color:var(--muted);background:none;
    border:none;font-size:22px;cursor:pointer;line-height:1;}

let _errShown = false;
function showGlobalError(msg){
  if(_errShown) return;
  _errShown = true;
  const el = document.createElement('div');
  el.className = 'err-overlay';
  el.innerHTML = `⚠️ ${escapeHtml(msg)}<br><button id="err-dismiss">Fechar</button>`;
  document.body.appendChild(el);
  el.querySelector('#err-dismiss').onclick = ()=>{ el.remove(); _errShown = false; };
  setTimeout(()=>{ if(el.parentElement){ el.remove(); _errShown = false; } }, 8000);
}
window.addEventListener('error', e=>{
  console.error('[86gym error]', e.error || e.message);
  showGlobalError('Algo deu errado. Tente novamente.');
});
window.addEventListener('unhandledrejection', e=>{
  console.error('[86gym promise]', e.reason);
});

const safeGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const safeSet = (k,v) => { try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };
const safeDel = k => { try{ localStorage.removeItem(k); }catch(e){} };
const safeJSON = (k,f) => { try{ const r = safeGet(k); if(!r) return f; return JSON.parse(r); }catch(e){ return f; } };

function migrate(){
  if(safeGet(KEYS.treinos)!==null){
    LEGACY_KEYS.forEach(k => safeDel(k));
    return;
  }
  let migrated = false;
  for(const k in LEGACY_MAP){
    for(const oldK of LEGACY_MAP[k]){
      const v = safeGet(oldK);
      if(v){ safeSet(KEYS[k], v); migrated = true; break; }
    }
  }
  LEGACY_KEYS.forEach(k => safeDel(k));
  if(migrated) console.log('[86gym] migração concluída e chaves antigas limpas');
}

const IDB = {
  db: null,
  async open(){
    if(this.db) return this.db;
    return new Promise((res, rej)=>{
      const req = indexedDB.open(KEYS.idb, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv', {keyPath:'k'}); };
      req.onsuccess = ()=>{ this.db = req.result; res(this.db); };
      req.onerror = ()=> rej(req.error);
    });
  },
  async get(key){
    try{
      const db = await this.open();
      return new Promise((res)=>{
        const tx = db.transaction('kv','readonly').objectStore('kv').get(key);
        tx.onsuccess = ()=> res(tx.result ? tx.result.v : null);
        tx.onerror = ()=> res(null);
      });
    }catch(e){ return null; }
  },
  async set(key, val){
    try{
      const db = await this.open();
      return new Promise((res)=>{
        const tx = db.transaction('kv','readwrite').objectStore('kv').put({k:key, v:val});
        tx.onsuccess = ()=> res(true); tx.onerror = ()=> res(false);
      });
    }catch(e){ return false; }
  },
  async del(key){
    try{
      const db = await this.open();
      return new Promise((res)=>{
        const tx = db.transaction('kv','readwrite').objectStore('kv').delete(key);
        tx.onsuccess = ()=> res(true); tx.onerror = ()=> res(false);
      });
    }catch(e){ return false; }
  }
};

let CUSTOM_EXERCISES = loadCustomExercises();
function allExerciseGroups(){
  const groups = BASE_EXERCISES.map(([g,l])=>[g,l.slice()]);
  if(CUSTOM_EXERCISES.length){
    const idx = groups.findIndex(([g])=>g==='Personalizados');
    const list = CUSTOM_EXERCISES.map(c=>[c.name, c.en||c.name]);
    if(idx>=0) groups[idx][1] = groups[idx][1].concat(list);
    else groups.push(['Personalizados', list]);
  }
  return groups;
}
function exerciseFlat(){
  const flat = [];
  allExerciseGroups().forEach(([g,l])=> l.forEach(([n,en])=> flat.push({name:n, group:g, en})));
  return flat;
}
function exerciseGroup(name){
  const f = exerciseFlat().find(e=> e.name.toLowerCase()===String(name).toLowerCase());
  return f ? f.group : 'Personalizado';
}
function isCustomExercise(name){
  return CUSTOM_EXERCISES.some(c=> c.name.toLowerCase() === String(name).toLowerCase());
}

/* ============================================================
   ROUTER
============================================================ */
let ROUTE = { name:'home', params:{} };
let SESSION = null;
let CARDIO_SESSION = null;
let wakeLock = null;
let lastActionTime = Date.now();
let autoPaused = false;
let focusedExIdx = null;
let execContainerHandlersBound = false;

const TABS = [
  {key:'home', label:'Início', icon:'home'},
  {key:'treinos', label:'Treinos', icon:'clipboard'},
  {key:'exercicios', label:'Exercícios', icon:'dumbbell'},
  {key:'cardio', label:'Cardio', icon:'flame'},
  {key:'treinar', label:'Treinar', icon:'play'},
  {key:'historico', label:'Histórico', icon:'history'}
];

function go(name, params={}){
  ROUTE = {name, params};
  render();
  document.getElementById('view').scrollTop = 0;
}
function renderTabbar(){
  const tb = document.getElementById('tabbar');
  tb.innerHTML = TABS.map(t=>`
    <button class="${ROUTE.name===t.key?'active':''}" data-tab="${t.key}" aria-label="${t.label}">
      ${ICONS[t.icon]}<span>${t.label}</span>
    </button>`).join('');
  tb.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=> go(b.dataset.tab)));
}
function applyTheme(){
  const s = loadSettings();
  let theme = s.theme;
  if(s.themeAuto){
    const h = new Date().getHours();
    theme = (h>=20 || h<7) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelector('meta[name=theme-color]').setAttribute('content', theme==='light'?'#F3F4F1':'#0A0B0D');
}
function render(){
  applyTheme();
  renderTabbar();
  const view = document.getElementById('view');
  try{
    if(ROUTE.name==='home') view.innerHTML = HomeScreen();
    else if(ROUTE.name==='treinos') view.innerHTML = TreinosListScreen();
    else if(ROUTE.name==='treino_form') view.innerHTML = TreinoFormScreen(ROUTE.params.id);
    else if(ROUTE.name==='exercicios') view.innerHTML = ExerciciosScreen();
    else if(ROUTE.name==='treinar') view.innerHTML = TreinarListScreen();
    else if(ROUTE.name==='treino_exec') view.innerHTML = ExecucaoScreen(ROUTE.params.treinoId, ROUTE.params.divisaoId);
    else if(ROUTE.name==='historico') view.innerHTML = HistoricoScreen();
    else if(ROUTE.name==='cardio') view.innerHTML = CardioListScreen();
    else if(ROUTE.name==='cardio_form') view.innerHTML = CardioFormScreen(ROUTE.params.id);
    else if(ROUTE.name==='cardio_exec') view.innerHTML = CardioExecScreen(ROUTE.params.cardioId);
    else if(ROUTE.name==='perfil') view.innerHTML = PerfilScreen();
    else if(ROUTE.name==='stats') view.innerHTML = InsightsScreen();
    else if(ROUTE.name==='badges') view.innerHTML = BadgesScreen();
    else if(ROUTE.name==='challenges') view.innerHTML = ChallengesScreen();
  }catch(err){
    console.error('[86gym render]', err);
    view.innerHTML = `<div class="empty">${ICONS.empty}<div>Erro ao carregar a tela. Recarregue o app.</div></div>`;
  }
  bindScreenEvents();
  if(ROUTE.name==='treino_exec' || ROUTE.name==='cardio_exec') requestWakeLock();
  else releaseWakeLock();
}

const escapeHtml = str => String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatSeconds(total){
  total = Math.max(0, Math.round(total));
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60).toString().padStart(2,'0');
  const s = (total%60).toString().padStart(2,'0');
  return h>0 ? `${h}:${m}:${s}` : `${m}:${s}`;
}
const dateShort = ts => new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
function dateLong(ts){ return new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}); }

function showToast(msg, opts={}){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (opts.gold?' gold':(opts.dark?' dark':''));
  t.innerHTML = `<span>${escapeHtml(msg)}</span>` + (opts.undo ? '<span class="undo">Desfazer</span>' : '');
  document.body.appendChild(t);
  if(opts.undo){
    t.querySelector('.undo').addEventListener('click', ()=>{ opts.undo(); t.remove(); });
  }
  setTimeout(()=> t.remove(), opts.duration || 3000);
}
function undoableAction(msg, action, undo){
  action();
  showToast(msg, {dark:true, duration:5000, undo});
}

/* ============================================================
   ONBOARDING — aceita modo manual (sem setup)
============================================================ */
function needsOnboarding(){ return !safeGet(KEYS.onboarded); }
function showOnboarding(opts = {}){
  const askSetup = opts.askSetup !== false;
  return new Promise(resolve=>{
    const slides = [
      { icon:'dumbbell', title:'Bem-vindo ao <span class="accent">86 TG</span>',
        desc:'Seu companheiro completo de treino. Vamos te mostrar o essencial em 30 segundos.' },
      { icon:'clipboard', title:'Monte seus <span class="accent">treinos</span>',
        desc:'Escolha um template pronto (PPL, ABC, Upper/Lower...) ou crie do zero. Cada treino tem divisões A/B/C com exercícios, séries e cargas.' },
      { icon:'play', title:'Execute com <span class="accent">timer</span> e PR ao vivo',
        desc:'Durante o treino, o app cronometra descanso, mostra recordes pessoais em tempo real, sugere progressão e analisa seu desempenho.' },
      { icon:'chart', title:'Acompanhe <span class="accent">padrões</span>',
        desc:'Sono, energia, humor, PRs, volume, heatmap anual. O app correlaciona tudo pra você treinar melhor. Pronto pra começar?' }
    ];
    let idx = 0;
    const bg = document.createElement('div');
    bg.className = 'onb-bg';
    bg.innerHTML = `
      <div class="onb-card">
        ${slides.map((s,i)=>`
          <div class="onb-slide ${i===0?'active':''}" data-slide="${i}">
            <div class="onb-icon">${ICONS[s.icon]}</div>
            <h1 class="onb-title">${s.title}</h1>
            <p class="onb-desc">${escapeHtml(s.desc)}</p>
          </div>
        `).join('')}
        <div class="onb-dots">
          ${slides.map((_,i)=>`<span class="onb-dot ${i===0?'active':''}" data-dot="${i}"></span>`).join('')}
        </div>
        <div class="onb-actions">
          <button class="btn secondary" id="onb-skip">Pular</button>
          <button class="btn" id="onb-next">Próximo</button>
        </div>
      </div>`;
    document.body.appendChild(bg);
    function update(){
      bg.querySelectorAll('.onb-slide').forEach((el,i)=> el.classList.toggle('active', i===idx));
      bg.querySelectorAll('.onb-dot').forEach((el,i)=> el.classList.toggle('active', i===idx));
      bg.querySelector('#onb-next').textContent = idx === slides.length-1 ? (askSetup ? 'Começar' : 'Concluir') : 'Próximo';
    }
    bg.querySelector('#onb-next').onclick = ()=>{
      haptic('tap');
      if(idx < slides.length-1){ idx++; update(); }
      else finish();
    };
    bg.querySelector('#onb-skip').onclick = finish;
    async function finish(){
      safeSet(KEYS.onboarded, '1');
      bg.remove();
      if(askSetup) await askInitialSetup();
      resolve();
    }
    update();
  });
}
async function askInitialSetup(){
  return new Promise(resolve=>{
    const bg = openModal(`
      <h3 style="margin-bottom:4px;">Vamos personalizar</h3>
      <p style="color:var(--muted); font-size:13px; margin-bottom:16px;">Opcional — melhora cálculos e sugestões.</p>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <div><label class="field" style="margin-top:0;">Idade</label>
          <input type="number" min="10" max="120" id="onb-idade" placeholder="30"></div>
        <div><label class="field" style="margin-top:0;">Altura (cm)</label>
          <input type="number" min="100" max="250" id="onb-altura" placeholder="175"></div>
      </div>
      <label class="field">Sexo biológico</label>
      <select id="onb-sexo"><option value="M">Masculino</option><option value="F">Feminino</option></select>
      <label class="field">Peso atual (kg)</label>
      <input type="number" step="0.1" min="0" id="onb-peso" placeholder="78.5">
      <label class="field">Objetivo</label>
      <select id="onb-objetivo">
        <option value="cutting">Perder gordura</option>
        <option value="manutencao" selected>Manutenção</option>
        <option value="bulking">Ganhar massa</option>
      </select>
      <label class="field">Treinos por semana (meta)</label>
      <input type="number" min="1" max="7" id="onb-meta" value="4">
      <div class="row" style="margin-top:20px;">
        <button class="btn secondary" id="onb-skip2" style="flex:1;">Depois</button>
        <button class="btn" id="onb-save" style="flex:1;">Salvar</button>
      </div>
    `);
    bg.querySelector('#onb-skip2').onclick = ()=>{ closeModal(bg); resolve(); };
    bg.querySelector('#onb-save').onclick = ()=>{
      const pp = loadPerfil();
      const idade = Number(bg.querySelector('#onb-idade').value);
      const altura = Number(bg.querySelector('#onb-altura').value);
      const peso = Number(bg.querySelector('#onb-peso').value);
      if(idade>0) pp.idade = idade;
      if(altura>0) pp.altura = altura;
      pp.sexo = bg.querySelector('#onb-sexo').value;
      pp.objetivo = bg.querySelector('#onb-objetivo').value;
      pp.metaTreinos = Number(bg.querySelector('#onb-meta').value) || 4;
      if(peso>0) pp.pesos.push({ id:uid(), data:Date.now(), peso });
      savePerfil(pp);
      closeModal(bg);
      showToast('Tudo pronto! Bora treinar 💪');
      render();
      resolve();
    };
  });
}

/* ============================================================

============================================================ */
function showWarmupScreen(divisao){
  return new Promise(resolve=>{
    const grupos = [...new Set(divisao.exercicios.map(ex => exerciseGroup(ex.nome)).filter(g => g && g !== 'Personalizado'))];
    const warmups = [...new Set(grupos.flatMap(g => WARMUPS[g]||[]))];
    if(!warmups.length){ resolve(); return; }
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal-box">
        <h3 style="margin-bottom:4px;">Aquecimento · Divisão ${escapeHtml(divisao.letra)}</h3>
        <p style="color:var(--muted); font-size:13px; margin:0 0 16px 0;">
          Mobilidade dinâmica para preparar ${grupos.join(', ').toLowerCase()}. Leva 3-5min.
        </p>
        <div>
          ${warmups.map((w, i)=>`
            <label class="warmup-item" data-warmup="${i}"
              style="display:flex; gap:12px; align-items:flex-start; padding:12px;
                     background:var(--surface-2); border:1px solid var(--line);
                     border-radius:12px; margin-bottom:8px; cursor:pointer;">
              <input type="checkbox" data-warmup-check="${i}" aria-label="${escapeHtml(w)}"
                style="width:22px;height:22px; accent-color:var(--lime); margin-top:2px; flex-shrink:0;">
              <span style="font-size:13.5px; line-height:1.45;">${escapeHtml(w)}</span>
            </label>
          `).join('')}
        </div>
        <div style="margin-top:16px; display:flex; gap:8px;">
          <button class="btn secondary" id="warmup-skip" style="flex:1;">Pular aquecimento</button>
          <button class="btn" id="warmup-start" style="flex:1;">Começar treino ✓</button>
        </div>
      </div>`;
    document.body.appendChild(bg);
    bg.querySelectorAll('[data-warmup-check]').forEach(chk=>{
      chk.addEventListener('change', ()=>{
        const label = chk.closest('.warmup-item');
        if(chk.checked){
          label.style.borderColor = 'var(--lime)';
          label.style.background = 'var(--lime-dim)';
          haptic('light');
        } else {
          label.style.borderColor = 'var(--line)';
          label.style.background = 'var(--surface-2)';
        }
      });
    });
    const done = ()=>{ bg.remove(); resolve(); };
    bg.querySelector('#warmup-skip').addEventListener('click', done);
    bg.querySelector('#warmup-start').addEventListener('click', done);
  });
}

/* ============================================================

============================================================ */
function encodeTreino(treino){
  try{
    const clean = {
      n: treino.nome,
      d: treino.divisoes.map(d=>({
        l: d.letra, nm: d.nome||'',
        e: d.exercicios.map(ex=>({
          n: ex.nome, s: ex.series, r: ex.repeticoes, c: ex.carga||0, ds: ex.descanso||60
        }))
      }))
    };
    const json = JSON.stringify(clean);
    const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    return b64;
  }catch(e){ return null; }
}
function decodeTreino(str){
  try{
    let b64 = str.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length % 4) b64 += '=';
    const json = decodeURIComponent(escape(atob(b64)));
    const clean = JSON.parse(json);
    return {
      id: uid(),
      nome: clean.n || 'Treino importado',
      divisoes: (clean.d||[]).map(d=>({
        id: uid(),
        letra: d.l || 'A',
        nome: d.nm || '',
        exercicios: (d.e||[]).map(ex=>({
          nome: ex.n, series: ex.s||3, repeticoes: ex.r||10,
          carga: ex.c||0, descanso: ex.ds||60, nota:'', aquecimento:false, grupo:'', dropSet:false, rirAlvo:null
        }))
      }))
    };
  }catch(e){ return null; }
}

  const url = location.origin + location.pathname + '#import=' + code;

============================================================ */
function playBeep(times=2){
  const s = loadSettings();
  if(!s.sound) return;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    for(let i=0;i<times;i++){
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = 880;
      const start = now + i*0.22;
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.25, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, start+0.18);
      o.start(start); o.stop(start+0.2);
    }
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 900);
  }catch(e){}
}

/* ============================================================
   CHART SVG
============================================================ */
function buildSvgLineChart(points, opts={}){
  const w = opts.width||300, h = opts.height||130, pad = 30;
  if(!points || !points.length) return `<div style="color:var(--muted); font-size:12.5px; text-align:center; padding:20px 0;">Ainda não há dados suficientes.</div>`;
  if(points.length===1) points = [points[0], points[0]];
  const ys = points.map(p=>p.y);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if(minY===maxY){ minY -= 1; maxY += 1; }
  const stepX = (w - pad*2) / (points.length-1);
  const scaleY = v => h - pad - ((v-minY)/(maxY-minY)) * (h - pad*2 - 12);
  const coords = points.map((p,i)=> [pad + i*stepX, scaleY(p.y)]);
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=> `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#C9FF4D"/>`).join('');
  const firstLbl = points[0].x, lastLbl = points[points.length-1].x;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-label="Gráfico">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="#C9FF4D" stroke-width="2.5"/>
    ${dots}
    <text x="${pad}" y="${h-6}" fill="var(--muted)" font-size="10" font-family="Inter">${escapeHtml(firstLbl)}</text>
    <text x="${w-pad}" y="${h-6}" fill="var(--muted)" font-size="10" font-family="Inter" text-anchor="end">${escapeHtml(lastLbl)}</text>
    <text x="${pad}" y="14" fill="var(--text)" font-size="11" font-family="Inter" font-weight="700">${maxY}${opts.unit||''}</text>
    <text x="${pad}" y="${h-pad-4}" fill="var(--text)" font-size="11" font-family="Inter" font-weight="700">${minY}${opts.unit||''}</text>
  </svg>`;
}

/* ============================================================
   PROGRESSÃO
============================================================ */
function cargaHistoryFor(name){
  const rows = [];
  DB.historico.filter(h=> h.tipo!=='cardio').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(e.nome && e.nome.toLowerCase()===String(name).toLowerCase() && e.setsFeitas>0){
        rows.push({ x: dateShort(h.data), y: Number(e.carga)||0, ts:h.data, setsFeitas:e.setsFeitas, setsTotal:e.setsTotal, repsMedias:e.repsMedias||0 });
      }
    });
  });
  rows.sort((a,b)=> a.ts-b.ts);
  return rows;
}
function lastSessionFor(name){
  const hist = DB.historico.filter(h=>h.tipo!=='cardio')
    .filter(h=> (h.exercicios||[]).some(e=> e.nome && e.nome.toLowerCase()===String(name).toLowerCase() && e.setsFeitas>0))
    .sort((a,b)=> b.data - a.data);
  if(!hist.length) return null;
  const h = hist[0];
  const e = h.exercicios.find(e=> e.nome.toLowerCase()===String(name).toLowerCase());
  return { ts:h.data, ex:e };
}
function bestSetFor(name){
  let best = null;
  DB.historico.filter(h=>h.tipo!=='cardio').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(e.nome && e.nome.toLowerCase()===String(name).toLowerCase()){
        (e.setsDetalhados||[]).forEach(s=>{
          if(!s.done || s.warmup) return;
          const carga = Number(s.carga)||0, reps = Number(s.repeticoes)||0;
          if(carga<=0 || reps<=0) return;
          const oneRm = carga*(1+reps/30);
          if(!best || oneRm>best.oneRm) best = {carga, reps, oneRm, ts:h.data};
        });
      }
    });
  });
  return best;
}
function isStagnant(name, weeks=3){
  const h = cargaHistoryFor(name);
  if(h.length<weeks) return false;
  const recent = h.slice(-weeks);
  const first = recent[0].y, last = recent[recent.length-1].y;
  return last <= first && (Date.now() - h[h.length-1].ts) < 14*86400000;
}
function suggestProgression(name){
  const last = lastSessionFor(name);
  if(!last) return null;
  const ex = last.ex;
  if(ex.setsFeitas === ex.setsTotal && ex.setsFeitas > 0){
    const next = Math.max(2.5, Math.round((ex.carga*0.05)/2.5)*2.5);
    return { tipo:'up', carga: ex.carga + next, atual: ex.carga, motivo: 'Completou todas as séries' };
  }
  if(ex.setsFeitas < ex.setsTotal * 0.7){
    return { tipo:'down', carga: Math.max(0, ex.carga - 2.5), atual: ex.carga, motivo: 'Falhou em várias séries' };
  }
  return null;
}
function calcWarmup(c){
  const num = Number(c); if(!num) return null;
  const round = v => Math.max(0, Math.round(v/2.5)*2.5);
  return [{pct:40,kg:round(num*0.4)},{pct:60,kg:round(num*0.6)},{pct:80,kg:round(num*0.8)}];
}
function calcPlates(target, bar=20){
  const num = Number(target); if(!num || num < bar) return null;
  const perSide = (num - bar) / 2;
  const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
  let rem = perSide; const used = [];
  for(const p of plates){ const n = Math.floor(rem / p + 0.0001); if(n > 0){ used.push({p, n}); rem = +(rem - n*p).toFixed(2); } }
  return { perSide, used, resto: rem, bar };
}

function isoWeek(d){
  const date = new Date(d); date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - ((date.getDay()+6)%7));
  const week1 = new Date(date.getFullYear(),0,4);
  const wk = 1 + Math.round(((date - week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
  return date.getFullYear()+'-'+wk;
}
function computeStreak(){
  if(!DB.historico.length) return 0;
  const weeks = new Set(DB.historico.map(h=>isoWeek(h.data)));
  const now = new Date(); let cursor = new Date(now);
  if(!weeks.has(isoWeek(cursor))) cursor.setDate(cursor.getDate()-7);
  let streak = 0;
  while(weeks.has(isoWeek(cursor)) && streak<500){ streak++; cursor.setDate(cursor.getDate()-7); }
  return streak;
}
function computeStreakDays(){
  const days = new Set(DB.historico.map(h=> todayKey(h.data)));
  let streak = 0; const cursor = new Date();
  while(days.has(todayKey(cursor)) && streak<365){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}
function lastTrainingOfGroup(group){
  const hist = DB.historico.filter(h=>h.tipo!=='cardio').sort((a,b)=> b.data-a.data);
  for(const h of hist){
    for(const e of (h.exercicios||[])){
      if(exerciseGroup(e.nome) === group && e.setsFeitas>0) return h.data;
    }
  }
  return null;
}
function groupFreq7d(group){
  const weekAgo = Date.now() - 7*86400000;
  let n = 0;
  DB.historico.filter(h=> h.data>=weekAgo && h.tipo!=='cardio').forEach(h=>{
    if((h.exercicios||[]).some(e=> exerciseGroup(e.nome)===group && e.setsFeitas>0)) n++;
  });
  return n;
}
function buildHeatmapData(){
  const map = {};
  DB.historico.forEach(h=>{
    const k = todayKey(h.data);
    const vol = (h.exercicios||[]).reduce((a,e)=> a + (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0), 0);
    map[k] = (map[k]||0) + Math.max(1, vol);
  });
  return map;
}
function detectOvertraining(){
  const cur = weekVolume(); const prev = prevWeekVolume();
  if(!prev || !cur) return null;
  const ratio = cur / prev;
  if(ratio > 1.5) return { tipo:'up', msg:`Volume subiu ${Math.round((ratio-1)*100)}% vs semana passada`, det:`${cur.toLocaleString('pt-BR')}kg vs ${prev.toLocaleString('pt-BR')}kg. Considere uma semana leve.` };
  if(ratio < 0.5) return { tipo:'down', msg:`Volume caiu ${Math.round((1-ratio)*100)}% vs semana passada`, det:`Talvez seja hora de recuperar o ritmo.` };
  return null;
}
function detectDeload(){
  const weekAgo = Date.now() - 7*86400000;
  const hist = DB.historico.filter(h=> h.tipo==='forca' && h.data >= weekAgo);
  if(hist.length < 3) return false;
  let falhas = 0, total = 0;
  hist.forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      (e.setsDetalhados||[]).forEach(s=>{
        if(s.done && !s.warmup){ total++; if(s.falha) falhas++; }
      });
    });
  });
  return total > 10 && falhas/total > 0.5;
}
function pushPullBalance(){
  const monthAgo = Date.now() - 30*86400000;
  const push = new Set(['Peito','Ombros','Tríceps']);
  const pull = new Set(['Costas','Bíceps']);
  let pv = 0, pu = 0;
  DB.historico.filter(h=> h.data>=monthAgo && h.tipo!=='cardio').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      const g = exerciseGroup(e.nome);
      const vol = (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0);
      if(push.has(g)) pv += vol;
      else if(pull.has(g)) pu += vol;
    });
  });
  if(!pv || !pu) return null;
  const ratio = pv / pu;
  if(ratio > 1.3) return { msg:`Você empurra ${Math.round((ratio-1)*100)}% mais que puxa`, det:'Adicione mais trabalho de costas/bíceps para equilibrar.' };
  if(ratio < 0.77) return { msg:`Você puxa ${Math.round((1/ratio-1)*100)}% mais que empurra`, det:'Adicione mais trabalho de peito/ombros/tríceps.' };
  return null;
}
function calcTMB(){
  const p = loadPerfil();
  if(!p.altura || !p.idade || !p.pesos.length) return null;
  const peso = p.pesos[p.pesos.length-1].peso;
  const base = 10*peso + 6.25*p.altura - 5*p.idade;
  const tmb = p.sexo === 'M' ? base + 5 : base - 161;
  const treinosSemana = DB.historico.filter(h=> h.data >= Date.now()-7*86400000).length;
  const fator = treinosSemana >= 5 ? 1.725 : treinosSemana >= 3 ? 1.55 : treinosSemana >= 1 ? 1.375 : 1.2;
  const tdee = tmb * fator;
  const objetivo = p.objetivo || 'manutencao';
  let alvo = tdee;
  if(objetivo === 'cutting') alvo = tdee - 500;
  if(objetivo === 'bulking') alvo = tdee + 350;
  return { peso, tmb: Math.round(tmb), tdee: Math.round(tdee), alvo: Math.round(alvo), fator };
}

/* ============================================================
   BADGES
============================================================ */
function computeBadgeStats(){
  const gruposCount = {};
  const prsMes = new Set();
  const monthAgo = Date.now() - 30*86400000;
  const perfil = loadPerfil();
  DB.historico.filter(h=>h.tipo!=='cardio').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      const g = exerciseGroup(e.nome);
      gruposCount[g] = (gruposCount[g]||0) + 1;
      if(h.data >= monthAgo && e.setsDetalhados){
        e.setsDetalhados.forEach(s=>{
          if(s.done && !s.warmup && Number(s.carga)>0 && Number(s.repeticoes)>0){
            const best = bestSetFor(e.nome);
            if(best && Number(s.carga) === best.carga) prsMes.add(e.nome);
          }
        });
      }
    });
  });
  const challengesOwned = loadChallenges();
  return {
    treinos: DB.historico.filter(h=>h.tipo==='forca').length,
    cardios: DB.historico.filter(h=>h.tipo==='cardio').length,
    streakSemana: computeStreak(),
    streakDias: computeStreakDays(),
    prsMes: prsMes.size,
    gruposCount, fotos: (perfil.fotos||[]).length, pesos: (perfil.pesos||[]).length,
    volumeTotal: totalVolume(),
    temTMB: !!(perfil.altura && perfil.idade && perfil.pesos.length),
    challengesFeitos: Object.keys(challengesOwned).length
  };
}
function checkNewBadges(){
  const stats = computeBadgeStats();
  const owned = loadBadges();
  const novos = [];
  BADGES.forEach(b=>{
    if(!owned[b.id]){
      try{ if(b.check(stats)){ owned[b.id] = Date.now(); novos.push(b); } }catch(e){}
    }
  });
  if(novos.length){
    saveBadges(owned);
    const perfil = loadPerfil();
    const maxStreak = Math.max(perfil.streakRecord||0, stats.streakSemana);
    if(maxStreak !== perfil.streakRecord){ perfil.streakRecord = maxStreak; savePerfil(perfil); }
  }
  return novos;
}

============================================================ */
function currentChallenge(){
  const wk = isoWeek(Date.now());
  const ch = loadChallenges();
  if(ch[wk]) return { id:wk, done:true, tipo:ch[wk].tipo, meta:ch[wk].meta, progresso:ch[wk].meta };
  const tipos = [
    {tipo:'treinos', meta:4, title:'Treine 4 vezes essa semana', sub:'Consistência é tudo.'},
    {tipo:'pr', meta:1, title:'Bata 1 recorde pessoal', sub:'PR em qualquer exercício.'},
    {tipo:'volume', meta:20000, title:'20.000 kg de volume', sub:'Soma de carga × séries × reps.'},
    {tipo:'cardio', meta:2, title:'2 sessões de cardio', sub:'Saúde cardiovascular.'},
    {tipo:'streak', meta:4, title:'4 dias seguidos', sub:'Sem pular dia.'}
  ];
  const idx = (parseInt(wk.split('-')[1]) || 1) % tipos.length;
  const def = tipos[idx];
  const weekAgo = Date.now() - 7*86400000;
  const semanaHist = DB.historico.filter(h=> h.data >= weekAgo);
  let prog = 0;
  if(def.tipo === 'treinos') prog = semanaHist.filter(h=> h.tipo==='forca').length;
  if(def.tipo === 'cardio') prog = semanaHist.filter(h=> h.tipo==='cardio').length;
  if(def.tipo === 'volume') prog = weekVolume();
  if(def.tipo === 'streak') prog = computeStreakDays();
  if(def.tipo === 'pr'){
    const nomes = [...new Set(semanaHist.filter(h=>h.tipo==='forca').flatMap(h=> (h.exercicios||[]).map(e=>e.nome)).filter(Boolean))];
    prog = nomes.filter(n=>{ const b = bestSetFor(n); return b && b.ts >= weekAgo; }).length;
  }
  return { id:wk, done:false, tipo:def.tipo, meta:def.meta, title:def.title, sub:def.sub, progresso:Math.min(prog, def.meta) };
}
function completeChallengeIfDone(){
  const c = currentChallenge();
  if(!c.done && c.progresso >= c.meta){
    const ch = loadChallenges();
    ch[c.id] = { tipo:c.tipo, meta:c.meta, ts:Date.now() };
    saveChallenges(ch);
    return true;
  }
  return false;
}

async function fetchExercisePhoto(name){
  const cache = getImgCache();
  if(Object.prototype.hasOwnProperty.call(cache, name)) return cache[name];
  const item = exerciseFlat().find(e=> e.name.toLowerCase()===String(name).toLowerCase());
  const term = item ? item.en : name;
  let photoUrl = null;
  try{
    const ctrl = new AbortController();

    const r = await fetch(`https://wger.de/api/v2/exercise/search/?term=${encodeURIComponent(term)}&language=english&format=json`, {signal:ctrl.signal});
    clearTimeout(t);
    if(r.ok){
      const d = await r.json();
      const s = (d.suggestions||[])[0];
      const baseId = s?.data?.base_id || s?.data?.id || s?.base_id || s?.id;
      if(baseId){
        const r2 = await fetch(`https://wger.de/api/v2/exerciseimage/?exercise_base=${baseId}&format=json`);

    }
  }catch(e){ photoUrl = null; }
  cache[name] = photoUrl; setImgCache(cache);

/* ============================================================
   TESTE 1RM
============================================================ */
function start1RMTest(name){
  const steps = [
    { titulo:'Aquecimento', desc:'Faça 5min de mobilidade + 1 série leve (10 reps).', reps:'10', pct:0.4 },
    { titulo:'Série média', desc:'Uma série de 5 reps com carga moderada.', reps:'5', pct:0.7 },
    { titulo:'Série pesada', desc:'Uma série de 3 reps próxima do seu máximo.', reps:'3', pct:0.85 },
    { titulo:'Tentativa máxima', desc:'Uma repetição com a maior carga que aguentar com técnica.', reps:'1', pct:1 }
  ];
  const best = bestSetFor(name);
  const baseCarga = best ? best.carga : 0;
  let step = 0;
  const bg = openModal(`
    <button class="close-x" aria-label="Fechar">&times;</button>
    <h3 style="margin-bottom:4px;">Teste de 1RM · ${escapeHtml(name)}</h3>
    <p style="color:var(--muted); font-size:13px; margin-bottom:16px;">Protocolo guiado em 4 etapas.</p>
    <div id="step-container"></div>
    <div class="row" style="margin-top:16px;">
      <button class="btn secondary" id="step-back" style="flex:1;">Voltar</button>
      <button class="btn" id="step-next" style="flex:1;">Próximo</button>
    </div>
    <button class="btn secondary" style="margin-top:8px;" id="close-1rm">Cancelar</button>
  `);
  function renderStep(){
    const s = steps[step];
    const sugest = baseCarga ? Math.round((baseCarga / (best ? (1 + best.reps/30) : 1)) * s.pct / 2.5) * 2.5 : 0;
    const container = bg.querySelector('#step-container');

/* ============================================================
   PARSE WORKOUT TEXT
============================================================ */
function parseWorkoutText(text){
  const linhas = text.split('\n').map(l=> l.trim()).filter(Boolean);
  const exercicios = [];
  const regex = /^[-•*]?\s*(.+?)\s+(\d+)\s*[xX×]\s*(\d+)(?:\s+(\d+(?:[.,]\d+)?)\s*kg?)?/;
  for(const l of linhas){
    const m = l.match(regex);
    if(m){
      const nome = m[1].replace(/[-,;:]$/, '').trim();
      const found = exerciseFlat().find(e=> e.name.toLowerCase() === nome.toLowerCase());
      exercicios.push({
        nome: found ? found.name : nome,
        series: Number(m[2])||3, repeticoes: Number(m[3])||10,
        carga: m[4] ? Number(m[4].replace(',','.')) : 0,
        descanso: 60, nota:'', aquecimento:false, grupo:'', dropSet:false, rirAlvo:null
      });
    }
  }
  return exercicios;
}

/* ============================================================
   BACKUP — payload, FS Access API
============================================================ */
function shouldRemindBackup(){
  const s = loadSettings();
  if(!s.backupReminder) return false;
  const last = Number(safeGet(KEYS.lastBackup) || 0);
  const daysSince = (Date.now() - last) / 86400000;
  return daysSince >= 7 && DB.historico.length > 0;
}
function markBackupDone(){ safeSet(KEYS.lastBackup, Date.now().toString()); }
function canUseFS(){ return 'showSaveFilePicker' in window; }
function buildBackupPayload(){
  return {
    _meta:{ app:'86 Training & Grind', version:5, exportedAt:new Date().toISOString() },
    treinos: DB.treinos, historico: DB.historico, cardios: DB.cardios,
    perfil: loadPerfil(), customExercises: CUSTOM_EXERCISES, settings: loadSettings(),
    checkin: safeJSON(KEYS.checkin, {}), badges: loadBadges(),
    hydration: safeJSON(KEYS.hydration, {}), photos: loadPhotos(),
    challenges: loadChallenges(), annual: loadAnnual(), goals: loadGoals()
  };
}
async function pickBackupFile(){
  if(!canUseFS()){ showToast('Navegador não suporta. Use Exportar.'); return null; }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: '86gym-backup.json',
      types: [{ description: 'Backup 86 TG', accept: {'application/json': ['.json']} }]
    });
    await IDB.set('backupFileHandle', handle);
    showToast('Arquivo de backup configurado!');
    return handle;
  }catch(e){
    if(e.name === 'AbortError') return null;
    showToast('Não foi possível escolher arquivo');
    return null;
  }
}
async function autoBackup(force){
  const s = loadSettings();
  if(!s.autoBackup && !force) return false;
  if(!canUseFS()) return false;
  const handle = await IDB.get('backupFileHandle');
  if(!handle) return false;
  let perm = 'denied';
  try{ perm = await handle.queryPermission({ mode: 'readwrite' }); }
  catch(e){ return false; }
  if(perm !== 'granted'){
    if(force){
      try{ perm = await handle.requestPermission({ mode: 'readwrite' }); }
      catch(e){ return false; }
      if(perm !== 'granted') return false;
    } else {
      return false;
    }
  }
  try{
    const payload = buildBackupPayload();
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    safeSet(KEYS.lastBackup, Date.now().toString());
    return true;
  }catch(e){
    console.warn('[86gym] auto-backup falhou', e);
    return false;
  }
}
function scheduleAutoBackup(delayMs = 4000){
  const s = loadSettings();
  if(!s.autoBackup) return;
  if(!canUseFS()) return;
  clearTimeout(_autoBackupTimer);
  _autoBackupTimer = setTimeout(()=> autoBackup(false), delayMs);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden'){
    autoBackup(false);
  }
});

/* ============================================================
   CALENDÁRIO
============================================================ */
let CAL_MONTH = new Date().getMonth();
let CAL_YEAR = new Date().getFullYear();
function renderCalendar(){
  const trained = new Set(DB.historico.map(h=> todayKey(h.data)));
  const first = new Date(CAL_YEAR, CAL_MONTH, 1);
  const lastDay = new Date(CAL_YEAR, CAL_MONTH+1, 0).getDate();
  const startWd = (first.getDay()+6)%7;
  const monthNames = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const hoje = todayKey();
  const cells = [];
  for(let i=0;i<startWd;i++) cells.push('');
  for(let d=1; d<=lastDay; d++){
    const dt = new Date(CAL_YEAR, CAL_MONTH, d);
    const k = todayKey(dt);
    const isTrained = trained.has(k);
    const isToday = k === hoje;
    cells.push(`<div class="cal-day ${isTrained?'trained':''} ${isToday?'today':''}" title="${k}">${d}</div>`);
  }
  return `
  <div class="card">
    <div class="cal-header">
      <button class="icon-btn mini" data-cal-prev aria-label="Mês anterior">${ICONS.back}</button>
      <b>${monthNames[CAL_MONTH]} ${CAL_YEAR}</b>
      <button class="icon-btn mini" data-cal-next aria-label="Próximo mês" style="transform:rotate(180deg);">${ICONS.back}</button>
    </div>
    <div class="cal-weekdays">
      <span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span>
    </div>
    <div class="cal-grid">
      ${cells.map(c=> c || '<div></div>').join('')}
    </div>
  </div>`;
}

/* ============================================================
   COMPARE PHOTOS
============================================================ */
function openComparePhotos(){
  const fotos = loadPhotos().slice().sort((a,b)=> a.data - b.data);
  if(fotos.length < 2){ showToast('Adicione 2+ fotos'); return; }
  let idxA = 0, idxB = fotos.length - 1;
  const bg = openModal(`
    <button class="close-x" aria-label="Fechar">&times;</button>
    <h3 style="margin-bottom:4px;">Comparar progresso</h3>
    <p style="color:var(--muted); font-size:13px; margin-bottom:14px;">Arraste a linha pra comparar as duas fotos.</p>
    <div class="compare-wrap" id="cmp-wrap">
      <img id="cmp-imgA" src="${fotos[idxA].dataUrl}" alt="Antes">
      <div class="compare-overlay" id="cmp-overlay"><img id="cmp-imgB" src="${fotos[idxB].dataUrl}" alt="Depois"></div>
      <div class="compare-handle" id="cmp-handle" style="left:50%;"></div>
    </div>
    <div class="compare-labels">
      <span id="cmp-lblA">${dateLong(fotos[idxA].data)}</span>
      <span id="cmp-lblB">${dateLong(fotos[idxB].data)}</span>
    </div>
    <div class="row" style="margin-top:12px;">
      <select id="cmp-selA" style="flex:1;">
        ${fotos.map((f,i)=>`<option value="${i}" ${i===idxA?'selected':''}>${dateShort(f.data)}</option>`).join('')}
      </select>
      <select id="cmp-selB" style="flex:1;">
        ${fotos.map((f,i)=>`<option value="${i}" ${i===idxB?'selected':''}>${dateShort(f.data)}</option>`).join('')}
      </select>
    </div>
  `);
  bg.querySelector('.close-x').onclick = ()=> closeModal(bg);

  const wrap = bg.querySelector('#cmp-wrap');
  const overlay = bg.querySelector('#cmp-overlay');
  const handle = bg.querySelector('#cmp-handle');
  const imgA = bg.querySelector('#cmp-imgA');
  const imgB = bg.querySelector('#cmp-imgB');
  const lblA = bg.querySelector('#cmp-lblA');
  const lblB = bg.querySelector('#cmp-lblB');
  const selA = bg.querySelector('#cmp-selA');
  const selB = bg.querySelector('#cmp-selB');

  function updateWidths(){
    const rect = wrap.getBoundingClientRect();
    if(rect.width){
      imgB.style.width = rect.width + 'px';
      imgB.style.height = 'auto';
    }
  }
  function setPos(pct){
    pct = Math.max(0, Math.min(100, pct));
    overlay.style.width = pct + '%';
    handle.style.left = pct + '%';
  }
  function updatePhotos(){
    idxA = Number(selA.value);
    idxB = Number(selB.value);
    imgA.src = fotos[idxA].dataUrl;
    imgB.src = fotos[idxB].dataUrl;
    lblA.textContent = dateLong(fotos[idxA].data);
    lblB.textContent = dateLong(fotos[idxB].data);
    updateWidths();
  }
  selA.onchange = updatePhotos;
  selB.onchange = updatePhotos;
  setTimeout(updateWidths, 100);

  let dragging = false;
  const startDrag = ()=> dragging = true;
  const endDrag = ()=> dragging = false;
  handle.addEventListener('mousedown', startDrag);
  handle.addEventListener('touchstart', startDrag, {passive:true});
  document.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    const rect = wrap.getBoundingClientRect();
    setPos((e.clientX - rect.left) / rect.width * 100);
  });
  document.addEventListener('touchmove', (e)=>{
    if(!dragging) return;
    const rect = wrap.getBoundingClientRect();
    setPos((e.touches[0].clientX - rect.left) / rect.width * 100);
  }, {passive:true});
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchend', endDrag);
  wrap.addEventListener('click', (e)=>{
    if(e.target === handle) return;
    const rect = wrap.getBoundingClientRect();
    setPos((e.clientX - rect.left) / rect.width * 100);
  });
  setPos(50);
}

/* ============================================================
   INSIGHTS
============================================================ */
function InsightsScreen(){
  const streak = computeStreak();
  const streakDays = computeStreakDays();
  const vol = weekVolume();
  const volMes = monthVolume();
  const goals = loadGoals();
  const metaVolPct = goals.volumeMes ? Math.min(100, Math.round(volMes/goals.volumeMes*100)) : 0;
  const hm = buildHeatmapData();

  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dayOfWeek = (hoje.getDay()+6)%7;
  const inicioHeatmap = new Date(hoje);
  inicioHeatmap.setDate(inicioHeatmap.getDate() - dayOfWeek - 51*7);
  const cells = [];
  const maxVol = Math.max(1, ...Object.values(hm));
  for(let w=0; w<52; w++){
    for(let d=0; d<7; d++){
      const dt = new Date(inicioHeatmap);
      dt.setDate(dt.getDate() + w*7 + d);
      if(dt > hoje){ cells.push({empty:true}); continue; }
      const k = todayKey(dt);
      const v = hm[k]||0;
      let level = 0;
      if(v>0) level = v/maxVol > 0.75 ? 4 : v/maxVol > 0.5 ? 3 : v/maxVol > 0.25 ? 2 : 1;
      cells.push({level, date: dt, vol:v});
    }
  }

  const gruposBase = ['Peito','Costas','Ombros','Bíceps','Tríceps','Pernas','Glúteos','Abdômen','Panturrilha'];
  const grpInfo = gruposBase.map(g=>{
    const last = lastTrainingOfGroup(g);
    const freq = groupFreq7d(g);
    const dias = last ? Math.floor((Date.now()-last)/86400000) : null;
    return {g, last, dias, freq};
  });

  const grpVol = {};
  const monthAgo = Date.now() - 30*86400000;
  DB.historico.filter(h=> h.data>=monthAgo && h.tipo!=='cardio').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      const g = exerciseGroup(e.nome);
      const v = (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0);
      grpVol[g] = (grpVol[g]||0) + v;
    });
  });
  const grpSorted = Object.entries(grpVol).sort((a,b)=>b[1]-a[1]);
  const maxGrp = grpSorted.length ? grpSorted[0][1] : 0;

  const nomes = [...new Set(DB.historico.filter(h=>h.tipo!=='cardio').flatMap(h=> (h.exercicios||[]).map(e=>e.nome)).filter(Boolean))];
  const prs = nomes.map(n=> ({n, b:bestSetFor(n)})).filter(x=>x.b).sort((a,b)=> b.b.oneRm - a.b.oneRm).slice(0, 5);
  const estagnados = nomes.filter(n=> isStagnant(n)).slice(0, 5);

  const checkins = safeJSON(KEYS.checkin, {});
  const correl = [];
  DB.historico.filter(h=>h.tipo!=='cardio').forEach(h=>{
    const k = todayKey(h.data);
    const c = checkins[k];
    if(!c || !c.energia || !c.horaDormir || !c.horaAcordar) return;
    const [hd, md] = c.horaDormir.split(':').map(Number);
    const [ha, ma] = c.horaAcordar.split(':').map(Number);
    let dur = (ha*60+ma) - (hd*60+md);
    if(dur < 0) dur += 24*60;
    correl.push({ sono:dur/60, energia:c.energia, humor:c.humor, vol:(h.exercicios||[]).reduce((a,e)=> a + (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0), 0) });
  });
  const correlInsight = correl.length >= 3 ? (()=>{
    const mediaSono = correl.reduce((a,c)=>a+c.sono,0) / correl.length;
    const mediaEnergia = correl.reduce((a,c)=>a+c.energia,0) / correl.length;
    const bem = correl.filter(c=> c.energia >= 4);
    const mal = correl.filter(c=> c.energia <= 2);
    const volBem = bem.length ? bem.reduce((a,c)=>a+c.vol,0)/bem.length : 0;
    const volMal = mal.length ? mal.reduce((a,c)=>a+c.vol,0)/mal.length : 0;
    return { mediaSono, mediaEnergia, volBem, volMal, n: correl.length };
  })() : null;

  const humorCorrel = correl.filter(c=> c.humor).length >= 3 ? (()=>{
    const bem = correl.filter(c=> c.humor >= 4);
    const mal = correl.filter(c=> c.humor <= 2);
    const volBem = bem.length ? bem.reduce((a,c)=>a+c.vol,0)/bem.length : 0;
    const volMal = mal.length ? mal.reduce((a,c)=>a+c.vol,0)/mal.length : 0;
    return { volBem, volMal, n: correl.length };
  })() : null;

  const anoAtual = new Date().getFullYear();
  const anual = loadAnnual()[anoAtual] || {};

  return `
  <div class="top-actions">
    <button class="icon-btn" id="btn-back-home" aria-label="Voltar">${ICONS.back}</button>
    <h1 class="page-title" style="margin:0;">Insights</h1>
    <div style="width:38px;"></div>
  </div>
  <div class="stat-grid">
    <div class="stat-box"><div class="v">${DB.historico.length}</div><div class="l">Treinos</div></div>
    <div class="stat-box"><div class="v">${streak}</div><div class="l">Sem.</div></div>
    <div class="stat-box"><div class="v">${streakDays}</div><div class="l">Dias</div></div>
  </div>
