/* ═══════════════════════════════════════════════════════════
   Miniaturas de exercício (com cache IndexedDB)
═══════════════════════════════════════════════════════════ */
const IMG_CACHE_PREFIX = 'eximg_';
const _imgMemoryCache = new Map();

async function getCachedExerciseImage(name){
  const key = normalizeStr(name);
  if(!key) return null;
  if(_imgMemoryCache.has(key)) return _imgMemoryCache.get(key);
  try{
    const cached = await IDB.get(IMG_CACHE_PREFIX + key);
    if(cached && typeof cached === 'string'){
      _imgMemoryCache.set(key, cached);
      return cached;
    }
  }catch(e){}
  return null;
}

async function cacheExerciseImage(name, url){
  const key = normalizeStr(name);
  if(!key || !url) return null;
  if(_imgMemoryCache.has(key)) return _imgMemoryCache.get(key);
  try{
    const r = await fetch(url, { mode:'cors' });
    if(!r.ok) return null;
    const blob = await r.blob();
    const dataUrl = await new Promise((res, rej)=>{
      const fr = new FileReader();
      fr.onload = ()=> res(fr.result);
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
    await IDB.set(IMG_CACHE_PREFIX + key, dataUrl);
    _imgMemoryCache.set(key, dataUrl);
    return dataUrl;
  }catch(e){
    console.warn('[86gym] cache img falhou:', name, e && e.message);
    return null;
  }
}

function exThumbHtml(name, grupo){
  const g = grupo || 'Outros';
  const letter = (g[0] || '?').toUpperCase();
  const grpVar = `var(--grp-${g})`;
  return `<div class="ex-thumb" data-ex-thumb="${escapeHtml(name)}" data-grp-thumb="${escapeHtml(g)}"
    style="background:${grpVar};border-color:${grpVar};">
    <span class="ex-thumb-letter">${letter}</span>
  </div>`;
}

function applyThumbImg(el, src){
  if(!el || !el.isConnected) return;
  el.innerHTML = `<img src="${src}" alt="">`;
  el.style.background = '';
  el.style.borderColor = '';
}

async function hydrateExerciseThumbs(container){
  const thumbs = container.querySelectorAll('.ex-thumb[data-ex-thumb]');
  if(!thumbs.length) return;
  await Promise.allSettled([...thumbs].map(async el => {
    const name = el.dataset.exThumb;
    let src = await getCachedExerciseImage(name);
    if(src){ applyThumbImg(el, src); return; }
    const urls = exerciseImages(name);
    if(!urls.length) return;
    const dataUrl = await cacheExerciseImage(name, urls[0]);
    if(dataUrl) applyThumbImg(el, dataUrl);
  }));
}

============================================================ */
function buildSessionFromDivisao(treino, divisao){
  const deloadAtivo = isDeloadActive();
  return {
    treinoId: treino.id, divisaoId: divisao.id,
    treinoNome: treino.nome, divisaoLetra: divisao.letra,
    startTime: Date.now(), lastAction: Date.now(),
    paused: false, pausedSegundos: 0, pausedAt: null,
    isDeload: deloadAtivo,
    timer: { running:false, secondsLeft:0, exIdx:null, interval:null, total:0, endTime:null },
    exercicios: divisao.exercicios.map(ex=>{
      const lastSess = lastSessionFor(ex.nome);
      const targetReps = Number(ex.repeticoes) || 10;
      const sugg = suggestProgression(ex.nome, targetReps);
      let cargaInicial = lastSess?.ex?.carga ?? (Number(ex.carga) || 0);
      let repsAlvo = targetReps;
      let suggNote = '';
      if(sugg && sugg.tipo === 'up'){ cargaInicial = sugg.carga; repsAlvo = targetReps; suggNote = sugg.motivo; }
      else if(sugg && sugg.tipo === 'reps'){ repsAlvo = sugg.reps; suggNote = sugg.motivo; }
      else if(sugg && sugg.tipo === 'down'){ cargaInicial = sugg.carga; repsAlvo = Math.max(6, Math.round(targetReps*0.9)); suggNote = sugg.motivo; }
      return {
        nome: ex.nome,
        descanso: deloadAtivo ? Math.round((Number(ex.descanso)||60)*1.5) : (Number(ex.descanso)||60),
        carga: cargaInicial,
        repeticoes: repsAlvo,
        nota: ex.nota || '',
        grupo: (ex.grupo||'').toUpperCase(),
        rirAlvo: ex.rirAlvo !== undefined && ex.rirAlvo !== '' ? Number(ex.rirAlvo) : null,
        aquecimento: !!ex.aquecimento,
        dropSet: !!ex.dropSet,
        supersetId: ex.supersetId || null,
        suggNote,
        sets: (()=>{
          const arr = [];
          if(ex.aquecimento) arr.push({
            repeticoes: Math.max(6, Math.round(repsAlvo*0.6)),
            carga: Math.max(0, Math.round((cargaInicial*0.5)*2)/2),
            done:false, warmup:true, rir:null, falha:false, isDrop:false
          });
          const n = deloadAtivo ? Math.max(1, Math.round((Number(ex.series)||3)/2)) : (Number(ex.series)||1);
          for(let i=0;i<n;i++) arr.push({ repeticoes: repsAlvo, carga: cargaInicial, done:false, rir:null, falha:false, isDrop:false });
          return arr;
        })()
      };
    })
  };
}
function validateSession(s){
  if(!s || typeof s !== 'object') return false;
  if(!s.treinoId || !s.divisaoId || !s.startTime) return false;
  if(!Array.isArray(s.exercicios) || !s.exercicios.length) return false;
  return s.exercicios.every(ex => ex && typeof ex.nome === 'string' && Array.isArray(ex.sets));
}
function persistSession(){
  try{
    if(SESSION && validateSession(SESSION)){
      const copy = JSON.parse(JSON.stringify(SESSION, (k,v)=> k === 'interval' ? null : v));
      safeSet(KEYS.session, JSON.stringify(copy));
    } else safeSet(KEYS.session, 'null');
  }catch(e){ console.warn('[86gym] persistSession falhou', e); }
}
function loadPersistedSession(){
  const s = safeJSON(KEYS.session, null);
  if(!validateSession(s)) return null;
  if(Date.now() - s.startTime > 24*3600*1000) return null;
  if(s.timer) s.timer.interval = null;
  if(s.pausedAt) s.pausedAt = null;
  return s;
}
function pauseSession(){ if(!SESSION || SESSION.paused) return; SESSION.paused = true; SESSION.pausedAt = Date.now(); }
function resumeSession(){
  if(!SESSION || !SESSION.paused) return;
  if(SESSION.pausedAt){ SESSION.pausedSegundos = (SESSION.pausedSegundos||0) + (Date.now() - SESSION.pausedAt)/1000; SESSION.pausedAt = null; }
  SESSION.paused = false; lastActionTime = Date.now(); autoPaused = false;
}
function sessionElapsedSeconds(){
  if(!SESSION) return 0;
  const pausedMs = (SESSION.pausedSegundos||0)*1000 + (SESSION.pausedAt ? Date.now() - SESSION.pausedAt : 0);
  return Math.max(0, (Date.now() - SESSION.startTime - pausedMs)/1000);
}
function stopRestTimer(){
  if(_restTimerRef){ clearInterval(_restTimerRef); _restTimerRef = null; }
  if(SESSION && SESSION.timer){ SESSION.timer.running = false; SESSION.timer.exIdx = null; SESSION.timer.interval = null; SESSION.timer.endTime = null; SESSION.timer.secondsLeft = 0; }
  safeDel(KEYS.pendingNotif);
}
function startRestTimer(exi){
  const ex = SESSION.exercicios[exi];
  stopRestTimer();
  if(!ex.descanso || ex.descanso <= 0){ render(); return; }
  SESSION.timer.running = true;
  SESSION.timer.exIdx = exi;
  SESSION.timer.total = ex.descanso;
  SESSION.timer.endTime = Date.now() + ex.descanso * 1000;
  SESSION.timer.secondsLeft = ex.descanso;
  haptic('medium');
  render();
  _restTimerRef = setInterval(restTimerTick, 200);
  SESSION.timer.interval = _restTimerRef;
  scheduleRestNotification(SESSION.timer.endTime, ex.nome);
}
function restTimerTick(){
  if(!SESSION || !SESSION.timer || !SESSION.timer.running){ stopRestTimer(); return; }
  const t = SESSION.timer;
  if(!t.endTime){ stopRestTimer(); return; }
  const remaining = Math.max(0, Math.ceil((t.endTime - Date.now()) / 1000));
  t.secondsLeft = remaining;
  const numEl = document.getElementById('timer-num');
  if(numEl) numEl.textContent = remaining;
  const ringEl = document.getElementById('timer-ring-fg');
  if(ringEl && t.total){
    const ringR = 54, ringCirc = 2 * Math.PI * ringR;
    const pct = Math.max(0, Math.min(1, remaining / t.total));
    ringEl.style.strokeDashoffset = (ringCirc * (1 - pct)).toFixed(2);
  }
  if(remaining <= 0){
    stopRestTimer();
    haptic('success');
    vibrateRestEnd();
    playBeep(2);
    notifyRestEnd(SESSION ? SESSION.exercicios[t.exIdx]?.nome : '');
    render();
  }
}

function ExecucaoScreen(treinoId, divisaoId){
  const treino = DB.treinos.find(t=>t.id===treinoId);
  if(!treino) return `<div class="empty">Treino não encontrado.</div>`;
  const divisao = treino.divisoes.find(d=>d.id===divisaoId);
  if(!divisao) return `<div class="empty">Divisão não encontrada.</div>`;
  if(!SESSION || SESSION.treinoId!==treinoId || SESSION.divisaoId!==divisaoId){
    SESSION = buildSessionFromDivisao(treino, divisao);
    persistSession();
    startMediaSession(treino.nome + ' · ' + divisao.letra);
    collapsedExIdx = {};
  }
  const s = loadSettings();
  const compact = !!s.compactExec;
  const allDone = SESSION.exercicios.every(ex=> ex.sets.every(st=>st.done));

  let totalSets = 0, doneSets = 0;
  SESSION.exercicios.forEach(ex=>{ ex.sets.forEach(st=>{ if(!st.warmup){ totalSets++; if(st.done) doneSets++; } }); });
  const pct = totalSets ? Math.round(doneSets/totalSets*100) : 0;

  const ssLabels = {}; let ssLetter = 0; const seenSS = new Set();
  SESSION.exercicios.forEach(ex=>{
    if(ex.supersetId && !seenSS.has(ex.supersetId)){ seenSS.add(ex.supersetId); ssLabels[ex.supersetId] = 'SS-' + String.fromCharCode(65 + ssLetter++); }
  });

  const ringR = 54, ringCirc = 2 * Math.PI * ringR;
  const ringPct = SESSION.timer.total ? Math.max(0, Math.min(1, SESSION.timer.secondsLeft / SESSION.timer.total)) : 0;
  const ringOffset = ringCirc * (1 - ringPct);
  const timerHtml = SESSION.timer.running ? `<div class="timer-banner" id="timer-banner">
    <div class="t-label">⏱ Descanse por</div>
    <div class="t-ex">${escapeHtml(SESSION.exercicios[SESSION.timer.exIdx]?.nome||'')}</div>
    <div class="t-ring-wrap">
      <svg class="t-ring-svg" viewBox="0 0 120 120">
        <circle class="t-ring-bg" cx="60" cy="60" r="${ringR}"/>
        <circle class="t-ring-fg" id="timer-ring-fg" cx="60" cy="60" r="${ringR}" stroke-dasharray="${ringCirc.toFixed(2)}" stroke-dashoffset="${ringOffset.toFixed(2)}"/>
      </svg>
      <div class="t-ring-center">
        <div class="t-num" id="timer-num">${SESSION.timer.secondsLeft}</div>
        <div class="t-unit">segundos</div>
      </div>
    </div>
    <button class="t-stop" id="timer-skip" type="button">Pular</button>
  </div>`:'';

  const exHtml = SESSION.exercicios.map((ex, exi)=>{
    const done = ex.sets.every(st=>st.done);
    const lastSess = lastSessionFor(ex.nome, SESSION.treinoNome, SESSION.divisaoLetra);
    let compareBadge = '';
    if(lastSess){
      const cargaAtual = ex.sets[0]?.carga || ex.carga;
      const diff = cargaAtual - Number(lastSess.ex.carga);
      if(diff > 0) compareBadge = `<span class="compare-badge up">↑ +${diff}kg</span>`;
      else if(diff < 0) compareBadge = `<span class="compare-badge down">↓ ${diff}kg</span>`;
      else compareBadge = `<span class="compare-badge same">=</span>`;
    }
    const stagnant = isStagnant(ex.nome);
    const leaving = leavingRepsInTank(ex.nome);
    const collapsed = compact && done && collapsedExIdx[exi] !== false;
    const ssLabel = ex.supersetId ? ssLabels[ex.supersetId] : null;
    const ssClass = ex.supersetId ? ('superset-' + ((Object.keys(ssLabels).indexOf(ex.supersetId) % 3) + 1)) : '';
    const eGrp = exerciseGroup(ex.nome);
    const injured = hasInjury(eGrp);

    const rows = ex.sets.map((st, si)=>{
      const prevDone = si===0 ? true : ex.sets[si-1].done;
      const lockedByTimer = SESSION.timer.running && SESSION.timer.exIdx===exi;
      const disabled = (!prevDone) || st.done || lockedByTimer;
      const e1rm = calcE1RM(st.carga, st.repeticoes);
      const numSeries = st.warmup ? 'A' : (ex.sets.slice(0,si).filter(x=>!x.warmup).length + 1);
      return `<tr data-set-row="${exi}:${si}" class="${st.warmup ? 'warmup-row' : ''} ${st.falha ? 'fail-row' : ''} ${st.done ? 'done-row' : ''}">
        <td style="white-space:nowrap;min-width:56px;">
          <div style="font-family:var(--font-display);font-weight:800;font-size:14px;color:${st.warmup?'var(--orange)':'var(--text)'};">#${numSeries}</div>
          <div class="set-actions">
            ${!st.warmup ? `<button class="icon-btn mini" style="padding:0;width:18px;height:18px;font-weight:800;font-size:10px;" data-mark-warmup="${exi}:${si}" title="Aquecimento">A</button>` : `<button class="icon-btn mini" style="padding:0;width:18px;height:18px;font-size:10px;" data-unmark-warmup="${exi}:${si}" title="Remover A">A</button>`}
            ${!st.warmup ? `<button class="icon-btn mini" style="padding:0;width:18px;height:18px;" data-del-set="${exi}:${si}" title="Excluir">✕</button>` : ''}
          </div>
        </td>
        <td>
          <div class="set-stepper">
            <button type="button" class="step-btn" data-reps-delta="${exi}:${si}:-1" ${st.done?'disabled':''}>−</button>
            <input type="number" inputmode="numeric" data-set-field="repeticoes" data-exi="${exi}" data-si="${si}" value="${st.repeticoes}" ${st.done?'disabled':''}>
            <button type="button" class="step-btn" data-reps-delta="${exi}:${si}:1" ${st.done?'disabled':''}>+</button>
          </div>
        </td>
        <td>
          <div class="set-stepper">
            <button type="button" class="step-btn" data-carga-delta="${exi}:${si}:-2.5" ${st.done?'disabled':''}>−</button>
            <input type="number" inputmode="decimal" step="0.5" data-set-field="carga" data-exi="${exi}" data-si="${si}" value="${st.carga}" ${st.done?'disabled':''}>
            <button type="button" class="step-btn" data-carga-delta="${exi}:${si}:2.5" ${st.done?'disabled':''}>+</button>
          </div>
          ${e1rm>0 ? `<div class="rm-preview">1RM ${e1rm.toFixed(0)}kg</div>` : ''}
        </td>
        <td>${rpeButtonHtml(exi, si, st.rir, st.done)}</td>
        <td>
          <input type="checkbox" data-check-set="${exi}:${si}" ${st.done?'checked':''} ${disabled && !st.done ? 'disabled':''}
            style="width:26px;height:26px;accent-color:var(--lime);">
        </td>
      </tr>`;
    }).join('');
    const nextSet = ex.sets.find(st=> !st.done);
    const previewHtml = nextSet ? `<div style="font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <span style="color:var(--blue);font-weight:700;">▶ Próxima:</span>
      <b>${nextSet.carga}kg × ${nextSet.repeticoes}</b>
      <button class="btn mini secondary" data-repeat-last="${exi}" style="margin-left:auto;">Repetir</button>
    </div>` : '';

    return `<div class="exec-ex-card ${done?'done':''} ${collapsed?'collapsed':''} ${ssClass}" data-exi="${exi}">
      <div class="exec-ex-head">
        <button class="toggle-btn" data-toggle-collapse="${exi}">${ICONS.chevronDown}</button>
        ${exThumbHtml(ex.nome, eGrp)}
        <div class="exec-ex-titles">
          <div class="exec-ex-title">
            ${ssLabel?`<span class="superset-badge">${ssLabel}</span>`:''}
            ${escapeHtml(ex.nome)}
            ${injured?'<span class="banned-tag">EVITAR</span>':''}
            ${ex.dropSet? '<span class="grp-chip" data-grp="Outros" style="background:var(--orange);">DS</span>':''}
          </div>
        </div>
        <div class="exec-ex-actions">
          <span class="grp-chip" data-grp="${escapeHtml(eGrp)}">${escapeHtml(eGrp)}</span>
          ${compareBadge}
          ${!ex.sets.some(st=>st.warmup) ? `<button class="icon-btn mini" data-gen-warmup="${exi}" title="Gerar aquecimento" style="color:var(--orange);">${ICONS.bolt}</button>` : ''}
          ${injured ? `<button class="icon-btn mini" data-suggest-swap="${exi}" title="Sugerir substituto" style="color:var(--lime);background:var(--lime-dim);">${ICONS.bolt}</button>` : ''}
          <button class="icon-btn mini" data-swap-ex="${exi}" title="Trocar">${ICONS.swap}</button>
          <button class="icon-btn mini" data-postpone-ex="${exi}" title="Adiar">${ICONS.arrowDown}</button>
          <div class="help-icon" data-help="${escapeHtml(ex.nome)}" role="button" tabindex="0">?</div>
        </div>
      </div>
      <div class="exec-body">
        ${lastSess ? `<div class="last-time-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;"><path d="M3 12a9 9 0 109-9"/><path d="M3 5v5h5"/><path d="M12 7v6l4 2"/></svg>
          Última: ${lastSess.ex.carga}kg × ${lastSess.ex.repsMedias||'-'} em ${dateShort(lastSess.ts)}
        </div>`:''}
        ${ex.suggNote ? `<div style="font-size:11.5px;color:var(--blue);margin-top:6px;font-weight:600;">🎯 ${escapeHtml(ex.suggNote)}</div>` : ''}
        ${ex.nota? `<div style="font-size:11.5px;color:var(--muted);margin-top:4px;">📝 ${escapeHtml(ex.nota)}</div>`:''}
        ${stagnant? `<div class="stagnation-alert">⚠ Estagnado.</div>`:''}
        ${leaving? `<div class="suggestion-banner" style="margin-top:10px;font-size:12px;">${ICONS.star} Você está deixando reps na reserva — tente subir a carga.</div>`:''}
        <table class="set-table">
          <thead>
            <tr>
              <th style="width:60px;">Série</th>
              <th>Reps</th>
              <th>Carga</th>
              <th style="width:56px;">RPE</th>
              <th style="width:36px;">OK</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        ${previewHtml}
        <button class="btn mini ghost" data-add-set="${exi}" style="margin-top:8px;">${ICONS.plus} Série</button>
      </div>
    </div>`;
  }).join('');
  const paused = SESSION.paused;
  return `
    <div class="top-actions">
      <button class="icon-btn" id="btn-exit-exec">${ICONS.back}</button>
      <h1 class="page-title" style="margin:0;font-size:17px;">${escapeHtml(treino.nome)} · ${escapeHtml(divisao.letra)}${SESSION.isDeload ? ' 🧊' : ''}</h1>
      <div style="width:38px;"></div>
    </div>
    <div class="session-clock">Tempo de treino<br><b id="session-clock-num">${formatSeconds(sessionElapsedSeconds())}</b>${paused?' <span class="paused-tag">· pausado</span>':''}
      ${paused? '<br><button class="resume-btn" id="btn-resume-session">Retomar treino</button>':''}
    </div>
    <div class="session-progress-bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="session-progress-lbl"><span>${doneSets}/${totalSets} séries</span><span>${pct}%</span></div>
    ${timerHtml}
    <div id="exec-container">${exHtml}</div>
    <button class="btn" id="btn-finalizar-treino" style="margin-top:10px;">${allDone? 'Finalizar treino ✓':'Finalizar treino'}</button>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <button class="btn mini ghost" id="btn-plank">${ICONS.bolt} Prancha</button>
    </div>`;
}
function startSessionClock(){
  clearInterval(clockInterval);
  const tick = ()=>{
    const el = document.getElementById('session-clock-num');
    if(!el || !SESSION){ clearInterval(clockInterval); return; }
    const s = loadSettings();
    if(s.pausaAuto && !SESSION.paused){
      const inativo = Date.now() - lastActionTime;
      if(inativo > 10*60*1000 && !autoPaused){ autoPaused = true; pauseSession(); persistSession(); render(); return; }
    }
    el.textContent = formatSeconds(sessionElapsedSeconds());
  };
  tick();
  clockInterval = setInterval(tick, 1000);
}

  const bg = openModal(`
    <button class="close-x">&times;</button>
    <h3 style="margin-bottom:4px;">Editar sessão</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">${escapeHtml(h.treinoNome)} · ${new Date(h.data).toLocaleDateString('pt-BR')}</p>
    <div id="edit-body">
      ${h.exercicios.map((e, ei)=>`
        <div class="card" style="padding:12px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <b style="font-size:13px;">${escapeHtml(e.nome)}</b>
            <button class="icon-btn mini" data-edit-del-ex="${ei}">${ICONS.trash}</button>
          </div>
          <table style="width:100%;border-collapse:collapse;">
            <tr><th style="font-size:10px;color:var(--muted);text-align:center;">Série</th><th style="font-size:10px;color:var(--muted);text-align:center;">Reps</th><th style="font-size:10px;color:var(--muted);text-align:center;">Carga</th></tr>
            ${(e.setsDetalhados||[]).filter(s=>!s.warmup).map((s, si)=>`
              <tr>
                <td style="text-align:center;font-size:12px;padding:4px;">${si+1}</td>
                <td><input type="text" inputmode="numeric" value="${s.reps||0}" data-edit-set="${ei}:${si}:reps" style="padding:6px;font-size:13px;text-align:center;"></td>
                <td><input type="text" inputmode="decimal" value="${s.carga||0}" data-edit-set="${ei}:${si}:carga" style="padding:6px;font-size:13px;text-align:center;"></td>
              </tr>`).join('')}
          </table>
        </div>
      `).join('')}
    </div>
    <div class="row" style="margin-top:16px;">
      <button class="btn secondary" id="edit-cancel" style="flex:1;">Cancelar</button>
      <button class="btn" id="edit-save" style="flex:1;">Salvar</button>
    </div>
  `);
  const edit = JSON.parse(JSON.stringify(h));
  bg.querySelector('.close-x').onclick = ()=> closeModal(bg);
  bg.querySelector('#edit-cancel').onclick = ()=> closeModal(bg);
  bg.querySelectorAll('[data-edit-set]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const [ei, si, f] = inp.dataset.editSet.split(':');
      const e = edit.exercicios[Number(ei)];
      let counter = 0;
      e.setsDetalhados.forEach(s=>{
        if(!s.warmup){
          if(counter === Number(si)){ if(f === 'reps') s.reps = Number(inp.value)||0; if(f === 'carga') s.carga = Number(inp.value)||0; }
          counter++;
        }
      });
    });
  });
  bg.querySelectorAll('[data-edit-del-ex]').forEach(el=> el.addEventListener('click', ()=>{
    if(!confirm('Excluir este exercício da sessão?')) return;
    edit.exercicios.splice(Number(el.dataset.editDelEx), 1);
    closeModal(bg);
    const h2 = DB.historico.find(x=> x.id === sessionId);
    h2.exercicios = edit.exercicios;
    saveHistorico();
    showToast('Exercício removido');
    editSessionModal(sessionId);
  }));
  bg.querySelector('#edit-save').onclick = ()=>{
    edit.exercicios.forEach(e=>{
      const valid = (e.setsDetalhados||[]).filter(s=>!s.warmup);
      const reps = valid.map(s=>Number(s.reps)||0).filter(r=>r>0);
      e.repsMedias = reps.length ? Math.round(reps.reduce((a,b)=>a+b,0)/reps.length) : 0;
      const lastDone = valid[valid.length-1];
      if(lastDone) e.carga = Number(lastDone.carga)||0;
    });
    const idx = DB.historico.findIndex(x=> x.id === sessionId);
    if(idx >= 0){ DB.historico[idx] = edit; saveHistorico(); }
    closeModal(bg);
    showToast('Sessão atualizada');
    render();
  };
}

function startPlankTimer(){
  let seg = 0, target = 60, running = true, interval = null;
  const bg = openModal(`
    <button class="close-x">&times;</button>
    <h3 style="margin-bottom:8px;">Cronômetro de prancha</h3>
    <div class="plank-timer running" id="plank-box"><div class="t" id="plank-time">00:00</div><div class="l" id="plank-label">Alvo: 60s</div></div>
    <label class="field">Alvo (segundos)</label>
    <input type="text" inputmode="numeric" id="plank-target" value="60">
    <div class="row" style="margin-top:16px;"><button class="btn secondary" id="plank-reset">Zerar</button><button class="btn" id="plank-stop">Parar</button></div>
  `);
  const timeEl = bg.querySelector('#plank-time'), labelEl = bg.querySelector('#plank-label'),
        boxEl = bg.querySelector('#plank-box'), targetEl = bg.querySelector('#plank-target');
  function tick(){ if(!running) return; seg++; timeEl.textContent = formatSeconds(seg); if(seg >= target){ playBeep(3); haptic('success'); running = false; boxEl.classList.remove('running'); labelEl.textContent = '✓ Alvo atingido!'; } }
  interval = setInterval(tick, 1000);
  targetEl.addEventListener('change', ()=>{ target = Number(targetEl.value)||60; labelEl.textContent = `Alvo: ${target}s`; });
  bg.querySelector('#plank-reset').onclick = ()=>{ seg = 0; timeEl.textContent = '00:00'; labelEl.textContent = `Alvo: ${target}s`; boxEl.classList.add('running'); running = true; };
  bg.querySelector('#plank-stop').onclick = ()=>{ clearInterval(interval); closeModal(bg); };
  bg.querySelector('.close-x').onclick = ()=>{ clearInterval(interval); closeModal(bg); };
}

function getExerciciosComHistorico(){
  const key = DB.historico.length + '|' + DB.historico.filter(h=>h.tipo==='forca').length;
  if(_cacheExerciciosHistoricoKey === key && _cacheExerciciosHistorico) return _cacheExerciciosHistorico;
  _cacheExerciciosHistorico = [...new Set(DB.historico.filter(h=>h.tipo==='forca').flatMap(h=> (h.exercicios||[]).map(e=>e.nome)).filter(Boolean))];
  _cacheExerciciosHistoricoKey = key;
  return _cacheExerciciosHistorico;
}

let HIST_VIEW = 'calendar';

let EXERCICIOS_VIEW = 'groups';

function getGroupRegion(group){
  if(['Peito','Costas','Ombros','Bíceps','Tríceps','Antebraço','Abdômen','Pescoço'].includes(group)) return 'upper';
  if(['Pernas','Glúteos','Panturrilha'].includes(group)) return 'lower';
  return 'none';
}

function bodySvgCropped(view, groups, region){
  let vb = '0 0 100 192';
  if(region === 'upper') vb = '0 0 100 108';
  else if(region === 'lower') vb = '5 82 90 110';
  const svg = bodySvg(view, groups, 1);
  return svg
    .replace('viewBox="0 0 100 192"', `viewBox="${vb}"`)
    .replace('max-width:190px', 'max-width:100%')
    .replace('width:100%;', 'width:100%;');
}

const EQUIP_FRIENDLY = {
  'barra':'Barra',
  'halteres':'Halteres',
  'maquina':'Máquina',
  'cabo':'Cabo',
  'peso-do-corpo':'Peso do corpo',

  'kettlebell':'Kettlebell',
  'outros':'Outros'
};
function equipLabel(key){
  return EQUIP_FRIENDLY[key] || (key ? key.charAt(0).toUpperCase()+key.slice(1) : 'Outros');
}
function equipKeyOf(name){
  const d = exerciseData(name);
  return (d && d.equipment) ? d.equipment : 'outros';
}
function equipmentsInList(list){
  const set = new Set();
  list.forEach(name => set.add(equipKeyOf(name)));
  return [...set].sort();
}
function filterByEquip(list, equip){
  if(!equip || equip === 'todos') return list;
  return list.filter(n => equipKeyOf(n) === equip);
}


function renderHistoryCalendar(){
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const first = new Date(CAL_YEAR, CAL_MONTH, 1);
  const lastDay = new Date(CAL_YEAR, CAL_MONTH+1, 0).getDate();
  const startWd = (first.getDay()+6)%7; // segunda = 0
  const hoje = todayKey();

  const daysForce  = new Set(DB.historico.filter(h => h.tipo === 'forca').map(h => todayKey(h.data)));
  const daysCardio = new Set(DB.historico.filter(h => h.tipo === 'cardio').map(h => todayKey(h.data)));
  const restDays = loadRestDays();

  const cells = [];
  for(let i=0;i<startWd;i++) cells.push('<div class="hc-day empty"></div>');
  for(let d=1; d<=lastDay; d++){
    const dt = new Date(CAL_YEAR, CAL_MONTH, d);
    const k = todayKey(dt);
    const isToday = k === hoje;
    const hasForce = daysForce.has(k);
    const hasCardio = daysCardio.has(k);
    const isRest = !!restDays[k];
    const cls = ['hc-day', hasForce ? 'trained' : '', (isRest && !hasForce) ? 'rest' : '', isToday ? 'today' : ''].filter(Boolean).join(' ');
    const dots = (hasForce || hasCardio)
      ? `<div class="hc-dots">${hasForce?'<span class="dot-force"></span>':''}${hasCardio?'<span class="dot-cardio"></span>':''}</div>`
      : '';
    cells.push(`<div class="${cls}" data-day-key="${k}" title="${k}"><span class="hc-num">${d}</span>${dots}</div>`);
  }

  const monthStart = new Date(CAL_YEAR, CAL_MONTH, 1).getTime();
  const monthEnd = new Date(CAL_YEAR, CAL_MONTH+1, 1).getTime();
  const monthSessions = DB.historico.filter(h => h.data >= monthStart && h.data < monthEnd).sort((a,b)=>b.data-a.data);
  const monthForce = monthSessions.filter(h => h.tipo === 'forca');
  const monthCardio = monthSessions.filter(h => h.tipo === 'cardio');
  const monthVol = monthForce.reduce((a,h) => a + (h.exercicios||[]).reduce((x,e) => x + (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0), 0), 0);

  const monthTag = t => t==='cardio' ? 'Cardio' : t==='descanso' ? 'Descanso' : 'Força';
  const monthTagColor = t => t==='cardio' ? 'var(--orange)' : t==='descanso' ? 'var(--muted)' : 'var(--lime)';

  return `
    <div class="card" style="padding:14px 12px;">
      <div class="hc-header">
        <button class="icon-btn mini" data-hc-prev>${ICONS.back}</button>
        <b style="font-size:15px;">${monthNames[CAL_MONTH]} ${CAL_YEAR}</b>
        <button class="icon-btn mini" data-hc-next style="transform:rotate(180deg);">${ICONS.back}</button>
      </div>
      <div class="hc-weekdays"><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span></div>
      <div class="hc-grid">${cells.join('')}</div>
      <div style="display:flex;gap:12px;margin-top:14px;font-size:10.5px;color:var(--muted);justify-content:center;align-items:center;flex-wrap:wrap;">
        <span style="display:inline-flex;align-items:center;gap:5px;">
          <span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--lime);flex-shrink:0;"></span>
          Treinou
        </span>
        <span style="display:inline-flex;align-items:center;gap:5px;">
          <span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--blue);flex-shrink:0;"></span>
          Descanso
        </span>
        <span style="display:inline-flex;align-items:center;gap:5px;">
          <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange);flex-shrink:0;"></span>
          Força
        </span>
        <span style="display:inline-flex;align-items:center;gap:5px;">
          <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#22D3EE;flex-shrink:0;"></span>
          Cardio
        </span>
      </div>
    </div>

    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-top:14px;">
      <div class="stat-box"><div class="v">${monthForce.length}</div><div class="l">Treinos</div></div>
      <div class="stat-box"><div class="v">${monthCardio.length}</div><div class="l">Cardios</div></div>
      <div class="stat-box"><div class="v">${monthVol >= 10000 ? Math.round(monthVol/1000)+'t' : Math.round(monthVol).toLocaleString('pt-BR')}</div><div class="l">Volume</div></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px;">
        ${monthSessions.length} ${monthSessions.length===1?'sessão':'sessões'} no mês
      </div>
      ${monthSessions.length === 0
        ? '<p style="color:var(--muted);font-size:12.5px;margin:0;">Nada registrado neste mês.</p>'
        : monthSessions.slice(0, 6).map(h => `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);">
            <div style="flex:1;min-width:0;">
              <b style="font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(h.treinoNome||'—')}${h.divisaoLetra? ' · '+escapeHtml(h.divisaoLetra):''}</b>
              <span style="font-size:10.5px;color:${monthTagColor(h.tipo)};font-weight:800;text-transform:uppercase;letter-spacing:0.5px;">${monthTag(h.tipo)}</span>
              <span style="font-size:10.5px;color:var(--muted);font-weight:600;margin-left:8px;">${new Date(h.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</span>
            </div>
            <span style="font-family:var(--font-display);font-size:12px;color:var(--muted);font-weight:700;flex-shrink:0;">${formatSeconds(h.duracaoSegundos||0)}</span>
          </div>
        `).join('')
      }
      ${monthSessions.length > 6 ? `<div style="text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px;">+${monthSessions.length-6} sessões neste mês</div>` : ''}
    </div>
  `;
}

      const trSet = isCardio

      return `<div class="hist-item" data-hist-id="${h.id}">
        <div class="swipe-bg">🗑 Excluir</div>
        <div class="hist-content">
          <div class="row-top">
            <div>
              <span class="tipo-tag ${tipoCls}">${tipoLbl}</span><br>
              <b>${escapeHtml(h.treinoNome || 'Descanso')}${h.divisaoLetra? ' · '+escapeHtml(h.divisaoLetra):''}</b><br>
              <small style="color:var(--muted);">${new Date(h.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})} · ${new Date(h.data).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small>
            </div>
            ${!isRest? `<div class="dur">${formatSeconds(h.duracaoSegundos||0)}</div>`:''}
          </div>
          ${note ? `<div class="hist-note">📝 ${escapeHtml(note)}</div>` : ''}
          ${trSet}
          ${!isRest ? `<div style="display:flex;gap:6px;margin-top:10px;justify-content:flex-end;flex-wrap:wrap;">
            <button class="btn mini secondary" data-share-session="${h.id}">${ICONS.share} Compartilhar</button>

            <button class="btn mini secondary" data-edit-session="${h.id}">Editar</button>

  const more = totalHist > LIMIT ? `<div style="text-align:center;color:var(--muted);font-size:12px;padding:16px;">Mostrando ${LIMIT} de ${totalHist}</div>` : '';
 return `<div class="top-actions"><h1 class="page-title" style="margin:0;">Histórico</h1></div>

    <p style="text-align:center;color:var(--muted);font-size:11px;margin-top:12px;">Deslize um cartão para a esquerda para excluir.</p>`;
}

function CardioExecScreen(cardioId){
  const cardio = DB.cardios.find(c=>c.id===cardioId);
  if(!cardio) return `<div class="empty">Cardio não encontrado.</div>`;
  if(!CARDIO_SESSION || CARDIO_SESSION.cardioId!==cardioId){
    CARDIO_SESSION = {
      cardioId, nome: cardio.nome, startTime: Date.now(),
      idx: 0, secondsLeft: Number(cardio.intervalos[0].duracaoMin)*60,
      paused:false, pausedSegundos: 0, pauseStart: null, finished:false, interval:null,
      intervalos: JSON.parse(JSON.stringify(cardio.intervalos)), observacoes: cardio.observacoes
    };
    startMediaSession('Cardio: ' + cardio.nome);
  }
  if(CARDIO_SESSION.interval) clearInterval(CARDIO_SESSION.interval);
  const S = CARDIO_SESSION;
  const current = S.intervalos[S.idx];
  const dots = S.intervalos.map((iv,i)=>`<div class="interval-dot ${(i<S.idx || (S.finished && i<=S.idx))?'done':''} ${(i===S.idx && !S.finished)?'active':''}"></div>`).join('');
  return `<div class="top-actions"><button class="icon-btn" id="btn-exit-cardio-exec">${ICONS.back}</button><h1 class="page-title" style="margin:0;font-size:20px;">${escapeHtml(S.nome)}</h1><div style="width:38px;"></div></div>
    <div class="session-clock">Tempo total<br><b id="cardio-clock-num">${formatSeconds((Date.now()-S.startTime)/1000 - (S.pausedSegundos||0))}</b></div>
    <div class="interval-dots">${dots}</div>
    <div class="cardio-countdown">
      <div class="num" id="cardio-countdown-num">${formatSeconds(S.secondsLeft)}</div>
      <div class="sub">${S.finished? 'Concluído!' : `Intervalo ${S.idx+1}/${S.intervalos.length}${S.paused?' · pausado':''}`}</div>
    </div>
    <div class="row" style="margin-bottom:14px;">
      <div class="dash-box" style="flex:1;"><div class="val">${current.inclinacao}</div><div class="lbl">Inclinação</div></div>
      <div class="dash-box" style="flex:1;"><div class="val">${current.velocidade}</div><div class="lbl">km/h</div></div>
    </div>
    ${current.dica? `<div class="dica-box">👉 ${escapeHtml(current.dica)}</div>`:''}
    <div class="row" style="margin-top:18px;">
      <button class="btn secondary" id="btn-pause-cardio" style="flex:1;">${S.paused?'Continuar':'Pausar'}</button>
      <button class="btn secondary" id="btn-skip-cardio" style="flex:1;" ${S.finished?'disabled':''}>Pular</button>
    </div>
    <button class="btn" id="btn-finalizar-cardio" style="margin-top:10px;">${S.finished?'Finalizar ✓':'Finalizar'}</button>`;
}
function startCardioTicker(){
  if(!CARDIO_SESSION) return;
  if(CARDIO_SESSION.interval) clearInterval(CARDIO_SESSION.interval);
  CARDIO_SESSION.interval = setInterval(()=>{
    const S = CARDIO_SESSION; if(!S) return;
    const elapsed = (Date.now()-S.startTime)/1000 - (S.pausedSegundos||0);
    const cEl = document.getElementById('cardio-clock-num'); if(cEl) cEl.textContent = formatSeconds(elapsed);
    if(S.paused || S.finished) return;
    S.secondsLeft -= 1;
    const nEl = document.getElementById('cardio-countdown-num'); if(nEl) nEl.textContent = formatSeconds(S.secondsLeft);
    if(S.secondsLeft<=0){
      if(S.idx < S.intervalos.length-1){ S.idx += 1; S.secondsLeft = Number(S.intervalos[S.idx].duracaoMin)*60; haptic('success'); playBeep(2); render(); }
      else { S.finished = true; clearInterval(S.interval); haptic('success'); playBeep(3); render(); }
    }
  }, 1000);
}
async function finalizeCardio(){
  const S = CARDIO_SESSION; if(!S) return;
  const duracaoSegundos = (Date.now()-S.startTime)/1000 - (S.pausedSegundos||0);
  const totalMin = S.intervalos.reduce((a,iv)=>a+Number(iv.duracaoMin),0);
  DB.historico.push({
    id: uid(), tipo:'cardio', treinoNome: S.nome, divisaoLetra:'', data: Date.now(), duracaoSegundos,
    intervalos: S.intervalos.map(iv=>({duracaoMin:iv.duracaoMin, inclinacao:iv.inclinacao, velocidade:iv.velocidade}))
  });
  saveHistorico();
  clearInterval(S.interval); clearInterval(clockInterval);
  CARDIO_SESSION = null;
  releaseWakeLock(); stopMediaSession();
  await showWorkoutComplete({
    subtitulo: 'Cardio finalizado!',
    stats: [ { v: formatSeconds(duracaoSegundos), l: 'Duração' }, { v: totalMin + 'min', l: 'Programado' }, { v: S.intervalos.length, l: 'Intervalos' } ],
    gruposTreinados: ['Cardio'], novosBadges: checkNewBadges()
  });
  go('historico');
}

        <button class="ex-img-nav" data-img-nav="1" style="right:8px;" aria-label="Próxima imagem">›</button>
        <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;">
          ${imgs.map((_, i)=>`<span class="ex-img-dot" data-img-dot="${i}" style="background:${i===0?'var(--lime)':'rgba(255,255,255,0.5)'};"></span>`).join('')}
        </div>
      ` : ''}
    </div>`;
}
function renderPRTimeline(name){
  const prs = [];
  const seenBest = new Map();
  const sorted = DB.historico.filter(h=>h.tipo==='forca').sort((a,b)=> a.data - b.data);
  sorted.forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(!e.nome || e.nome.toLowerCase() !== name.toLowerCase()) return;
      (e.setsDetalhados||[]).forEach(s=>{
        if(!s.done || s.warmup) return;
        const c = Number(s.carga)||0, r = Number(s.repeticoes)||0;
        if(c<=0 || r<=0) return;
        const oneRm = c*(1+r/30);
        const best = seenBest.get(name) || 0;
        if(oneRm > best){
          seenBest.set(name, oneRm);
          prs.push({ ts: h.data, carga: c, reps: r, oneRm });
        }
      });
    });
  });
  if(prs.length < 2) return '';
  return `<div class="divider"></div>
    <h3 style="font-size:15px;margin-bottom:8px;">📈 Histórico de PRs</h3>
    ${prs.slice(-8).reverse().map(p=>`<div class="hist-weight-row">
      <span style="color:var(--muted);font-size:11.5px;">${new Date(p.ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</span>
      <span style="flex:1;text-align:right;">
        <b style="color:var(--lime);">${p.carga}kg × ${p.reps}</b>
        <span style="color:var(--muted);font-size:11px;margin-left:6px;">1RM ${p.oneRm.toFixed(1)}kg</span>
      </span>
    </div>`).join('')}`;
}

function estimateSessionCalories(h){
  const p = loadPerfil();
  const pesoKg = (p.pesos && p.pesos.length) ? Number(p.pesos[p.pesos.length-1].peso) : 70;
  const min = (Number(h.duracaoSegundos)||0)/60;
  const met = h.tipo === 'cardio' ? 8 : 5;
  return met * 3.5 * pesoKg / 200 * min;
}
function resumoDayList(days){
  const out = []; const hoje = new Date(); hoje.setHours(0,0,0,0);
  for(let i=days-1;i>=0;i--){ const d = new Date(hoje); d.setDate(d.getDate()-i); out.push(d); }
  return out;
}
function computeResumoData(days){
  const dias = resumoDayList(days);
  const keys = dias.map(d=> todayKey(d));
  const byDay = {}; keys.forEach(k=> byDay[k] = { seg:0, cal:0, ex:0, sets:0, reps:0, carga:0 });
  const cutoff = dias[0].getTime();
  DB.historico.filter(h=> h.data >= cutoff && (h.tipo==='forca' || h.tipo==='cardio')).forEach(h=>{
    const k = todayKey(h.data); if(!byDay[k]) return;
    byDay[k].seg += Number(h.duracaoSegundos)||0;
    byDay[k].cal += estimateSessionCalories(h);
    if(h.tipo==='forca'){
      (h.exercicios||[]).forEach(e=>{
        if(!e.setsFeitas) return;
        byDay[k].ex += 1;
        byDay[k].sets += Number(e.setsFeitas)||0;
        byDay[k].reps += (Number(e.setsFeitas)||0) * (Number(e.repsMedias)||0);
        byDay[k].carga += (Number(e.carga)||0) * (Number(e.setsFeitas)||0) * (Number(e.repsMedias)||0);
      });
    }
  });
  const serie = field => keys.map(k=> byDay[k][field]);
  const sum = arr => arr.reduce((a,b)=>a+b,0);
  const tempoSerie=serie('seg'), calSerie=serie('cal'), exSerie=serie('ex'), setsSerie=serie('sets'), repsSerie=serie('reps'), cargaSerie=serie('carga');
  return { tempoSeg: sum(tempoSerie), tempoSerie, cal: sum(calSerie), calSerie, exCount: sum(exSerie), exSerie, sets: sum(setsSerie), setsSerie, reps: sum(repsSerie), repsSerie, carga: sum(cargaSerie), cargaSerie };
}
function resumoGroupVolumes(days){
  const cutoff = Date.now() - days*86400000;
  const vol = {};
  DB.historico.filter(h=> h.data>=cutoff && h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      if(!e.setsFeitas) return;
      const g = exerciseGroup(e.nome);
      const v = (Number(e.carga)||0) * (Number(e.setsFeitas)||0) * (Number(e.repsMedias)||0);
      vol[g] = (vol[g]||0) + v;
    });
  });
  return vol;
}
function buildSparkline(values, opts={}){
  const w = opts.width||118, h = opts.height||38;
  const color = opts.color || 'var(--orange)';
  const id = 'spk' + Math.random().toString(36).slice(2,9);
  let vals = (values && values.length) ? values : [0,0];
  if(vals.every(v=>!v)) vals = vals.map(()=>0);
  const max = Math.max(...vals, 0.0001), min = Math.min(...vals, 0);
  const range = (max - min) || 1;
  const stepX = w / Math.max(vals.length-1, 1);
  const pts = vals.map((v,i)=> [ i*stepX, h - 5 - ((v-min)/range) * (h-10) ]);
  const line = pts.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const area = line + ` L${w.toFixed(1)},${h} L0,${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;overflow:visible;">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.45"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})" stroke="none"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
const TORSO_PATH_D = 'M27,30 C19,40 23,54 35,63 C25,74 24,85 29,94 L71,94 C76,85 75,74 65,63 C77,54 81,40 73,30 Q50,22 27,30 Z';
function muscleBlob(cx, y0, y1, wTop, wMid, wBot, bias=0.4){
  const yMid = y0 + (y1-y0)*bias;
  const rT=wTop/2, rM=wMid/2, rB=wBot/2;
  const c1 = y0 + (yMid-y0)*0.6, c2 = yMid - (yMid-y0)*0.2;
  const c3 = yMid + (y1-yMid)*0.2, c4 = y1 - (y1-yMid)*0.6;
  const n = v=> Number(v).toFixed(1);
  return `M${n(cx-rT)},${n(y0)} C${n(cx-rT)},${n(c1)} ${n(cx-rM)},${n(c2)} ${n(cx-rM)},${n(yMid)} C${n(cx-rM)},${n(c3)} ${n(cx-rB)},${n(c4)} ${n(cx-rB)},${n(y1)} L${n(cx+rB)},${n(y1)} C${n(cx+rB)},${n(c4)} ${n(cx+rM)},${n(c3)} ${n(cx+rM)},${n(yMid)} C${n(cx+rM)},${n(c2)} ${n(cx+rT)},${n(c1)} ${n(cx+rT)},${n(y0)} Z`;
}

function zoneShapeSvg(z, fill, opacity, strokeCol){
  const s = z.shape;
  const attrs = `fill="${fill}" fill-opacity="${opacity}" stroke="${strokeCol}" stroke-width="1" stroke-opacity="${z.deco?0.4:0.32}"`;
  if(s.type==='circle') return `<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}" ${attrs}/>`;
  if(s.type==='ellipse') return `<ellipse cx="${s.cx}" cy="${s.cy}" rx="${s.rx}" ry="${s.ry}" ${attrs}/>`;
  if(s.type==='blob') return `<path d="${muscleBlob(s.cx,s.y0,s.y1,s.wTop,s.wMid,s.wBot,s.bias)}" ${attrs}/>`;
  const rx = s.pill ? s.w/2 : (s.rx||6);
  return `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="${rx}" ry="${rx}" ${attrs}/>`;
}
function bodySvg(view, groupVolumes, sharedMax){
  const zones = BODY_ZONES[view];
  const uid = 'bd' + Math.random().toString(36).slice(2,8);
  const trainable = zones.filter(z=>!z.deco);
  const max = sharedMax || Math.max(1, ...trainable.map(z=> groupVolumes[z.group]||0));
  const baseFill = 'color-mix(in srgb, #d8a97c 15%, var(--surface-2))';
  const strokeCol = 'var(--line)';
  const colorFor = z=>{
    if(z.deco) return {fill:baseFill, op:1};
    const v = groupVolumes[z.group]||0;
    if(v<=0) return {fill:baseFill, op:1};
    const r = v / max;
    const fill = r < 0.25 ? 'color-mix(in srgb, var(--orange) 30%, var(--surface-2))'
      : r < 0.50 ? 'color-mix(in srgb, var(--orange) 55%, var(--surface-2))'
      : r < 0.75 ? 'color-mix(in srgb, var(--orange) 80%, var(--surface-2))'
      : 'var(--orange)';
    return {fill, op:1};
  };
  const titleFor = z=> `<title>${escapeHtml(z.group)}: ${Math.round(groupVolumes[z.group]||0).toLocaleString('pt-BR')}kg</title>`;
  const torsoZones = zones.filter(z=> z.torso);
  const limbZones = zones.filter(z=> !z.torso && !['sh_l','sh_r','hip_l','hip_r','head','neck'].includes(z.id));
  const jointZones = zones.filter(z=> ['sh_l','sh_r','hip_l','hip_r'].includes(z.id));
  const capZones = zones.filter(z=> ['head','neck'].includes(z.id));
  const renderZone = z=>{
    const c = colorFor(z);
    return z.deco ? zoneShapeSvg(z, c.fill, c.op, strokeCol) : `<g>${zoneShapeSvg(z, c.fill, c.op, strokeCol)}${titleFor(z)}</g>`;
  };
  const linesMarkup = (BODY_LINES[view]||'').replace(/<path /g, `<path stroke="${strokeCol}" stroke-width="0.6" stroke-opacity="0.4" `);
  const torsoMarkup = torsoZones.length ? `
    <clipPath id="tclip-${uid}"><path d="${TORSO_PATH_D}"/></clipPath>
    <g clip-path="url(#tclip-${uid})">
      <path d="${TORSO_PATH_D}" fill="${baseFill}"/>
      ${torsoZones.map(z=>{ const c=colorFor(z); return `<g>${zoneShapeSvg(z, c.fill, c.op, strokeCol)}${titleFor(z)}</g>`; }).join('')}
      ${linesMarkup}
    </g>
    <path d="${TORSO_PATH_D}" fill="none" stroke="${strokeCol}" stroke-width="1.2" stroke-opacity="0.45"/>` : '';
  return `<svg viewBox="0 0 100 192" style="display:block;margin:0 auto;width:100%;max-width:190px;height:auto;">
    ${limbZones.map(renderZone).join('')}
    ${torsoMarkup}
    ${jointZones.map(renderZone).join('')}
    ${capZones.map(renderZone).join('')}
  </svg>`;
}

function muscleHighlightsForDay(dateKey){
  const sessions = DB.historico.filter(h => todayKey(h.data) === dateKey);
  const groups = {};
  sessions.forEach(h => {
    if(h.tipo === 'cardio'){
      groups['Cardio'] = groups['Cardio'] || { count:0, volume:0 };
      groups['Cardio'].count += 1;
    } else if(h.tipo === 'forca'){
      (h.exercicios||[]).forEach(e => {
        if(!e.setsFeitas) return;
        const g = exerciseGroup(e.nome);
        if(!groups[g]) groups[g] = { count:0, volume:0 };
        groups[g].count += 1;
        groups[g].volume += (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0);
      });
    }
  });
  return groups;
}
function topMusclesRank(days, limit=5){
  const cutoff = Date.now() - days*86400000;
  const groups = {};
  DB.historico.filter(h => h.data >= cutoff && h.tipo === 'forca').forEach(h => {
    (h.exercicios||[]).forEach(e => {
      if(!e.setsFeitas) return;
      const g = exerciseGroup(e.nome);
      if(!groups[g]) groups[g] = { group:g, count:0, volume:0 };
      groups[g].count += 1;
      groups[g].volume += (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0);
    });
  });
  return Object.values(groups).sort((a,b) => b.count - a.count || b.volume - a.volume).slice(0, limit);
}
function bodySideForGroup(group){
  if(['Tríceps','Costas','Glúteos'].includes(group)) return 'back';
  return 'front';
}
function bodySvgHighlightDay(view, groups){
  const zones = BODY_ZONES[view];
  const uid = 'bdd' + Math.random().toString(36).slice(2,8);
  const baseFill = 'color-mix(in srgb, #d8a97c 15%, var(--surface-2))';
  const strokeCol = 'var(--line)';
  const trained = new Set(Object.keys(groups));
  const colorFor = z => {
    if(z.deco) return { fill:baseFill, op:1 };
    if(trained.has(z.group)) return { fill:'var(--lime)', op:0.85 };
    return { fill:baseFill, op:1 };
  };
  const titleFor = z => `<title>${escapeHtml(z.group)}${trained.has(z.group)?' ✓':''}</title>`;
  const torsoZones = zones.filter(z => z.torso);
  const limbZones = zones.filter(z => !z.torso && !['sh_l','sh_r','hip_l','hip_r','head','neck'].includes(z.id));
  const jointZones = zones.filter(z => ['sh_l','sh_r','hip_l','hip_r'].includes(z.id));
  const capZones = zones.filter(z => ['head','neck'].includes(z.id));
  const renderZone = z => { const c = colorFor(z); return z.deco ? zoneShapeSvg(z, c.fill, c.op, strokeCol) : `<g>${zoneShapeSvg(z, c.fill, c.op, strokeCol)}${titleFor(z)}</g>`; };
  const linesMarkup = (BODY_LINES[view]||'').replace(/<path /g, `<path stroke="${strokeCol}" stroke-width="0.6" stroke-opacity="0.4" `);
  const torsoMarkup = torsoZones.length ? `
    <clipPath id="tclip-${uid}"><path d="${TORSO_PATH_D}"/></clipPath>
    <g clip-path="url(#tclip-${uid})">
      <path d="${TORSO_PATH_D}" fill="${baseFill}"/>
      ${torsoZones.map(z=>{ const c=colorFor(z); return `<g>${zoneShapeSvg(z, c.fill, c.op, strokeCol)}${titleFor(z)}</g>`; }).join('')}
      ${linesMarkup}
    </g>
    <path d="${TORSO_PATH_D}" fill="none" stroke="${strokeCol}" stroke-width="1.2" stroke-opacity="0.45"/>` : '';
  return `<svg viewBox="0 0 100 192" style="display:block;margin:0 auto;width:100%;max-width:130px;height:auto;">

    ${torsoMarkup}

const MONTH_NAMES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function computeMonthlyStats(month, year){
  const start = new Date(year, month, 1).getTime();
  const end = new Date(year, month+1, 1).getTime();
  const sessions = DB.historico.filter(h => h.data >= start && h.data < end);
  const force = sessions.filter(h => h.tipo === 'forca');
  const cardio = sessions.filter(h => h.tipo === 'cardio');
  const totalSeg = sessions.reduce((a,h) => a + (Number(h.duracaoSegundos)||0), 0);
  let volume = 0, exCount = 0, setsCount = 0;
  const groupVol = {};
  force.forEach(h => {
    (h.exercicios||[]).forEach(e => {
      if(!e.setsFeitas) return;
      const v = (Number(e.carga)||0) * (Number(e.setsFeitas)||0) * (Number(e.repsMedias)||0);
      volume += v;
      exCount++;
      setsCount += Number(e.setsFeitas)||0;
      const g = exerciseGroup(e.nome);
      groupVol[g] = (groupVol[g]||0) + v;
    });
  });
  const favGroupEntry = Object.entries(groupVol).sort((a,b)=>b[1]-a[1])[0];
  let bestPR = null;
  force.forEach(h => {
    (h.exercicios||[]).forEach(e => {
      (e.setsDetalhados||[]).forEach(s => {
        if(!s.done || s.warmup) return;
        const c = Number(s.carga)||0, r = Number(s.repeticoes)||0;
        if(c<=0 || r<=0) return;
        const rm = c*(1+r/30);
        if(!bestPR || rm > bestPR.oneRm) bestPR = { nome: e.nome, carga: c, reps: r, oneRm: rm };
      });
    });
  });
  const daysTrained = new Set(force.map(h => todayKey(h.data))).size;
  return {
    monthName: MONTH_NAMES_PT[month],
    month, year,
    force, cardio, sessions,
    totalSeg, volume, exCount, setsCount,
    daysTrained,
    favGroup: favGroupEntry ? favGroupEntry[0] : null,
    bestPR
  };
}

function computePRsThisMonth(){
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const monthEnd = new Date(now.getFullYear(), now.getMonth()+1, 1).getTime();
  const bestBefore = {};
  const bestInMonth = {};
  DB.historico.filter(h => h.tipo === 'forca').forEach(h => {
    (h.exercicios||[]).forEach(e => {
      (e.setsDetalhados||[]).forEach(s => {
        if(!s.done || s.warmup) return;
        const c = Number(s.carga)||0, r = Number(s.repeticoes)||0;
        if(c<=0 || r<=0) return;
        const rm = c*(1+r/30);
        if(h.data < monthStart){
          if(!bestBefore[e.nome] || rm > bestBefore[e.nome]) bestBefore[e.nome] = rm;
        } else if(h.data < monthEnd){
          if(!bestInMonth[e.nome] || rm > bestInMonth[e.nome]) bestInMonth[e.nome] = rm;
        }
      });
    });
  });
  let count = 0;
  for(const [name, rm] of Object.entries(bestInMonth)){
    if(rm > (bestBefore[name] || 0) + 0.5) count++;
  }
  return count;
}

function getLateGroups(minDays = 7, onlyTrained = true){
  const all = ['Peito','Costas','Ombros','Bíceps','Tríceps','Antebraço','Pernas','Glúteos','Abdômen','Panturrilha'];
  const result = [];
  all.forEach(g => {
    const lastT = lastTrainingOfGroup(g);
    if(!lastT){
      if(!onlyTrained) result.push({ group:g, days:null });
      return;
    }
    const d = Math.floor((Date.now()-lastT)/86400000);
    if(d >= minDays) result.push({ group:g, days:d });
  });
  return result.sort((a,b) => {
    if(a.days === null && b.days === null) return 0;
    if(a.days === null) return 1;
    if(b.days === null) return -1;
    return b.days - a.days;
  });
}

async function shareMonthlyCard(stats, card){
  showToast('Gerando imagem…', {dark:true, duration:1500});
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  const W = 1080, H = 1350;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const grads = {
    treinos: ['#C9FF4D', '#7FA800', '#0A0B0D'],
    dias:    ['#FF6A45', '#B33C1F', '#ffffff'],
    volume:  ['#FFD166', '#C79020', '#1a0d05'],
    tempo:   ['#4DA6FF', '#2E6BB3', '#ffffff'],
    series:  ['#A78BFA', '#7C3AED', '#ffffff'],
    pr:      ['#FF6A45', '#FFD166', '#0A0B0D'],
    grupo:   ['#EC4899', '#8B5CF6', '#ffffff'],
    cardio:  ['#22D3EE', '#0891B2', '#ffffff']
  };
  const [c1, c2, textCol] = grads[card.id] || ['#141619', '#0A0B0D', '#F3F4F1'];
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, c1); grad.addColorStop(1, c2);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
  for(let i=0;i<W;i+=80){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
  for(let i=0;i<H;i+=80){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }

  ctx.fillStyle = textCol;
  ctx.font = '900 96px "Space Grotesk", Inter, sans-serif';
  ctx.fillText('86', 80, 170);
  ctx.font = '800 28px "Space Grotesk", Inter, sans-serif';
  ctx.fillText('TRAINING & GRIND', 80, 220);

  ctx.font = '800 22px Inter, sans-serif';
  ctx.globalAlpha = 0.72;
  ctx.fillText(card.tag.toUpperCase(), 80, 400);
  ctx.globalAlpha = 1;

  const bigFontSize = card.bigClass === 'small' ? 130 : 260;
  ctx.font = `900 ${bigFontSize}px "Space Grotesk", Inter, sans-serif`;
  ctx.fillText(card.big, 80, 400 + bigFontSize * 0.95);

  ctx.font = '700 42px Inter, sans-serif';
  ctx.globalAlpha = 0.9;
  const descY = 400 + bigFontSize * 0.95 + 70;
  ctx.fillText(card.desc, 80, descY);
  ctx.globalAlpha = 1;

  ctx.font = '700 22px Inter, sans-serif';
  ctx.globalAlpha = 0.55;
  ctx.fillText('86 Training & Grind', 80, H - 60);
  ctx.textAlign = 'right';
  ctx.fillText(stats.monthName + ' ' + stats.year, W-80, H - 60);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;

  const blob = await new Promise(res => c.toBlob(res, 'image/png', 0.95));
  if(!blob){ showToast('Falha ao gerar imagem'); return; }
  const fname = `86tg-${card.id}-${stats.monthName.toLowerCase()}-${stats.year}.png`;
  const file = new File([blob], fname, { type:'image/png' });

  if(navigator.share && navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:'86 TG · ' + card.tag, text:`${card.big} — ${card.desc}` }); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
  showToast('Imagem salva ✓');
}

  const streak = computeStreak(), streakDays = computeStreakDays();
  const vol = weekVolume(), volMes = monthVolume();
  const goals = loadGoals();
  const metaVolPct = goals.volumeMes ? Math.min(100, Math.round(volMes/goals.volumeMes*100)) : 0;
  const hm = buildHeatmapData();
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dow = (hoje.getDay()+6)%7;
  const ini = new Date(hoje); ini.setDate(ini.getDate() - dow - 51*7);
  const cells = [];
  const maxVol = Math.max(1, ...Object.values(hm));
  for(let w=0; w<52; w++){
    for(let d=0; d<7; d++){
      const dt = new Date(ini); dt.setDate(dt.getDate() + w*7 + d);
      if(dt > hoje){ cells.push({empty:true}); continue; }
      const k = todayKey(dt); const v = hm[k]||0;
      let level = 0;
      if(v>0) level = v/maxVol > 0.75 ? 4 : v/maxVol > 0.5 ? 3 : v/maxVol > 0.25 ? 2 : 1;
      cells.push({level, date: dt, vol:v});
    }
  }
  const grpVol = {}; const monthAgo = Date.now() - 30*86400000;
  DB.historico.filter(h=> h.data>=monthAgo && h.tipo==='forca').forEach(h=>{
    (h.exercicios||[]).forEach(e=>{
      const g = exerciseGroup(e.nome);
      const v = (Number(e.carga)||0)*(Number(e.setsFeitas)||0)*(Number(e.repsMedias)||0);
      grpVol[g] = (grpVol[g]||0) + v;
    });
  });
  const grpSorted = Object.entries(grpVol).sort((a,b)=>b[1]-a[1]);
  const maxGrp = grpSorted.length ? grpSorted[0][1] : 0;
  const nomes = [...new Set(DB.historico.filter(h=>h.tipo==='forca').flatMap(h=> (h.exercicios||[]).map(e=>e.nome)).filter(Boolean))];
  const prs = nomes.map(n=> ({n, b:bestSetFor(n)})).filter(x=>x.b).sort((a,b)=> b.b.oneRm - a.b.oneRm).slice(0, 5);
  const estagnados = nomes.filter(n=> isStagnant(n)).slice(0, 5);
  const anoAtual = new Date().getFullYear();
  const anual = loadAnnual()[anoAtual] || {};
  const notas = DB.historico.filter(h=> h.nota && h.nota.trim()).sort((a,b)=> b.data - a.data);
  return `
  ${renderResumoSummary()}
  ${renderTopMusclesRank()}
  <div class="stat-grid">
    <div class="stat-box"><div class="v">${DB.historico.filter(h=>h.tipo==='forca').length}</div><div class="l">Treinos</div></div>
    <div class="stat-box"><div class="v">${streak}</div><div class="l">Sem.</div></div>
    <div class="stat-box"><div class="v">${streakDays}</div><div class="l">Dias</div></div>
  </div>
  <div class="card"><h3 style="font-size:15px;margin-bottom:8px;">Volume últimos 7 dias</h3><div style="font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--lime);">${vol.toLocaleString('pt-BR')} kg</div></div>
  ${goals.volumeMes ? `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><h3 style="font-size:15px;">Meta mensal</h3><b style="color:var(--lime);font-family:var(--font-display);">${metaVolPct}%</b></div><div class="progress-bar"><div class="fill" style="width:${metaVolPct}%"></div></div><div style="font-size:12px;color:var(--muted);margin-top:8px;">${volMes.toLocaleString('pt-BR')} / ${goals.volumeMes.toLocaleString('pt-BR')} kg</div></div>` : ''}
  <div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Atividade do ano</h3>
    <div class="heatmap-wrap"><div class="heatmap">${cells.map(c=> c.empty ? '<div class="hm-cell" style="visibility:hidden;"></div>' : `<div class="hm-cell l${c.level}" title="${todayKey(c.date)}: ${c.vol.toFixed(0)}kg"></div>`).join('')}</div></div>
    <div class="hm-legend"><span>Menos</span><div class="hm-cell"></div><div class="hm-cell l1"></div><div class="hm-cell l2"></div><div class="hm-cell l3"></div><div class="hm-cell l4"></div><span>Mais</span></div>
  </div>
  ${Object.keys(anual).length ? `<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Recordes ${anoAtual}</h3>${Object.entries(anual).sort((a,b)=> b[1].oneRm - a[1].oneRm).slice(0,5).map(([n,d])=>`<div class="hist-weight-row"><span style="flex:1;">${escapeHtml(n)}</span><span style="text-align:right;"><b style="color:var(--lime);">${d.oneRm.toFixed(1)}kg</b><div style="color:var(--muted);font-size:11px;">${d.carga}kg × ${d.reps}</div></span></div>`).join('')}</div>`:''}
  ${estagnados.length ? `<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">⚠ Estagnados</h3>${estagnados.map(n=>{ const l = lastSessionFor(n); return `<div class="insight-alert" style="margin-bottom:8px;"><b>${escapeHtml(n)}</b><small>${l?`Último: ${l.ex.carga}kg`:''}. Tente +2.5kg ou nova variação.</small></div>`; }).join('')}</div>`:''}
  ${grpSorted.length? `<div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Volume por grupo (30 dias)</h3>${grpSorted.map(([g,v])=>`<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span><span class="grp-chip" data-grp="${g}">${g}</span></span><b>${Math.round(v).toLocaleString('pt-BR')} kg</b></div><div class="progress-bar"><div class="fill" style="width:${maxGrp? (v/maxGrp*100).toFixed(0):0}%"></div></div></div>`).join('')}</div>`:''}
  <div class="card"><h3 style="font-size:15px;margin-bottom:10px;">Top PRs (1RM)</h3>
    ${prs.length===0 ? '<p style="color:var(--muted);font-size:12.5px;">Sem registros.</p>' : prs.map(x=>`<div class="hist-weight-row"><span style="flex:1;">${escapeHtml(x.n)}</span><span style="text-align:right;"><b style="color:var(--lime);">${x.b.oneRm.toFixed(1)} kg</b><div style="color:var(--muted);font-size:11px;">${x.b.carga}kg × ${x.b.reps}</div></span></div>`).join('')}
  </div>
  ${notas.length ? `<div class="card">
    <h3 style="font-size:15px;margin-bottom:10px;">📝 Diário</h3>
    ${notas.slice(0, 20).map(h=>`<div style="padding:10px 0;border-top:1px solid var(--line-soft);">
      <div style="font-size:11px;color:var(--muted);font-weight:600;">${new Date(h.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})} · ${escapeHtml(h.treinoNome||'Treino')}</div>
      <div style="font-size:13px;margin-top:4px;line-height:1.5;">${escapeHtml(h.nota)}</div>

}

    treinos: DB.treinos, historico: DB.historico, cardios: DB.cardios,

async function pickBackupFile(){
  if(!canUseFS()){ showToast('Navegador não suporta'); return null; }
  try{
    const h = await window.showSaveFilePicker({ suggestedName:'86gym-backup.json', types:[{ description:'Backup', accept:{'application/json':['.json']} }] });
    await IDB.set('backupFileHandle', h);
    showToast('Configurado!'); return h;
  }catch(e){ if(e.name==='AbortError') return null; showToast('Não foi possível'); return null; }
}
async function autoBackup(force){
  const s = loadSettings();
  if(!s.autoBackup && !force) return false;
  if(!canUseFS()) return false;
  const handle = await IDB.get('backupFileHandle');
  if(!handle) return false;
  let perm = 'denied';
  try{ perm = await handle.queryPermission({ mode:'readwrite' }); }catch(e){ return false; }
  if(perm !== 'granted'){
    if(force){ try{ perm = await handle.requestPermission({ mode:'readwrite' }); }catch(e){ return false; } if(perm !== 'granted') return false; }
    else return false;
  }
  try{
    const payload = buildBackupPayload();
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    safeSet(KEYS.lastBackup, Date.now().toString());
    return true;
  }catch(e){ console.warn('[86gym] auto-backup falhou', e); return false; }
}
function scheduleAutoBackup(delayMs = 4000){
  const s = loadSettings();
  if(!s.autoBackup) return;
  if(!canUseFS()) return;
  clearTimeout(_autoBackupTimer);
  _autoBackupTimer = setTimeout(()=> autoBackup(false), delayMs);
}
function exportBackup(){

function importBackup(file){

function exportCSV(){
  const rows = [['data','treino','divisao','exercicio','serie','reps','carga','rir','falha','aquecimento']];
  DB.historico.filter(h=>h.tipo==='forca').sort((a,b)=> a.data - b.data).forEach(h=>{
    const dt = new Date(h.data).toISOString();
    (h.exercicios||[]).forEach(e=>{
      (e.setsDetalhados||[]).forEach((s, i)=>{
        rows.push([dt, h.treinoNome||'', h.divisaoLetra||'', e.nome||'', String(i+1), String(s.reps||0), String(s.carga||0), String(s.rir ?? ''), s.falha ? '1':'0', s.warmup ? '1':'0']);
      });
    });
  });
  const csv = rows.map(r=> r.map(cell=>{ const s = String(cell).replace(/"/g,'""'); return /[",\n]/.test(s) ? '"'+s+'"' : s; }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `86gym-export-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); setTimeout(()=> URL.revokeObjectURL(url), 2000);
  showToast('CSV exportado!');

function parseCSVLine(line){
  const out = []; let cur = ''; let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){ if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else inQ = false; } else cur += ch; }
    else { if(ch === ','){ out.push(cur); cur = ''; } else if(ch === '"') inQ = true; else cur += ch; }
  }
  out.push(cur); return out;
}
async function importCSV(file){
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l=> l.trim());
  if(!lines.length) throw new Error('CSV vazio');
  const header = parseCSVLine(lines[0]).map(h=> h.trim().toLowerCase());
  const idx = k => header.indexOf(k);
  for(const n of ['data','treino','divisao','exercicio','serie','reps','carga']){ if(idx(n)<0) throw new Error('Faltando: '+n); }
  const sessions = new Map();
  for(let i=1;i<lines.length;i++){
    const cells = parseCSVLine(lines[i]);
    const get = k => cells[idx(k)] ?? '';
    const dt = new Date(get('data'));
    if(isNaN(dt.getTime())) continue;
    const tKey = get('treino') + '|' + get('divisao') + '|' + dt.toISOString().slice(0,16);
    if(!sessions.has(tKey)) sessions.set(tKey, { id: uid(), tipo:'forca', treinoNome: get('treino'), divisaoLetra: get('divisao'), data: dt.getTime(), duracaoSegundos:0, exercicios:[], _map:new Map() });
    const s = sessions.get(tKey);
    const exName = get('exercicio');
    if(!s._map.has(exName)) s._map.set(exName, { nome:exName, setsTotal:0, setsFeitas:0, carga:0, repsMedias:0, setsDetalhados:[] });
    const ex = s._map.get(exName);
    const warmup = get('aquecimento') === '1';
    const reps = Number(get('reps'))||0, carga = Number(get('carga'))||0;
    const rir = get('rir')==='' ? null : Number(get('rir'));
    const falha = get('falha') === '1';
    ex.setsDetalhados.push({ reps, carga, done:true, warmup, rir, falha });
    if(!warmup){ ex.setsTotal++; ex.setsFeitas++; ex.carga = carga; }
  }
  const arr = [];
  sessions.forEach(s=>{
    s.exercicios = [...s._map.values()];
    s.exercicios.forEach(e=>{ const valid = e.setsDetalhados.filter(x=> !x.warmup && x.reps>0); const reps = valid.map(x=>x.reps); e.repsMedias = reps.length ? Math.round(reps.reduce((a,b)=>a+b,0)/reps.length) : 0; });
    delete s._map; arr.push(s);
  });
  return arr;
}

function loadGistConfig(){
  return {
    token: safeGet(GIST_KEYS.token) || '', id: safeGet(GIST_KEYS.id) || '',
    lastSync: Number(safeGet(GIST_KEYS.lastSync) || 0),
    enabled: safeGet(GIST_KEYS.enabled) === '1',
    autoSync: safeGet(GIST_KEYS.autoSync) !== '0',
    localModified: Number(safeGet(GIST_KEYS.localModified) || 0)
  };
}
function saveGistConfig(c){
  if(c.token!==undefined) safeSet(GIST_KEYS.token, c.token);
  if(c.id!==undefined) safeSet(GIST_KEYS.id, c.id);
  if(c.lastSync!==undefined) safeSet(GIST_KEYS.lastSync, String(c.lastSync));
  if(c.enabled!==undefined) safeSet(GIST_KEYS.enabled, c.enabled ? '1' : '0');
  if(c.autoSync!==undefined) safeSet(GIST_KEYS.autoSync, c.autoSync ? '1' : '0');
  if(c.localModified!==undefined) safeSet(GIST_KEYS.localModified, String(c.localModified));
}
async function gistFetch(url, opts={}){
  const cfg = loadGistConfig();
  if(!cfg.token) throw new Error('Token não configurado');
  const r = await fetch(url, { ...opts, headers: { 'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + cfg.token, 'X-GitHub-Api-Version':'2022-11-28', 'Content-Type':'application/json', ...(opts.headers||{}) } });
  if(!r.ok){ const txt = await r.text().catch(()=> ''); let msg = `GitHub ${r.status}`; try{ const j = JSON.parse(txt); if(j.message) msg += ': ' + j.message; }catch(e){} throw new Error(msg); }
  return r.json();
}
function buildSyncPayload(){ const data = buildBackupPayload(); if(data.settings){ delete data.settings.gistToken; delete data.settings.gistId; } return data; }
async function gistCreate(){
  const payload = buildSyncPayload();
  const d = await gistFetch('https://api.github.com/gists', { method:'POST', body: JSON.stringify({ description:'86 TG — backup', public:false, files:{ '86gym-data.json':{ content: JSON.stringify(payload, null, 2) } } }) });
  const now = Date.now();
  saveGistConfig({ id: d.id, lastSync: now, enabled: true, localModified: now });
  return d;
}
async function gistPush(){
  const cfg = loadGistConfig();
  if(!cfg.token || !cfg.id) throw new Error('Sync não configurada');
  await gistFetch(`https://api.github.com/gists/${cfg.id}`, { method:'PATCH', body: JSON.stringify({ files:{ '86gym-data.json':{ content: JSON.stringify(buildSyncPayload(), null, 2) } } }) });
  saveGistConfig({ lastSync: Date.now() }); updateSyncBadge('ok');
}
async function gistPull(){
  const cfg = loadGistConfig();
  if(!cfg.token || !cfg.id) throw new Error('Sync não configurada');
  const d = await gistFetch(`https://api.github.com/gists/${cfg.id}`);
  const file = d.files['86gym-data.json'] || Object.values(d.files)[0];
  if(!file) throw new Error('Arquivo não encontrado');
  let content = file.content;
  if(file.truncated && file.raw_url){ const r = await fetch(file.raw_url, {headers:{'Accept':'application/vnd.github.raw'}}); content = await r.text(); }
  applySyncPayload(JSON.parse(content));
  saveGistConfig({ lastSync: Date.now(), localModified: Date.now() }); updateSyncBadge('ok');
}
function applySyncPayload(data){
  if(!data) return;
  _suppressGistSync = true;
  try{
    DB.treinos = data.treinos || []; DB.historico = data.historico || []; DB.cardios = data.cardios || [];
    saveTreinos(); saveHistorico(); saveCardios();
    if(data.perfil) savePerfil(data.perfil);
    if(data.customExercises){ CUSTOM_EXERCISES = data.customExercises; saveCustomExercises(CUSTOM_EXERCISES); }
    if(data.settings) saveSettings({ ...data.settings });
    if(data.checkin) safeSet(KEYS.checkin, JSON.stringify(data.checkin));
    if(data.badges) saveBadges(data.badges);
    if(data.goals) saveGoals(data.goals);
    if(data.favs) saveFavs(data.favs);
    if(data.exNotes) saveExNotes(data.exNotes);
    if(data.restDays) saveRestDays(data.restDays);
    if(data.injuries) saveInjuries(data.injuries);
    if(data.annual) saveAnnual(data.annual); else rebuildAnnualRecords();
  } finally { _suppressGistSync = false; }
}
async function gistSmartSync(){
  const cfg = loadGistConfig();
  if(!cfg.enabled || !cfg.token || !cfg.id) return { status:'disabled' };
  try{
    updateSyncBadge('syncing');
    const d = await gistFetch(`https://api.github.com/gists/${cfg.id}`);
    const remoteUpdated = new Date(d.updated_at).getTime();
    const localMod = cfg.localModified || 0, lastSync = cfg.lastSync || 0;
    const TOL = 5000;
    if(remoteUpdated > lastSync + TOL && remoteUpdated >= localMod){ await gistPull(); return { status:'pulled' }; }
    if(localMod > lastSync + TOL && localMod > remoteUpdated){ await gistPush(); return { status:'pushed' }; }
    saveGistConfig({ lastSync: Math.max(remoteUpdated, localMod, lastSync) });
    updateSyncBadge('ok'); return { status:'up-to-date' };
  }catch(e){ updateSyncBadge('err'); return { status:'error', error: e.message }; }
}
function scheduleGistSync(delayMs = 3000){
  if(_suppressGistSync) return;
  const cfg = loadGistConfig();
  if(!cfg.enabled || !cfg.autoSync || !cfg.token || !cfg.id) return;
  clearTimeout(_gistSyncTimer);
  _gistSyncTimer = setTimeout(async ()=>{ try{ await gistPush(); }catch(e){ updateSyncBadge('err'); } }, delayMs);
}
function rebuildAnnualRecords(){
  const anual = {};
  DB.historico.filter(h=>h.tipo==='forca').forEach(h=>{
    const ano = new Date(h.data).getFullYear();
    if(!anual[ano]) anual[ano] = {};
    (h.exercicios||[]).forEach(e=>{
      (e.setsDetalhados||[]).forEach(s=>{
        if(!s.done || s.warmup) return;
        const carga = Number(s.carga)||0, reps = Number(s.repeticoes)||0;
        if(carga<=0 || reps<=0) return;
        const oneRm = carga*(1+reps/30);
        if(!anual[ano][e.nome] || anual[ano][e.nome].oneRm < oneRm) anual[ano][e.nome] = { carga, reps, oneRm, ts:h.data };
      });
    });
  });
  saveAnnual(anual);
}

function showWarmupScreen(divisao){
  return new Promise(resolve=>{
    const grupos = [...new Set(divisao.exercicios.map(ex => exerciseGroup(ex.nome)).filter(g => g && g !== 'Personalizado'))];
    const warmups = [...new Set(grupos.flatMap(g => WARMUPS[g]||[]))];
    if(!warmups.length){ resolve(); return; }
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal-box">
      <h3 style="margin-bottom:4px;">Aquecimento · Divisão ${escapeHtml(divisao.letra)}</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 16px 0;">Mobilidade para preparar ${grupos.join(', ').toLowerCase()}. Leva 3-5min.</p>
      <div>${warmups.map((w, i)=>`<label style="display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;"><input type="checkbox" style="width:22px;height:22px;accent-color:var(--lime);margin-top:2px;flex-shrink:0;"><span style="font-size:13.5px;line-height:1.45;">${escapeHtml(w)}</span></label>`).join('')}</div>
      <div style="margin-top:16px;display:flex;gap:8px;"><button class="btn secondary" id="warmup-skip" style="flex:1;">Pular</button><button class="btn" id="warmup-start" style="flex:1;">Começar ✓</button></div>
    </div>`;
    document.body.appendChild(bg);
    const done = ()=>{ bg.remove(); resolve(); };
    bg.querySelector('#warmup-skip').addEventListener('click', done);
    bg.querySelector('#warmup-start').addEventListener('click', done);
  });
}

function parseWorkoutText(text){
  const linhas = text.split('\n').map(l=> l.trim()).filter(Boolean);
  const exercicios = [];
  const regex = /^[-•*]?\s*(.+?)\s+(\d+)\s*[xX×]\s*(\d+)(?:\s+(\d+(?:[.,]\d+)?)\s*kg?)?/;
  for(const l of linhas){
    const m = l.match(regex);
    if(m){
      const nome = m[1].replace(/[-,;:]$/, '').trim();
      const found = fuzzyFindExercise(nome);
      exercicios.push({ nome: found ? found.name : nome, series: Number(m[2])||3, repeticoes: Number(m[3])||10, carga: m[4] ? Number(m[4].replace(',','.')) : 0, descanso: 60, nota:'', aquecimento:false, grupo:'', dropSet:false, rirAlvo:null, supersetId:null });
    }
  }
  return exercicios;
}
function openImportTextModal(){
  textareaDialog('Cole o texto. Formato: Exercício 3x10 60kg', { title:'Importar de texto', placeholder:`Supino reto 3x10 60kg\nCrucifixo 3x12 15kg` }).then(text=>{
    if(!text) return;
    const exercicios = parseWorkoutText(text);
    if(!exercicios.length){ showToast('Nada reconhecido'); return; }
    DB.treinos.push({ id:uid(), nome:'Treino importado', divisoes:[{ id:uid(), letra:'A', exercicios }] });
    saveTreinos(); showToast(`${exercicios.length} exercícios importados!`); go('treinos');
  });
}

  view.querySelectorAll('[data-set-row]').forEach(row=>{
    let startX = 0, startY = 0, curX = 0, swiping = false, intent = null;
    const [exi, si] = row.dataset.setRow.split(':').map(Number);
    const onStart = (e)=>{
      const t = e.touches ? e.touches[0] : e;
      // Ignora se começou em input/botão/checkbox
      if(e.target.closest('input, button, .step-btn, .rpe-btn')) return;
      startX = t.clientX; startY = t.clientY; curX = startX;
      swiping = false; intent = null;
    };
    const onMove = (e)=>{
      if(!startX) return;
      const t = e.touches ? e.touches[0] : e;
      curX = t.clientX;
      const dx = curX - startX;
      const dy = t.clientY - startY;
      if(intent === null){
        if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)*1.4){ intent = 'h'; }
        else if(Math.abs(dy) > 12){ intent = 'v'; }
      }
      if(intent === 'h'){
        swiping = true;
        const pct = Math.min(1, Math.abs(dx) / 80);

        else row.style.background = `color-mix(in srgb, var(--danger) ${Math.round(pct*18)}%, transparent)`;
        if(e.cancelable) e.preventDefault();
      }
    };
    const onEnd = ()=>{
      if(!swiping){ startX = 0; return; }
      const dx = curX - startX;
      if(Math.abs(dx) > 70){
        // Swipe fechado: toggle done
        const set = SESSION.exercicios[exi].sets[si];

            startX = 0; swiping = false; intent = null;

            return;

        }

          chk.checked = willBe;

          haptic(willBe ? 'success' : 'tap');
          row.classList.add('swipe-hit');
          setTimeout(()=> row.classList.remove('swipe-hit'), 350);
        }
      }
      row.style.background = '';
      startX = 0; curX = 0; swiping = false; intent = null;
    };
    row.addEventListener('touchstart', onStart, {passive:true});
    row.addEventListener('touchmove', onMove, {passive:false});
    row.addEventListener('touchend', onEnd);
    row.addEventListener('touchcancel', onEnd);
  });
